repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: detect-private-key
      - id: forbid-new-submodules
      # Disabled: We work directly on main in this repo
      # - id: no-commit-to-branch
      #   args: [--branch, main]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Lint and format agents separately to match CI behavior (each agent has its own pyproject.toml)
  - repo: local
    hooks:
      - id: ruff-agents
        name: Lint agent code
        entry: bash -c 'for dir in agents/*/; do if [ -f "$dir/pyproject.toml" ]; then cd "$dir" && uv run ruff check src/ tests/ 2>/dev/null || ruff check src/ tests/ && cd - > /dev/null; fi; done'
        language: system
        files: ^agents/.*\.py$
        pass_filenames: false

      - id: ruff-format-agents
        name: Format agent code
        entry: bash -c 'for dir in agents/*/; do if [ -f "$dir/pyproject.toml" ]; then cd "$dir" && uv run ruff format src/ tests/ 2>/dev/null || ruff format src/ tests/ && cd - > /dev/null; fi; done'
        language: system
        files: ^agents/.*\.py$
        pass_filenames: false

  # Comprehensive secret scanning with gitleaks
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Additional secret detection with detect-secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package.lock.json

  # SOPS validation - ensure encrypted files are actually encrypted
  - repo: local
    hooks:
      - id: check-sops-encryption
        name: Verify SOPS files are encrypted
        entry: scripts/pre-commit/check-sops-encryption.sh
        language: script
        files: '\.enc\.yaml$'

      - id: forbid-sops-age-secret
        name: Forbid sops-age-secret.yaml
        entry: 'sops-age-secret.yaml must never be committed - use kubectl apply from stdin'
        language: fail
        files: 'sops-age-secret\.yaml$'

      - id: forbid-plain-age-keys
        name: Forbid age key files
        entry: 'Age key files must never be committed'
        language: fail
        files: '(age\.key.*|.*\.agekey)$'

  # Conventional commit message validation
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [
          # Valid commit types
          "feat",     # New feature
          "fix",      # Bug fix
          "docs",     # Documentation only
          "style",    # Formatting, missing semicolons, etc
          "refactor", # Code restructuring
          "perf",     # Performance improvement
          "test",     # Adding/updating tests
          "chore",    # Maintenance, deps, config
          "ci",       # CI configuration
          "build",    # Build system changes
          "revert",   # Reverting changes
        ]

  # Note: Type checking with ty is done via 'just check' rather than pre-commit
  # because ty is experimental and still maturing
