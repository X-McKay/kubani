repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: detect-private-key

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.37.1
    hooks:
      - id: yamllint
        files: ^(infrastructure|docs)/.*\.(yml|yaml)$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: .*\.enc\.yaml$
        args:
          - "--baseline"
          - ".secrets.baseline"
          - "--exclude-files"
          - ".*\\.enc\\.yaml$"

  - repo: local
    hooks:
      - id: check-sops-encryption
        name: Verify SOPS files are encrypted
        entry: infrastructure/scripts/pre-commit/check-sops-encryption.sh
        language: script
        files: \.enc\.yaml$

      # The hook above only polices files already named .enc.yaml, so it cannot
      # see a Secret committed as a plain secret.yaml. This one starts from the
      # manifest kind instead of the filename.
      - id: check-plaintext-secrets
        name: Forbid unencrypted Kubernetes Secrets
        entry: uv run python infrastructure/scripts/pre-commit/check-plaintext-secrets.py
        language: system
        files: ^infrastructure/gitops/.*\.(yaml|yml)$

      - id: ansible-lint
        name: Ansible lint
        entry: uv run ansible-lint infrastructure/ansible --format=pep8
        language: system
        files: ^infrastructure/ansible/.*\.(yml|yaml)$
        pass_filenames: false

      - id: forbid-sops-age-secret
        name: Forbid sops-age-secret.yaml
        entry: sops-age-secret.yaml must never be committed
        language: fail
        files: sops-age-secret\.yaml$

      - id: forbid-plain-age-keys
        name: Forbid age key files
        entry: Age key files must never be committed
        language: fail
        files: (age\.key.*|.*\.agekey)$
