[project]
name = "kubani"
version = "0.1.0"
description = "Infrastructure automation and GitOps for the Kubani homelab cluster"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ansible-core>=2.17,<2.19",
    "PyYAML>=6.0",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "ansible-lint>=25.0.0",
    "pre-commit>=4.0.0",
    "yamllint>=1.35.0",
]
