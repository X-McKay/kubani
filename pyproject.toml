[project]
name = "kubani"
version = "0.1.0"
description = "Kubernetes cluster automation and management for Tailscale networks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "textual>=6.0.0",
    "pydantic>=2.5.0",
    "ruamel.yaml>=0.18.0",
    "kubernetes>=29.0.0",
    "ansible-runner>=2.3.0",
    "pytest>=7.4.0",
    "hypothesis>=6.92.0",
    "pytest-cov>=4.1.0",
    "tomli>=2.0.0",
    "ruff>=0.14.7",
    "ty>=0.0.1a30", # Fast type checker from Astral (experimental)
    "ansible>=12.2.0",
    "huggingface-hub>=1.2.3",
    "strands-agents>=1.21.0",
    "openai>=2.15.0",
    "core-agents",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "ty>=0.0.1a30",
    "pre-commit>=3.5.0",
]

[project.scripts]
# Deprecated cluster-mgr and cluster-tui removed - use kubani-dev cluster instead

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--verbose",
]

[tool.coverage.run]
source = ["kubani", "infrastructure"]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.hypothesis]
max_examples = 100
deadline = 5000
derandomize = false

[tool.ruff]
line-length = 100
target-version = "py311"
extend-include = ["kubani/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # Ignore line length errors

[tool.ruff.lint.isort]
known-first-party = ["k8s_monitor", "kubani", "infrastructure"]

[tool.uv.workspace]
members = [
    "kubani",
    "platform/cli",
]

[tool.uv.sources]
core-agents = { workspace = true }

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
    "python-frontmatter>=1.1.0",
]
