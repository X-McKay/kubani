# Test cases for cluster-health skill
# This skill is primarily documentation-driven (bash commands)
# These tests verify the skill.py interface

test_cases:
  - name: quick_mode
    description: Test quick mode returns success
    inputs:
      mode: quick
    expected_outputs:
      status: success
      mode: quick
    assertions:
      - field: status
        type: equals
        value: success
      - field: mode
        type: equals
        value: quick

  - name: validate_mode
    description: Test validate mode returns success
    inputs:
      mode: validate
    expected_outputs:
      status: success
      mode: validate
    assertions:
      - field: status
        type: equals
        value: success

  - name: troubleshoot_mode
    description: Test troubleshoot mode returns success
    inputs:
      mode: troubleshoot
    expected_outputs:
      status: success
      mode: troubleshoot
    assertions:
      - field: status
        type: equals
        value: success

  - name: default_mode
    description: Test default mode is quick
    inputs: {}
    expected_outputs:
      status: success
      mode: quick
    assertions:
      - field: mode
        type: equals
        value: quick

  - name: invalid_mode
    description: Test invalid mode returns error
    inputs:
      mode: invalid
    expected_outputs:
      status: error
    assertions:
      - field: status
        type: equals
        value: error
