test_cases:
  - name: test_prime_7
    description: Check if 7 is prime
    inputs:
      number: 7
    expected:
      is_prime: true
    assertions:
      - type: equals
        field: is_prime
        value: true
        description: 7 should be prime
      - type: exists
        field: reason
        description: Should provide a reason

  - name: test_not_prime_4
    description: Check if 4 is prime
    inputs:
      number: 4
    expected:
      is_prime: false
    assertions:
      - type: equals
        field: is_prime
        value: false
        description: 4 should not be prime
      - type: exists
        field: reason
        description: Should provide a reason

  - name: test_prime_2
    description: Check if 2 is prime
    inputs:
      number: 2
    expected:
      is_prime: true
    assertions:
      - type: equals
        field: is_prime
        value: true
        description: 2 should be prime

  - name: test_not_prime_1
    description: Check if 1 is prime
    inputs:
      number: 1
    expected:
      is_prime: false
    assertions:
      - type: equals
        field: is_prime
        value: false
        description: 1 should not be prime
