test_cases:
  - name: test_simple_dataset
    description: Calculate statistics for simple sequential numbers
    inputs:
      numbers: [1, 2, 3, 4, 5]
    expected_outputs:
      mean: 3.0
      median: 3
      min: 1
      max: 5
      count: 5
    assertions:
      - field: mean
        type: equals
        value: 3.0
        description: Mean should be 3.0
      - field: median
        type: equals
        value: 3
        description: Median should be 3
      - field: min
        type: equals
        value: 1
        description: Min should be 1
      - field: max
        type: equals
        value: 5
        description: Max should be 5
      - field: count
        type: equals
        value: 5
        description: Count should be 5

  - name: test_with_duplicates
    description: Calculate mode with duplicates
    inputs:
      numbers: [1, 2, 2, 3, 3, 3, 4]
    expected_outputs:
      mode: 3
      count: 7
    assertions:
      - field: mode
        type: equals
        value: 3
        description: Mode should be 3 (appears most frequently)
      - field: count
        type: equals
        value: 7
        description: Count should be 7
      - field: mean
        type: exists
        description: Mean should be calculated
      - field: median
        type: exists
        description: Median should be calculated

  - name: test_even_count
    description: Calculate median for even count of numbers
    inputs:
      numbers: [1, 2, 3, 4]
    expected_outputs:
      mean: 2.5
      median: 2.5
      count: 4
    assertions:
      - field: mean
        type: equals
        value: 2.5
        description: Mean should be 2.5
      - field: median
        type: equals
        value: 2.5
        description: Median should be 2.5 (average of 2 and 3)
      - field: count
        type: equals
        value: 4
        description: Count should be 4

  - name: test_single_number
    description: Calculate statistics for single number
    inputs:
      numbers: [42]
    expected_outputs:
      mean: 42.0
      median: 42
      mode: 42
      std_dev: 0.0
      min: 42
      max: 42
      count: 1
    assertions:
      - field: mean
        type: equals
        value: 42.0
        description: Mean should be 42.0
      - field: median
        type: equals
        value: 42
        description: Median should be 42
      - field: mode
        type: equals
        value: 42
        description: Mode should be 42
      - field: std_dev
        type: equals
        value: 0.0
        description: Std dev should be 0.0
      - field: min
        type: equals
        value: 42
        description: Min should be 42
      - field: max
        type: equals
        value: 42
        description: Max should be 42
      - field: count
        type: equals
        value: 1
        description: Count should be 1

  - name: test_negative_numbers
    description: Calculate statistics with negative numbers
    inputs:
      numbers: [-5, -2, 0, 3, 7]
    expected_outputs:
      min: -5
      max: 7
      count: 5
    assertions:
      - field: min
        type: equals
        value: -5
        description: Min should be -5
      - field: max
        type: equals
        value: 7
        description: Max should be 7
      - field: count
        type: equals
        value: 5
        description: Count should be 5
      - field: mean
        type: exists
        description: Mean should be calculated
      - field: median
        type: exists
        description: Median should be calculated

  - name: test_decimal_numbers
    description: Calculate statistics with decimal numbers
    inputs:
      numbers: [1.5, 2.5, 3.5, 4.5]
    expected_outputs:
      mean: 3.0
      count: 4
    assertions:
      - field: mean
        type: equals
        value: 3.0
        description: Mean should be 3.0
      - field: count
        type: equals
        value: 4
        description: Count should be 4
      - field: min
        type: exists
        description: Min should be calculated
      - field: max
        type: exists
        description: Max should be calculated

  - name: test_empty_array
    description: Handle error for empty array
    inputs:
      numbers: []
    expected_outputs:
      error: "Numbers array cannot be empty"
    assertions:
      - field: error
        type: exists
        description: Should return an error
      - field: error
        type: contains
        value: "empty"
        description: Error should mention empty
