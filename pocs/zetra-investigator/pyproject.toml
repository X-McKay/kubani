[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "kubani-investigator"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp==2.3.0",
    "zetra @ git+https://github.com/X-McKay/zetra.git@328937a771248c7362a268838c333f22de36275e",
]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[tool.zetra.agents]
investigator = "src/kubani_investigator/agents/investigator/agent.yaml"

[tool.hatch.build.targets.wheel]
packages = ["src/kubani_investigator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.hatch.metadata]
allow-direct-references = true
