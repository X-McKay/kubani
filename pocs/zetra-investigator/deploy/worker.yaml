apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: investigator-artifacts
  namespace: zetra-poc
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: {storage: 2Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: investigator-worker
  namespace: zetra-poc
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: investigator-worker}
  template:
    metadata:
      labels: {app: investigator-worker}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/hostname: rig0
      securityContext:
        runAsNonRoot: true
        runAsUser: 1500
        runAsGroup: 1500
        fsGroup: 1500
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: IMAGE_DIGEST_REQUIRED
          command:
            - /app/.venv/bin/python
            - -m
            - zetra
            - --artifacts
            - /artifacts/objects
            - --task-queue
            - zetra-kubernetes-poc-v1
            - --runtime-id
            - kubani-kubernetes-poc-v1
            - worker
            - --key-file
            - /etc/zetra-key/key
            - --release
            - /etc/zetra/release.json
            - --provider
            - kubani-k8s-read
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          env:
            - {name: HOME, value: /tmp}
            - {name: TEMPORAL_ADDRESS, value: 'temporal-frontend.temporal.svc.cluster.local:7233'}
            - {name: TEMPORAL_NAMESPACE, value: zetra-poc}
            - {name: OPENSHELL_ADDRESS, value: 'zetra-poc-openshell.zetra-poc.svc.cluster.local:8080'}
            - {name: OPENSHELL_TLS_DIR, value: /etc/openshell}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 1Gi}
          volumeMounts:
            - {name: artifacts, mountPath: /artifacts}
            - {name: tls, mountPath: /etc/openshell, readOnly: true}
            - {name: key, mountPath: /etc/zetra-key, readOnly: true}
            - {name: release, mountPath: /etc/zetra, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: artifacts
          persistentVolumeClaim: {claimName: investigator-artifacts}
        - name: tls
          secret: {secretName: openshell-client-tls, defaultMode: 0440}
        - name: key
          secret: {secretName: investigator-worker-key, defaultMode: 0440}
        - name: release
          configMap: {name: investigator-release}
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
