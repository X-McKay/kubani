apiVersion: v1
kind: Pod
metadata:
  name: investigator-demo-healthy
  namespace: zetra-poc-fixtures
  labels: {app: investigator-demo}
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: demo
      image: registry.k8s.io/pause:3.10
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
      resources:
        requests: {cpu: 5m, memory: 8Mi}
        limits: {cpu: 50m, memory: 32Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: investigator-demo-broken
  namespace: zetra-poc-fixtures
  labels: {app: investigator-demo}
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: demo
      image: registry.k8s.io/pause:3.10
      env:
        - name: DEMO_CONFIG
          valueFrom:
            configMapKeyRef:
              name: investigator-demo-config
              key: value
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
      resources:
        requests: {cpu: 5m, memory: 8Mi}
        limits: {cpu: 50m, memory: 32Mi}
