apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zetra-investigator-poc
  namespace: temporal
  labels:
    app.kubernetes.io/part-of: zetra-investigator-poc
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: frontend
      app.kubernetes.io/instance: temporal
      app.kubernetes.io/name: temporal
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: zetra-poc
          podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [investigator-worker, investigator-run]
      ports:
        - {protocol: TCP, port: 7233}
