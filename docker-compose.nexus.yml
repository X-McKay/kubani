# Kubani Nexus - Local Development Infrastructure
# Usage: docker-compose -f docker-compose.nexus.yml up -d
#
# This file provides the infrastructure services needed to develop and test
# the Nexus components locally. Services are configured to use minimal resources.
#
# Services:
#   - temporal: Workflow orchestration (auto-setup with PostgreSQL)
#   - redis: Pub/Sub, caching, event bus
#   - postgres: Skill Registry database
#   - qdrant: Vector search for memory

services:
  # =========================================================================
  # Temporal (workflow orchestration)
  # =========================================================================
  temporal:
    image: temporalio/auto-setup:latest
    ports:
      - "7233:7233"   # gRPC frontend
      - "8080:8080"   # Web UI
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-db
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-cass.yaml
    depends_on:
      temporal-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  temporal-db:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 128M

  # =========================================================================
  # Redis (pub/sub, caching, event bus)
  # =========================================================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 96M

  # =========================================================================
  # PostgreSQL (Skill Registry + Nexus state)
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: kubani
      POSTGRES_PASSWORD: kubani
      POSTGRES_DB: kubani_nexus
    volumes:
      - ./infrastructure/docker/nexus-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubani"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 128M

  # =========================================================================
  # Qdrant (vector search for memory)
  # =========================================================================
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
