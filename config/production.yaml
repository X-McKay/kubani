# Kubani Production Configuration
# This file contains production-specific overrides.
# Secrets should be provided via environment variables or Kubernetes secrets.

environment: production
log_level: INFO
log_format: json

# =============================================================================
# MCP Server Configuration (Cluster URLs)
# =============================================================================
mcp:
  temporal_url: http://temporal-mcp.ai-agents.svc:8081
  temporal_enabled: true

  qdrant_url: http://qdrant-mcp.ai-agents.svc:8082
  qdrant_enabled: true

  memory_url: http://memory-mcp.ai-agents.svc:8083
  memory_enabled: true

  discord_url: http://discord-mcp-server.ai-agents.svc:8080
  discord_enabled: true

  registry_url: http://registry-mcp.ai-agents.svc:8085
  registry_enabled: true

# =============================================================================
# Temporal Configuration (Cluster)
# =============================================================================
temporal:
  host: temporal-frontend.temporal.svc.cluster.local:7233
  namespace: kubani
  task_queue: kubani-tasks
  enabled: true
  ui_url: https://temporal.almckay.io

# =============================================================================
# Memory Configuration (Cluster Services)
# =============================================================================
memory:
  default_ttl_days: 90
  consolidation_threshold: 100

  qdrant:
    host: qdrant.database.svc.cluster.local
    port: 6333
    grpc_port: 6334
    prefer_grpc: true
    skills_collection: skills
    memory_collection: kubani_memory
    learnings_collection: learnings

  neo4j:
    uri: bolt://neo4j.database.svc.cluster.local:7687
    user: neo4j
    database: neo4j
    # password: set via NEO4J_PASSWORD env var

  redis:
    host: redis.database.svc.cluster.local
    port: 6379
    db: 0
    event_stream: "kubani:events"
    consumer_group: kubani-agents
    # password: set via REDIS_PASSWORD env var

# =============================================================================
# LLM Configuration (Cluster vLLM)
# =============================================================================
llm:
  provider: vllm
  api_url: http://llm-api.vllm.svc.cluster.local:8000/v1
  model: nvidia/Qwen3-14B-FP4
  temperature: 0.3
  max_tokens: 4096
  timeout: 120.0

# Fast model for simple tasks (classification, routing, simple Q&A)
llm_fast:
  provider: vllm
  api_url: http://fast-model-api.vllm.svc.cluster.local:8000/v1
  model: Qwen/Qwen3-0.6B
  temperature: 0.3
  max_tokens: 1024
  timeout: 30.0

# =============================================================================
# Embeddings Configuration (Cluster)
# =============================================================================
embeddings:
  api_url: http://embeddings-api.vllm.svc.cluster.local:8000/v1
  model: Qwen/Qwen3-Embedding-0.6B
  dimensions: 1024
  batch_size: 32

# =============================================================================
# Discord Configuration
# Channel IDs should be set via environment variables
# =============================================================================
discord:
  # All channel IDs set via DISCORD_* env vars

# =============================================================================
# Registry Configuration (Cluster)
# =============================================================================
registry:
  url: http://metadata-registry.ai-agents.svc:8000
  sync_on_startup: true
  heartbeat_interval: 30
  auto_register: true

# =============================================================================
# Learning Configuration (Production Settings)
# =============================================================================
learning:
  enabled: true
  critic_enabled: true
  reflection_enabled: true
  synthesizer_enabled: true
  auto_approve_threshold: 0.98  # Higher threshold in production
  min_examples_for_skill: 5     # More examples required
  require_discord_approval: true
  approval_timeout_hours: 72
  approval_threshold: 2
  critic_interval_minutes: 60
  reflection_interval_hours: 24

# =============================================================================
# Observability Configuration (Production)
# =============================================================================
observability:
  metrics_enabled: true
  metrics_port: 9090
  tracing_enabled: true
  tracing_endpoint: http://otel-collector.observability.svc:4317
  debug_hooks: false

# =============================================================================
# Local Development (Disabled in Production)
# =============================================================================
local_dev:
  enabled: false
  tunnel_enabled: false
  tunnel_method: none
  output_mode: discord
  mock_services: false
  hot_reload: false
