# CPU stress chaos experiment
# Puts CPU pressure on agent pods
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: cpu-stress
  namespace: chaos-mesh
  labels:
    app.kubernetes.io/part-of: kubani-chaos-tests
    test-scenario: cpu-exhaustion
spec:
  mode: one
  selector:
    namespaces:
      - ai-agents
    labelSelectors:
      app.kubernetes.io/component: ai-agent
  stressors:
    cpu:
      workers: 2
      load: 80  # 80% CPU load per worker
  duration: "60s"
