# Redis (Event Bus) failure chaos experiment
# Kills Redis pod to test event bus resilience
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: redis-failure
  namespace: chaos-mesh
  labels:
    app.kubernetes.io/part-of: kubani-chaos-tests
    test-scenario: event-bus-failure
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces:
      - cache
    labelSelectors:
      app.kubernetes.io/name: redis
  duration: "30s"
