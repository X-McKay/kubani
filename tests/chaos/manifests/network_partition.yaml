# Network partition chaos experiment
# Isolates agents from communicating with each other
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: agent-partition
  namespace: chaos-mesh
  labels:
    app.kubernetes.io/part-of: kubani-chaos-tests
    test-scenario: network-partition
spec:
  action: partition
  mode: all
  selector:
    namespaces:
      - ai-agents
    labelSelectors:
      app.kubernetes.io/component: ai-agent
  direction: both
  duration: "60s"
