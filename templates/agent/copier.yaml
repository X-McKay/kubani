# =============================================================================
# Kubani Agent Template
# =============================================================================
# Creates a new AI agent with standard structure:
# - Python source code with Strands SDK + Temporal workflows
# - Tests with pytest
# - Dockerfile and Earthfile for builds
# - Kubernetes manifests for GitOps deployment
#
# Usage:
#   copier copy templates/agent agents/my-new-agent
#   copier copy templates/agent . --data agent_name=my-new-agent
# =============================================================================

_min_copier_version: "9.0.0"
_subdirectory: template
_templates_suffix: .jinja

# =============================================================================
# Questions
# =============================================================================

agent_name:
  type: str
  help: Agent name (kebab-case, e.g., log-analyzer)
  validator: "{% if not agent_name.replace('-', '').isalnum() %}Must be alphanumeric with hyphens{% endif %}"

package_name:
  type: str
  help: Python package name (snake_case)
  default: "{{ agent_name | replace('-', '_') }}"

description:
  type: str
  help: Short description of the agent
  default: "AI-powered agent for Kubani platform"

# Agent capabilities
uses_kubernetes:
  type: bool
  help: Does this agent interact with the Kubernetes API?
  default: true

uses_temporal:
  type: bool
  help: Does this agent use Temporal workflows?
  default: true

uses_discord:
  type: bool
  help: Does this agent send Discord notifications?
  default: true

uses_llm:
  type: bool
  help: Does this agent use the LLM (vLLM) API?
  default: true

# Kubernetes RBAC
k8s_permissions:
  type: str
  help: Kubernetes RBAC permission level
  when: "{{ uses_kubernetes }}"
  choices:
    read-only: Read-only access to common resources
    read-write: Read + limited write (scale, restart)
    custom: Custom permissions (edit rbac.yaml manually)
  default: read-only

# Scheduling
schedule_type:
  type: str
  help: How should this agent run?
  choices:
    scheduled: Run on a schedule (hourly, daily, etc.)
    continuous: Run continuously as a worker
    on-demand: Triggered manually or by events
  default: scheduled

schedule_interval_hours:
  type: int
  help: Schedule interval in hours
  when: "{{ schedule_type == 'scheduled' }}"
  default: 1

# Resource allocation
cpu_request:
  type: str
  help: CPU request for the agent pod
  default: "100m"

memory_request:
  type: str
  help: Memory request for the agent pod
  default: "256Mi"

cpu_limit:
  type: str
  help: CPU limit for the agent pod
  default: "500m"

memory_limit:
  type: str
  help: Memory limit for the agent pod
  default: "512Mi"

# Author information
author_name:
  type: str
  help: Author name
  default: "Kubani Team"
