apiVersion: apps/v1
kind: Deployment
metadata:
  name: vlm-vllm
  namespace: ai-agents
  labels:
    app.kubernetes.io/name: vlm-vllm
    app.kubernetes.io/component: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vlm-vllm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vlm-vllm
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          args:
            - --model
            - Qwen/Qwen3-VL-8B-Instruct
            - --max-model-len
            - "8192"
            - --trust-remote-code
            - --dtype
            - bfloat16
            - --port
            - "8000"
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
          resources:
            requests:
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
              memory: 24Gi
          volumeMounts:
            - name: model-cache
              mountPath: /root/.cache/huggingface
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
      volumes:
        - name: model-cache
          hostPath:
            path: /data/models
            type: DirectoryOrCreate
      nodeSelector:
        nvidia.com/gpu.present: "true"
