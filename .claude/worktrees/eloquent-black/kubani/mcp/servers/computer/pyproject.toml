[project]
name = "computer-mcp-server"
version = "0.1.0"
description = "Computer Use MCP server for Kubani - browser control via Playwright for agentic web interaction"
authors = [{ name = "Kubani Team" }]
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "playwright>=1.49.0",
    "kubani",
]

[tool.uv.sources]
kubani = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
computer-mcp-server = "computer_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/computer_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
