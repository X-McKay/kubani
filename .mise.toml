[tools]
python = "3.12"
uv = "latest"
kubectl = "1.31"
helm = "latest"
flux2 = "latest"
jq = "latest"
sops = "latest"
age = "latest"
just = "latest"

[env]
_.python.venv = ".venv"
UV_PYTHON = "3.12"
ANSIBLE_INVENTORY = "infrastructure/ansible/inventory/hosts.yml"
ANSIBLE_ROLES_PATH = "infrastructure/ansible/roles"
ANSIBLE_COLLECTIONS_PATH = ".ansible/collections:{{env.HOME}}/.ansible/collections:/usr/share/ansible/collections"
KUBECONFIG = "{{env.HOME}}/.kube/config"
