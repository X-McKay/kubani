
[tools]
python = "3.12"
kubectl = "1.28"
uv = "latest"
helm = "latest"
earthly = "latest"
pipx = "latest"
just = "latest"
node = "latest"
# Note: typos should be installed via pip in the virtual environment

[env]
# Auto-activate the uv-managed venv
_.python.venv = ".venv"

# Temporal CLI configuration
TEMPORAL_ADDRESS = "temporal-grpc.almckay.io:7233"

# Ensure UV is used for Python package management
UV_PYTHON = "3.12"

# Ansible configuration
ANSIBLE_HOST_KEY_CHECKING = "False"
ANSIBLE_INVENTORY = "ansible/inventory/hosts.yml"
ANSIBLE_ROLES_PATH = "ansible/roles"

# Kubernetes configuration
KUBECONFIG = "~/.kube/config"

# =============================================================================
# Tasks are now managed via justfile
# =============================================================================
# Run 'just' to see all available commands
# Run 'just setup' for initial project setup
# Run 'just --list' for command descriptions
