---
# Tailscale installation and configuration tasks

- name: Check if Tailscale is already installed
  ansible.builtin.command: which tailscale
  register: tailscale_check
  changed_when: false
  failed_when: false

- name: Install Tailscale
  when: tailscale_check.rc != 0
  block:
    - name: Download Tailscale install script
      ansible.builtin.get_url:
        url: https://tailscale.com/install.sh
        dest: /tmp/tailscale-install.sh
        mode: '0755'

    - name: Run Tailscale install script
      ansible.builtin.command: /tmp/tailscale-install.sh
      register: tailscale_install_result
      changed_when: true

    - name: Remove install script
      ansible.builtin.file:
        path: /tmp/tailscale-install.sh
        state: absent

- name: Ensure Tailscale service is enabled and started
  ansible.builtin.systemd:
    name: tailscaled
    state: started
    enabled: yes

- name: Get Tailscale status
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false

- name: Parse Tailscale status
  ansible.builtin.set_fact:
    tailscale_state: "{{ (tailscale_status.stdout | from_json).BackendState | default('Unknown') }}"
  when: tailscale_status.rc == 0

- name: Authenticate Tailscale with authkey (if provided)
  ansible.builtin.command: >
    tailscale up --authkey={{ tailscale_authkey }} {{ tailscale_up_args }}
  when:
    - tailscale_authkey | length > 0
    - tailscale_state is defined
    - tailscale_state != "Running"
  no_log: true  # Hide authkey from logs

- name: Display Tailscale status
  ansible.builtin.debug:
    msg: |
      Tailscale installation status on {{ inventory_hostname }}:
      - Installed: {{ 'Yes' if tailscale_check.rc == 0 or tailscale_install_result is defined else 'No' }}
      - State: {{ tailscale_state | default('Unknown') }}
      {% if tailscale_state is not defined or tailscale_state != 'Running' %}

      ACTION REQUIRED: Tailscale needs to be authenticated.
      Run on the node: sudo tailscale up
      {% endif %}
