[project]
name = "news-monitor"
version = "0.3.3"
description = "AI news monitoring agent with trend analysis and Discord notifications"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "strands-agents>=0.1.0",
    "strands-agents-tools>=0.1.0",
    "temporalio>=1.7.0",
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "openai>=1.0.0",
    # Memory system
    "mem0ai>=0.1.0",
    "psycopg2-binary>=2.9.0",
    # Direct Qdrant client for fast queries (bypassing mem0 for digest generation)
    "qdrant-client>=1.7.0",
    # Redis for fast URL deduplication
    "redis>=5.0.0",
    # RSS parsing
    "feedparser>=6.0.0",
    # HTML parsing for full article extraction
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    # Core reusable agents (DiscordAgent, MemoryAgent)
    "core-agents",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.8.0",
]

[project.scripts]
news-monitor-worker = "news_monitor.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/news_monitor"]

[tool.hatch.build.targets.sdist]
include = ["src/news_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["news_monitor", "core_agents"]

[tool.uv.sources]
core-agents = { path = "../core", editable = true }
