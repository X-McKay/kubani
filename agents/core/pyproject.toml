[project]
name = "core-agents"
version = "0.3.3"
description = "Reusable agents for multi-agent swarms (Discord, Memory, etc.)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "strands-agents>=1.20.0",
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "openai>=1.0.0",
    # Memory system
    "mem0ai>=0.1.0",
    "psycopg2-binary>=2.9.0",
    "langchain-neo4j>=0.1.0",  # Required for mem0 graph memory
    "rank-bm25>=0.2.0",  # Required for mem0 graph memory search
    # MCP client
    "mcp>=1.0.0",
    # Temporal workflows
    "temporalio>=1.7.0",
    # Skills system (markdown parsing)
    "python-frontmatter>=1.0.0",
]

[project.optional-dependencies]
# Federated architecture components (Phase 1)
events = [
    "redis>=5.0.0",  # Redis Streams event bus
]
skills = [
    "qdrant-client>=1.7.0",  # Skill library vector storage
]
observability = [
    "prometheus-client>=0.19.0",  # Prometheus metrics
]
# All federated components
federated = [
    "redis>=5.0.0",
    "qdrant-client>=1.7.0",
    "prometheus-client>=0.19.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
]

[project.scripts]
skills-sync = "core_agents.skills.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core_agents"]

[tool.hatch.build.targets.sdist]
include = ["src/core_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["core_agents"]
