[project]
name = "backup-agent"
version = "0.1.0"
description = "Database backup agent with Temporal workflows and Discord notifications"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "temporalio>=1.7.0",
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    # Core reusable agents (DiscordAgent)
    "core-agents",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.8.0",
]

[project.scripts]
backup-agent-worker = "backup_agent.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backup_agent"]

[tool.hatch.build.targets.sdist]
include = ["src/backup_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["backup_agent", "core_agents"]

[tool.uv.sources]
core-agents = { path = "../core", editable = true }
