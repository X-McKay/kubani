[project]
name = "cluster-swarm"
version = "0.1.11"
description = "Swarm Intelligence architecture for intelligent Kubernetes cluster monitoring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "strands-agents>=1.21.0",
    "temporalio>=1.7.0",
    "kubernetes>=29.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "openai>=1.0.0",
    # Memory system
    "mem0ai>=0.1.0",
    "psycopg2-binary>=2.9.0",
    "neo4j>=5.0.0",
    # MCP client
    "mcp>=1.0.0",
    "strands-agents-tools>=0.2.18",
    # Core reusable agents with federated support
    "core-agents[federated]",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.8.0",
    "mypy>=1.7.0",
]

[project.scripts]
cluster-swarm-worker = "cluster_swarm.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cluster_swarm"]

[tool.hatch.build.targets.sdist]
include = ["src/cluster_swarm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["cluster_swarm", "core_agents"]

[tool.uv.sources]
core-agents = { path = "../core", editable = true }
