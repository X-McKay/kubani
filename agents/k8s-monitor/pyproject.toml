[project]
name = "k8s-monitor"
version = "0.2.10"
description = "Kubernetes cluster health monitoring agent with Discord notifications"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "strands-agents>=1.20.0",
    "temporalio>=1.7.0",
    "kubernetes>=29.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "openai>=1.0.0",
    # Memory system
    "mem0ai>=0.1.0",
    "psycopg2-binary>=2.9.0", # PostgreSQL driver for pgvector
    # MCP client for kubernetes-mcp-server
    "mcp>=1.0.0",
    # Uses local vLLM embeddings service (Qwen3-Embedding-0.6B) - no external API keys needed
    "strands-agents-tools>=0.2.18",
    # Core reusable agents (DiscordAgent, MemoryAgent)
    # Installed from wheel during Docker build, or via uv.sources for local dev
    "core-agents",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.8.0",
    "mypy>=1.7.0",
]

[project.scripts]
k8s-monitor-worker = "k8s_monitor.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/k8s_monitor"]

[tool.hatch.build.targets.sdist]
include = ["src/k8s_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["k8s_monitor", "core_agents"]

[tool.uv.sources]
# For local development: uv resolves core-agents from ../core
# For Docker builds: wheel is installed from registry or local build
core-agents = { path = "../core", editable = true }
