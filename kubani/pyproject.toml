[project]
name = "kubani-framework"
version = "0.5.0"
description = "Kubani AI agent framework - shared framework, agents, and base classes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Agent framework
    "strands-agents>=1.20.0",
    # HTTP client
    "httpx>=0.27.0",
    # Configuration and validation
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    # LLM integration
    "openai>=1.0.0",
    # MCP protocol
    "mcp>=1.0.0",
    # Temporal workflows
    "temporalio>=1.7.0",
    # Skills system (markdown parsing)
    "python-frontmatter>=1.0.0",
    # Configuration files
    "pyyaml>=6.0.0",
    # Structured logging
    "structlog>=24.0.0",
]

[project.optional-dependencies]
# Memory systems
memory = [
    "mem0ai>=0.1.0",
    "psycopg2-binary>=2.9.0",
    "langchain-neo4j>=0.1.0",
    "rank-bm25>=0.2.0",
]
# Event bus (Redis Streams)
events = [
    "redis>=5.0.0",
]
# Skills registry
skills = [
    "qdrant-client>=1.7.0",
]
# Observability
observability = [
    "prometheus-client>=0.19.0",
]
# A2A protocol support
a2a = [
    "a2a>=0.1.0",
]
# All optional dependencies
all = [
    "kubani-framework[memory,events,skills,observability,a2a]",
]

[project.scripts]
skill-auto-worker = "kubani.workflows.skill_auto.worker:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "fakeredis>=2.25.0",
    "respx>=0.21.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["framework", "agents", "syndicates/_base"]

[tool.hatch.build.targets.sdist]
include = ["*.py", "framework", "agents", "syndicates/_base", "README.md"]

# =============================================================================
# uv Workspace Configuration
# =============================================================================
[tool.uv.workspace]
members = ["syndicates/k8s_monitor", "syndicates/news_digest"]

# =============================================================================
# Testing
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["framework", "agents", "syndicates"]
asyncio_mode = "auto"

# =============================================================================
# Linting
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["kubani_framework", "framework", "agents", "syndicates"]
