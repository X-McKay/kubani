# Feed Collector Agent Configuration
# Fetches and filters content from data feeds

name: feed-collector
version: "1.0.0"
description: >
  Collects content from data feeds (RSS, APIs, webhooks), filters by age
  and relevance, and deduplicates. Can be used for any feed-based collection.

# Skills this agent can use
skills:
  allowed:
    - "news/collection/*"
  denied: []

# Agent capabilities for A2A registration
capabilities:
  - name: fetch_feeds
    description: Fetch articles from configured RSS feeds
  - name: filter_articles
    description: Filter articles by age and AI relevance
  - name: deduplicate
    description: Remove already-seen articles

# Operational limits
limits:
  max_tokens: 8192
  max_turns: 3

# MCP servers required
mcp_servers: []

# Collector-specific configuration
collector:
  # Maximum age of articles to collect (hours)
  max_age_hours: 24

  # Only include AI-relevant articles
  filter_ai_relevant: true

  # Feed categories and priorities
  feed_categories:
    company_blogs:
      priority: 10
      sources:
        - OpenAI
        - Anthropic
        - Google AI
        - Meta AI
    ai_focused:
      priority: 8
      sources:
        - MIT Tech Review
        - VentureBeat
        - TechCrunch
    research:
      priority: 7
      sources:
        - ArXiv AI
        - ArXiv ML
        - ArXiv NLP
    general_tech:
      priority: 6
      sources:
        - Hacker News
        - Ars Technica
        - The Verge
    security:
      priority: 5
      sources:
        - Schneier on Security
        - The Hacker News
