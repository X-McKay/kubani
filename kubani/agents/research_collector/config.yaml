name: research-collector
version: "1.0.0"
description: >
  Collects research papers from arXiv and trending repositories from GitHub
  for inclusion in news digests. Implements fetch-arxiv-papers and
  fetch-github-trending skills.

skills:
  allowed:
    - "news/collection/*"
  denied: []

capabilities:
  - name: fetch_arxiv_papers
    description: Fetch recent AI/ML papers from arXiv RSS feeds
  - name: fetch_github_trending
    description: Fetch trending AI repositories from GitHub API

limits:
  max_tokens: 4096
  max_turns: 1

mcp_servers: []

# Agent-specific configuration
research:
  # arXiv settings
  max_papers_per_category: 20
  arxiv_categories:
    - cs.AI
    - cs.LG
    - cs.CL

  # GitHub settings
  max_repos: 30
  min_stars: 100
  github_topics:
    - machine-learning
    - deep-learning
    - llm
    - langchain
    - ai
    - transformers
    - neural-network
    - pytorch
    - huggingface
