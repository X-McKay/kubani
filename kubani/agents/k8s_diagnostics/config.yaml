name: k8s-diagnostics
version: "1.0.0"
description: >
  Investigates Kubernetes issues by gathering logs, events, and resource
  status. Reports findings with root cause analysis and actionable
  recommendations. Never takes remediation actions.

skills:
  allowed:
    - "k8s/diagnostic/*"
    - "k8s/collection/*"
  denied:
    - "k8s/remediation/*"

capabilities:
  - name: investigate_issue
    description: Deep investigation of a Kubernetes issue with root cause analysis
  - name: gather_evidence
    description: Collect logs, events, and resource status for an issue

limits:
  max_tokens: 4096
  max_turns: 8

mcp_servers:
  - kubernetes-mcp-server
