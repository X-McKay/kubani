# Event Classifier Agent Configuration
# Classifies events by severity and category for downstream processing

name: event-classifier
version: "1.0.0"
description: >
  Watches Kubernetes events via watch streams or MCP polling, classifies them
  based on known patterns and LLM intelligence, and publishes actionable issues
  for the Healer to process.

# Skills this agent can use
skills:
  allowed:
    - "k8s/collection/*"
    - "k8s/diagnostic/*"
  denied:
    - "k8s/remediation/*"  # Classifier observes, doesn't remediate

# Agent capabilities for A2A registration
capabilities:
  - name: classify_events
    description: Classify Kubernetes events by severity and category
  - name: detect_issues
    description: Detect actionable issues from Warning events
  - name: correlate_events
    description: Group related events within a time window

# Operational limits
limits:
  max_tokens: 4096
  max_turns: 1  # Classification is single-turn

# MCP servers required
mcp_servers:
  - kubernetes-mcp-server

# Classifier-specific configuration
classifier:
  # Watch mode: watch (real-time), poll (MCP), auto (watch with poll fallback)
  watch_mode: auto

  # Polling interval in seconds (when in poll mode)
  poll_interval: 30.0

  # Maximum event age in seconds to consider
  max_event_age: 300

  # Deduplication cooldown in seconds
  cooldown_seconds: 3600

  # Enable LLM classification for unknown patterns
  enable_llm_classification: true

  # LLM classifier configuration
  llm_classifier:
    enabled: true
    cache_classifications: true
    cache_ttl_seconds: 86400
    max_retries: 2
    timeout_seconds: 30.0

  # Enable event correlation
  enable_correlation: true

  # Correlation window in seconds
  correlation_window: 30

# Known issue patterns with severity and category
patterns:
  # Critical - Immediate action required
  OOMKilled:
    severity: critical
    category: resource
  NodeNotReady:
    severity: critical
    category: node_health

  # High - Requires attention soon
  CrashLoopBackOff:
    severity: high
    category: pod_health
  ImagePullBackOff:
    severity: high
    category: pod_health
  ErrImagePull:
    severity: high
    category: pod_health
  FailedScheduling:
    severity: high
    category: scheduling
  FailedMount:
    severity: high
    category: storage
  FailedCreate:
    severity: high
    category: resource
  NetworkNotReady:
    severity: high
    category: network
  FreeDiskSpaceFailed:
    severity: high
    category: storage
  EvictionThresholdMet:
    severity: high
    category: resource
  NodeHasDiskPressure:
    severity: high
    category: node_health
  NodeHasMemoryPressure:
    severity: high
    category: node_health

  # Medium - Should be monitored
  Unhealthy:
    severity: medium
    category: pod_health
  BackOff:
    severity: medium
    category: pod_health
  FailedKillPod:
    severity: medium
    category: pod_health

# Benign patterns to ignore
benign_patterns:
  - DNSConfigForming      # DNS warnings with Tailscale
  - Killing               # Normal deployment lifecycle
  - Preempting            # Normal scheduler preemption
  - ProbeWarning          # Transient probe failures
  - ReconciliationSucceeded  # Flux success events
  - Progressing           # Normal Flux progress

# Ignored resource patterns (regex)
ignored_resources:
  - "^k8s-monitor-"       # Don't monitor ourselves
  - "-start-schedule-"    # Scheduled job pods
  - "-start-scheduler-"   # Init container jobs
