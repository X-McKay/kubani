name: trend-analyst
version: "1.0.0"
description: >
  Analyzes trends by comparing current entity mentions against historical data.
  Identifies surging, rising, emerging, and declining topics with velocity metrics.

skills:
  allowed:
    - "news/diagnostic/*"
  denied: []

capabilities:
  - name: analyze_trends
    description: Compare current vs historical data to identify trend velocity

limits:
  max_tokens: 4096
  max_turns: 1

mcp_servers:
  - memory-mcp-server

# Agent-specific configuration
analyst:
  # Minimum mentions to include an entity in analysis
  min_mentions: 2

  # Default historical lookback period
  default_lookback_days: 14

  # Velocity thresholds (percentage change)
  surging_threshold: 100   # >100% increase = surging
  rising_threshold: 25     # >25% increase = rising
  declining_threshold: -25 # <-25% = declining
  fading_threshold: -75    # <-75% = fading
