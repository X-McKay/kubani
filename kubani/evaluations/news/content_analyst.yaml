name: content_analyst_evaluation
description: Evaluate ContentAnalystAgent behavior for article analysis, trend detection, and breaking news identification
version: "1.0"
agent: content-analyst

# Test cases for ContentAnalystAgent
test_cases:
  # ============================================================================
  # ARTICLE ANALYSIS
  # ============================================================================

  - id: analyze_high_importance_article
    name: High Importance Article Detection
    description: Agent should identify major model release as high importance
    input:
      articles:
        - title: "OpenAI Releases GPT-5 with Revolutionary Capabilities"
          source: "OpenAI Blog"
          source_category: "company_blogs"
          summary: "Today we announce GPT-5, our most capable model. It demonstrates significant improvements in reasoning, coding, and multimodal understanding."
          url: "https://openai.com/blog/gpt-5"
          published_date: "2026-01-29T10:00:00Z"
    expected:
      articles_analyzed: 1
      high_importance_detected: true
      importance_range: [8, 10]
      category: "research"
      entities_include: ["OpenAI", "GPT-5"]
    evaluator: automated
    tags: [importance, model_release]

  - id: analyze_security_article
    name: Security Article Analysis
    description: Agent should categorize security vulnerabilities correctly
    input:
      articles:
        - title: "Critical RCE Vulnerability in LangChain Affects Millions"
          source: "SecurityWeek"
          source_category: "security"
          summary: "A critical remote code execution vulnerability has been discovered in LangChain. All users should update immediately."
          url: "https://securityweek.com/langchain-rce"
          published_date: "2026-01-29T08:30:00Z"
    expected:
      articles_analyzed: 1
      category: "security"
      importance_range: [8, 10]
      is_breaking: true
    evaluator: automated
    tags: [security, breaking]

  - id: analyze_routine_article
    name: Routine News Article
    description: Agent should score routine updates as medium importance
    input:
      articles:
        - title: "Minor Update to Popular Python Package"
          source: "Tech Blog"
          source_category: "general_tech"
          summary: "Version 2.1.3 released with bug fixes and minor improvements."
          url: "https://example.com/update"
          published_date: "2026-01-29T12:00:00Z"
    expected:
      articles_analyzed: 1
      importance_range: [3, 6]
      is_breaking: false
    evaluator: automated
    tags: [routine]

  - id: analyze_multiple_articles
    name: Batch Article Analysis
    description: Agent should analyze multiple articles correctly
    input:
      articles:
        - title: "Google Announces Gemini 2.0"
          source: "The Verge"
          summary: "Google unveils next-generation AI model."
          url: "https://theverge.com/gemini2"
          published_date: "2026-01-29T09:00:00Z"
        - title: "AI Startup Raises $50M Series B"
          source: "TechCrunch"
          summary: "AI infrastructure company secures funding."
          url: "https://techcrunch.com/funding"
          published_date: "2026-01-29T11:00:00Z"
        - title: "Weekly AI Newsletter"
          source: "AI Weekly"
          summary: "This week in AI news and developments."
          url: "https://example.com/newsletter"
          published_date: "2026-01-29T10:00:00Z"
    expected:
      articles_analyzed: 3
      articles_processed: 3
    evaluator: automated
    tags: [batch]

  # ============================================================================
  # BREAKING NEWS DETECTION
  # ============================================================================

  - id: detect_breaking_model_release
    name: Breaking News - Model Release
    description: Agent should flag major model release as breaking
    input:
      processed_articles:
        - title: "Claude 4 Released: Anthropic's Most Capable Model"
          source: "Anthropic"
          importance_score: 10
          is_breaking: true
          category: "research"
          entities: ["Claude 4", "Anthropic"]
    expected:
      breaking_detected: true
      breaking_count: 1
    evaluator: automated
    tags: [breaking, model_release]

  - id: detect_breaking_acquisition
    name: Breaking News - Major Acquisition
    description: Agent should flag major acquisition as breaking
    input:
      processed_articles:
        - title: "Microsoft Acquires OpenAI for $100B"
          source: "Reuters"
          importance_score: 10
          is_breaking: true
          category: "business"
          entities: ["Microsoft", "OpenAI"]
    expected:
      breaking_detected: true
      breaking_count: 1
    evaluator: automated
    tags: [breaking, acquisition]

  - id: no_breaking_for_routine
    name: No Breaking for Routine News
    description: Agent should not flag routine news as breaking
    input:
      processed_articles:
        - title: "Weekly AI Newsletter"
          source: "AI Weekly"
          importance_score: 4
          is_breaking: false
          category: "general"
          entities: ["AI"]
        - title: "Minor Framework Update"
          source: "Dev Blog"
          importance_score: 5
          is_breaking: false
          category: "product"
          entities: []
    expected:
      breaking_detected: false
      breaking_count: 0
    evaluator: automated
    tags: [breaking, negative]

  # ============================================================================
  # TREND ANALYSIS
  # ============================================================================

  - id: detect_hot_trend
    name: Hot Trend Detection
    description: Agent should identify topic covered by multiple sources as HOT
    input:
      processed_articles:
        - title: "GPT-5 Released"
          source: "TechCrunch"
          entities: ["OpenAI", "GPT-5"]
        - title: "GPT-5 Analysis"
          source: "The Verge"
          entities: ["GPT-5", "AI"]
        - title: "What GPT-5 Means for AI"
          source: "Wired"
          entities: ["GPT-5", "AI", "Language Models"]
        - title: "GPT-5 Technical Review"
          source: "arXiv"
          entities: ["GPT-5", "Transformer"]
      hot_threshold: 3
    expected:
      trends_identified: true
      hot_trends_count: 1
      hot_topics_include: ["gpt-5"]
    evaluator: automated
    tags: [trends, hot]

  - id: detect_rising_trend
    name: Rising Trend Detection
    description: Agent should identify emerging topics
    input:
      processed_articles:
        - title: "New AI Agents Framework"
          source: "Source 1"
          entities: ["AI Agents", "Framework"]
        - title: "AI Agents Are the Future"
          source: "Source 2"
          entities: ["AI Agents", "Autonomy"]
      hot_threshold: 3
    expected:
      trends_identified: true
      rising_trends_exist: true
    evaluator: automated
    tags: [trends, rising]

  - id: no_trend_single_mention
    name: No Trend for Single Mentions
    description: Topics mentioned once should not be trends
    input:
      processed_articles:
        - title: "Article About Topic A"
          source: "Source 1"
          entities: ["Topic A"]
        - title: "Article About Topic B"
          source: "Source 2"
          entities: ["Topic B"]
        - title: "Article About Topic C"
          source: "Source 3"
          entities: ["Topic C"]
      hot_threshold: 3
    expected:
      trends_count: 0
    evaluator: automated
    tags: [trends, negative]

  # ============================================================================
  # LLM JUDGE TESTS
  # ============================================================================

  - id: analysis_quality_assessment
    name: Analysis Quality Assessment
    description: LLM evaluates overall analysis quality
    input:
      articles:
        - title: "Anthropic Introduces Constitutional AI 2.0"
          source: "Anthropic Blog"
          source_category: "company_blogs"
          summary: "We present Constitutional AI 2.0, an improved approach to training safe and helpful AI systems. The new method reduces harmful outputs by 90% while maintaining helpfulness."
          url: "https://anthropic.com/constitutional-ai-2"
          published_date: "2026-01-29T14:00:00Z"
    evaluator: llm_judge
    llm_criteria:
      - name: summary_accuracy
        weight: 0.3
        prompt: "Does the AI summary accurately capture the key points of the article?"
      - name: importance_appropriateness
        weight: 0.3
        prompt: "Is the importance score appropriate for this type of announcement (major research from leading AI lab)?"
      - name: entity_extraction
        weight: 0.2
        prompt: "Were the relevant entities (Anthropic, Constitutional AI) correctly identified?"
      - name: categorization
        weight: 0.2
        prompt: "Was the article correctly categorized as research?"
    tags: [llm_judge, quality]

# Metrics thresholds
metrics:
  - name: accuracy
    type: percentage
    threshold: 0.90
  - name: breaking_detection_accuracy
    type: percentage
    threshold: 0.95
  - name: trend_detection_accuracy
    type: percentage
    threshold: 0.85
  - name: analysis_latency_p95
    type: duration
    threshold: 5000ms
