[project]
name = "discord-mcp-server"
version = "0.4.2"
description = "Discord MCP server for Kubani - bidirectional Discord integration for AI agents"
authors = [{ name = "Kubani Team" }]
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "mcp>=1.0.0",
    "discord.py>=2.3.0",
    "pydantic>=2.0.0",
    "kubani-framework",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
discord-mcp-server = "discord_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discord_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
