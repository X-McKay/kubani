[project]
name = "skills-mcp-server"
version = "0.1.1"
description = "Skills MCP server for Kubani - discovers and executes skills with sandboxed isolation"
authors = [{ name = "Kubani Team" }]
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "python-frontmatter>=1.0.0",
    "microsandbox>=0.1.0",
    "prometheus-client>=0.19.0",
    "kubani",
    "oras>=0.1.0",
]

[tool.uv.sources]
kubani = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
skills-mcp-server = "skills_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skills_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
