[project]
name = "news-digest-syndicate"
version = "0.8.0"
description = "News aggregation and digest generation syndicate"
requires-python = ">=3.11"
dependencies = [
    "kubani",
    # News-specific dependencies
    "feedparser>=6.0.0",
    "httpx>=0.27.0",
    "openai>=1.0.0",
    "redis>=5.0.0",
]

[tool.uv.sources]
kubani = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/news_digest_syndicate"]

[project.scripts]
news-digest-worker = "news_digest_syndicate.worker:main"
news-digest-schedule = "news_digest_syndicate.worker:schedules"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
