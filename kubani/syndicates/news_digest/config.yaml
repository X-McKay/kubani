# News Digest Syndicate Configuration
# Three-stage pipeline: Ingest → Analyze → Digest

name: news-digest
version: "2.0.0"
description: >
  Three-stage pipeline for AI/ML news intelligence.
  Stage 1 (Ingest): Source-specific collectors for RSS, arXiv, and GitHub
  with batch deduplication and tuned schedules.
  Stage 2 (Analyze): Entity extraction, topic classification, importance
  scoring, and knowledge graph integration.
  Stage 3 (Digest): Scheduled summaries querying analyzed documents,
  published to Discord.

# Agents used by this syndicate
agents:
  - feed-collector      # RSS feed collection (Stage 1)
  - research-collector  # arXiv and GitHub collection (Stage 1)
  - content-analyst     # Document analysis and enrichment (Stage 2)
  - digest-publisher    # Digest composition and publishing (Stage 3)

# Temporal workflow configuration
task_queue: news-digest
namespace: default

# Pipeline stages and schedules (managed by Temporal, see worker.py):
#
# Stage 1 - Ingest (source-specific schedules):
#   - RSS:    every 30 minutes  (high-frequency news sources)
#   - arXiv:  every 4 hours     (daily paper batches)
#   - GitHub: every 6 hours     (trending repos change slowly)
#
# Stage 2 - Analyze:
#   - Triggered by ingest workflows via child workflow
#   - Processes each new batch immediately after ingest
#
# Stage 3 - Digest:
#   - Morning digest: 9:00 AM daily (12h lookback)
#   - Evening digest: 9:00 PM daily (12h lookback)

# Event subscriptions
events:
  subscribe:
    - NEWS_INGEST_REQUESTED
  publish:
    - NEWS_DIGEST_PUBLISHED

# Discord integration
discord:
  enabled: true
  digest_channel: ai-news
  notifications:
    - digest_published

# Deduplication configuration
dedup:
  # TTL for dedup cache keys (days)
  rss_ttl_days: 7
  arxiv_ttl_days: 30
  github_ttl_days: 14
  # Strategy per source type
  rss_strategy: uri_hash       # SHA-256 of article URL
  arxiv_strategy: arxiv_id     # arXiv paper ID
  github_strategy: repo_url    # GitHub repo URL

# Analysis configuration
analysis:
  # Maximum documents to analyze per batch
  max_batch_size: 50
  # Minimum importance score to include in digest
  min_digest_importance: 3
  # Maximum entities/topics per document for graph
  max_entities: 10
  max_topics: 10
