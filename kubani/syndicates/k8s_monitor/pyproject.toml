[project]
name = "k8s-monitor-syndicate"
version = "0.4.0"
description = "Kubernetes cluster health monitoring syndicate"
requires-python = ">=3.11"
dependencies = [
    "kubani",
    # K8s-specific dependencies
    "redis>=5.0.0",
    "qdrant-client>=1.7.0",
]

[tool.uv.sources]
kubani = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/k8s_monitor_syndicate"]

[project.scripts]
k8s-monitor-worker = "k8s_monitor_syndicate.worker:main"
k8s-monitor-schedule = "k8s_monitor_syndicate.worker:schedule"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
