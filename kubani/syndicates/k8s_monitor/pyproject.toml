[project]
name = "k8s-monitor-syndicate"
version = "1.0.2"
description = "K8s cluster monitoring syndicate - multi-agent swarm"
requires-python = ">=3.12"
dependencies = [
    "kubani",
    "redis>=5.0.0",
    "httpx>=0.27.0",
]

[tool.uv.sources]
kubani = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/k8s_monitor_syndicate"]

[project.scripts]
k8s-monitor-worker = "k8s_monitor_syndicate.worker:main"
k8s-monitor-schedules = "k8s_monitor_syndicate.worker:schedules"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
