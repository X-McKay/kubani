name: k8s-monitor
version: "1.0.0"
description: >
  K8s cluster monitoring syndicate. Uses a coordinator agent to assess
  cluster health and dispatch to specialist agents for investigation
  and remediation.

agents:
  - k8s-coordinator
  - k8s-diagnostics
  - remediator

task_queue: k8s-monitor
namespace: k8s-monitor

events:
  subscribe:
    - K8S_ISSUE_DETECTED
  publish:
    - K8S_HEALTH_CHECK_COMPLETED

discord:
  enabled: true
  channel: kubani-alerts

schedule:
  health_check_interval_minutes: 5
