test_cases:
  - name: happy_path_identify_breaking_news
    description: Identify breaking news from articles with high importance scores
    inputs:
      articles:
        - title: "OpenAI Releases GPT-5 with AGI Capabilities"
          url: "https://openai.com/blog/gpt5"
          source: "OpenAI Blog"
          ai_summary: "OpenAI has released GPT-5, demonstrating unprecedented reasoning capabilities."
          importance_score: 10
          is_breaking: true
          breaking_reason: "Major model release from leading AI company"
          category: "product"
        - title: "Minor Update to Open Source Library"
          url: "https://example.com/minor-update"
          source: "GitHub Blog"
          ai_summary: "Small bug fixes in popular library."
          importance_score: 3
          is_breaking: false
          category: "product"
    assertions:
      - type: exists
        field: result
        description: Should return breaking news array
      - type: exists
        field: result.0.breaking_score
        description: Breaking articles should have breaking_score

  - name: edge_case_no_breaking_news
    description: Handle case with no breaking news articles
    inputs:
      articles:
        - title: "Local Restaurant Opens"
          url: "https://example.com/local"
          source: "Local News"
          ai_summary: "A new restaurant opened downtown."
          importance_score: 2
          is_breaking: false
          category: "general"
        - title: "Minor Software Update"
          url: "https://example.com/update"
          source: "Tech Blog"
          ai_summary: "Version 1.2.3 released with bug fixes."
          importance_score: 2
          is_breaking: false
          category: "product"
    assertions:
      - type: exists
        field: result
        description: Should return empty array for no breaking news

  - name: happy_path_multiple_breaking
    description: Identify multiple breaking news articles
    inputs:
      articles:
        - title: "Major Security Vulnerability Discovered"
          url: "https://example.com/security"
          source: "Security Research"
          ai_summary: "Critical vulnerability affects millions of systems."
          importance_score: 9
          is_breaking: true
          breaking_reason: "Critical security vulnerability"
          category: "security"
        - title: "Anthropic Announces Claude 4"
          url: "https://anthropic.com/claude4"
          source: "Anthropic Blog"
          ai_summary: "Next generation Claude model with improved capabilities."
          importance_score: 9
          is_breaking: true
          breaking_reason: "Major model release"
          category: "product"
    assertions:
      - type: exists
        field: result
        description: Should return breaking news array
      - type: exists
        field: result.1
        description: Should return multiple breaking articles

  - name: edge_case_empty_input
    description: Handle empty article list
    inputs:
      articles: []
    assertions:
      - type: exists
        field: result
        description: Should return empty array for empty input
