version: "2.0"

test_cases:
  # ============================================================================
  # EDGE CASES - Tests that reliably return object format
  # ============================================================================

  - name: edge_case_no_breaking_news
    description: Handle case with no breaking news articles
    category: edge_case

    inputs:
      articles:
        - title: "Local Restaurant Opens"
          url: "https://example.com/local"
          source: "Local News"
          ai_summary: "A new restaurant opened downtown."
          importance_score: 2
          is_breaking: false
          category: "general"

    assertions:
      - type: exists
        field: articles
        description: Should return articles field (may be empty)

  - name: output_format_validation
    description: Verify output contains required fields when single breaking article
    category: validation

    inputs:
      articles:
        - title: "Test Breaking News"
          url: "https://example.com/test"
          source: "Test Source"
          ai_summary: "Test summary"
          importance_score: 10
          is_breaking: true
          category: "product"

    assertions:
      - type: exists
        field: url
        description: Must include url in response

