version: "2.0"

test_cases:
  # ============================================================================
  # HAPPY PATH - SUCCESSFUL ARTICLE ANALYSIS
  # ============================================================================

  - name: happy_path_major_news
    description: Analyze a significant AI news article and store analysis
    category: happy_path

    inputs:
      article_id: "article-123"

    # Mocks for future tool-based evaluation
    mocks:
      memory.get:
        found: true
        object:
          id: "article-123"
          data:
            title: "OpenAI Releases GPT-5 with Revolutionary Reasoning Capabilities"
            url: "https://openai.com/blog/gpt5"
            source: "OpenAI Blog"
            summary: "OpenAI today announced the release of GPT-5, their most advanced language model featuring unprecedented reasoning capabilities."
      use_llm:
        summary: "OpenAI releases GPT-5 with major advances in reasoning capabilities."
        category: "product"
        entities: ["OpenAI", "GPT-5"]
        importance_score: 9
        is_breaking: true
        breaking_reason: "Major model release from leading AI company"
      memory.add:
        id: "analysis-456"
        success: true
      memory.link:
        created: true

    # Output assertions (for LLM simulation)
    assertions:
      - type: exists
        field: category
      - type: exists
        field: importance_score
      - type: exists
        field: summary

    # Tool invocation assertions (for future tool-based evaluation)
    invocation_assertions:
      - type: tool_invoked
        tool: "memory/get"
      - type: tool_invoked
        tool: "use_llm"
      - type: tool_invoked
        tool: "memory/add"
      - type: tool_invoked_with
        tool: "memory/add"
        arguments:
          type: "analysis"
          namespace: "news/analyses"
      - type: tool_invoked
        tool: "memory/link"
      - type: tool_invoked_with
        tool: "memory/link"
        arguments:
          relation_type: "ANALYZED_FROM"

  - name: happy_path_research_paper
    description: Analyze a research article from arXiv
    category: happy_path

    inputs:
      article_id: "article-arxiv"

    assertions:
      - type: exists
        field: category
      - type: exists
        field: importance_score
      - type: exists
        field: summary

  - name: happy_path_minor_news
    description: Analyze a minor news article
    category: happy_path

    inputs:
      article_id: "article-minor"

    assertions:
      - type: exists
        field: category
      - type: exists
        field: importance_score
      - type: exists
        field: is_breaking

  # ============================================================================
  # OUTPUT FORMAT VALIDATION
  # ============================================================================

  - name: output_format_validation
    description: Verify analysis output contains all required fields
    category: validation

    inputs:
      article_id: "article-test"

    assertions:
      - type: exists
        field: summary
        description: Must include a summary
      - type: exists
        field: category
        description: Must include a category
      - type: exists
        field: importance_score
        description: Must include an importance score
      - type: exists
        field: entities
        description: Must include extracted entities

  - name: breaking_news_detection
    description: Correctly identify breaking news
    category: validation

    inputs:
      article_id: "article-breaking"

    assertions:
      - type: exists
        field: is_breaking
        description: Must indicate whether news is breaking
