version: "2.0"

test_cases:
  # ============================================================================
  # HAPPY PATH - SUCCESSFUL DIGEST COMPOSITION
  # ============================================================================

  - name: happy_path_compose_digest
    description: Generate a formatted news digest from articles and trends
    category: happy_path

    inputs:
      articles:
        - title: "OpenAI Announces GPT-5"
          source: "OpenAI Blog"
          url: "https://openai.com/gpt5"
          ai_summary: "OpenAI releases their most advanced model yet."
          importance_score: 9
          category: "product"
        - title: "Anthropic Releases Claude 4"
          source: "Anthropic Blog"
          url: "https://anthropic.com/claude4"
          ai_summary: "New Claude model with improved capabilities."
          importance_score: 8
          category: "product"
      trends:
        - topic: "AI Models"
          status: "hot"
          mention_count: 15

    assertions:
      - type: exists
        field: digest
        description: Should return formatted digest content

  - name: happy_path_with_trends
    description: Generate digest with trending topics section
    category: happy_path

    inputs:
      articles:
        - title: "Tech News Update"
          source: "Tech Blog"
          url: "https://example.com/tech"
          ai_summary: "Latest technology developments."
          importance_score: 6
          category: "research"
      trends:
        - topic: "Machine Learning"
          status: "rising"
          mention_count: 8
        - topic: "Neural Networks"
          status: "established"
          mention_count: 5

    assertions:
      - type: exists
        field: digest
        description: Should return digest with trends

  # ============================================================================
  # EDGE CASES
  # ============================================================================

  - name: edge_case_empty_articles
    description: Handle empty article list
    category: edge_case

    inputs:
      articles: []
      trends: []

    assertions:
      - type: exists
        field: digest
        description: Should return digest structure even with no articles

  - name: output_format_validation
    description: Verify output contains required fields
    category: validation

    inputs:
      articles:
        - title: "Test Article"
          source: "Test Source"
          url: "https://example.com/test"
          ai_summary: "Test summary"
          importance_score: 5
          category: "general"
      trends: []

    assertions:
      - type: exists
        field: digest
        description: Must include digest content
