test_cases:
  - name: happy_path_publish_discord
    description: Publish formatted content to Discord via webhook
    inputs:
      message: "This is a test message with some important information."
      channel_id: "1234567890"
      webhook_url: "https://discord.com/api/webhooks/1234567890/abcdef1234567890"
    assertions:
      - type: exists
        field: status
        description: Should return status field
      - type: contains
        field: status
        value: "success"
        description: Operation should be successful

  - name: edge_case_long_message_splitting
    description: Handle long messages that need splitting
    inputs:
      message: "This is a very long message that needs to be split into multiple parts when published to Discord. Discord has a character limit of 2000 characters per message, so when content exceeds this limit, the system should automatically split the message into multiple sequential messages."
      channel_id: "1234567890"
      webhook_url: "https://discord.com/api/webhooks/1234567890/abcdef1234567890"
    assertions:
      - type: exists
        field: status
        description: Should return status field

  - name: error_case_invalid_webhook_url
    description: Handle invalid webhook URL
    inputs:
      message: "Test message"
      channel_id: "1234567890"
      webhook_url: "invalid-url"
    assertions:
      - type: exists
        field: status
        description: Should return status indicating result

  - name: happy_path_with_embed
    description: Publish message with Discord embed formatting
    inputs:
      message: "Important news update about AI developments"
      channel_id: "1234567890"
      webhook_url: "https://discord.com/api/webhooks/1234567890/abcdef1234567890"
      embed:
        title: "AI News"
        description: "Latest developments in AI"
        color: 16711680
    assertions:
      - type: exists
        field: status
        description: Should return status for embed message
