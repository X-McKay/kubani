test_cases:
  - name: "Full daily digest with all sections"
    description: "Create a complete digest with all optional sections populated"
    context:
      articles:
        - title: "GPT-5 Announced by OpenAI"
          url: "https://example.com/gpt5"
          source: "OpenAI Blog"
          importance_score: 10
          ai_summary: "OpenAI announces GPT-5 with major improvements"
          entities: ["GPT-5", "OpenAI"]
        - title: "LoRA Fine-tuning Gets Easier"
          url: "https://example.com/lora"
          source: "TechCrunch"
          importance_score: 8
          ai_summary: "New libraries simplify LoRA fine-tuning"
          entities: ["LoRA", "fine-tuning"]
      research_deepdives:
        - arxiv_id: "2601.54321"
          title: "FlashAttention-3"
          authors: ["Tri Dao"]
          practitioner_summary: "FlashAttention-3 achieves 2x speedup..."
          key_takeaways: ["2x faster", "Better memory usage"]
          relevance_scores:
            overall: 9
      tool_spotlights:
        - full_name: "example/llm-tool"
          name: "llm-tool"
          stars: 5000
          language: "Python"
          spotlight_summary: "A powerful new LLM inference library..."
          spotlight_worthy: true
      company_updates:
        - title: "OpenAI GPT-5 Details"
          url: "https://openai.com/gpt5"
          source: "OpenAI Blog"
          importance_score: 10
      trends: null
      digest_type: "daily"
      period_hours: 24
    expected:
      sections_included:
        - "executive_summary"
        - "research_deepdives"
        - "tool_spotlights"
        - "company_updates"
      digest:
        digest_type: "daily"
      criteria_met:
        - all_sections_present
        - executive_summary_coherent
        - citations_embedded
        - discord_chunks_valid_length

  - name: "Minimal digest - articles only"
    description: "Create digest when only articles are available"
    context:
      articles:
        - title: "Minor AI Update"
          url: "https://example.com/minor"
          source: "Blog"
          importance_score: 6
          ai_summary: "A small update in the AI space"
          entities: ["AI"]
        - title: "Another Update"
          url: "https://example.com/another"
          source: "News"
          importance_score: 5
          ai_summary: "Another development"
          entities: ["ML"]
      research_deepdives: []
      tool_spotlights: []
      company_updates: []
      trends: null
      digest_type: "daily"
      period_hours: 24
    expected:
      sections_included:
        - "executive_summary"
      criteria_met:
        - graceful_minimal_content
        - executive_summary_generated
        - empty_sections_omitted

  - name: "Weekly digest with trends"
    description: "Create weekly digest including trend analysis"
    context:
      articles:
        - title: "Weekly Summary Article 1"
          url: "https://example.com/1"
          source: "TechCrunch"
          importance_score: 8
          ai_summary: "Summary 1"
          entities: ["LoRA"]
        - title: "Weekly Summary Article 2"
          url: "https://example.com/2"
          source: "VentureBeat"
          importance_score: 7
          ai_summary: "Summary 2"
          entities: ["AI agents"]
      research_deepdives:
        - arxiv_id: "2601.11111"
          title: "Research Paper"
          authors: ["Author"]
          practitioner_summary: "Summary..."
          key_takeaways: ["Takeaway"]
          relevance_scores:
            overall: 8
      tool_spotlights: []
      company_updates: []
      trends:
        trends:
          - entity: "LoRA"
            velocity_class: "surging"
            current_mentions: 15
        emerging_topics: ["mixture-of-agents"]
        declining_topics: ["BERT"]
        summary: "LoRA continues to surge in coverage..."
      digest_type: "weekly"
      period_hours: 168
    expected:
      sections_included:
        - "executive_summary"
        - "research_deepdives"
        - "trends"
      digest:
        digest_type: "weekly"
      criteria_met:
        - trends_section_included
        - weekly_format_applied

  - name: "Discord message chunking"
    description: "Ensure long content is properly split for Discord"
    context:
      articles:
        - title: "Article 1"
          url: "https://example.com/1"
          source: "Source"
          importance_score: 9
          ai_summary: "Very long summary that goes on and on..."
          entities: ["AI"]
        - title: "Article 2"
          url: "https://example.com/2"
          source: "Source"
          importance_score: 8
          ai_summary: "Another long summary..."
          entities: ["ML"]
        - title: "Article 3"
          url: "https://example.com/3"
          source: "Source"
          importance_score: 7
          ai_summary: "Yet another summary..."
          entities: ["DL"]
      research_deepdives:
        - arxiv_id: "2601.11111"
          title: "Long Paper Title"
          authors: ["Author 1", "Author 2", "Author 3"]
          practitioner_summary: "A very detailed practitioner summary that explains the paper in depth and covers multiple paragraphs of content..."
          key_takeaways: ["Takeaway 1 with details", "Takeaway 2 with more", "Takeaway 3"]
          relevance_scores:
            overall: 9
        - arxiv_id: "2601.22222"
          title: "Another Paper"
          authors: ["Author"]
          practitioner_summary: "Another detailed summary..."
          key_takeaways: ["Takeaway"]
          relevance_scores:
            overall: 8
      tool_spotlights:
        - full_name: "org/tool1"
          name: "tool1"
          stars: 10000
          language: "Python"
          spotlight_summary: "Tool description..."
          spotlight_worthy: true
        - full_name: "org/tool2"
          name: "tool2"
          stars: 8000
          language: "Rust"
          spotlight_summary: "Another tool..."
          spotlight_worthy: true
      company_updates: []
      trends: null
      digest_type: "daily"
      period_hours: 24
    expected:
      criteria_met:
        - discord_messages_under_1900_chars
        - no_mid_section_breaks
        - continuation_indicators_present

  - name: "Company updates grouping"
    description: "Group company updates by company name"
    context:
      articles:
        - title: "General Article"
          url: "https://example.com/gen"
          source: "News"
          importance_score: 7
          ai_summary: "General news"
          entities: ["AI"]
      research_deepdives: []
      tool_spotlights: []
      company_updates:
        - title: "OpenAI Announces Feature"
          url: "https://openai.com/feature"
          source: "OpenAI Blog"
          importance_score: 9
          ai_summary: "OpenAI new feature"
          entities: ["OpenAI", "GPT"]
        - title: "OpenAI Pricing Update"
          url: "https://openai.com/pricing"
          source: "OpenAI Blog"
          importance_score: 7
          ai_summary: "Pricing changes"
          entities: ["OpenAI"]
        - title: "Anthropic Claude Update"
          url: "https://anthropic.com/claude"
          source: "Anthropic Blog"
          importance_score: 8
          ai_summary: "Claude improvements"
          entities: ["Anthropic", "Claude"]
      trends: null
      digest_type: "daily"
      period_hours: 24
    expected:
      sections_included:
        - "executive_summary"
        - "company_updates"
      criteria_met:
        - companies_grouped
        - openai_updates_together
        - anthropic_updates_together

  - name: "Handle LLM summary failure"
    description: "Fallback to bullet points if LLM fails"
    context:
      articles:
        - title: "Article 1"
          url: "https://example.com/1"
          source: "Source"
          importance_score: 8
          ai_summary: "Summary 1"
          entities: ["AI"]
        - title: "Article 2"
          url: "https://example.com/2"
          source: "Source"
          importance_score: 7
          ai_summary: "Summary 2"
          entities: ["ML"]
      research_deepdives: []
      tool_spotlights: []
      company_updates: []
      trends: null
      digest_type: "daily"
      period_hours: 24
    mocks:
      llm_summary:
        error: "LLM timeout"
    expected:
      success: true
      criteria_met:
        - fallback_format_used
        - bullet_point_summary
        - no_exception_thrown

  - name: "Insufficient content"
    description: "Handle case with too little content"
    context:
      articles: []
      research_deepdives: []
      tool_spotlights: []
      company_updates: []
      trends: null
      digest_type: "daily"
      period_hours: 24
    expected:
      success: false
      criteria_met:
        - error_returned
        - explanation_provided

  - name: "Research deep-dive limit"
    description: "Limit research section to max 3 papers"
    context:
      articles:
        - title: "Article"
          url: "https://example.com/1"
          source: "Source"
          importance_score: 7
          ai_summary: "Summary"
          entities: ["AI"]
      research_deepdives:
        - arxiv_id: "2601.11111"
          title: "Paper 1"
          authors: ["Author"]
          practitioner_summary: "Summary 1"
          key_takeaways: ["Takeaway"]
          relevance_scores:
            overall: 9
        - arxiv_id: "2601.22222"
          title: "Paper 2"
          authors: ["Author"]
          practitioner_summary: "Summary 2"
          key_takeaways: ["Takeaway"]
          relevance_scores:
            overall: 8
        - arxiv_id: "2601.33333"
          title: "Paper 3"
          authors: ["Author"]
          practitioner_summary: "Summary 3"
          key_takeaways: ["Takeaway"]
          relevance_scores:
            overall: 8
        - arxiv_id: "2601.44444"
          title: "Paper 4 - Should be excluded"
          authors: ["Author"]
          practitioner_summary: "Summary 4"
          key_takeaways: ["Takeaway"]
          relevance_scores:
            overall: 7
      tool_spotlights: []
      company_updates: []
      trends: null
      digest_type: "daily"
      period_hours: 24
    expected:
      digest:
        metadata:
          papers_featured: 3
      criteria_met:
        - max_3_papers_included
        - highest_relevance_selected
