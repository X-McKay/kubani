test_cases:
  # ============================================================================
  # DIGEST PUBLISHING
  # ============================================================================

  - name: "Publish short digest"
    description: "Publish digest under 2000 characters"
    context:
      content: "# AI News Digest - Jan 29, 2026\n\n## Top Stories\n\nOpenAI released GPT-5 today with significant improvements. [TechCrunch](https://techcrunch.com/gpt5)\n\n**Trending:** AI Safety, GPT-5\n\n---\n*3 articles from 3 sources*"
      content_type: "digest"
      channel_name: "ai-news"
    expected:
      published: true
      message_id_exists: true
      chunks_sent: 1
      criteria_met:
        - single_message_sent
        - no_chunking_needed
        - message_id_returned

  - name: "Publish long digest requiring chunking"
    description: "Digest over 2000 chars should be split"
    context:
      content: |
        # AI News Digest - Jan 29, 2026 (Evening)

        ## Major Developments

        Today marks a significant day in AI history with multiple major announcements from leading companies. OpenAI has officially released GPT-5, their most advanced language model to date, featuring unprecedented reasoning capabilities and multimodal understanding. The model demonstrates remarkable improvements in code generation, mathematical reasoning, and creative writing tasks. [Read more at TechCrunch](https://techcrunch.com/gpt5)

        Meanwhile, Google DeepMind unveiled Gemini 2.0, a groundbreaking multimodal AI system that seamlessly integrates text, image, audio, and video processing. The new model shows particular strength in complex reasoning tasks and real-time interaction scenarios. Industry analysts predict this release will significantly impact the competitive landscape. [Full story at The Verge](https://theverge.com/gemini2)

        ## Industry Moves

        In acquisition news, Microsoft announced a strategic partnership expansion with OpenAI, increasing their investment by an additional $10 billion. This move solidifies their position as the primary commercial partner for GPT technology and ensures exclusive access to enterprise features. [Bloomberg coverage](https://bloomberg.com/microsoft-openai)

        Anthropic also made headlines with the release of Claude 3.5 Opus, their most capable model featuring enhanced reasoning and reduced hallucination rates. The company reported a 50% improvement in benchmark performance across standard evaluation suites. [Anthropic blog](https://anthropic.com/claude-35)

        ## Research Highlights

        The academic community saw several important publications this week. A team from Stanford introduced a novel architecture that promises to reduce transformer inference costs by 60% without sacrificing accuracy. The paper has already garnered significant attention from industry practitioners.

        ## Trending Topics

        - **GPT-5** (covered by 8 sources) - HOT
        - **Gemini 2.0** (covered by 6 sources) - HOT
        - **AI Agents** (covered by 5 sources) - RISING
        - **AI Safety** (covered by 4 sources) - RISING

        ## Emerging Themes

        - Multimodal AI Integration
        - Cost-Efficient Inference
        - Enterprise AI Adoption

        ---
        *15 articles from 12 sources | Generated by AI News Monitor*
      content_type: "digest"
      channel_name: "ai-news"
    expected:
      published: true
      chunks_sent: 2  # at least 2
      criteria_met:
        - content_chunked
        - all_chunks_sent
        - logical_breaks_preserved
        - no_mid_paragraph_splits

  - name: "Default channel used"
    description: "Should use ai-news channel by default"
    context:
      content: "# AI News Digest\n\nNews content here."
      content_type: "digest"
    expected:
      published: true
      channel: "ai-news"
      criteria_met:
        - default_channel_used
        - posted_successfully

  # ============================================================================
  # BREAKING NEWS ALERTS
  # ============================================================================

  - name: "Publish breaking news alert"
    description: "Breaking alert should use embed with @here"
    context:
      content_type: "breaking_alert"
      article:
        title: "Critical Security Vulnerability in Major AI Framework"
        url: "https://securityweek.com/ai-vuln"
        source: "SecurityWeek"
        category: "security"
        ai_summary: "A critical RCE vulnerability has been discovered affecting LangChain versions 0.1.x through 0.3.x. All users are urged to update immediately."
      channel_name: "ai-news"
    expected:
      published: true
      message_id_exists: true
      criteria_met:
        - embed_used
        - here_mention_included
        - red_color_used
        - article_details_in_embed
        - footer_present

  - name: "Breaking alert for model release"
    description: "Major model release breaking alert"
    context:
      content_type: "breaking_alert"
      article:
        title: "GPT-5 Released: OpenAI's Most Capable Model"
        url: "https://openai.com/blog/gpt-5"
        source: "OpenAI Blog"
        category: "research"
        ai_summary: "OpenAI has released GPT-5, demonstrating significant improvements in reasoning, coding, and multimodal understanding."
      channel_name: "ai-news"
    expected:
      published: true
      criteria_met:
        - breaking_title_formatted
        - source_field_present
        - category_field_present
        - url_linked

  # ============================================================================
  # ERROR HANDLING
  # ============================================================================

  - name: "Handle MCP server unavailable"
    description: "Should handle gracefully when Discord MCP is down"
    context:
      content: "# AI News Digest\n\nContent here."
      content_type: "digest"
      channel_name: "ai-news"
      discord_mcp_available: false
    expected:
      published: false
      criteria_met:
        - error_handled_gracefully
        - no_crash
        - error_message_returned

  - name: "Handle channel not found"
    description: "Should return error for non-existent channel"
    context:
      content: "# AI News Digest\n\nContent here."
      content_type: "digest"
      channel_name: "non-existent-channel"
    expected:
      published: false
      criteria_met:
        - channel_error_handled
        - error_message_descriptive

  - name: "Handle rate limiting"
    description: "Should retry on rate limit"
    context:
      content: "# AI News Digest\n\nContent here."
      content_type: "digest"
      channel_name: "ai-news"
      rate_limited: true
    expected:
      criteria_met:
        - retry_attempted
        - backoff_applied

  # ============================================================================
  # EDGE CASES
  # ============================================================================

  - name: "Empty content handling"
    description: "Should handle empty content gracefully"
    context:
      content: ""
      content_type: "digest"
      channel_name: "ai-news"
    expected:
      published: false
      criteria_met:
        - empty_content_rejected
        - error_message_returned

  - name: "Very long single paragraph"
    description: "Long paragraph without breaks should still chunk"
    context:
      content: "This is a very long paragraph without any line breaks that goes on and on describing various AI developments and news items in great detail without any natural breaking points which makes it challenging to chunk properly but the system should still handle it by finding appropriate points to split the content even if they are not ideal paragraph boundaries and ensure that each chunk is under the Discord character limit while maintaining readability and coherence of the message content for the end users who will be reading this in their Discord channels."
      content_type: "digest"
      channel_name: "ai-news"
    expected:
      published: true
      criteria_met:
        - long_paragraph_handled
        - chunked_appropriately

  - name: "Unicode content handling"
    description: "Should handle unicode and emoji in content"
    context:
      content: "# AI News 🤖\n\n## Top Stories\n\n🔥 OpenAI releases GPT-5\n🚀 Google announces Gemini 2.0\n📈 AI industry growth continues\n\n中文内容测试 - Testing Chinese characters"
      content_type: "digest"
      channel_name: "ai-news"
    expected:
      published: true
      criteria_met:
        - unicode_preserved
        - emoji_preserved
        - no_encoding_errors

  - name: "Breaking alert missing article"
    description: "Breaking alert without article should fail gracefully"
    context:
      content_type: "breaking_alert"
      channel_name: "ai-news"
    expected:
      published: false
      criteria_met:
        - missing_article_detected
        - error_message_returned

  - name: "Markdown formatting preserved"
    description: "Markdown should be preserved in Discord message"
    context:
      content: |
        # Heading

        **Bold text** and *italic text*

        - Bullet point 1
        - Bullet point 2

        `code snippet`

        [Link](https://example.com)
      content_type: "digest"
      channel_name: "ai-news"
    expected:
      published: true
      criteria_met:
        - markdown_preserved
        - formatting_intact
