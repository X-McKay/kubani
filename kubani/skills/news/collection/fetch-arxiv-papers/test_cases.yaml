version: "2.0"

test_cases:
  # ============================================================================
  # HAPPY PATH - SUCCESSFUL PAPER FETCHING
  # ============================================================================

  - name: happy_path_fetch_multiple_categories
    description: Fetch papers from multiple arXiv categories
    category: happy_path

    inputs:
      categories: ["cs.AI", "cs.LG"]
      max_results: 10
      days_back: 3

    # Mocks for future tool-based evaluation
    mocks:
      rss:
        "https://export.arxiv.org/rss/cs.AI":
          - title: "Advances in LLM Reasoning"
            link: "https://arxiv.org/abs/2601.12345"
            description: "We present a novel approach to improving reasoning in large language models."
            author: "Alice Smith, Bob Jones"
            published: "2026-01-26"
        "https://export.arxiv.org/rss/cs.LG":
          - title: "Efficient LoRA Training"
            link: "https://arxiv.org/abs/2601.12346"
            description: "A new method for efficient parameter adaptation."
            author: "Jane Doe"
            published: "2026-01-25"
      memory.check_seen:
        seen: false
      memory.add:
        id: "paper-123"
        success: true
      memory.mark_seen:
        success: true

    # Output assertions (for LLM simulation)
    assertions:
      - type: exists
        field: papers_stored
      - type: exists
        field: categories_processed

    # Tool invocation assertions (for future tool-based evaluation)
    invocation_assertions:
      - type: tool_invoked
        tool: "rss"
      - type: tool_invoked
        tool: "memory/check_seen"
      - type: tool_invoked
        tool: "memory/add"
      - type: tool_invoked_with
        tool: "memory/add"
        arguments:
          type: "document"
          namespace: "news/papers"
      - type: tool_invoked
        tool: "memory/mark_seen"

  - name: happy_path_single_category
    description: Fetch papers from a single arXiv category
    category: happy_path

    inputs:
      categories: ["cs.AI"]
      max_results: 5
      days_back: 7

    assertions:
      - type: exists
        field: papers_stored
      - type: exists
        field: categories_processed

  # ============================================================================
  # EDGE CASES
  # ============================================================================

  - name: empty_category_list
    description: Handle empty category configuration gracefully
    category: edge_case

    inputs:
      categories: []
      max_results: 10
      days_back: 7

    # When categories is empty, should return error or zero values
    assertions:
      - type: exists
        field: error
        description: Should return error when no categories provided

  - name: single_category_with_max_results
    description: Respect max_results parameter
    category: happy_path

    inputs:
      categories: ["cs.CL"]
      max_results: 3
      days_back: 5

    assertions:
      - type: exists
        field: papers_stored
      - type: exists
        field: categories_processed

  # ============================================================================
  # OUTPUT FORMAT VALIDATION
  # ============================================================================

  - name: output_format_validation
    description: Verify output contains required fields
    category: validation

    inputs:
      categories: ["cs.AI"]
      max_results: 5
      days_back: 7

    assertions:
      - type: exists
        field: papers_stored
        description: Must report number of papers stored
      - type: exists
        field: categories_processed
        description: Must report number of categories processed
