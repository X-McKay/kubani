test_cases:
  - name: "Happy path - weekly Python ML repos"
    description: "Fetch weekly trending Python machine learning repositories"
    context:
      language: "python"
      since: "weekly"
      topics: ["machine-learning", "llm"]
      min_stars: 100
      max_results: 5
    mocks:
      github_search:
        query: "topic:machine-learning OR topic:llm language:python stars:>100"
        response:
          total_count: 150
          items:
            - full_name: "example/ml-toolkit"
              name: "ml-toolkit"
              description: "A machine learning toolkit"
              html_url: "https://github.com/example/ml-toolkit"
              stargazers_count: 5000
              forks_count: 300
              language: "Python"
              topics: ["machine-learning", "pytorch"]
              created_at: "2025-06-01T00:00:00Z"
              pushed_at: "2026-01-26T12:00:00Z"
              open_issues_count: 15
            - full_name: "org/llm-lib"
              name: "llm-lib"
              description: "LLM utilities library"
              html_url: "https://github.com/org/llm-lib"
              stargazers_count: 2500
              forks_count: 150
              language: "Python"
              topics: ["llm", "transformers"]
              created_at: "2025-09-15T00:00:00Z"
              pushed_at: "2026-01-25T18:00:00Z"
              open_issues_count: 8
    expected:
      success: true
      total_found: 2
      topics_searched: ["machine-learning", "llm"]
      criteria_met:
        - repos_sorted_by_trending_score
        - all_repos_have_urls
        - all_repos_ai_relevant

  - name: "All languages daily trending"
    description: "Fetch daily trending AI repos across all languages"
    context:
      language: ""
      since: "daily"
      topics: ["artificial-intelligence"]
      min_stars: 50
      max_results: 10
    mocks:
      github_search:
        query: "topic:artificial-intelligence stars:>50"
        response:
          total_count: 25
          items:
            - full_name: "new/ai-project"
              name: "ai-project"
              description: "New AI project"
              html_url: "https://github.com/new/ai-project"
              stargazers_count: 150
              forks_count: 10
              language: "Rust"
              topics: ["artificial-intelligence", "rust"]
              created_at: "2026-01-25T00:00:00Z"
              pushed_at: "2026-01-27T08:00:00Z"
              open_issues_count: 2
    expected:
      success: true
      total_found: 1
      criteria_met:
        - no_language_filter_applied
        - recent_push_date

  - name: "No results found"
    description: "Search returns no matching repositories"
    context:
      language: "cobol"
      since: "daily"
      topics: ["machine-learning"]
      min_stars: 10000
      max_results: 10
    mocks:
      github_search:
        query: "topic:machine-learning language:cobol stars:>10000"
        response:
          total_count: 0
          items: []
    expected:
      success: true
      total_found: 0
      repos: []
      criteria_met:
        - empty_result_valid
        - no_error_thrown

  - name: "Rate limit handling"
    description: "GitHub API returns rate limit error"
    context:
      language: "python"
      since: "weekly"
      topics: ["llm"]
      min_stars: 100
      max_results: 5
    mocks:
      github_search:
        status: 403
        error: "API rate limit exceeded"
        headers:
          X-RateLimit-Remaining: "0"
          X-RateLimit-Reset: "1706400000"
    expected:
      success: true
      repos: []
      criteria_met:
        - graceful_rate_limit_handling
        - warning_logged

  - name: "Multiple topics OR search"
    description: "Search combines multiple topics with OR"
    context:
      language: ""
      since: "weekly"
      topics: ["deep-learning", "neural-network", "transformers"]
      min_stars: 200
      max_results: 10
    mocks:
      github_search:
        query: "topic:deep-learning OR topic:neural-network OR topic:transformers stars:>200"
        response:
          total_count: 500
          items:
            - full_name: "research/dl-framework"
              name: "dl-framework"
              description: "Deep learning framework"
              html_url: "https://github.com/research/dl-framework"
              stargazers_count: 12000
              forks_count: 800
              language: "Python"
              topics: ["deep-learning", "pytorch"]
              created_at: "2024-01-01T00:00:00Z"
              pushed_at: "2026-01-26T10:00:00Z"
              open_issues_count: 50
    expected:
      success: true
      topics_searched: ["deep-learning", "neural-network", "transformers"]
      criteria_met:
        - topics_combined_with_or
        - results_match_any_topic

  - name: "Filter out forks"
    description: "Forked repositories should be excluded"
    context:
      language: "python"
      since: "monthly"
      topics: ["machine-learning"]
      min_stars: 100
      max_results: 5
    mocks:
      github_search:
        response:
          total_count: 2
          items:
            - full_name: "original/ml-project"
              name: "ml-project"
              description: "Original ML project"
              html_url: "https://github.com/original/ml-project"
              stargazers_count: 3000
              forks_count: 200
              fork: false
              language: "Python"
              topics: ["machine-learning"]
              created_at: "2025-01-01T00:00:00Z"
              pushed_at: "2026-01-26T00:00:00Z"
              open_issues_count: 10
            - full_name: "fork/ml-project"
              name: "ml-project"
              description: "Forked ML project"
              html_url: "https://github.com/fork/ml-project"
              stargazers_count: 50
              forks_count: 5
              fork: true
              language: "Python"
              topics: ["machine-learning"]
              created_at: "2025-06-01T00:00:00Z"
              pushed_at: "2026-01-25T00:00:00Z"
              open_issues_count: 0
    expected:
      success: true
      total_found: 1
      criteria_met:
        - forks_excluded
        - original_repos_only

  - name: "Trending score calculation"
    description: "Repos should be sorted by calculated trending score"
    context:
      language: ""
      since: "weekly"
      topics: ["ai"]
      min_stars: 100
      max_results: 3
    mocks:
      github_search:
        response:
          total_count: 3
          items:
            - full_name: "low/stars-high-forks"
              name: "stars-high-forks"
              description: "Low stars but high forks"
              html_url: "https://github.com/low/stars-high-forks"
              stargazers_count: 500
              forks_count: 1000
              language: "Python"
              topics: ["ai"]
              created_at: "2025-01-01T00:00:00Z"
              pushed_at: "2026-01-26T00:00:00Z"
              open_issues_count: 5
            - full_name: "high/stars-low-forks"
              name: "stars-low-forks"
              description: "High stars but low forks"
              html_url: "https://github.com/high/stars-low-forks"
              stargazers_count: 3000
              forks_count: 50
              language: "Python"
              topics: ["ai"]
              created_at: "2025-01-01T00:00:00Z"
              pushed_at: "2026-01-26T00:00:00Z"
              open_issues_count: 10
    expected:
      success: true
      criteria_met:
        - repos_sorted_by_trending_score
        - trending_score_calculated
