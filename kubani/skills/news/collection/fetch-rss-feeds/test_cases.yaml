version: "2.0"

test_cases:
  # ============================================================================
  # HAPPY PATH - SUCCESSFUL FEED FETCHING
  # ============================================================================

  - name: happy_path_fetch_and_store
    description: Fetch articles from RSS feeds and store new ones in memory
    category: happy_path

    inputs:
      feeds:
        - url: "https://openai.com/blog/rss/"
          name: "OpenAI Blog"
        - url: "https://techcrunch.com/category/artificial-intelligence/feed/"
          name: "TechCrunch AI"

    # Mocked MCP responses for unit tests
    mocks:
      rss:
        - title: "GPT-5 Announcement"
          link: "https://openai.com/blog/gpt-5"
          summary: "OpenAI announces GPT-5"
          published: "2026-02-01T10:00:00Z"
        - title: "AI Startup Funding"
          link: "https://techcrunch.com/ai-funding"
          summary: "AI startups raise record funding"
          published: "2026-02-01T09:00:00Z"
      memory.check_seen:
        seen: false
      memory.add:
        id: "doc-12345"
        success: true
      memory.mark_seen:
        success: true

    # Output assertions - use supported types
    assertions:
      - type: exists
        field: articles_stored
      - type: exists
        field: feeds_processed

    # Tool invocation assertions
    invocation_assertions:
      - type: tool_invoked
        tool: "rss"
      - type: tool_invoked
        tool: "memory/check_seen"
      - type: tool_invoked
        tool: "memory/add"
      - type: tool_invoked_with
        tool: "memory/add"
        arguments:
          type: "document"
          namespace: "news/articles"
      - type: tool_invoked
        tool: "memory/mark_seen"

  - name: happy_path_single_feed
    description: Fetch articles from a single RSS feed
    category: happy_path

    inputs:
      feeds:
        - url: "https://example.com/feed"
          name: "Example Feed"

    assertions:
      - type: exists
        field: articles_stored
      - type: exists
        field: feeds_processed

  # ============================================================================
  # EDGE CASES
  # ============================================================================

  - name: empty_feed_list
    description: Should handle empty feed configuration
    category: edge_case

    inputs:
      feeds: []

    assertions:
      - type: exists
        field: feeds_processed
        description: Should return feeds_processed field (0 for empty input)

  - name: output_format_validation
    description: Verify output contains required fields
    category: validation

    inputs:
      feeds:
        - url: "https://example.com/feed"
          name: "Test Feed"

    assertions:
      - type: exists
        field: articles_stored
        description: Must report number of articles stored
      - type: exists
        field: feeds_processed
        description: Must report number of feeds processed
