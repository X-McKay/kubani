test_cases:
  # ============================================================================
  # BASIC DEDUPLICATION
  # ============================================================================

  - name: "All new articles"
    description: "No duplicates - all articles should pass through"
    context:
      articles:
        - title: "Article 1"
          url: "https://example.com/article-1"
          source: "Source 1"
        - title: "Article 2"
          url: "https://example.com/article-2"
          source: "Source 2"
        - title: "Article 3"
          url: "https://example.com/article-3"
          source: "Source 3"
      seen_urls: []
    expected:
      new_articles_count: 3
      seen_count: 0
      criteria_met:
        - all_articles_passed
        - no_filtering

  - name: "All duplicate articles"
    description: "All articles already seen - none should pass"
    context:
      articles:
        - title: "Article 1"
          url: "https://example.com/article-1"
          source: "Source 1"
        - title: "Article 2"
          url: "https://example.com/article-2"
          source: "Source 2"
      seen_urls:
        - "https://example.com/article-1"
        - "https://example.com/article-2"
    expected:
      new_articles_count: 0
      seen_count: 2
      criteria_met:
        - all_filtered_as_duplicates
        - correct_seen_count

  - name: "Mixed new and duplicate articles"
    description: "Some new, some already seen"
    context:
      articles:
        - title: "New Article 1"
          url: "https://example.com/new-1"
          source: "Source"
        - title: "Seen Article 1"
          url: "https://example.com/seen-1"
          source: "Source"
        - title: "New Article 2"
          url: "https://example.com/new-2"
          source: "Source"
        - title: "Seen Article 2"
          url: "https://example.com/seen-2"
          source: "Source"
      seen_urls:
        - "https://example.com/seen-1"
        - "https://example.com/seen-2"
    expected:
      new_articles_count: 2
      seen_count: 2
      criteria_met:
        - new_articles_passed
        - duplicates_filtered
        - correct_counts

  # ============================================================================
  # URL HANDLING
  # ============================================================================

  - name: "URL normalization - trailing slashes"
    description: "URLs with/without trailing slash should match"
    context:
      articles:
        - title: "Article with slash"
          url: "https://example.com/article/"
          source: "Source"
        - title: "Article without slash"
          url: "https://example.com/other"
          source: "Source"
      seen_urls:
        - "https://example.com/article"  # Without trailing slash
    expected:
      new_articles_count: 1
      seen_count: 1
      criteria_met:
        - trailing_slash_normalized
        - duplicate_detected

  - name: "URL normalization - case sensitivity"
    description: "URL comparison should handle case appropriately"
    context:
      articles:
        - title: "Article 1"
          url: "https://Example.com/Article"
          source: "Source"
        - title: "Article 2"
          url: "https://other.com/path"
          source: "Source"
      seen_urls:
        - "https://example.com/article"
    expected:
      criteria_met:
        - case_handled_appropriately

  - name: "URL with query parameters"
    description: "URLs with different query params should be handled"
    context:
      articles:
        - title: "Article with params"
          url: "https://example.com/article?utm_source=twitter"
          source: "Source"
        - title: "Same article different params"
          url: "https://example.com/article?utm_source=facebook"
          source: "Source"
      seen_urls:
        - "https://example.com/article"
    expected:
      criteria_met:
        - query_params_handled
        # Policy: either strip params for comparison or keep them

  - name: "URL with fragments"
    description: "URLs with #fragments should be handled"
    context:
      articles:
        - title: "Article with fragment"
          url: "https://example.com/article#section1"
          source: "Source"
      seen_urls:
        - "https://example.com/article#section2"
    expected:
      criteria_met:
        - fragments_handled_appropriately

  # ============================================================================
  # REDIS INTEGRATION
  # ============================================================================

  - name: "Redis connection successful"
    description: "Should successfully check URLs against Redis"
    context:
      articles:
        - title: "Test Article"
          url: "https://example.com/test"
          source: "Source"
      redis_available: true
    expected:
      success: true
      criteria_met:
        - redis_connected
        - lookup_performed

  - name: "Redis connection failure"
    description: "Should handle Redis being unavailable"
    context:
      articles:
        - title: "Test Article"
          url: "https://example.com/test"
          source: "Source"
      redis_available: false
    expected:
      criteria_met:
        - redis_failure_handled
        - graceful_degradation
        # Policy: either fail or pass all articles through

  - name: "Redis timeout handling"
    description: "Should handle slow Redis responses"
    context:
      articles:
        - title: "Test Article"
          url: "https://example.com/test"
          source: "Source"
      redis_latency_ms: 5000
    expected:
      criteria_met:
        - timeout_handled
        - no_indefinite_hang

  # ============================================================================
  # HASH GENERATION
  # ============================================================================

  - name: "Consistent URL hashing"
    description: "Same URL should always generate same hash"
    context:
      articles:
        - title: "Article"
          url: "https://example.com/consistent-test"
          source: "Source"
      run_twice: true
    expected:
      criteria_met:
        - hash_is_deterministic
        - same_url_same_hash

  - name: "Different URLs different hashes"
    description: "Different URLs should generate different hashes"
    context:
      articles:
        - title: "Article 1"
          url: "https://example.com/article-1"
          source: "Source"
        - title: "Article 2"
          url: "https://example.com/article-2"
          source: "Source"
    expected:
      criteria_met:
        - different_urls_different_hashes
        - no_hash_collisions

  # ============================================================================
  # EDGE CASES
  # ============================================================================

  - name: "Empty article list"
    description: "Should handle empty input gracefully"
    context:
      articles: []
    expected:
      new_articles_count: 0
      seen_count: 0
      criteria_met:
        - empty_input_handled
        - returns_empty_list
        - no_crash

  - name: "Large batch of articles"
    description: "Should handle many articles efficiently"
    context:
      articles_count: 500
      seen_urls_count: 1000
    expected:
      success: true
      criteria_met:
        - handles_large_batch
        - completes_in_reasonable_time
        - no_memory_issues

  - name: "Article with missing URL"
    description: "Should handle articles without URL field"
    context:
      articles:
        - title: "Article without URL"
          source: "Source"
        - title: "Article with URL"
          url: "https://example.com/valid"
          source: "Source"
    expected:
      criteria_met:
        - missing_url_handled
        - valid_articles_processed
        - no_crash

  - name: "Article with empty URL"
    description: "Should handle articles with empty string URL"
    context:
      articles:
        - title: "Article with empty URL"
          url: ""
          source: "Source"
        - title: "Article with valid URL"
          url: "https://example.com/valid"
          source: "Source"
    expected:
      criteria_met:
        - empty_url_handled
        - valid_articles_processed

  - name: "Very long URL"
    description: "Should handle extremely long URLs"
    context:
      articles:
        - title: "Long URL Article"
          url: "https://example.com/very/long/path/that/goes/on/and/on/with/many/segments/and/query?param1=value1&param2=value2&param3=value3"
          source: "Source"
    expected:
      success: true
      criteria_met:
        - long_url_handled
        - hash_generated_correctly

  - name: "Unicode in URL"
    description: "Should handle URLs with unicode characters"
    context:
      articles:
        - title: "Unicode URL Article"
          url: "https://example.com/文章/article"
          source: "Source"
    expected:
      success: true
      criteria_met:
        - unicode_url_handled
        - properly_encoded

  - name: "Duplicate URLs in same batch"
    description: "Same URL appearing twice in input should be deduplicated"
    context:
      articles:
        - title: "Article Instance 1"
          url: "https://example.com/same"
          source: "Source 1"
        - title: "Article Instance 2"
          url: "https://example.com/same"
          source: "Source 2"
      seen_urls: []
    expected:
      new_articles_count: 1
      criteria_met:
        - within_batch_dedup
        - first_instance_kept
