test_cases:
  - name: "High-impact new method paper"
    description: "Analyze a paper introducing a significant new method"
    context:
      paper:
        arxiv_id: "2601.54321"
        title: "FlashAttention-3: Faster Attention with Better Hardware Utilization"
        authors: ["Tri Dao", "Daniel Fu"]
        abstract: "We present FlashAttention-3, which achieves 2x speedup over FlashAttention-2 through improved memory access patterns and better GPU utilization. Our method reduces memory bandwidth bottlenecks and enables longer context windows with lower latency. Experiments on various transformer architectures demonstrate consistent improvements."
        categories: ["cs.LG", "cs.AI"]
        pdf_url: "https://arxiv.org/pdf/2601.54321.pdf"
      analysis_depth: "deep"
    expected:
      digest_worthy: true
      spotlight_candidate: true
      analysis:
        research_type: "new_method"
        relevance_scores:
          overall: 8  # at least 8
      criteria_met:
        - research_type_identified
        - main_claim_extracted
        - practitioner_summary_accessible
        - high_relevance_score
        - spotlight_recommendation_justified

  - name: "Theoretical paper with limited practical impact"
    description: "Analyze a theoretical paper that won't interest practitioners"
    context:
      paper:
        arxiv_id: "2601.99999"
        title: "Improved Convergence Bounds for Federated Learning with Non-IID Data"
        authors: ["Academic Researcher"]
        abstract: "We provide tighter convergence bounds for federated averaging under non-IID data distributions. Our theoretical analysis shows that under certain assumptions about data heterogeneity, the convergence rate can be improved by a factor of log(n)."
        categories: ["cs.LG"]
        pdf_url: "https://arxiv.org/pdf/2601.99999.pdf"
      analysis_depth: "standard"
    expected:
      digest_worthy: false
      spotlight_candidate: false
      analysis:
        research_type: "theoretical"
        relevance_scores:
          practical_applicability: 4  # at most 4
      criteria_met:
        - low_practical_relevance_detected
        - theoretical_nature_identified
        - appropriate_summary_tone

  - name: "Major lab announcement"
    description: "Paper from a major AI lab should get higher attention"
    context:
      paper:
        arxiv_id: "2601.11111"
        title: "GPT-5: Scaling to New Heights"
        authors: ["OpenAI Team"]
        abstract: "We introduce GPT-5, our latest language model that demonstrates significant improvements in reasoning, coding, and multimodal understanding. The model achieves state-of-the-art results on 15 benchmarks."
        categories: ["cs.CL", "cs.AI"]
        pdf_url: "https://arxiv.org/pdf/2601.11111.pdf"
      analysis_depth: "deep"
    expected:
      digest_worthy: true
      spotlight_candidate: true
      criteria_met:
        - major_lab_recognized
        - high_impact_assessment
        - comprehensive_analysis

  - name: "Dataset paper"
    description: "Analyze a paper introducing a new dataset"
    context:
      paper:
        arxiv_id: "2601.22222"
        title: "MegaCode: A Large-Scale Dataset for Code Understanding"
        authors: ["Research Team"]
        abstract: "We release MegaCode, a dataset of 10 million code samples across 50 programming languages with rich annotations for code understanding tasks. We provide baseline results and analysis of the dataset characteristics."
        categories: ["cs.SE", "cs.CL"]
        pdf_url: "https://arxiv.org/pdf/2601.22222.pdf"
      analysis_depth: "standard"
    expected:
      digest_worthy: true
      analysis:
        research_type: "dataset"
      criteria_met:
        - dataset_type_identified
        - resource_value_assessed

  - name: "Survey paper"
    description: "Analyze a comprehensive survey paper"
    context:
      paper:
        arxiv_id: "2601.33333"
        title: "A Survey of Large Language Model Agents"
        authors: ["Survey Authors"]
        abstract: "This survey provides a comprehensive overview of LLM-based agents, covering architectures, capabilities, and applications. We review over 200 papers and identify key trends and challenges in the field."
        categories: ["cs.AI"]
        pdf_url: "https://arxiv.org/pdf/2601.33333.pdf"
      analysis_depth: "standard"
    expected:
      analysis:
        research_type: "survey"
      criteria_met:
        - survey_type_identified
        - coverage_noted

  - name: "Application paper"
    description: "Paper applying existing methods to new domain"
    context:
      paper:
        arxiv_id: "2601.44444"
        title: "LLMs for Medical Diagnosis: A Case Study in Rare Diseases"
        authors: ["Medical AI Team"]
        abstract: "We apply large language models to the challenging task of rare disease diagnosis. Our system achieves 85% accuracy on a curated dataset of rare disease cases, significantly outperforming traditional diagnostic systems."
        categories: ["cs.AI", "cs.CL"]
        pdf_url: "https://arxiv.org/pdf/2601.44444.pdf"
      analysis_depth: "standard"
    expected:
      digest_worthy: true
      analysis:
        research_type: "application"
      criteria_met:
        - application_domain_identified
        - practical_results_noted

  - name: "Minimal abstract handling"
    description: "Handle paper with very short abstract"
    context:
      paper:
        arxiv_id: "2601.55555"
        title: "Brief: A New Compression Method"
        authors: ["Author"]
        abstract: "We propose a new compression method."
        categories: ["cs.LG"]
        pdf_url: "https://arxiv.org/pdf/2601.55555.pdf"
      analysis_depth: "standard"
    expected:
      success: true
      criteria_met:
        - handles_minimal_abstract
        - still_produces_analysis
        - indicates_low_confidence

  - name: "Relevance scoring consistency"
    description: "Ensure relevance scores align with recommendations"
    context:
      paper:
        arxiv_id: "2601.66666"
        title: "Efficient Training of Billion-Parameter Models on Consumer Hardware"
        authors: ["Research Team"]
        abstract: "We present techniques for training billion-parameter language models on consumer GPUs with 24GB VRAM. Our approach combines gradient checkpointing, mixed precision, and a novel optimizer to enable training that previously required datacenter-scale resources."
        categories: ["cs.LG"]
        pdf_url: "https://arxiv.org/pdf/2601.66666.pdf"
      analysis_depth: "standard"
    expected:
      digest_worthy: true
      analysis:
        relevance_scores:
          practical_applicability: 8  # at least 8 - very practical
          overall: 7  # at least 7
      criteria_met:
        - scores_justify_recommendation
        - practical_impact_recognized
