test_cases:
  # ============================================================================
  # HIGH IMPORTANCE / BREAKING NEWS SCENARIOS
  # ============================================================================

  - name: "Major model release - GPT-5 announcement"
    description: "Should identify as breaking news with high importance"
    context:
      article:
        url: "https://openai.com/blog/gpt-5"
        title: "Introducing GPT-5: A New Frontier in AI Capabilities"
        source: "OpenAI Blog"
        source_category: "research"
        summary: "Today we release GPT-5, our most capable model yet. GPT-5 demonstrates significant improvements in reasoning, coding, and multimodal understanding. The model achieves state-of-the-art results on 25 benchmarks and introduces new capabilities in long-context understanding and tool use."
        published_at: "2026-01-29T10:00:00Z"
    expected:
      success: true
      processed_article:
        category: "research"
        importance_score: 9  # at least 9
        is_breaking: true
      criteria_met:
        - high_importance_detected
        - breaking_news_flagged
        - entities_include_openai
        - entities_include_gpt5
        - category_is_research
        - summary_captures_key_points
        - importance_boost_for_official_blog

  - name: "Critical security vulnerability"
    description: "Security vulnerability should be high importance and breaking"
    context:
      article:
        url: "https://securityweek.com/critical-llm-vulnerability"
        title: "Critical RCE Vulnerability Discovered in Major LLM Framework"
        source: "SecurityWeek"
        source_category: "security"
        summary: "Security researchers have discovered a critical remote code execution vulnerability affecting LangChain versions 0.1.x through 0.3.x. The vulnerability allows attackers to execute arbitrary code through specially crafted prompts. All users are urged to update immediately."
        published_at: "2026-01-29T08:30:00Z"
    expected:
      success: true
      processed_article:
        category: "security"
        importance_score: 9  # at least 9
        is_breaking: true
      criteria_met:
        - security_category_assigned
        - high_importance_for_vulnerability
        - breaking_news_flagged
        - entities_include_langchain
        - urgency_captured

  - name: "Major acquisition announcement"
    description: "Big tech acquisition should be high importance"
    context:
      article:
        url: "https://techcrunch.com/google-acquires-anthropic"
        title: "Google Acquires Anthropic for $50 Billion in Landmark AI Deal"
        source: "TechCrunch"
        source_category: "business"
        summary: "Google has announced the acquisition of Anthropic, the AI safety company behind Claude, for $50 billion. The deal represents the largest AI acquisition in history and will give Google access to Anthropic's advanced AI models and safety research."
        published_at: "2026-01-29T14:00:00Z"
    expected:
      success: true
      processed_article:
        category: "business"
        importance_score: 9  # at least 9
        is_breaking: true
      criteria_met:
        - business_category_assigned
        - high_importance_for_major_deal
        - entities_include_google
        - entities_include_anthropic
        - financial_magnitude_noted

  # ============================================================================
  # MEDIUM IMPORTANCE SCENARIOS
  # ============================================================================

  - name: "Notable funding round"
    description: "Significant funding should be medium-high importance"
    context:
      article:
        url: "https://venturebeat.com/ai-startup-funding"
        title: "AI Startup Raises $200M Series C to Scale Enterprise Platform"
        source: "VentureBeat"
        source_category: "business"
        summary: "Cohere has raised $200 million in Series C funding led by Inovia Capital. The company plans to use the funds to expand its enterprise AI platform and hire additional researchers."
        published_at: "2026-01-29T11:00:00Z"
    expected:
      success: true
      processed_article:
        category: "business"
        importance_score: 6  # between 5-7
        is_breaking: false
      criteria_met:
        - business_category_assigned
        - medium_importance_for_funding
        - not_breaking_news
        - entities_include_cohere

  - name: "New research paper announcement"
    description: "Research paper should be categorized correctly"
    context:
      article:
        url: "https://ai.googleblog.com/attention-replacement"
        title: "Mamba-2: Replacing Attention with State Space Models"
        source: "Google AI Blog"
        source_category: "research"
        summary: "We introduce Mamba-2, an improved state space model architecture that achieves competitive performance with Transformers while offering linear scaling with sequence length. Experiments show 3x faster inference on long sequences."
        published_at: "2026-01-28T16:00:00Z"
    expected:
      success: true
      processed_article:
        category: "research"
        importance_score: 7  # between 6-8
        is_breaking: false
      criteria_met:
        - research_category_assigned
        - technical_entities_extracted
        - summary_explains_contribution
        - importance_boost_for_official_blog

  - name: "Product launch"
    description: "New AI product launch"
    context:
      article:
        url: "https://blog.microsoft.com/copilot-agents"
        title: "Microsoft Announces Copilot Agents for Enterprise Automation"
        source: "Microsoft Blog"
        source_category: "product"
        summary: "Microsoft is launching Copilot Agents, a new feature enabling autonomous AI agents within Microsoft 365. Agents can handle multi-step tasks like scheduling meetings, processing expenses, and managing workflows."
        published_at: "2026-01-28T09:00:00Z"
    expected:
      success: true
      processed_article:
        category: "product"
        importance_score: 7  # between 6-8
        is_breaking: false
      criteria_met:
        - product_category_assigned
        - entities_include_microsoft
        - entities_include_copilot
        - importance_boost_for_official_blog

  # ============================================================================
  # LOW IMPORTANCE SCENARIOS
  # ============================================================================

  - name: "Weekly roundup article"
    description: "Aggregation content should be low importance"
    context:
      article:
        url: "https://arstechnica.com/weekly-ai-roundup"
        title: "This Week in AI: Updates, Rumors, and Minor Announcements"
        source: "Ars Technica"
        source_category: "general"
        summary: "A roundup of this week's AI news including minor model updates, industry commentary, and upcoming conference announcements."
        published_at: "2026-01-27T18:00:00Z"
    expected:
      success: true
      processed_article:
        category: "general"
        importance_score: 3  # between 2-4
        is_breaking: false
      criteria_met:
        - general_category_assigned
        - low_importance_for_roundup
        - not_breaking_news

  - name: "Opinion piece"
    description: "Opinion/editorial should be low-medium importance"
    context:
      article:
        url: "https://wired.com/ai-future-opinion"
        title: "Opinion: Why AI Won't Replace Programmers Anytime Soon"
        source: "Wired"
        source_category: "general"
        summary: "A columnist argues that despite advances in AI coding assistants, human programmers will remain essential due to the need for creative problem-solving and understanding business context."
        published_at: "2026-01-27T12:00:00Z"
    expected:
      success: true
      processed_article:
        importance_score: 4  # between 3-5
        is_breaking: false
      criteria_met:
        - opinion_nature_recognized
        - low_importance_for_opinion
        - not_breaking_news

  - name: "Minor update announcement"
    description: "Incremental updates should be low importance"
    context:
      article:
        url: "https://huggingface.co/blog/minor-update"
        title: "Transformers 4.38 Released with Bug Fixes"
        source: "Hugging Face Blog"
        source_category: "product"
        summary: "Transformers 4.38 is now available with several bug fixes and minor performance improvements. This is a maintenance release with no breaking changes."
        published_at: "2026-01-26T14:00:00Z"
    expected:
      success: true
      processed_article:
        importance_score: 3  # between 2-4
        is_breaking: false
      criteria_met:
        - maintenance_release_recognized
        - low_importance_for_bugfix
        - entities_include_transformers

  # ============================================================================
  # ENTITY EXTRACTION SCENARIOS
  # ============================================================================

  - name: "Multi-company collaboration"
    description: "Should extract multiple company entities"
    context:
      article:
        url: "https://reuters.com/ai-partnership"
        title: "Microsoft, Google, and Meta Form AI Safety Consortium"
        source: "Reuters"
        source_category: "business"
        summary: "Microsoft, Google, and Meta have announced a joint consortium to develop AI safety standards. The initiative will focus on model evaluation, red-teaming, and responsible deployment practices."
        published_at: "2026-01-29T15:00:00Z"
    expected:
      success: true
      processed_article:
        entities_min_count: 3
      criteria_met:
        - entities_include_microsoft
        - entities_include_google
        - entities_include_meta
        - multiple_entities_extracted

  - name: "Technical article with model names"
    description: "Should extract technical entities (models, frameworks)"
    context:
      article:
        url: "https://arxiv.org/abs/2601.12345"
        title: "Comparing Claude, GPT-4, and Gemini on Mathematical Reasoning"
        source: "arXiv"
        source_category: "research"
        summary: "We evaluate Claude 3.5 Sonnet, GPT-4 Turbo, and Gemini 1.5 Pro on a new benchmark for mathematical reasoning. Results show significant variance across problem types."
        published_at: "2026-01-28T20:00:00Z"
    expected:
      success: true
      processed_article:
        category: "research"
      criteria_met:
        - entities_include_claude
        - entities_include_gpt4
        - entities_include_gemini
        - model_names_extracted

  # ============================================================================
  # EDGE CASES
  # ============================================================================

  - name: "Minimal content article"
    description: "Handle article with very short summary"
    context:
      article:
        url: "https://example.com/short-news"
        title: "AI Update"
        source: "Tech News"
        source_category: "general"
        summary: "New AI model released."
        published_at: "2026-01-29T10:00:00Z"
    expected:
      success: true
      criteria_met:
        - handles_minimal_content
        - still_produces_output
        - defaults_applied_gracefully

  - name: "Long detailed article"
    description: "Handle article with extensive content (should truncate)"
    context:
      article:
        url: "https://example.com/detailed-analysis"
        title: "Comprehensive Analysis of 2025 AI Developments and 2026 Predictions"
        source: "MIT Technology Review"
        source_category: "research"
        summary: "This comprehensive analysis covers every major AI development of 2025, including the release of GPT-4.5, Claude 3, Gemini Ultra, and Llama 3. We examine the shift towards multimodal models, the emergence of AI agents, advances in reasoning capabilities, improvements in code generation, the growing importance of AI safety research, regulatory developments across the US, EU, and China, the impact on various industries including healthcare, finance, and education, new research directions in interpretability and alignment, the evolution of AI infrastructure and hardware, open source vs closed source dynamics, the role of AI in scientific discovery, emerging applications in robotics and embodied AI, and our predictions for 2026 including expected model capabilities, regulatory changes, and market dynamics."
        published_at: "2026-01-15T08:00:00Z"
    expected:
      success: true
      criteria_met:
        - handles_long_content
        - truncation_applied
        - key_entities_still_extracted
        - summary_generated

  - name: "Non-English content handling"
    description: "Handle article with non-English elements"
    context:
      article:
        url: "https://example.com/international-news"
        title: "中国AI公司发布新模型 - Chinese AI Company Releases New Model"
        source: "International Tech News"
        source_category: "product"
        summary: "Baidu announced the release of ERNIE 5.0, their latest large language model. The model reportedly outperforms GPT-4 on Chinese language tasks."
        published_at: "2026-01-28T06:00:00Z"
    expected:
      success: true
      criteria_met:
        - handles_mixed_language
        - entities_include_baidu
        - category_assigned

  - name: "Policy and regulation news"
    description: "Regulatory news should be categorized correctly"
    context:
      article:
        url: "https://reuters.com/eu-ai-act-enforcement"
        title: "EU AI Act Enforcement Begins: What Companies Need to Know"
        source: "Reuters"
        source_category: "policy"
        summary: "The European Union has begun enforcement of the AI Act. Companies deploying high-risk AI systems must now comply with new requirements including risk assessments, human oversight provisions, and transparency obligations."
        published_at: "2026-01-29T07:00:00Z"
    expected:
      success: true
      processed_article:
        category: "policy"
        importance_score: 7  # between 6-8
      criteria_met:
        - policy_category_assigned
        - regulatory_importance_recognized
        - entities_include_eu
