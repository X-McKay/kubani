scenarios:
  - name: "High-quality trending library"
    description: "Analyze a rapidly growing production-ready library"
    context:
      repo:
        full_name: "example/llm-accelerator"
        name: "llm-accelerator"
        description: "Fast LLM inference with automatic batching and caching"
        url: "https://github.com/example/llm-accelerator"
        stars: 3500
        forks: 180
        language: "Python"
        topics: ["llm", "inference", "optimization"]
        created_at: "2025-11-01"
        pushed_at: "2026-01-26"
        open_issues: 25
      include_readme: true
    mocks:
      github_readme:
        content: "# LLM Accelerator\n\nFast inference for LLMs.\n\n## Installation\n\npip install llm-accelerator\n\n## Quick Start\n\n```python\nfrom llm_accelerator import Accelerator\nacc = Accelerator()\nresult = acc.generate('Hello')\n```"
    expected:
      spotlight_worthy: true
      analysis:
        category: "library"
        quality_scores:
          overall: 7  # at least 7
      criteria_met:
        - library_category_identified
        - high_quality_assessment
        - spotlight_summary_generated
        - target_audience_identified

  - name: "Tutorial repository - not spotlight worthy"
    description: "Educational content should not be spotlighted"
    context:
      repo:
        full_name: "someone/llm-tutorial"
        name: "llm-tutorial"
        description: "Learn how to build with LLMs - step by step tutorials"
        url: "https://github.com/someone/llm-tutorial"
        stars: 800
        forks: 150
        language: "Jupyter Notebook"
        topics: ["tutorial", "llm", "learning"]
        created_at: "2025-08-01"
        pushed_at: "2026-01-20"
        open_issues: 5
      include_readme: false
    expected:
      spotlight_worthy: false
      analysis:
        category: "tutorial"
      criteria_met:
        - tutorial_category_identified
        - not_production_tool
        - appropriate_rejection

  - name: "Stale popular repository"
    description: "Old repository with no recent activity should be flagged"
    context:
      repo:
        full_name: "old/legacy-tool"
        name: "legacy-tool"
        description: "ML toolkit from 2023"
        url: "https://github.com/old/legacy-tool"
        stars: 15000
        forks: 2000
        language: "Python"
        topics: ["machine-learning"]
        created_at: "2022-01-01"
        pushed_at: "2025-06-01"
        open_issues: 500
      include_readme: false
    expected:
      spotlight_worthy: false
      analysis:
        quality_scores:
          activity: 3  # at most 3 due to staleness
        risk_factors:
          - "No recent updates"
      criteria_met:
        - staleness_detected
        - risk_factors_identified
        - appropriate_rejection

  - name: "New framework with good docs"
    description: "New framework that's well documented"
    context:
      repo:
        full_name: "newco/ai-framework"
        name: "ai-framework"
        description: "Full-stack framework for building AI applications"
        url: "https://github.com/newco/ai-framework"
        stars: 2000
        forks: 100
        language: "TypeScript"
        topics: ["ai", "framework", "full-stack"]
        created_at: "2025-12-01"
        pushed_at: "2026-01-27"
        open_issues: 30
      include_readme: true
    mocks:
      github_readme:
        content: "# AI Framework\n\nBuild AI apps fast.\n\n## Features\n- Agent orchestration\n- Memory management\n- Tool integration\n\n## Installation\nnpm install ai-framework"
    expected:
      spotlight_worthy: true
      analysis:
        category: "framework"
      criteria_met:
        - framework_category_identified
        - features_extracted

  - name: "Model repository"
    description: "Repository containing model weights"
    context:
      repo:
        full_name: "lab/new-model"
        name: "new-model"
        description: "Weights and code for our new language model"
        url: "https://github.com/lab/new-model"
        stars: 5000
        forks: 800
        language: "Python"
        topics: ["llm", "model", "weights"]
        created_at: "2026-01-15"
        pushed_at: "2026-01-26"
        open_issues: 100
      include_readme: false
    expected:
      spotlight_worthy: true
      analysis:
        category: "model"
      criteria_met:
        - model_category_identified

  - name: "CLI tool"
    description: "Standalone command-line tool"
    context:
      repo:
        full_name: "dev/ai-cli"
        name: "ai-cli"
        description: "Command-line interface for interacting with various AI models"
        url: "https://github.com/dev/ai-cli"
        stars: 1500
        forks: 50
        language: "Rust"
        topics: ["cli", "ai", "terminal"]
        created_at: "2025-10-01"
        pushed_at: "2026-01-25"
        open_issues: 10
      include_readme: false
    expected:
      spotlight_worthy: true
      analysis:
        category: "tool"
      criteria_met:
        - tool_category_identified

  - name: "Low stars but growing fast"
    description: "New repo with few stars but rapid growth should be considered"
    context:
      repo:
        full_name: "startup/new-lib"
        name: "new-lib"
        description: "Revolutionary approach to LLM fine-tuning"
        url: "https://github.com/startup/new-lib"
        stars: 600
        forks: 30
        language: "Python"
        topics: ["llm", "fine-tuning"]
        created_at: "2026-01-20"
        pushed_at: "2026-01-27"
        open_issues: 5
        trending_score: 1500  # indicates rapid growth
      include_readme: false
    expected:
      analysis:
        popularity_metrics:
          growth_status: "rapid"
      criteria_met:
        - growth_trajectory_considered

  - name: "Application repository"
    description: "Complete application should be categorized correctly"
    context:
      repo:
        full_name: "team/chat-ui"
        name: "chat-ui"
        description: "Open source ChatGPT-like interface for local LLMs"
        url: "https://github.com/team/chat-ui"
        stars: 8000
        forks: 1000
        language: "TypeScript"
        topics: ["chat", "ui", "llm"]
        created_at: "2025-03-01"
        pushed_at: "2026-01-26"
        open_issues: 75
      include_readme: false
    expected:
      spotlight_worthy: true
      analysis:
        category: "application"
        use_cases:
          - "practitioners"
          - "hobbyists"
      criteria_met:
        - application_category_identified
        - use_cases_identified
