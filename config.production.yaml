# Kubani Production Configuration
# Cluster-specific settings - secrets should be in environment variables

environment: production
log_level: INFO

# Temporal workflow engine (cluster)
temporal:
  host: temporal-frontend.temporal.svc.cluster.local:7233
  namespace: kubani
  task_queue: kubani-tasks
  enabled: true

# Memory and knowledge storage (cluster services)
memory:
  qdrant_host: qdrant.ai-agents.svc.cluster.local
  qdrant_port: 6333
  qdrant_collection: kubani_memory

  neo4j_uri: bolt://neo4j.ai-agents.svc.cluster.local:7687
  neo4j_user: neo4j
  # neo4j_password: set via MEMORY_NEO4J_PASSWORD env var

  redis_host: redis.ai-agents.svc.cluster.local
  redis_port: 6379
  redis_db: 0

# Metadata registry (cluster)
registry:
  url: http://metadata-registry.ai-agents.svc.cluster.local:8000
  sync_on_startup: true
  heartbeat_interval: 30

# Discord integration (cluster MCP server)
discord:
  mcp_url: http://discord-mcp-server.ai-agents.svc.cluster.local:8080
  # Channel IDs set via environment variables

# LLM provider (cluster vLLM)
llm:
  provider: vllm
  api_url: http://llm-api.vllm.svc.cluster.local:8000/v1
  model: Qwen/Qwen3-14B
  temperature: 0.7
  max_tokens: 4096

# Embeddings (cluster)
embeddings:
  api_url: http://embeddings-api.ai-agents.svc.cluster.local:8001/v1
  model: BAAI/bge-large-en-v1.5

# Continuous learning (production settings)
learning:
  enabled: true
  critic_enabled: true
  reflection_enabled: true
  auto_approve_threshold: 0.98  # Higher threshold in production
  require_discord_approval: true
  min_examples_for_skill: 5  # More examples required in production

# Local dev disabled in production
local_dev:
  tunnel_enabled: false
  tunnel_method: none
  output_mode: discord
  mock_services: false
