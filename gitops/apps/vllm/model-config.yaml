apiVersion: v1
kind: ConfigMap
metadata:
  name: model-config
  namespace: vllm
  labels:
    app.kubernetes.io/part-of: vllm
data:
  # Main LLM model configuration
  LLM_MODEL_NAME: "nvidia/Qwen3-14B-FP4"
  LLM_MODEL_PATH: "/models/Qwen3-14B-FP4"
  LLM_GPU_MEMORY_UTILIZATION: "0.60"

  # Context length - using native 32K (YaRN rope-scaling removed in vLLM 0.11.1)
  # See: https://github.com/vllm-project/vllm/issues/29026
  LLM_MAX_MODEL_LEN: "32768"

  # Speculative decoding configuration (n-gram based, no draft model needed)
  LLM_SPECULATIVE_CONFIG: '{"method":"ngram","prompt_lookup_max":4,"num_speculative_tokens":5}'

  # Fast model configuration (Qwen3-0.6B for simple tasks - smallest/fastest)
  FAST_MODEL_NAME: "Qwen/Qwen3-0.6B"
  FAST_GPU_MEMORY_UTILIZATION: "0.15"
  FAST_MAX_MODEL_LEN: "32768"

  # Embeddings model configuration
  EMBEDDINGS_MODEL_NAME: "Qwen/Qwen3-Embedding-0.6B"
  EMBEDDINGS_GPU_MEMORY_UTILIZATION: "0.10"
  EMBEDDINGS_MAX_MODEL_LEN: "8192"
