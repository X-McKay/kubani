apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vllm
resources:
  - namespace.yaml
  - model-storage-pvc.yaml
  - nas-model-storage-pvc.yaml
  - model-config.yaml
  - hf-token-secret.enc.yaml
  # Main LLM (configured in model-config.yaml)
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  # Embeddings (configured in model-config.yaml)
  - embeddings-deployment.yaml
  - embeddings-service.yaml
  - embeddings-ingress.yaml
