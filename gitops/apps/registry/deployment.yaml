apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: ai-agents
  labels:
    app.kubernetes.io/name: registry
    app.kubernetes.io/component: registry-service
    app.kubernetes.io/part-of: kubani
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry
    spec:
      serviceAccountName: default
      containers:
        - name: registry
          image: registry.almckay.io/kubani-registry:0.1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          env:
            - name: REGISTRY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: registry-secrets
                  key: database-url
            - name: REGISTRY_REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: registry-config
                  key: redis-url
            - name: REGISTRY_HOST
              value: "0.0.0.0"
            - name: REGISTRY_PORT
              value: "8000"
            - name: REGISTRY_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: registry-config
                  key: log-level
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
