---
# Memory credentials for news-monitor agent
# These should be created manually or via Terraform/external-secrets
# PostgreSQL database should be pre-created:
#   CREATE DATABASE news_monitor_memory;
#   CREATE USER news_monitor WITH PASSWORD 'xxx';
#   GRANT ALL PRIVILEGES ON DATABASE news_monitor_memory TO news_monitor;
apiVersion: v1
kind: Secret
metadata:
  name: news-monitor-memory-credentials
  namespace: ai-agents
type: Opaque
stringData:
  pg-host: "postgresql.database.svc.cluster.local"
  pg-user: "news_monitor"
  pg-password: "news-monitor-mem0-2024"
  pg-database: "news_monitor_memory"
