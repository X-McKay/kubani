---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: news-monitor
  namespace: ai-agents
  labels:
    app.kubernetes.io/name: news-monitor
    app.kubernetes.io/component: ai-agent
  annotations:
    # Auto-restart pod when model-config ConfigMap changes
    configmap.reloader.stakater.com/reload: "model-config"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: news-monitor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: news-monitor
        app.kubernetes.io/component: ai-agent
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      initContainers:
        # NEW ARCHITECTURE: Continuous article ingestion (every 30 min)
        - name: start-ingestion-scheduler
          image: registry.almckay.io/news-monitor:0.4.4
          imagePullPolicy: Always
          args: ["schedule-ingest", "30"]
          env:
            - name: TEMPORAL_HOST
              value: "temporal-frontend.temporal.svc.cluster.local:7233"
            - name: TEMPORAL_NAMESPACE
              value: "default"
        # NEW ARCHITECTURE: Periodic digest generation (every 4 hours)
        - name: start-digest-scheduler
          image: registry.almckay.io/news-monitor:0.4.4
          imagePullPolicy: Always
          args: ["schedule-digest", "4"]
          env:
            - name: TEMPORAL_HOST
              value: "temporal-frontend.temporal.svc.cluster.local:7233"
            - name: TEMPORAL_NAMESPACE
              value: "default"
      containers:
        - name: worker
          image: registry.almckay.io/news-monitor:0.4.4
          imagePullPolicy: Always
          args: ["worker"]
          envFrom:
            - configMapRef:
                name: model-config
          env:
            - name: TEMPORAL_HOST
              value: "temporal-frontend.temporal.svc.cluster.local:7233"
            - name: TEMPORAL_NAMESPACE
              value: "default"
            - name: VLLM_API_URL
              value: "http://llm-api.vllm.svc.cluster.local:8000/v1"
            - name: VLLM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: model-config
                  key: LLM_MODEL_NAME
            - name: EMBEDDINGS_API_URL
              value: "http://embeddings-api.vllm.svc.cluster.local:8000/v1"
            - name: EMBEDDINGS_MODEL
              valueFrom:
                configMapKeyRef:
                  name: model-config
                  key: EMBEDDINGS_MODEL_NAME
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: news-monitor-secrets
                  key: discord-webhook-url
            # Memory system configuration (Qdrant + Neo4j graph memory)
            # Qdrant for vector similarity search
            - name: QDRANT_HOST
              value: "qdrant.database.svc.cluster.local"
            - name: QDRANT_PORT
              value: "6333"
            - name: QDRANT_COLLECTION
              value: "news-monitor"
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: news-monitor-memory-credentials
                  key: qdrant-api-key
            # Neo4j for graph-based entity/relationship tracking
            - name: NEO4J_URL
              value: "bolt://neo4j.database.svc.cluster.local:7687"
            - name: NEO4J_USERNAME
              value: "neo4j"
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: news-monitor-memory-credentials
                  key: neo4j-password
            # Redis for fast URL deduplication
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: news-monitor-memory-credentials
                  key: redis-host
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: news-monitor-memory-credentials
                  key: redis-password
            # Federated agents configuration (NewsExplorer)
            - name: ENABLE_FEDERATED_AGENTS
              value: "true"
            - name: EXPLORER_CYCLE_HOURS
              value: "24"
            # Registry integration for agent metadata
            - name: KUBANI_REGISTRY_URL
              value: "http://metadata-registry.ai-agents.svc:8000"
            - name: KUBANI_REGISTRY_ENABLED
              value: "true"
            - name: AGENT_VERSION
              value: "0.4.0"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import news_monitor; print('ok')"
            initialDelaySeconds: 30
            periodSeconds: 60
      restartPolicy: Always
