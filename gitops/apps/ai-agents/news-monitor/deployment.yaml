---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: news-monitor
  namespace: ai-agents
  labels:
    app.kubernetes.io/name: news-monitor
    app.kubernetes.io/component: ai-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: news-monitor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: news-monitor
        app.kubernetes.io/component: ai-agent
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      initContainers:
        # Start the 12-hour digest schedule
        - name: start-digest-scheduler
          image: registry.almckay.io/news-monitor:0.1.0-2496900
          imagePullPolicy: Always
          args: ["schedule", "12"]
          env:
            - name: TEMPORAL_HOST
              value: "temporal-frontend.temporal.svc.cluster.local:7233"
            - name: TEMPORAL_NAMESPACE
              value: "default"
        # Start the 1-hour breaking news check
        - name: start-breaking-scheduler
          image: registry.almckay.io/news-monitor:0.1.0-2496900
          imagePullPolicy: Always
          args: ["schedule-breaking", "1"]
          env:
            - name: TEMPORAL_HOST
              value: "temporal-frontend.temporal.svc.cluster.local:7233"
            - name: TEMPORAL_NAMESPACE
              value: "default"
      containers:
        - name: worker
          image: registry.almckay.io/news-monitor:0.1.0-2496900
          imagePullPolicy: Always
          args: ["worker"]
          envFrom:
            - configMapRef:
                name: model-config
          env:
            - name: TEMPORAL_HOST
              value: "temporal-frontend.temporal.svc.cluster.local:7233"
            - name: TEMPORAL_NAMESPACE
              value: "default"
            - name: VLLM_API_URL
              value: "http://llm-api.vllm.svc.cluster.local:8000/v1"
            - name: VLLM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: model-config
                  key: LLM_MODEL_NAME
            - name: EMBEDDINGS_API_URL
              value: "http://embeddings-api.vllm.svc.cluster.local:8000/v1"
            - name: EMBEDDINGS_MODEL
              valueFrom:
                configMapKeyRef:
                  name: model-config
                  key: EMBEDDINGS_MODEL_NAME
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: news-monitor-secrets
                  key: discord-webhook-url
            # Memory system configuration (Qdrant + Neo4j graph memory)
            # Qdrant for vector similarity search
            - name: QDRANT_HOST
              value: "qdrant.database.svc.cluster.local"
            - name: QDRANT_PORT
              value: "6333"
            - name: QDRANT_COLLECTION
              value: "news-monitor"
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: news-monitor-memory-credentials
                  key: qdrant-api-key
            # Neo4j for graph-based entity/relationship tracking
            - name: NEO4J_URL
              value: "bolt://neo4j.database.svc.cluster.local:7687"
            - name: NEO4J_USERNAME
              value: "neo4j"
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: news-monitor-memory-credentials
                  key: neo4j-password
            # Redis for fast URL deduplication
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: news-monitor-memory-credentials
                  key: redis-host
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: news-monitor-memory-credentials
                  key: redis-password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import news_monitor; print('ok')"
            initialDelaySeconds: 30
            periodSeconds: 60
      restartPolicy: Always
