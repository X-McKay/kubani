---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discord-mcp-server
  namespace: ai-agents
  labels:
    app.kubernetes.io/name: discord-mcp-server
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: kubani
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: discord-mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: discord-mcp-server
        app.kubernetes.io/component: mcp-server
    spec:
      containers:
        - name: mcp-server
          image: registry.almckay.io/discord-mcp-server:0.1.0
          imagePullPolicy: Always
          args:
            - --mode
            - sse
            - --port
            - "8080"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: discord-mcp-server-secrets
                  key: DISCORD_BOT_TOKEN
            - name: DISCORD_GUILD_ID
              valueFrom:
                secretKeyRef:
                  name: discord-mcp-server-secrets
                  key: DISCORD_GUILD_ID
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      restartPolicy: Always
