---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-mcp-server
  namespace: ai-agents
  labels:
    app.kubernetes.io/name: temporal-mcp-server
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: kubani
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal-mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-mcp-server
        app.kubernetes.io/component: mcp-server
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: mcp-server
          image: ghcr.io/x-mckay/kubani/temporal-mcp-server:latest
          imagePullPolicy: Always
          args:
            - --mode
            - sse
            - --port
            - "8081"
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          env:
            - name: TEMPORAL_HOST
              value: "temporal-frontend.temporal.svc.cluster.local:7233"
            - name: TEMPORAL_NAMESPACE
              value: "kubani"
            - name: MCP_TRANSPORT
              value: "sse"
            - name: MCP_ALLOWED_HOSTS
              value: "temporal-mcp.almckay.io,temporal-mcp.almckay.io:*,localhost,localhost:*,127.0.0.1,127.0.0.1:*,10.*,10.*:*,100.*,100.*:*,*.ai-agents.svc,*.ai-agents.svc:*"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      restartPolicy: Always
