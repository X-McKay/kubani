---
apiVersion: v1
kind: Service
metadata:
  name: learning-agent
  namespace: ai-agents
  labels:
    app.kubernetes.io/name: learning-agent
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: kubani
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
  selector:
    app.kubernetes.io/name: learning-agent
