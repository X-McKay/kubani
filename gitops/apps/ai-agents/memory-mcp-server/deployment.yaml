---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-mcp-server
  namespace: ai-agents
  labels:
    app.kubernetes.io/name: memory-mcp-server
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: kubani
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: memory-mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memory-mcp-server
        app.kubernetes.io/component: mcp-server
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: mcp-server
          image: ghcr.io/x-mckay/kubani/memory-mcp-server:latest
          imagePullPolicy: Always
          args:
            - --mode
            - sse
            - --port
            - "8083"
          ports:
            - name: http
              containerPort: 8083
              protocol: TCP
          env:
            # Qdrant configuration
            - name: QDRANT_HOST
              value: "qdrant.database.svc.cluster.local"
            - name: QDRANT_PORT
              value: "6333"
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: memory-mcp-server-secrets
                  key: QDRANT_API_KEY
                  optional: true
            # Neo4j configuration
            - name: NEO4J_URI
              value: "bolt://neo4j.database.svc.cluster.local:7687"
            - name: NEO4J_USER
              value: "neo4j"
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: memory-mcp-server-secrets
                  key: NEO4J_PASSWORD
            # Redis configuration
            - name: REDIS_HOST
              value: "redis.database.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: memory-mcp-server-secrets
                  key: REDIS_PASSWORD
                  optional: true
            # Embeddings configuration
            - name: EMBEDDINGS_API_URL
              value: "http://embeddings-api.vllm.svc.cluster.local:8000/v1"
            - name: EMBEDDINGS_MODEL
              value: "Qwen/Qwen3-Embedding-0.6B"
            # MCP configuration
            - name: MCP_TRANSPORT
              value: "sse"
            - name: MCP_ALLOWED_HOSTS
              value: "memory-mcp.almckay.io,memory-mcp.almckay.io:*,localhost,localhost:*,127.0.0.1,127.0.0.1:*,10.*,10.*:*,100.*,100.*:*,*.ai-agents.svc,*.ai-agents.svc:*"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      restartPolicy: Always
