---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-swarm
  namespace: ai-agents
  labels:
    app.kubernetes.io/name: cluster-swarm
    app.kubernetes.io/component: ai-agent
  annotations:
    configmap.reloader.stakater.com/reload: "model-config"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cluster-swarm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cluster-swarm
        app.kubernetes.io/component: ai-agent
    spec:
      serviceAccountName: cluster-swarm
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        # Kubernetes MCP Server sidecar - provides MCP tools via HTTP
        - name: mcp-server
          image: quay.io/containers/kubernetes_mcp_server:latest
          args:
            - "--port=8080"
            - "--log-level=2"
          ports:
            - containerPort: 8080
              name: mcp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
        # Main cluster-swarm worker
        - name: worker
          image: registry.almckay.io/cluster-swarm:0.1.4
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: model-config
          env:
            # Python unbuffered output for proper logging
            - name: PYTHONUNBUFFERED
              value: "1"
            # LLM Configuration (uses LLM_ prefix per config_unified.py)
            - name: LLM_API_URL
              value: "http://llm-api.vllm.svc.cluster.local:8000/v1"
            - name: LLM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: model-config
                  key: LLM_MODEL_NAME
            # Discord MCP server for notifications
            - name: DISCORD_MCP_URL
              value: "https://discord-mcp.almckay.io/mcp"
            - name: DISCORD_CHANNEL
              value: "cluster-swarm"
            # MCP transport configuration - sidecar runs on localhost
            - name: KUBERNETES_MCP_SERVER_URL
              value: "http://localhost:8080/mcp"
            # Memory system configuration (Qdrant)
            - name: QDRANT_HOST
              value: "qdrant.database.svc.cluster.local"
            - name: QDRANT_PORT
              value: "6333"
            - name: QDRANT_COLLECTION
              value: "cluster-swarm"
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: qdrant-api-key
                  key: api-key
            # Redis for event bus and caching
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: news-monitor-memory-credentials
                  key: redis-host
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: news-monitor-memory-credentials
                  key: redis-password
            # Embeddings API
            - name: EMBEDDINGS_API_URL
              value: "http://embeddings-api.vllm.svc.cluster.local:8000/v1"
            - name: EMBEDDINGS_MODEL
              valueFrom:
                configMapKeyRef:
                  name: model-config
                  key: EMBEDDINGS_MODEL_NAME
            - name: EMBEDDINGS_DIMS
              value: "1024"
            # Agent metadata
            - name: AGENT_NAME
              value: "cluster-swarm"
            - name: AGENT_VERSION
              value: "0.1.4"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import cluster_swarm; print('ok')"
            initialDelaySeconds: 30
            periodSeconds: 60
      restartPolicy: Always
