---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-monitor
  namespace: ai-agents
  labels:
    app.kubernetes.io/name: k8s-monitor
    app.kubernetes.io/component: ai-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-monitor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-monitor
        app.kubernetes.io/component: ai-agent
    spec:
      serviceAccountName: k8s-monitor
      nodeSelector:
        kubernetes.io/arch: amd64
      initContainers:
        - name: start-scheduler
          image: registry.almckay.io/k8s-monitor:0.2.3-32c69f1
          imagePullPolicy: Always
          args: ["schedule-remediation"]
          env:
            - name: TEMPORAL_HOST
              value: "temporal-frontend.temporal.svc.cluster.local:7233"
            - name: TEMPORAL_NAMESPACE
              value: "default"
            - name: HEALTH_CHECK_INTERVAL_HOURS
              value: "1"
      containers:
        - name: worker
          image: registry.almckay.io/k8s-monitor:0.2.3-32c69f1
          imagePullPolicy: Always
          args: ["worker"]
          envFrom:
            - configMapRef:
                name: model-config
          env:
            - name: TEMPORAL_HOST
              value: "temporal-frontend.temporal.svc.cluster.local:7233"
            - name: TEMPORAL_NAMESPACE
              value: "default"
            - name: VLLM_API_URL
              value: "http://llm-api.vllm.svc.cluster.local:8000/v1"
            - name: VLLM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: model-config
                  key: LLM_MODEL_NAME
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: k8s-monitor-secrets
                  key: discord-webhook-url
            - name: HEALTH_CHECK_INTERVAL_HOURS
              value: "1"
            # Agentic mode configuration (MCP + ReAct)
            - name: USE_AGENTIC_MONITOR
              value: "true"
            - name: K8S_MCP_URL
              value: "http://kubernetes-mcp-server.ai-agents.svc.cluster.local:8080"
            # Memory system configuration
            - name: MEMORY_PG_HOST
              valueFrom:
                secretKeyRef:
                  name: k8s-monitor-memory-credentials
                  key: pg-host
            - name: MEMORY_PG_USER
              valueFrom:
                secretKeyRef:
                  name: k8s-monitor-memory-credentials
                  key: pg-user
            - name: MEMORY_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: k8s-monitor-memory-credentials
                  key: pg-password
            - name: MEMORY_PG_DATABASE
              valueFrom:
                secretKeyRef:
                  name: k8s-monitor-memory-credentials
                  key: pg-database
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import k8s_monitor; print('ok')"
            initialDelaySeconds: 30
            periodSeconds: 60
      restartPolicy: Always
