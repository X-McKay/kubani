---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-monitor
  namespace: ai-agents
  labels:
    app.kubernetes.io/name: k8s-monitor
    app.kubernetes.io/component: ai-agent
  annotations:
    # Auto-restart pod when model-config ConfigMap changes
    configmap.reloader.stakater.com/reload: "model-config"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-monitor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-monitor
        app.kubernetes.io/component: ai-agent
    spec:
      serviceAccountName: k8s-monitor
      nodeSelector:
        kubernetes.io/arch: amd64
      initContainers:
        - name: start-scheduler
          image: registry.almckay.io/k8s-monitor:0.3.0
          imagePullPolicy: Always
          args: ["schedule"]
          env:
            - name: TEMPORAL_HOST
              value: "temporal-frontend.temporal.svc.cluster.local:7233"
            - name: TEMPORAL_NAMESPACE
              value: "default"
            - name: HEALTH_CHECK_INTERVAL_HOURS
              value: "1"
      containers:
        # Kubernetes MCP Server sidecar - provides MCP tools via HTTP
        - name: mcp-server
          image: quay.io/containers/kubernetes_mcp_server:latest
          args:
            - "--port=8080"
            - "--log-level=2"
          ports:
            - containerPort: 8080
              name: mcp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
        # Main k8s-monitor worker
        - name: worker
          image: registry.almckay.io/k8s-monitor:0.3.0
          imagePullPolicy: Always
          args: ["worker"]
          envFrom:
            - configMapRef:
                name: model-config
          env:
            - name: TEMPORAL_HOST
              value: "temporal-frontend.temporal.svc.cluster.local:7233"
            - name: TEMPORAL_NAMESPACE
              value: "default"
            - name: VLLM_API_URL
              value: "http://llm-api.vllm.svc.cluster.local:8000/v1"
            - name: VLLM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: model-config
                  key: LLM_MODEL_NAME
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: k8s-monitor-secrets
                  key: discord-webhook-url
            - name: HEALTH_CHECK_INTERVAL_HOURS
              value: "1"
            # Agentic mode configuration (MCP + ReAct)
            - name: USE_AGENTIC_MONITOR
              value: "true"
            # MCP transport configuration - sidecar runs on localhost
            - name: KUBERNETES_MCP_SERVER_URL
              value: "http://localhost:8080/sse"
            # Memory system configuration (Qdrant + Neo4j graph memory)
            # Qdrant for vector similarity search
            - name: QDRANT_HOST
              value: "qdrant.database.svc.cluster.local"
            - name: QDRANT_PORT
              value: "6333"
            - name: QDRANT_COLLECTION
              value: "k8s-remediation"
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: qdrant-api-key
                  key: api-key
            # Neo4j for graph-based entity/relationship tracking
            - name: NEO4J_URL
              value: "bolt://neo4j.database.svc.cluster.local:7687"
            - name: NEO4J_USERNAME
              value: "neo4j"
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: news-monitor-memory-credentials
                  key: neo4j-password
            # Redis for fast signature deduplication and caching
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: news-monitor-memory-credentials
                  key: redis-host
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: news-monitor-memory-credentials
                  key: redis-password
            # Federated agents configuration (Sentinel, Healer, Explorer)
            - name: ENABLE_FEDERATED_AGENTS
              value: "true"
            - name: EXPLORER_CYCLE_HOURS
              value: "6"
            # Embeddings API for skill embeddings
            - name: EMBEDDINGS_API_URL
              value: "http://embeddings-api.vllm.svc.cluster.local:8000/v1"
            - name: EMBEDDINGS_MODEL
              valueFrom:
                configMapKeyRef:
                  name: model-config
                  key: EMBEDDINGS_MODEL_NAME
            - name: EMBEDDINGS_DIMS
              value: "1024"
            # Registry integration for agent metadata and deployment tracking
            - name: KUBANI_REGISTRY_URL
              value: "http://metadata-registry.ai-agents.svc:8000"
            - name: KUBANI_REGISTRY_ENABLED
              value: "true"
            # Agent version/deployment metadata (used by registry for deployment tracking)
            - name: AGENT_VERSION
              value: "0.3.0"
            - name: AGENT_IMAGE_TAG
              value: "0.3.0"
            - name: AGENT_GIT_SHA
              value: "e8cc3f9"
            - name: AGENT_DEPLOYED_BY
              value: "gitops"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import k8s_monitor; print('ok')"
            initialDelaySeconds: 30
            periodSeconds: 60
      restartPolicy: Always
