# Model configuration for ai-agents namespace
# NOTE: Keep in sync with gitops/apps/vllm/model-config.yaml
# The just model-switch command updates both automatically
apiVersion: v1
kind: ConfigMap
metadata:
  name: model-config
  namespace: ai-agents
  labels:
    app.kubernetes.io/part-of: ai-agents
data:
  # Main LLM model configuration (must match vllm deployment)
  LLM_MODEL_NAME: "Qwen/Qwen3-14B-FP8"

  # Embeddings model configuration (must match vllm-embeddings deployment)
  EMBEDDINGS_MODEL_NAME: "Qwen/Qwen3-Embedding-0.6B"
