apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubani-ui
  namespace: kubani-ui
  labels:
    app.kubernetes.io/name: kubani-ui
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubani-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubani-ui
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: kubani-ui
          image: registry.almckay.io/kubani-ui:0.3.3
          imagePullPolicy: Always
          command: ["node"]
          args: ["dist/index.js"]
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            # Server-side API endpoints for chat backend
            - name: REGISTRY_URL
              value: "http://metadata-registry.ai-agents.svc.cluster.local:8000"
            - name: VLLM_URL
              value: "http://llm-api.vllm.svc.cluster.local:8000/v1"
            - name: MODEL_NAME
              value: "nvidia/Qwen3-14B-FP4"
            - name: K8S_MCP_URL
              value: "http://kubernetes-mcp-server.ai-agents.svc.cluster.local:8080"
            # Client-side API endpoints (for future use)
            - name: VITE_METADATA_REGISTRY_URL
              value: "http://metadata-registry.ai-agents.svc:8000"
            - name: VITE_TEMPORAL_URL
              value: "http://temporal-frontend.temporal.svc.cluster.local:7233"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kubani-ui
  namespace: kubani-ui
  labels:
    app.kubernetes.io/name: kubani-ui
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: kubani-ui
