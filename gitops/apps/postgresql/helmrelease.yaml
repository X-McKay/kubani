---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgresql
  namespace: database
spec:
  interval: 10m
  chart:
    spec:
      chart: postgresql
      version: "16.2.1"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  values:
    # Use latest tag which is available
    image:
      registry: docker.io
      repository: bitnami/postgresql
      tag: "latest"

    # Authentication configuration using encrypted secret
    auth:
      existingSecret: postgresql-credentials
      secretKeys:
        adminPasswordKey: postgres-password
        userPasswordKey: password
      username: authentik
      database: authentik

    # Disable volumePermissions - it can't chown on NFS with root_squash anyway
    # Instead, we run PostgreSQL as UID 1024 to match the NFS anonymous user
    volumePermissions:
      enabled: false

    # Primary PostgreSQL configuration
    primary:
      # Run as UID 1024 to match Synology NFS root_squash anonymous user
      # This is required because root_squash maps all operations to UID 1024
      # Reference: https://github.com/bitnami/charts/issues/33703
      podSecurityContext:
        fsGroup: 1024
        fsGroupChangePolicy: "OnRootMismatch"
      containerSecurityContext:
        runAsUser: 1024
        runAsGroup: 1024
        runAsNonRoot: false  # Required because 1024 is not in standard range

      # Schedule on non-GPU worker nodes (strix or asio) to protect sparky for GPU workloads
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - strix
                      - asio

      # Persistent storage configuration - use NAS for cross-node scheduling
      persistence:
        enabled: true
        size: 20Gi
        storageClass: "nas-nfs-777"  # NAS storage with 777 permissions for non-root containers

      # Service configuration for internal access
      service:
        type: ClusterIP
        ports:
          postgresql: 5432

      # Resource limits (optional, adjust as needed)
      resources:
        requests:
          memory: "256Mi"
          cpu: "250m"
        limits:
          memory: "1Gi"
          cpu: "1000m"

    # Metrics configuration for Prometheus scraping
    metrics:
      enabled: true
      image:
        registry: docker.io
        repository: bitnami/postgres-exporter
        tag: latest
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
