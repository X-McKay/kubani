---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: prometheus
      version: "25.27.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Alertmanager configuration
    alertmanager:
      enabled: true
      persistence:
        enabled: true
        size: 2Gi

    # Prometheus server configuration
    server:
      persistentVolume:
        enabled: true
        size: 10Gi
      retention: "15d"
      resources:
        requests:
          cpu: 200m
          memory: 1Gi
        limits:
          cpu: 1000m
          memory: 4Gi
      service:
        type: ClusterIP

    # Node exporter for node metrics
    # Enabled on sparky only - rig0 and asio have host-level exporters (scraped via extraScrapeConfigs)
    prometheus-node-exporter:
      enabled: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - rig0
                      - asio

    # Kube-state-metrics for Kubernetes metrics
    kubeStateMetrics:
      enabled: true

    # Push gateway (disabled by default)
    pushgateway:
      enabled: false

    # Extra scrape configs for vLLM and host-level node-exporter on rig0
    extraScrapeConfigs: |
      - job_name: 'vllm'
        scrape_interval: 15s
        static_configs:
          - targets: ['llm-api.vllm.svc.cluster.local:8000']
        metrics_path: /metrics
      - job_name: 'node-exporter-rig0'
        scrape_interval: 15s
        static_configs:
          - targets: ['100.77.107.81:9100']
            labels:
              instance: 'rig0'
              node: 'rig0'
        metrics_path: /metrics
      - job_name: 'node-exporter-asio'
        scrape_interval: 15s
        static_configs:
          - targets: ['100.92.107.71:9100']
            labels:
              instance: 'asio'
              node: 'asio'
        metrics_path: /metrics
