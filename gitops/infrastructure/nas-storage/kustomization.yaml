apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Note: No namespace override - PVs are cluster-scoped
# PVCs are defined in their respective namespace kustomizations

resources:
  - namespace.yaml
  - secret.enc.yaml
  - storageclass.yaml
  - storageclass-nfs.yaml
  - pvs/models-pv.yaml
  - pvs/backups-pv.yaml
  - pvs/backups-ai-agents-pv.yaml
  - pvs/qdrant-pv.yaml
  - pvs/neo4j-pv.yaml
