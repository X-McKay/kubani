# Neo4j credentials secret
# This is a placeholder - actual secret should be created via SOPS
# Format: neo4j/<password>
apiVersion: v1
kind: Secret
metadata:
  name: neo4j-credentials
  namespace: database
  labels:
    app.kubernetes.io/name: neo4j
type: Opaque
stringData:
  # Default password - CHANGE THIS in production via SOPS
  # Format is "neo4j/<password>" for initial setup
  auth: "neo4j/changeme"
  # Individual fields for applications
  username: "neo4j"
  password: "changeme"
