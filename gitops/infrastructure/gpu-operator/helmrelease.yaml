---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
  namespace: gpu-operator
spec:
  interval: 10m
  chart:
    spec:
      chart: gpu-operator
      # v25.10.0+ required for DGX Spark/GB10 support (unified RAM architecture)
      # See: https://github.com/NVIDIA/gpu-operator/issues/1794
      # See: https://forums.developer.nvidia.com/t/blackwell-gb10-gpu-device-plugin-v0-18-0-driver-580-95-05/348704
      version: "v25.10.1"
      sourceRef:
        kind: HelmRepository
        name: nvidia
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Driver settings - use pre-installed drivers since nodes have NVIDIA kernel
    driver:
      enabled: false  # Driver already installed on nodes

    # CUDA toolkit for container runtime (K3s containerd paths)
    toolkit:
      enabled: true
      env:
        - name: CONTAINERD_CONFIG
          value: /var/lib/rancher/k3s/agent/etc/containerd/config.toml
        - name: CONTAINERD_SOCKET
          value: /run/k3s/containerd/containerd.sock
        - name: CONTAINERD_RUNTIME_CLASS
          value: nvidia
        - name: CONTAINERD_SET_AS_DEFAULT
          value: "true"

    # Device plugin to expose GPUs
    devicePlugin:
      enabled: true

    # DCGM exporter for GPU metrics
    dcgmExporter:
      enabled: true

    # MIG manager (not needed for consumer GPUs)
    migManager:
      enabled: false

    # Node feature discovery
    nfd:
      enabled: true

    # GFD for GPU feature discovery
    gfd:
      enabled: true
