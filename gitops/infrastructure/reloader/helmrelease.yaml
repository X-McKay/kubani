---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: reloader
spec:
  interval: 30m
  chart:
    spec:
      chart: reloader
      version: "1.2.0"
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    reloader:
      # Watch all namespaces for ConfigMap/Secret changes
      watchGlobally: true

      # Log level (info, debug, warning, error)
      logFormat: json

      # Resource limits
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi

      # Reload strategy: env-vars triggers rolling restart
      # when ConfigMap/Secret values change
      reloadStrategy: default
