# Support file for the examples corpus (not a backend). Job has no MCP_PASSWORD environment variable.
apiVersion: batch/v1
kind: Job
metadata:
  name: example-db-role-v1
  namespace: database
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: apply
        image: registry.example.com/example/psql:1
      volumes:
      - name: sql
        configMap:
          name: example-sql
