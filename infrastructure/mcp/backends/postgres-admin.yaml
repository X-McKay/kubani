version: 1
name: postgres-admin
profile: container-sse-v1
workload:
  image: docker.io/crystaldba/postgres-mcp@sha256:dbbd346860d29f1543e991f30f3284bf4ab5f096d049ecc3426528f20b1b6e6b
  args:
  - --access-mode=restricted
  - --transport=sse
  port: 8000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  secretEnv:
  - name: DATABASE_URI
    secretKeyRef:
      name: postgres-admin-mcp
      key: DATABASE_URI
authorization:
  role: agent-role-postgres-admin-read
  tools:
  - execute_sql
  scopeDescription: Read-only DB monitoring backend; optional on agent clients and
    APS
secrets:
- infrastructure/gitops/apps/mcp/postgres-admin-mcp.enc.yaml
- infrastructure/gitops/apps/mcp/postgres-admin-mcp-role.enc.yaml
upstreams:
- name: postgresql
  namespace: database
  selector:
    app.kubernetes.io/name: postgresql
  port: 5432
bootstrap:
  manifest: infrastructure/gitops/apps/mcp/postgres-admin-role-job.yaml
  name: postgres-admin-mcp-role-v1
  namespace: database
  revision: v1
  sql: infrastructure/gitops/apps/mcp/postgres-admin-monitor.sql
  sqlSha256: sha256:a2d54af71636dbef937aa1167115943ca091ada44dcff0b42c71dfd4c3125982
  configMap: postgres-admin-monitor-sql
  key: monitor.sql
provision:
  profile: postgres-secret-pair-v1
  roleSecret: infrastructure/gitops/apps/mcp/postgres-admin-mcp-role.enc.yaml
  workloadSecret: infrastructure/gitops/apps/mcp/postgres-admin-mcp.enc.yaml
  username: db_admin_monitor
  database: postgres
  host: postgresql.database.svc.cluster.local
  port: 5432
  policyDescription: Reviewed metadata-only monitor role and interface grants
