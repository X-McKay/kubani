---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: starbase-foundation
  namespace: flux-system
  labels:
    starbase.io/activation-wave: phase4a-restore-v1
spec:
  interval: 10m0s
  # The restore Job has a 20-minute deadline. Allow a five-minute controller
  # cushion so a valid bounded restore does not fail the Flux health wait.
  timeout: 25m0s
  path: ./infrastructure/gitops/apps/starbase-phase4a-foundation
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: databases
      # Require the dependency's matching activation wave, built-in Ready
      # semantics, and reconciliation of its new generation. This prevents an
      # old Ready=True status from admitting the foundation during the source
      # update that unsuspends the exact restore-verification Job.
      readyExpr: >-
        dep.metadata.labels['starbase.io/activation-wave'] ==
        self.metadata.labels['starbase.io/activation-wave'] &&
        dep.status.conditions.exists(e, e.type == 'Ready' && e.status == 'True') &&
        dep.metadata.generation == dep.status.observedGeneration
  # This check deliberately belongs to the Starbase-only gate rather than the
  # shared databases Kustomization. A failed restore blocks this foundation
  # and every later Starbase phase without freezing unrelated app revisions.
  healthChecks:
    - apiVersion: batch/v1
      kind: Job
      name: postgres-backup-restore-verification-v1-e4deaaf32203
      namespace: database
    # This stage must not report Ready until the separately authorized core
    # schema migration has completed successfully. The completed core Job is
    # retained while the separately authorized gateway stage runs; all runtime
    # workloads remain fenced in the foundation overlay.
    - apiVersion: batch/v1
      kind: Job
      name: starbase-core-migrate-22bfaa3b1e8f
      namespace: starbase-system
    # Core migration acceptance and force cleanup are complete. This stage
    # must not report Ready until the separately authorized gateway schema
    # migration succeeds. Every product Deployment remains at zero replicas.
    - apiVersion: batch/v1
      kind: Job
      name: starbase-gateway-migrate-38db19887578
      namespace: starbase-system
    # Stage 8 must fail closed until the real core workload identity proves its
    # required database, Authentik, and issuer paths and its denied external,
    # metadata, and Kubernetes Secret boundaries.
    - apiVersion: batch/v1
      kind: Job
      name: starbase-network-boundary-v1-1cfcdccbc358
      namespace: starbase-system
    # DNS is owned by ExternalDNS from the reviewed Ingress. Do not admit core
    # activation until cert-manager has issued the exact Starbase certificate.
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      name: starbase-tls
      namespace: starbase-system
