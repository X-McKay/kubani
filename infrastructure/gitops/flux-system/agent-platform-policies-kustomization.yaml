---
# Agent sandbox admission policies (spec 6.5), stage B2 in
# docs/infrastructure/configuration/agent-runtime-platform.md. Kept out of the
# infrastructure Kustomization for the same reason as tetragon-policies: the
# ClusterPolicy CRD comes from the Kyverno HelmRelease, so on a fresh cluster
# a server-side dry run of the policies fails. Here that failure only blocks
# this Kustomization, which retries until Kyverno has installed the CRDs.
#
# Rollback: remove this file from kustomization.yaml. prune deletes the
# policies, and tenant pod admission falls back to RBAC and PSA only.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agent-platform-policies
  namespace: flux-system
spec:
  interval: 10m0s
  retryInterval: 2m0s
  timeout: 5m0s
  path: ./infrastructure/gitops/infrastructure/kyverno/policies
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infrastructure
