apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
  namespace: descheduler
spec:
  interval: 30m
  maxHistory: 3
  chart:
    spec:
      chart: descheduler
      version: "0.31.0"
      sourceRef:
        kind: HelmRepository
        name: descheduler
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Run descheduler as a CronJob hourly
    kind: CronJob
    schedule: "0 * * * *"
    successfulJobsHistoryLimit: 1
    failedJobsHistoryLimit: 1

    # Descheduler policy configuration
    deschedulerPolicy:
      profiles:
        - name: default
          pluginConfig:
            # Balance pods across nodes based on resource utilization
            - name: LowNodeUtilization
              args:
                thresholds:
                  cpu: 20
                  memory: 20
                  pods: 20
                targetThresholds:
                  cpu: 50
                  memory: 50
                  pods: 50
                useDeviationThresholds: true

            # Remove duplicate pods (same owner) from same node
            - name: RemoveDuplicates

            # Remove pods that violate topology spread constraints
            - name: RemovePodsViolatingTopologySpreadConstraint

            # Remove pods on nodes that no longer match their node affinity
            - name: RemovePodsViolatingNodeAffinity
              args:
                nodeAffinityType:
                  - requiredDuringSchedulingIgnoredDuringExecution

            # Remove pods violating inter-pod anti-affinity
            - name: RemovePodsViolatingInterPodAntiAffinity

          plugins:
            balance:
              enabled:
                - LowNodeUtilization
                - RemoveDuplicates
                - RemovePodsViolatingTopologySpreadConstraint
            deschedule:
              enabled:
                - RemovePodsViolatingNodeAffinity
                - RemovePodsViolatingInterPodAntiAffinity

    # Resource limits for the descheduler pod
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

    # Run on control plane node
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule

    # Prefer scheduling on control plane
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
