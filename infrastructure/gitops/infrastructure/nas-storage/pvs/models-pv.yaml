apiVersion: v1
kind: PersistentVolume
metadata:
  name: nas-model-storage
  labels:
    app.kubernetes.io/name: nas-model-storage
spec:
  capacity:
    storage: 500Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""  # Empty for static binding
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: nas-models-unique-id
    volumeAttributes:
      source: "//192.168.86.27/kubani/k8s-volumes/models"
    nodeStageSecretRef:
      name: nas-smb-creds
      namespace: nas-storage
  mountOptions:
    - dir_mode=0777
    - file_mode=0777
    - vers=3.0
    - noperm
