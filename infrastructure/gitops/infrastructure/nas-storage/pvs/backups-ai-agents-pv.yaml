apiVersion: v1
kind: PersistentVolume
metadata:
  name: nas-backups-ai-agents
  labels:
    app.kubernetes.io/name: nas-backups
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: nas-backups-ai-agents-unique-id
    volumeAttributes:
      source: "//192.168.86.27/kubani/backups"
    nodeStageSecretRef:
      name: nas-smb-creds
      namespace: nas-storage
  mountOptions:
    - dir_mode=0777
    - file_mode=0777
    - vers=3.0
    - noperm
