apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nas-smb
provisioner: smb.csi.k8s.io
parameters:
  source: "//100.72.32.10/kubani/k8s-volumes"
  # subDir: "${pvc.metadata.namespace}/${pvc.metadata.name}"  # For dynamic subdirs
  csi.storage.k8s.io/node-stage-secret-name: "nas-smb-creds"
  csi.storage.k8s.io/node-stage-secret-namespace: "nas-storage"
reclaimPolicy: Retain
volumeBindingMode: Immediate
mountOptions:
  - dir_mode=0777
  - file_mode=0777
  - vers=3.0
  - noperm
  - nobrl
