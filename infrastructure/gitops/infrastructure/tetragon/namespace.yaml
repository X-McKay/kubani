---
# Tetragon eBPF trial (plan docs/plans/ideas/2026-10-17-mcp-gateway-openshell-tetragon.md,
# section 4). The agent is privileged with hostPID and hostNetwork, so this
# namespace enforces `privileged`; audit/warn stay at restricted so the
# exception remains visible.
apiVersion: v1
kind: Namespace
metadata:
  name: tetragon
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: v1.34
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.34
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.34
