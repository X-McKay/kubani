---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tetragon
  namespace: tetragon
spec:
  interval: 30m
  maxHistory: 3
  chart:
    spec:
      chart: tetragon
      version: "1.7.1"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Agent DaemonSet: strix only. The label comes from topology_labels in
    # the Ansible inventory, so moving or ending the trial is an inventory
    # change (or `kubectl label node strix topology.kubani.io/ebpf-trial-`
    # as the fast stop).
    nodeSelector:
      topology.kubani.io/ebpf-trial: "true"
    # The chart default is `tolerations: [{operator: Exists}]`, which would
    # also land the agent on tainted sparky and the control plane.
    tolerations: []

    tetragon:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 768Mi
      # The chart default drops host ("") and kube-system events from the
      # export; the trial wants to see what runs on the host, so it filters by
      # binary instead.
      # Export volume: the first ring 1 run (2026-10-17) sent ~9 GB/day to
      # Loki against a 1 GB/day gate, almost all of it container-runtime and
      # probe churn: runc and its /proc/self/fd re-exec for every exec probe,
      # kube-proxy's iptables calls, Postgres's pg_isready probe, and an exit
      # event for each of them. Exits are dropped (the exec event carries the
      # same process), those binaries are denied, exec events drop the
      # embedded parent object (parent_exec_id still links them), and
      # exportRateLimit caps the export at 200 events per minute, about
      # 0.8 GB/day at an estimated ~2.7 KB per event without the parent
      # (~5.4 KB with it, measured).
      exportAllowList: |-
        {"event_set":["PROCESS_EXEC", "PROCESS_KPROBE", "PROCESS_UPROBE", "PROCESS_TRACEPOINT", "PROCESS_LSM"]}
      exportDenyList: |-
        {"health_check":true}
        {"binary_regex":["(?:^|/)runc$", "^/proc/self/fd/", "(?:^|/)(?:iptables|ip6tables|iptables-save|iptables-restore|ip6tables-save|ip6tables-restore|nft)(?:-legacy|-nft)?$", "(?:^|/)pg_isready$"]}
      exportRateLimit: 200
      fieldFilters: |-
        {"event_set":["PROCESS_EXEC"], "fields":"parent", "action":"EXCLUDE"}
      # Exec events carry full argv, and the export goes to Loki. FalkorDB
      # on strix starts as `redis-server --requirepass <password>` (its
      # REDIS_ARGS), and Tetragon also reports processes already running when
      # it starts, so these filters must be in place before strix is
      # labelled. Capture groups are replaced with "*****". Checked with a
      # sentinel credential in the change record's ring 1 gate.
      redactionFilters: |-
        {"redact": ["--(?:requirepass|masterauth|password|passwd|pass|token|secret|api-key|apikey)(?:\\s+|=)(\\S+)"]}
        {"binary_regex": ["(?:^|/)redis-cli$"], "redact": ["(?:^|\\s)-a\\s+(\\S+)"]}
        {"redact": ["://[^:/@\\s]+:([^@\\s]+)@"]}
      prometheus:
        enabled: true
        port: 2112
        # Drop the pod label to cap cardinality.
        metricsLabelFilter: "namespace,workload,binary"

    # Events go to stdout of the export sidecar; Alloy already ships pod
    # logs to Loki.
    export:
      mode: stdout
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi

    tetragonOperator:
      nodeSelector:
        kubernetes.io/hostname: rig0
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
