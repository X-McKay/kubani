# Tetragon trial, observe only, strix only (plan section 4).
#
# Stage 1: the agent with built-in process exec/exit events and no
# TracingPolicies. The operator installs the TracingPolicy CRDs on startup.
#
# Stage 2: the TracingPolicies in `policies/` are applied by their own Flux
# Kustomization (flux-system/tetragon-policies-kustomization.yaml). The CRDs
# come from the operator, not from Git, so listing the policies here would
# fail this Kustomization's dry run on a fresh cluster before the operator
# that installs the CRDs exists.
#
# Rollback: plan section 6.2. Fast stop:
#   kubectl label node strix topology.kubani.io/ebpf-trial-
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - helmrelease.yaml
