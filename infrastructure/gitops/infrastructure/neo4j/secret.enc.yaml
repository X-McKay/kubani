apiVersion: v1
kind: Secret
metadata:
  name: neo4j-credentials
  namespace: database
  labels:
    app.kubernetes.io/name: neo4j
type: Opaque
stringData:
  # IMPORTANT: This file must be encrypted with SOPS before committing.
  # Run: sops --encrypt infrastructure/gitops/infrastructure/neo4j/secret.enc.yaml > /tmp/enc.yaml && mv /tmp/enc.yaml infrastructure/gitops/infrastructure/neo4j/secret.enc.yaml
  # Format: neo4j/<password>
  auth: "neo4j/REPLACE_WITH_ACTUAL_PASSWORD"
  username: "neo4j"
  password: "REPLACE_WITH_ACTUAL_PASSWORD"
