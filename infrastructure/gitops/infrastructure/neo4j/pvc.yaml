apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: neo4j-data
  namespace: database
  labels:
    app.kubernetes.io/name: neo4j
spec:
  accessModes:
    - ReadWriteOnce
  # Longhorn block storage — replicated across Primary Site nodes, data is expensive to rebuild
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
