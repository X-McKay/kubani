apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: neo4j-data
  namespace: database
  labels:
    app.kubernetes.io/name: neo4j
spec:
  accessModes:
    - ReadWriteOnce
  # Currently bound to NAS volume (nas-neo4j). Migration to Longhorn requires
  # a data migration step — see docs/infrastructure/cluster/cluster-stability.md
  storageClassName: ""
  volumeName: nas-neo4j
  resources:
    requests:
      storage: 10Gi
