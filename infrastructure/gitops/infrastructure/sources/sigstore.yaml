# Flux source for the Sigstore scaffold Helm chart (private Sigstore,
# governance doc plan step 2). Chart 0.6.117 bundles fulcio 2.11.4 (Fulcio
# v1.9.0), rekor 1.8.7 (Rekor v1.5.4), trillian 0.3.22, ctlog 0.2.69, tuf
# 0.1.33 and tsa 2.1.5; every image in it is pinned by digest. The digest is
# the chart manifest digest read from ghcr.io on 2026-11-01 (chart published
# 2026-10-08); Flux uses the digest and the tag is documentation.
#
# Consumed by HelmRelease.spec.chartRef in infrastructure/sigstore/helmrelease.yaml.
# On a bump, re-render the chart and mirror any new image digests into
# registry.almckay.io/mirror/ first (see infrastructure/sigstore/README.md).
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: sigstore-scaffold
  namespace: flux-system
spec:
  interval: 1h
  url: oci://ghcr.io/sigstore/helm-charts/scaffold
  ref:
    tag: "0.6.117"
    digest: sha256:fb9d986842b3c13d2e85b98e800175753aba7f9a20d564c0aa76d51ca1a545af
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
