---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 10m
  chart:
    spec:
      chart: longhorn
      version: "1.7.2"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  values:
    defaultSettings:
      # Single replica — databases use local storage on the attached node.
      # Cross-node replication over Tailscale saturates the network link.
      # Use application-level replication (e.g. PostgreSQL streaming) if HA is needed.
      defaultReplicaCount: 1
      # Prefer reading from local replica when available
      defaultDataLocality: best-effort
      # Allow pod deletion when node goes down (important for StatefulSets like PostgreSQL)
      nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
      defaultDataPath: /var/lib/longhorn
      # Low CPU reservation — this is a homelab, not production at scale
      guaranteedInstanceManagerCPU: 12
      # Restrict replica and instance manager scheduling to Primary Site nodes only.
      # This prevents cross-site replication traffic to osprey (secondary site).
      # Requirements: 2.3, 3.1
      nodeSelector: "topology.kubani.io/site:primary"

    persistence:
      defaultClass: false
      defaultClassReplicaCount: 1
