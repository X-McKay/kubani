apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: falkordb-data
  namespace: database
  labels:
    app.kubernetes.io/name: falkordb
spec:
  accessModes:
    - ReadWriteOnce
  # Longhorn block storage — replicated across Primary Site nodes
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
