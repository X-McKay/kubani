apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: falkordb
  namespace: database
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.middlewares: database-authentik-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - falkordb.almckay.io
      secretName: falkordb-tls  # pragma: allowlist secret
  rules:
    - host: falkordb.almckay.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: falkordb
                port:
                  number: 3000
