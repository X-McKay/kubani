apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    ports:
      postgresql:
        port: 5432
        expose:
          default: true
        exposedPort: 5432
        protocol: TCP
      redis:
        port: 6379
        expose:
          default: true
        exposedPort: 6379
        protocol: TCP
      temporal:
        port: 7233
        expose:
          default: true
        exposedPort: 7233
        protocol: TCP
      # FalkorDB speaks RESP; 6379 is already taken by the cache Redis
      # entrypoint above, so it is exposed on 6380 externally.
      falkordb:
        port: 6380
        expose:
          default: true
        exposedPort: 6380
        protocol: TCP
      metrics:
        port: 9100
        expose:
          default: false
        # Not exposed via LoadBalancer to avoid hostPort conflict with prometheus-node-exporter
        # Prometheus scrapes via ClusterIP service instead
    additionalArguments:
      - "--entrypoints.postgresql.address=:5432/tcp"
      - "--entrypoints.redis.address=:6379/tcp"
      - "--entrypoints.temporal.address=:7233/tcp"
      - "--entrypoints.falkordb.address=:6380/tcp"
