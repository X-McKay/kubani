---
# tier: platform
# Namespace: vllm (vLLM inference endpoints)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: vllm
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: vllm
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-ingress
  namespace: vllm
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: vllm
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
---
# Prometheus scrapes the engine pods directly (llm-engine / fast-model-engine
# Services target these same pods), not through the broker (roadmap 0.1).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-scrape
  namespace: vllm
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - vllm
      - vllm-fast
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - port: 8000
      protocol: TCP
---
# The gpu-broker instances proxy to engine pods in this namespace; the
# namespace's egress posture (DNS-only) would otherwise block
# broker -> engine :8000. Selects the shared role label so it covers
# every broker instance (gpu-broker, gpu-broker-main).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-broker-engine-egress
  namespace: vllm
spec:
  podSelector:
    matchLabels:
      kubani.io/role: gpu-broker
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector: {}
    ports:
    - port: 8000
      protocol: TCP
---
# Ephemeral inference benchmark Jobs (infrastructure/scripts/inference_bench,
# launched by `just inference-bench`) drive load through the brokers' public
# listener, sleep/wake through the broker admin listener, and read engine
# /version and /is_sleeping. Ingress side is covered by allow-same-namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-inference-bench-egress
  namespace: vllm
spec:
  podSelector:
    matchLabels:
      kubani.io/role: inference-bench
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector: {}
    ports:
    - port: 8000
      protocol: TCP
    - port: 8080
      protocol: TCP
    - port: 8081
      protocol: TCP
