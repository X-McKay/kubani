---
# tier: platform
# Namespace: vllm (vLLM inference endpoints)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: vllm
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: vllm
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-ingress
  namespace: vllm
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: vllm
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
---
# The gpu-broker instances proxy to engine pods in this namespace; the
# namespace's egress posture (DNS-only) would otherwise block
# broker -> engine :8000. Selects the shared role label so it covers
# every broker instance (gpu-broker, gpu-broker-main).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-broker-engine-egress
  namespace: vllm
spec:
  podSelector:
    matchLabels:
      kubani.io/role: gpu-broker
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector: {}
    ports:
    - port: 8000
      protocol: TCP
