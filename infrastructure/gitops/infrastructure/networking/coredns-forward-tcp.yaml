---
# Keep CoreDNS's external upstream DNS traffic on TCP.  The node network has
# intermittent UDP/53 loss to otherwise healthy public resolvers; TCP queries
# to the same resolvers are reliable.  Without this, Flux and image pulls can
# fail whenever CoreDNS selects an unreachable UDP upstream.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health
        ready
        kubernetes cluster.local in-addr.arpa ip6.arpa {
          pods insecure
          fallthrough in-addr.arpa ip6.arpa
        }
        hosts /etc/coredns/NodeHosts {
          ttl 60
          reload 15s
          fallthrough
        }
        prometheus :9153
        cache 30
        loop
        reload
        loadbalance
        import /etc/coredns/custom/*.override
        forward . /etc/resolv.conf {
          force_tcp
        }
    }
  NodeHosts: |
    100.71.65.62 sparky
    100.76.45.84 strix
    100.77.107.81 rig0 RIG0
    100.92.107.71 asio
