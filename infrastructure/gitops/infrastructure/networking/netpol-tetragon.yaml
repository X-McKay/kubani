---
# tier: optional (trial)
# Namespace: tetragon (eBPF trial on strix, plan section 4)
# The agent DaemonSet runs with hostNetwork, so NetworkPolicy does not select
# it; Prometheus scrapes its :2112 on strix's node IP (see
# allow-prometheus-scrape-egress in netpol-monitoring.yaml). Only the operator
# pod is subject to these policies: nothing needs to reach it, and it only
# talks to DNS and the API server (it installs the CRDs and watches pods).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: tetragon
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-operator-egress
  namespace: tetragon
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  # API server: the kubernetes Service ClusterIP, and the server's own
  # address after kube-proxy DNAT (same pair as netpol-monitoring.yaml).
  - to:
    - ipBlock:
        cidr: 10.43.0.1/32
    ports:
    - port: 443
      protocol: TCP
  - to:
    - ipBlock:
        cidr: 100.64.0.0/10
    ports:
    - port: 6443
      protocol: TCP
