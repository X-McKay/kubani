---
# tier: optional (OpenShell, plan 2026-10-17 section 3)
# Namespace: agent-sandbox-system. The controller talks to DNS and the API
# server; the API server calls its conversion webhook (:9443). Same API-server
# pair as netpol-tetragon.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: agent-sandbox-system
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
# API server -> conversion webhook. k3s's API server runs on the host, so the
# source is a node address: the tailnet (K3s binds to Tailscale) or the node's
# flannel address in the pod CIDR.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apiserver-webhook-ingress
  namespace: agent-sandbox-system
spec:
  podSelector:
    matchLabels:
      app: agent-sandbox-controller
  policyTypes:
  - Ingress
  ingress:
  - from:
    - ipBlock:
        cidr: 100.64.0.0/10
    - ipBlock:
        cidr: 10.42.0.0/16
    ports:
    - port: 9443
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-controller-egress
  namespace: agent-sandbox-system
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  - to:
    - ipBlock:
        cidr: 10.43.0.1/32
    ports:
    - port: 443
      protocol: TCP
  - to:
    - ipBlock:
        cidr: 100.64.0.0/10
    ports:
    - port: 6443
      protocol: TCP
