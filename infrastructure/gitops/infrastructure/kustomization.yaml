apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace-policy/
  - sources/
  - traefik/
  - cert-manager/
  - storage/
  - networking/
  - gpu-operator/
  - descheduler/
  - external-dns/
  - registry/
  - database-auth/
  - falkordb/
  - qdrant/
  - smb-csi-driver/
  - nfs-csi-driver/
  - nas-storage/
  - reloader/
  - longhorn/
  - tetragon/
  - agent-sandbox/
  # Agent Runtime Platform, in the order of
  # docs/infrastructure/configuration/agent-runtime-platform.md (each
  # directory's kustomization.yaml also stages its own files). Phase A is
  # enabled (P0, P1, P2, A1, A2) and Kyverno is installed (B1); its policies (B2) are not.
  - agent-platform-crds/
  - agent-platform-netpol/
  - kata/
  - kyverno/
