apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: database
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/component: vector-database
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: qdrant
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qdrant
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "6333"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.16.3
          ports:
            - name: http
              containerPort: 6333
              protocol: TCP
            - name: grpc
              containerPort: 6334
              protocol: TCP
          env:
            - name: QDRANT__SERVICE__API_KEY
              valueFrom:
                secretKeyRef:
                  name: qdrant-credentials
                  key: api-key
            - name: QDRANT__TELEMETRY_DISABLED
              value: "true"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 300
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 120
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: qdrant-data
