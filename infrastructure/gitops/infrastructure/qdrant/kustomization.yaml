apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: database

resources:
  - secret.enc.yaml
  # - readonly-secret.enc.yaml  # UNCOMMENT once the SOPS file exists (docs/infrastructure/operations/pending-secrets.md)
  - pvc.yaml
  - nas-backups-pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app.kubernetes.io/part-of: kubani
      app.kubernetes.io/managed-by: flux
