---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-server-registry
  namespace: ai-agents
  labels:
    app.kubernetes.io/name: mcp-registry
    app.kubernetes.io/component: configuration
data:
  # MCP Server Registry Configuration
  # This ConfigMap provides centralized discovery of MCP servers available to agents.
  # Agents read this configuration to discover available MCP servers and their capabilities.
  #
  # NOTE: This file is auto-generated from ./mcp/servers/ and ./mcp/policies/
  # Do not edit directly - run 'just mcp-sync' to update.

  # Registry format (JSON for programmatic access)
  registry.json: |
    {
      "version": "1.0",
      "servers": {
        "cloudflare-docs": {
          "name": "cloudflare-docs-mcp",
          "description": "Search Cloudflare documentation",
          "transport": "sse",
          "url": "https://docs.cloudflare.com/mcp/sse",
          "capabilities": [
            "docs.search"
          ],
          "readOnly": true
        },
        "discord": {
          "name": "discord-mcp-server",
          "description": "Bidirectional Discord integration for AI agents - send/read messages, manage reactions, channels, and webhooks",
          "transport": "sse",
          "url": "https://discord-mcp.almckay.io/sse",
          "capabilities": [
            "messages.send",
            "messages.read",
            "messages.delete",
            "messages.await_reply",
            "reactions.add",
            "reactions.remove",
            "reactions.get",
            "reactions.await",
            "channels.list",
            "channels.create",
            "channels.delete",
            "webhooks.list",
            "webhooks.create",
            "webhooks.delete"
          ],
          "readOnly": false
        },
        "kubernetes": {
          "name": "kubernetes-mcp-server",
          "description": "Native Kubernetes operations via MCP protocol",
          "transport": "stdio",
          "command": "npx",
          "args": [
            "-y",
            "@anthropics/kubernetes-mcp-server@latest"
          ],
          "env": {
            "KUBECONFIG": "/etc/kubernetes/kubeconfig"
          },
          "capabilities": [
            "pods.list",
            "pods.get",
            "pods.logs",
            "pods.exec",
            "pods.delete",
            "deployments.list",
            "deployments.scale",
            "events.list",
            "namespaces.list",
            "resources.get",
            "resources.create",
            "resources.delete",
            "helm.install",
            "helm.list",
            "helm.uninstall"
          ],
          "namespaces": [
            "*"
          ],
          "readOnly": false
        }
      },
      "policies": {
        "default": {
          "allowedServers": [
            "kubernetes",
            "cloudflare-docs",
            "discord"
          ],
          "requireApproval": [
            "pods.delete",
            "deployments.scale",
            "resources.delete",
            "channels.delete",
            "webhooks.delete"
          ],
          "auditLog": true
        },
        "k8s-monitor": {
          "allowedServers": [
            "kubernetes",
            "discord"
          ],
          "requireApproval": [
            "pods.delete",
            "channels.delete"
          ],
          "auditLog": true,
          "namespaceRestrictions": {
            "deny": [
              "kube-system",
              "flux-system"
            ]
          }
        },
        "security-monitor": {
          "allowedServers": [
            "kubernetes"
          ],
          "requireApproval": [
            "*"
          ],
          "auditLog": true,
          "readOnly": true
        }
      }
    }

  # Human-readable documentation
  README.md: |
    # MCP Server Registry

    This ConfigMap provides centralized discovery of MCP (Model Context Protocol)
    servers available to AI agents in the cluster.

    NOTE: This file is auto-generated. Edit files in ./mcp/ and run 'just mcp-sync'.

    ## Available Servers

    ### kubernetes-mcp-server
    Native Kubernetes operations. Provides direct access to cluster resources
    without requiring Python kubernetes client libraries.

    **Capabilities:**
    - Pod management (list, get, logs, exec, delete)
    - Deployment operations (list, scale)
    - Event monitoring
    - Resource management (get, create, delete)
    - Helm chart operations

    ### cloudflare-docs-mcp
    Search Cloudflare documentation for infrastructure guidance.

    ## Agent Policies

    Each agent can have specific policies defining:
    - Which MCP servers they can access
    - Which operations require human approval
    - Namespace restrictions
    - Audit logging requirements

    ## Usage

    Agents should read this ConfigMap at startup to discover available
    MCP servers and configure their tool sets accordingly.

    ```python
    from kubernetes import client, config

    config.load_incluster_config()
    v1 = client.CoreV1Api()

    cm = v1.read_namespaced_config_map(
        name="mcp-server-registry",
        namespace="ai-agents"
    )
    registry = json.loads(cm.data["registry.json"])
    ```
