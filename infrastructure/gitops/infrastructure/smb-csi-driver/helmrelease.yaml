apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-smb
  namespace: smb-csi-driver
spec:
  interval: 30m
  chart:
    spec:
      chart: csi-driver-smb
      version: "1.19.1"
      sourceRef:
        kind: HelmRepository
        name: csi-driver-smb
        namespace: flux-system
  values:
    linux:
      kubelet: "/var/lib/kubelet"
    controller:
      replicas: 1
      resources:
        limits:
          memory: 300Mi
        requests:
          cpu: 10m
          memory: 20Mi
    node:
      resources:
        limits:
          memory: 300Mi
        requests:
          cpu: 10m
          memory: 20Mi
