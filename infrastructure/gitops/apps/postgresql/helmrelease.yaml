---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgresql
  namespace: database
spec:
  interval: 10m
  maxHistory: 3
  chart:
    spec:
      chart: postgresql
      version: "16.2.1"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  values:
    image:
      registry: docker.io
      repository: bitnami/postgresql
      # Bitnami removed pinned tags from docker.io; only :latest remains.
      tag: "latest"
      # Pin by digest: the pgvector-portable vector.so overlay below is built
      # against this exact image's PG 18.3 ABI — an unpinned :latest could
      # silently roll the PG major and break extension loading. Bump the
      # digest and rebuild the overlay together (see pgvector-portable/).
      digest: "sha256:e93732718bf7fafa61a04abaa437fc601c80a791857105fd6fca18407b5725c9"

    # Authentication configuration using encrypted secret
    auth:
      existingSecret: postgresql-credentials
      secretKeys:
        adminPasswordKey: postgres-password
        userPasswordKey: password
      username: authentik
      database: authentik

    # PostgreSQL extended configuration
    primary:
      extendedConfiguration: |
        max_connections = 200
        tcp_keepalives_idle = 60
        tcp_keepalives_interval = 10
        tcp_keepalives_count = 6
        idle_in_transaction_session_timeout = 900000

      # Primary PostgreSQL configuration
      # Schedule on Primary Site general-purpose nodes (topology label, not hostname)
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubani.io/site
                    operator: In
                    values:
                      - primary
                  - key: topology.kubani.io/role
                    operator: In
                    values:
                      - database

      # pgvector fix: bitnami's vector.so mixes AVX-512VL instructions (e.g.
      # vextractf64x2 in vector_norm) into AVX2 code; the database nodes'
      # Zen+ CPUs have no AVX-512, so any HNSW insert/scan SIGILLs the
      # backend and crash-recovers the whole server (observed 2026-08-09,
      # bakudo issue #30). Overlay a portable x86-64-v2 build of the same
      # pgvector 0.8.2 — see pgvector-portable/README.md.
      extraVolumes:
        - name: pgvector-portable
          configMap:
            name: pgvector-portable
            defaultMode: 0755
      extraVolumeMounts:
        - name: pgvector-portable
          mountPath: /opt/bitnami/postgresql/lib/vector.so
          subPath: vector.so

      # Longhorn block storage — replicated across nodes, proper fsync
      persistence:
        enabled: true
        size: 20Gi
        storageClass: "longhorn"

      # Service configuration for internal access
      service:
        type: ClusterIP
        ports:
          postgresql: 5432

      # Resource limits (optional, adjust as needed)
      resources:
        requests:
          memory: "256Mi"
          cpu: "250m"
        limits:
          memory: "1Gi"
          cpu: "1000m"

    # Metrics configuration for Prometheus scraping
    metrics:
      enabled: true
      image:
        registry: docker.io
        repository: bitnami/postgres-exporter
        tag: "latest"
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
