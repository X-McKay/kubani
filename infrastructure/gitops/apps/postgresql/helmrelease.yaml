---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgresql
  namespace: database
spec:
  interval: 10m
  chart:
    spec:
      chart: postgresql
      version: "16.2.1"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  values:
    # Use latest tag which is available
    image:
      registry: docker.io
      repository: bitnami/postgresql
      tag: "latest"

    # Authentication configuration using encrypted secret
    auth:
      existingSecret: postgresql-credentials
      secretKeys:
        adminPasswordKey: postgres-password
        userPasswordKey: password
      username: authentik
      database: authentik

    # PostgreSQL extended configuration
    primary:
      extendedConfiguration: |
        max_connections = 200
        tcp_keepalives_idle = 60
        tcp_keepalives_interval = 10
        tcp_keepalives_count = 6
        idle_in_transaction_session_timeout = 900000

      # Primary PostgreSQL configuration
      # Schedule on Primary Site general-purpose nodes (topology label, not hostname)
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubani.io/site
                    operator: In
                    values:
                      - primary
                  - key: topology.kubani.io/usage-class
                    operator: In
                    values:
                      - general

      # Longhorn block storage — replicated across nodes, proper fsync
      persistence:
        enabled: true
        size: 20Gi
        storageClass: "longhorn"

      # Service configuration for internal access
      service:
        type: ClusterIP
        ports:
          postgresql: 5432

      # Resource limits (optional, adjust as needed)
      resources:
        requests:
          memory: "256Mi"
          cpu: "250m"
        limits:
          memory: "1Gi"
          cpu: "1000m"

    # Metrics configuration for Prometheus scraping
    metrics:
      enabled: true
      image:
        registry: docker.io
        repository: bitnami/postgres-exporter
        tag: latest
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
