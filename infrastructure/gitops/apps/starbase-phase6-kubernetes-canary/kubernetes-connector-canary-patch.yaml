apiVersion: apps/v1
kind: Deployment
metadata:
  name: starbase-kubernetes-connector
  namespace: starbase-connectors
  annotations:
    starbase.io/activation-state: authorized-preproduction-kubernetes-canary
    starbase.io/activation-stage: phase6-kubernetes-observation
spec:
  replicas: 1
  template:
    metadata:
      annotations:
        starbase.io/activation-state: authorized-preproduction-kubernetes-canary
        starbase.io/activation-stage: phase6-kubernetes-observation
        starbase.io/source-revision: 400711d9fbb3e068f6dff274e58db26bcae934e3 # pragma: allowlist secret
        starbase.io/artifact-class: owner-local-preproduction
        starbase.io/blocker: null
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution: null
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [asio, strix]
      containers:
        - name: connector
          image: ghcr.io/x-mckay/starbase/kubernetes-connector@sha256:70595d0171b481ae78b221e52b11f38a67aedf6768974fb77b19a875c42ae7c5
