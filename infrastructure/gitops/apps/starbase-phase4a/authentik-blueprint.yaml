apiVersion: v1
kind: ConfigMap
metadata:
  name: starbase-authentik-blueprint
  namespace: auth
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: blueprints
    app.kubernetes.io/part-of: starbase
  annotations:
    starbase.io/activation-state: blocked
    starbase.io/blocker: merge-into-authentik-owned-blueprint-configmap
data:
  starbase.yaml: |
    version: 1
    metadata:
      name: Starbase OIDC
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_core.group
        identifiers:
          name: starbase-operators
        attrs:
          is_superuser: false

      - id: starbase-groups-scope
        model: authentik_providers_oauth2.scopemapping
        identifiers:
          name: Starbase group membership
        attrs:
          scope_name: groups
          description: Exact Authentik group names used by Starbase authorization.
          expression: |
            return {
                "groups": [group.name for group in request.user.groups.all()],
            }

      - id: starbase-provider
        model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: Starbase Kubani
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: public
          client_id: starbase-kubani
          redirect_uris:
            - matching_mode: strict
              url: https://starbase.almckay.io/api/v1/auth/callback
              redirect_uri_type: authorization
          grant_types:
            - authorization_code
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !KeyOf starbase-groups-scope
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

      - model: authentik_core.application
        identifiers:
          slug: starbase
        attrs:
          name: Starbase
          provider: !KeyOf starbase-provider
          meta_launch_url: https://starbase.almckay.io
          policy_engine_mode: any
