apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-upgrade-repair-rehearsal-v2-014a5e82b6d2
  namespace: database
  labels:
    app.kubernetes.io/name: authentik-upgrade-rehearsal
    app.kubernetes.io/component: recovery-rehearsal
data:
  restore-postgres.sh: |
    #!/usr/bin/env bash
    set -Eeuo pipefail
    umask 007

    readonly backup_dir=/backups/postgresql
    readonly backup_name=postgres-20260825-020000.sql.gz.enc
    readonly backup_file=${backup_dir}/${backup_name}
    readonly checksum_file=${backup_file}.sha256
    readonly work_dir=/work
    readonly shared_dir=${work_dir}/shared
    readonly socket_dir=${work_dir}/socket

    if [[ ! -s "${backup_file}" || ! -s "${checksum_file}" ]]; then
      echo "ERROR: exact encrypted backup or checksum is absent"
      exit 2
    fi
    (
      cd "${backup_dir}"
      sha256sum --check "$(basename "${checksum_file}")"
    )
    openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
      -md sha256 -pass env:POSTGRES_PASSWORD -in "${backup_file}" \
      | gzip -t

    export PGDATA=${work_dir}/pgdata
    export TMPDIR=/tmp
    restore_role=upgrade_rehearsal_$(openssl rand -hex 12)
    readonly restore_role
    mkdir -p "${PGDATA}" "${shared_dir}" "${socket_dir}"
    chmod 0700 "${PGDATA}" "${socket_dir}"
    chgrp 2000 "${shared_dir}"
    chmod 2770 "${shared_dir}"

    initdb --pgdata="${PGDATA}" --username="${restore_role}" \
      --auth-local=trust --auth-host=trust >/dev/null
    pg_ctl --pgdata="${PGDATA}" \
      --options="-c listen_addresses=127.0.0.1 -c unix_socket_directories=${socket_dir} -c port=5432 -c log_statement=none -c log_min_error_statement=panic" \
      --wait start >/dev/null
    stop_postgres() {
      pg_ctl --pgdata="${PGDATA}" --mode=fast --wait stop >/dev/null || true
    }
    trap stop_postgres EXIT TERM INT

    echo "Restoring the exact encrypted backup into isolated PostgreSQL"
    if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
      -md sha256 -pass env:POSTGRES_PASSWORD -in "${backup_file}" \
      | gzip -dc \
      | psql --host=127.0.0.1 --port=5432 --username="${restore_role}" \
          --dbname=postgres --set=ON_ERROR_STOP=1 --quiet \
          >"${work_dir}/restore.stdout" 2>"${work_dir}/restore.stderr"; then
      echo "ERROR: isolated restore failed"
      tail -n 100 "${work_dir}/restore.stderr"
      exit 1
    fi

    printf '%s\n' "${restore_role}" >"${shared_dir}/restore-role"
    openssl rand -hex 32 >"${shared_dir}/authentik-secret-key"
    psql --host=127.0.0.1 --port=5432 --username="${restore_role}" \
      --dbname=authentik --tuples-only --no-align --field-separator='|' \
      --set=ON_ERROR_STOP=1 --command="
        SELECT
          (SELECT count(*) FROM authentik_core_user),
          (SELECT count(*) FROM authentik_core_group),
          (SELECT count(*) FROM authentik_core_application),
          (SELECT count(*) FROM authentik_core_provider),
          (SELECT count(*) FROM django_migrations);
      " >"${shared_dir}/baseline-counts"
    chgrp 2000 "${shared_dir}/restore-role" \
      "${shared_dir}/authentik-secret-key" "${shared_dir}/baseline-counts"
    chmod 0640 "${shared_dir}/restore-role" \
      "${shared_dir}/authentik-secret-key" "${shared_dir}/baseline-counts"
    touch "${shared_dir}/restore-ready"
    chgrp 2000 "${shared_dir}/restore-ready"
    chmod 0640 "${shared_dir}/restore-ready"
    echo "Isolated restore ready; beginning the reviewed upgrade ladder"

    while pg_ctl --pgdata="${PGDATA}" status >/dev/null; do
      sleep 5
    done

  repair-migration-state.sh: |
    #!/usr/bin/env bash
    set -Eeuo pipefail
    umask 007

    readonly shared_dir=/work/shared
    readonly restore_role=$(<"${shared_dir}/restore-role")
    readonly psql_base=(
      psql
      --host=127.0.0.1
      --port=5432
      --username="${restore_role}"
      --dbname=authentik
      --set=ON_ERROR_STOP=1
      --no-align
      --tuples-only
    )

    before_counts=$("${psql_base[@]}" --field-separator='|' --command="
      SELECT
        (SELECT count(*) FROM authentik_rbac_role),
        (SELECT count(*) FROM authentik_rbac_role WHERE group_id IS NOT NULL),
        (SELECT count(*) FROM authentik_core_user),
        (SELECT count(*) FROM authentik_core_group),
        (SELECT count(*) FROM authentik_core_application),
        (SELECT count(*) FROM authentik_core_provider);
    ")
    readonly before_counts

    echo "Applying exact-fingerprint repair to the isolated restored copy"
    if ! "${psql_base[@]}" <<'SQL'
    BEGIN;
    DO $repair$
    DECLARE
      applied_0008 integer;
      applied_0009 integer;
      applied_0010 integer;
      applied_0056 integer;
      deleted_rows integer;
      group_nullable text;
      managed_nullable text;
    BEGIN
      SELECT count(*) INTO applied_0008
      FROM django_migrations
      WHERE app = 'authentik_rbac' AND name = '0008_alter_role_group';
      SELECT count(*) INTO applied_0009
      FROM django_migrations
      WHERE app = 'authentik_rbac' AND name = '0009_remove_initialpermissions_mode';
      SELECT count(*) INTO applied_0010
      FROM django_migrations
      WHERE app = 'authentik_rbac'
        AND name = '0010_remove_role_group_alter_role_name';
      SELECT count(*) INTO applied_0056
      FROM django_migrations
      WHERE app = 'authentik_core' AND name = '0056_user_roles';

      SELECT is_nullable INTO group_nullable
      FROM information_schema.columns
      WHERE table_schema = 'public'
        AND table_name = 'authentik_rbac_role'
        AND column_name = 'group_id';
      SELECT is_nullable INTO managed_nullable
      FROM information_schema.columns
      WHERE table_schema = 'public'
        AND table_name = 'authentik_rbac_role'
        AND column_name = 'managed';

      IF applied_0008 <> 1 OR applied_0009 <> 1 OR applied_0010 <> 1
        OR applied_0056 <> 0 OR group_nullable IS DISTINCT FROM 'NO'
        OR managed_nullable IS DISTINCT FROM 'YES'
        OR to_regclass('public.authentik_core_user_roles') IS NOT NULL
        OR NOT EXISTS (
          SELECT 1 FROM information_schema.columns
          WHERE table_schema = 'public'
            AND table_name = 'authentik_rbac_initialpermissions'
            AND column_name = 'mode'
        )
        OR EXISTS (SELECT 1 FROM authentik_rbac_initialpermissions LIMIT 1)
      THEN
        RAISE EXCEPTION
          'restored schema/history does not match the reviewed repair fingerprint';
      END IF;

      ALTER TABLE authentik_rbac_role ALTER COLUMN group_id DROP NOT NULL;
      ALTER TABLE authentik_rbac_initialpermissions DROP COLUMN mode;
      DELETE FROM django_migrations
      WHERE app = 'authentik_rbac'
        AND name = '0010_remove_role_group_alter_role_name';
      GET DIAGNOSTICS deleted_rows = ROW_COUNT;
      IF deleted_rows <> 1 THEN
        RAISE EXCEPTION 'expected exactly one future migration marker';
      END IF;
    END
    $repair$;
    COMMIT;
    SQL
    then
      echo "ERROR: exact-fingerprint repair failed and PostgreSQL rolled back"
      exit 1
    fi

    after_counts=$("${psql_base[@]}" --field-separator='|' --command="
      SELECT
        (SELECT count(*) FROM authentik_rbac_role),
        (SELECT count(*) FROM authentik_rbac_role WHERE group_id IS NOT NULL),
        (SELECT count(*) FROM authentik_core_user),
        (SELECT count(*) FROM authentik_core_group),
        (SELECT count(*) FROM authentik_core_application),
        (SELECT count(*) FROM authentik_core_provider);
    ")
    readonly after_counts
    if [[ "${before_counts}" != "${after_counts}" ]]; then
      echo "ERROR: repair changed domain row counts"
      exit 1
    fi

    repair_state=$("${psql_base[@]}" --field-separator='|' --command="
      SELECT
        (SELECT is_nullable FROM information_schema.columns
          WHERE table_schema = 'public'
            AND table_name = 'authentik_rbac_role'
            AND column_name = 'group_id'),
        (SELECT count(*) FROM django_migrations
          WHERE app = 'authentik_rbac'
            AND name = '0010_remove_role_group_alter_role_name'),
        (SELECT count(*) FROM information_schema.columns
          WHERE table_schema = 'public'
            AND table_name = 'authentik_rbac_initialpermissions'
            AND column_name = 'mode');
    ")
    readonly repair_state
    if [[ "${repair_state}" != "YES|0|0" ]]; then
      echo "ERROR: isolated repair postcondition failed"
      exit 1
    fi
    printf '%s\n' "${repair_state}" >"${shared_dir}/repair-state"
    chmod 0640 "${shared_dir}/repair-state"
    echo "REPAIR PASS: isolated migration state aligned for 2025.12"

  run-version.sh: |
    #!/usr/bin/env bash
    set -Eeuo pipefail
    umask 007

    readonly expected_version=${1:?expected Authentik version is required}
    readonly shared_dir=/work/shared
    readonly log_file=${shared_dir}/authentik-${expected_version}.log
    readonly restore_role=$(<"${shared_dir}/restore-role")

    export AUTHENTIK_DISABLE_UPDATE_CHECK=true
    export AUTHENTIK_LISTEN__HTTP=127.0.0.1:9000
    export AUTHENTIK_POSTGRESQL__HOST=127.0.0.1
    export AUTHENTIK_POSTGRESQL__PORT=5432
    export AUTHENTIK_POSTGRESQL__NAME=authentik
    export AUTHENTIK_POSTGRESQL__USER=${restore_role}
    export AUTHENTIK_SECRET_KEY
    AUTHENTIK_SECRET_KEY=$(<"${shared_dir}/authentik-secret-key")

    child_pid=
    stop_server() {
      if [[ -n "${child_pid}" ]] && kill -0 "${child_pid}" 2>/dev/null; then
        kill -TERM "${child_pid}" 2>/dev/null || true
        wait "${child_pid}" 2>/dev/null || true
      fi
    }
    trap stop_server EXIT TERM INT

    echo "Starting isolated Authentik ${expected_version} lifecycle"
    /lifecycle/ak server >"${log_file}" 2>&1 &
    child_pid=$!

    ready=false
    for _ in $(seq 1 180); do
      if grep -Eq \
        'IntegrityError|InconsistentMigrationHistory|FieldError|gunicorn failed to start' \
        "${log_file}"; then
        echo "ERROR: Authentik ${expected_version} reported a migration startup failure"
        exit 1
      fi
      if ! kill -0 "${child_pid}" 2>/dev/null; then
        echo "ERROR: Authentik ${expected_version} exited before readiness"
        exit 1
      fi
      if python3 -c 'from urllib.request import urlopen; urlopen("http://127.0.0.1:9000/-/health/ready/", timeout=2).read()' \
        >/dev/null 2>&1; then
        ready=true
        break
      fi
      sleep 2
    done
    if [[ "${ready}" != true ]]; then
      echo "ERROR: Authentik ${expected_version} did not become ready"
      exit 1
    fi

    if ! /lifecycle/ak migrate --check \
      >"${shared_dir}/migration-check-${expected_version}.log" 2>&1; then
      echo "ERROR: Authentik ${expected_version} reports pending migrations"
      exit 1
    fi
    echo "PASS: Authentik ${expected_version} is ready with no pending migrations"

  verify-upgrade.sh: |
    #!/usr/bin/env bash
    set -Eeuo pipefail

    readonly shared_dir=/work/shared
    readonly restore_role=$(<"${shared_dir}/restore-role")
    readonly expected_version=2026.5.6
    if [[ ! -s "${shared_dir}/repair-state" ]] \
      || [[ "$(<"${shared_dir}/repair-state")" != "YES|0|0" ]]; then
      echo "ERROR: reviewed isolated repair evidence is absent"
      exit 1
    fi
    readonly baseline_counts=$(<"${shared_dir}/baseline-counts")
    final_counts=$(psql --host=127.0.0.1 --port=5432 \
      --username="${restore_role}" --dbname=authentik \
      --tuples-only --no-align --field-separator='|' --set=ON_ERROR_STOP=1 \
      --command="
        SELECT
          (SELECT count(*) FROM authentik_core_user),
          (SELECT count(*) FROM authentik_core_group),
          (SELECT count(*) FROM authentik_core_application),
          (SELECT count(*) FROM authentik_core_provider),
          (SELECT count(*) FROM django_migrations);
      ")
    readonly final_counts
    IFS='|' read -r base_users base_groups base_apps base_providers base_migrations \
      <<<"${baseline_counts}"
    IFS='|' read -r final_users final_groups final_apps final_providers final_migrations \
      <<<"${final_counts}"
    if [[ "${base_users}|${base_groups}|${base_apps}|${base_providers}" \
      != "${final_users}|${final_groups}|${final_apps}|${final_providers}" ]]; then
      echo "ERROR: identity or provider object counts changed during rehearsal"
      exit 1
    fi
    if (( final_migrations < base_migrations )); then
      echo "ERROR: migration history regressed"
      exit 1
    fi

    latest_version=$(psql --host=127.0.0.1 --port=5432 \
      --username="${restore_role}" --dbname=authentik \
      --tuples-only --no-align --set=ON_ERROR_STOP=1 \
      --command="SELECT version FROM authentik_version_history ORDER BY timestamp DESC, id DESC LIMIT 1")
    readonly latest_version
    waiting_locks=$(psql --host=127.0.0.1 --port=5432 \
      --username="${restore_role}" --dbname=authentik \
      --tuples-only --no-align --set=ON_ERROR_STOP=1 \
      --command="SELECT count(*) FROM pg_locks WHERE NOT granted")
    readonly waiting_locks
    repaired_migrations=$(psql --host=127.0.0.1 --port=5432 \
      --username="${restore_role}" --dbname=authentik \
      --tuples-only --no-align --field-separator='|' --set=ON_ERROR_STOP=1 \
      --command="
        SELECT
          (SELECT count(*) FROM django_migrations
            WHERE app = 'authentik_core' AND name = '0056_user_roles'),
          (SELECT count(*) FROM django_migrations
            WHERE app = 'authentik_rbac'
              AND name = '0010_remove_role_group_alter_role_name'),
          (SELECT count(*) FROM information_schema.columns
            WHERE table_schema = 'public'
              AND table_name = 'authentik_rbac_role'
              AND column_name = 'group_id');
      ")
    readonly repaired_migrations
    if [[ "${latest_version}" != "${expected_version}" ]]; then
      echo "ERROR: final version history is not ${expected_version}"
      exit 1
    fi
    if [[ "${waiting_locks}" != 0 ]]; then
      echo "ERROR: final database has waiting locks"
      exit 1
    fi
    if [[ "${repaired_migrations}" != "1|1|0" ]]; then
      echo "ERROR: repaired migration sequence did not converge"
      exit 1
    fi

    printf 'PASS: isolated Authentik upgrade reached %s; users=%s, groups=%s, applications=%s, providers=%s, migrations=%s, waiting_locks=0\n' \
      "${expected_version}" "${final_users}" "${final_groups}" \
      "${final_apps}" "${final_providers}" "${final_migrations}"
