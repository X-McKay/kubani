apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: database
spec:
  schedule: "0 2 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            # Matched by the allow-postgres-backup-egress NetworkPolicy
            app.kubernetes.io/name: postgres-backup
        spec:
          restartPolicy: OnFailure
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: topology.kubani.io/site
                        operator: In
                        values:
                          - primary
                      - key: topology.kubani.io/role
                        operator: In
                        values:
                          - database
          securityContext:
            fsGroup: 1001
            runAsUser: 1001
            runAsGroup: 1001
            runAsNonRoot: true
          containers:
            - name: backup
              # Match the running postgres image so the layer is already cached
              # on the database-role node — no image pull on first run.
              image: docker.io/bitnami/postgresql:latest
              imagePullPolicy: IfNotPresent
              env:
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgresql-credentials
                      key: postgres-password
                - name: RETENTION
                  value: "3"
              command:
                - bash
                - -c
                - |
                  set -eo pipefail
                  TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)
                  BACKUP_FILE=/backups/postgres-${TIMESTAMP}.sql.gz
                  RETENTION=${RETENTION:-3}

                  echo "Starting pg_dumpall -> ${BACKUP_FILE}"
                  PGPASSWORD="$POSTGRES_PASSWORD" pg_dumpall \
                    -h postgresql.database.svc.cluster.local \
                    -U postgres \
                    --clean --if-exists \
                    | gzip -9 > "${BACKUP_FILE}"

                  if [ ! -s "${BACKUP_FILE}" ]; then
                    echo "ERROR: backup file is empty"
                    rm -f "${BACKUP_FILE}"
                    exit 1
                  fi

                  echo "Backup written: $(stat -c%s "${BACKUP_FILE}") bytes"
                  echo "Pruning to ${RETENTION} most recent backups"
                  ls -1t /backups/postgres-*.sql.gz 2>/dev/null \
                    | tail -n +$((RETENTION + 1)) \
                    | xargs -r rm -f

                  echo "Current backups on disk:"
                  ls -lh /backups/
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: postgres-backup
