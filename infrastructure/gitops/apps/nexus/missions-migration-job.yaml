---
# Nexus Missions Schema Migration Job
#
# This Kubernetes Job applies the schema_missions.sql migration to the
# PostgreSQL database, creating the nexus_missions and nexus_mission_runs
# tables required by the proactive agent loop.
#
# The migration is idempotent (uses CREATE TABLE IF NOT EXISTS).
# Run this job before deploying the updated nexus-orchestrator worker.
apiVersion: batch/v1
kind: Job
metadata:
  name: nexus-missions-migration
  namespace: nexus
  labels:
    app: nexus-migrations
    app.kubernetes.io/name: nexus-missions-migration
    app.kubernetes.io/part-of: kubani
  annotations:
    app.kubernetes.io/version: "1.0.0"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: nexus-migrations
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: registry.almckay.io/kubani-nexus-orchestrator:0.6.8-fix5
          imagePullPolicy: Always
          command:
            - python
            - -c
            - |
              import asyncio
              import os
              import asyncpg

              async def run_migration():
                  db_url = os.environ["NEXUS_DATABASE_URL"]
                  conn = await asyncpg.connect(db_url)
                  try:
                      import importlib.resources
                      sql_path = "/app/kubani/nexus/schema_missions.sql"
                      with open(sql_path) as f:
                          sql = f.read()
                      await conn.execute(sql)
                      print("Missions schema migration completed successfully.")
                  finally:
                      await conn.close()

              asyncio.run(run_migration())
          env:
            - name: NEXUS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nexus-config
                  key: nexus-database-url
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
