apiVersion: apps/v1
kind: Deployment
metadata:
  name: starbase-core
  namespace: starbase-system
spec:
  template:
    metadata:
      annotations:
        starbase.io/release: 0.1.0-rc.8
        starbase.io/source-revision: d688bec5f85795cbb6e16beaf92ef29247875f10
        starbase.io/activation-stage: phase9-governed-proposal-ui
    spec:
      containers:
        - name: core
          image: ghcr.io/x-mckay/starbase/core@sha256:97eb49b3c43ad3ffe3308ce510088e54270d7b3dfcc08e313ff0021eb34cff88
          env:
            - name: STARBASE_DOJO_URL
              value: https://starbase-dojo.starbase-execution.svc.cluster.local:8443
            - name: STARBASE_DOJO_READ_TOKEN
              valueFrom:
                secretKeyRef: {name: starbase-dojo-reader, key: read-token}
            - name: STARBASE_DOJO_CA_FILE
              value: /var/run/secrets/starbase.io/dojo/ca.crt
          volumeMounts:
            - name: dojo-ca
              mountPath: /var/run/secrets/starbase.io/dojo
              readOnly: true
        - name: web
          image: ghcr.io/x-mckay/starbase/web@sha256:9d2388029599ac045992ffe76fd40145c50e31419fa7d356158da6a04c49f568
      volumes:
        - name: dojo-ca
          configMap:
            name: starbase-dojo-ca
            items: [{key: ca.crt, path: ca.crt}]
            defaultMode: 292
---
