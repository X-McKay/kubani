apiVersion: apps/v1
kind: Deployment
metadata:
  name: starbase-core
  namespace: starbase-system
spec:
  template:
    metadata:
      annotations:
        starbase.io/release: 0.1.0-rc.10
        starbase.io/source-revision: 40bacc987ee45c0c65787c681340c89cafab0b8c
        starbase.io/activation-stage: phase9-governed-proposal-ui
    spec:
      containers:
        - name: core
          image: ghcr.io/x-mckay/starbase/core@sha256:e70596ab4514f64714307e223d4a2b2d74ebc535e56af5b6e7891c42ea4b9c4b
          env:
            - name: STARBASE_DOJO_URL
              value: https://starbase-dojo.starbase-execution.svc.cluster.local:8443
            - name: STARBASE_DOJO_READ_TOKEN
              valueFrom:
                secretKeyRef: {name: starbase-dojo-reader, key: read-token}
            - name: STARBASE_DOJO_CA_FILE
              value: /var/run/secrets/starbase.io/dojo/ca.crt
          volumeMounts:
            - name: dojo-ca
              mountPath: /var/run/secrets/starbase.io/dojo
              readOnly: true
        - name: web
          image: ghcr.io/x-mckay/starbase/web@sha256:6e237e10d23e4cce4b9aaf8bdd40f4ed6f9230d1275b8dbd5702a36b75bb40a0
      volumes:
        - name: dojo-ca
          configMap:
            name: starbase-dojo-ca
            items: [{key: ca.crt, path: ca.crt}]
            defaultMode: 292
---
