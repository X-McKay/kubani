apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-core-to-dojo-tls
  namespace: starbase-system
  labels: {app.kubernetes.io/part-of: starbase}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: starbase-core}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: starbase-execution}
          podSelector:
            matchLabels: {app.kubernetes.io/name: starbase-dojo-runtime}
      ports: [{protocol: TCP, port: 8443}]
