apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-config
  namespace: ai-agents
  labels:
    app.kubernetes.io/name: registry
    app.kubernetes.io/component: registry-service
    app.kubernetes.io/part-of: kubani
data:
  # Redis connection URL
  redis-url: "redis://redis.database.svc.cluster.local:6379"

  # Logging configuration
  log-level: "INFO"

  # Heartbeat configuration
  heartbeat-timeout-seconds: "90"
  heartbeat-check-interval: "30"

  # Health check configuration
  health-check-interval: "60"
  health-check-timeout: "10"
