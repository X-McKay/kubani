apiVersion: batch/v1
kind: Job
metadata:
  name: registry-db-init
  namespace: database
  labels:
    app.kubernetes.io/name: registry
    app.kubernetes.io/component: db-init
    app.kubernetes.io/part-of: kubani
  annotations:
    # Run this job before deploying the registry
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-init
          image: bitnami/postgresql:16
          command:
            - /bin/bash
            - -c
            - |
              set -e

              echo "Waiting for PostgreSQL to be ready..."
              until PGPASSWORD="$POSTGRES_PASSWORD" psql -h "$POSTGRES_HOST" -U "$POSTGRES_USER" -d postgres -c '\q' 2>/dev/null; do
                echo "PostgreSQL is unavailable - sleeping"
                sleep 2
              done

              echo "PostgreSQL is ready. Creating database if not exists..."

              # Create the kubani_registry database if it doesn't exist
              PGPASSWORD="$POSTGRES_PASSWORD" psql -h "$POSTGRES_HOST" -U "$POSTGRES_USER" -d postgres -tc \
                "SELECT 1 FROM pg_database WHERE datname = 'kubani_registry'" | grep -q 1 || \
              PGPASSWORD="$POSTGRES_PASSWORD" psql -h "$POSTGRES_HOST" -U "$POSTGRES_USER" -d postgres -c \
                "CREATE DATABASE kubani_registry OWNER $POSTGRES_USER"

              echo "Database initialization complete."
          env:
            - name: POSTGRES_HOST
              value: "postgresql.database.svc.cluster.local"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: postgres-password
