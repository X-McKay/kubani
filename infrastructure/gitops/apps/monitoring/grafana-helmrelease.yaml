---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 10m
  maxHistory: 3
  chart:
    spec:
      chart: grafana
      version: "8.5.2"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # See prometheus-helmrelease.yaml for why this and replicas: 1 below exist:
  # Flux needs the replica count in the rendered template to correct a
  # hand-scaled live object, and driftDetection is what makes it do so going
  # forward.
  driftDetection:
    mode: enabled
  values:
    # Admin credentials from secret (fallback)
    admin:
      existingSecret: grafana-credentials
      userKey: admin-user
      passwordKey: admin-password

    # Prior value: unset (chart default 1); pinned for driftDetection.
    replicas: 1

    # Platform node per the capacity ledger (roadmap 9.2). No topology label
    # covers "rig0 specifically" among the three general-usage-class nodes
    # (rig0, strix, asio all carry topology.kubani.io/usage-class: general),
    # so this pins the hostname directly rather than the topology label.
    nodeSelector:
      kubernetes.io/hostname: rig0

    # Persistence
    persistence:
      enabled: true
      size: 5Gi

    # Resources
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    # Grafana configuration
    grafana.ini:
      server:
        root_url: https://grafana.almckay.io
      # Authentik OAuth2/OIDC configuration (per https://integrations.goauthentik.io/monitoring/grafana/)
      auth.generic_oauth:
        enabled: true
        name: authentik
        allow_sign_up: true
        client_id: ${GF_AUTH_GENERIC_OAUTH_CLIENT_ID}
        client_secret: ${GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
        scopes: openid email profile
        auth_url: https://auth.almckay.io/application/o/authorize/
        token_url: https://auth.almckay.io/application/o/token/
        api_url: https://auth.almckay.io/application/o/userinfo/
        # Role mapping from Authentik groups
        role_attribute_path: contains(groups, 'Grafana Admins') && 'Admin' || contains(groups, 'Grafana Editors') && 'Editor' || 'Viewer'
      auth:
        signout_redirect_url: https://auth.almckay.io/application/o/grafana/end-session/
        oauth_auto_login: false
        disable_login_form: false
      # Auto-assign users to default org
      users:
        auto_assign_org: true
        auto_assign_org_id: 1

    # OAuth credentials from secret
    envFromSecrets:
      - name: grafana-oauth-credentials

    # Preconfigure datasources
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            url: http://prometheus-server.monitoring.svc.cluster.local
            access: proxy
            isDefault: true
          - name: Loki
            type: loki
            url: http://loki:3100
            access: proxy
            jsonData:
              maxLines: 1000

    # Preconfigure useful dashboards
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: 'default'
            orgId: 1
            folder: ''
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/default

    dashboards:
      default:
        # Kubernetes cluster monitoring (updated to modern dashboard)
        kubernetes-cluster:
          gnetId: 7249
          revision: 1
          datasource: Prometheus
        # Node exporter dashboard
        node-exporter:
          gnetId: 1860
          revision: 37
          datasource: Prometheus
        # Kubernetes pods dashboard (updated to modern version)
        kubernetes-pods:
          gnetId: 15760
          revision: 31
          datasource: Prometheus
        # Kubernetes deployments/statefulsets/daemonsets
        kubernetes-workloads:
          gnetId: 8588
          revision: 1
          datasource: Prometheus
        # vLLM metrics dashboard
        vllm:
          gnetId: 23991
          revision: 1
          datasource: Prometheus
        # Loki logs dashboard
        loki-kubernetes-logs:
          gnetId: 15141
          revision: 1
          datasource: Loki
        # Loki quick search dashboard
        loki-quick-search:
          gnetId: 12019
          revision: 2
          datasource: Loki
        # loki-promtail (gnetId 10880) removed: Promtail is retired (EOL,
        # roadmap 0.1) in favor of Grafana Alloy. Alloy does not have an
        # equivalent dashboard published to grafana.com with a gnetId — its
        # dashboards ship as a "mixin" of rendered JSON files in the
        # grafana/alloy repo (operations/alloy-mixin/rendered/dashboards/),
        # not as an importable numbered ID. Vendoring that JSON as a
        # ConfigMap is future work; see the task report for detail.
        # Longhorn storage dashboard
        longhorn:
          gnetId: 13032
          revision: 6
          datasource: Prometheus
        # Alertmanager dashboard
        alertmanager:
          gnetId: 9578
          revision: 4
          datasource: Prometheus
        # NVIDIA DCGM GPU metrics dashboard
        nvidia-dcgm:
          gnetId: 12239
          revision: 2
          datasource: Prometheus
        # Traefik ingress dashboard
        traefik:
          gnetId: 17346
          revision: 9
          datasource: Prometheus
        # PostgreSQL database metrics
        postgresql:
          gnetId: 9628
          revision: 7
          datasource: Prometheus
        # Redis cache metrics
        redis:
          gnetId: 11835
          revision: 1
          datasource: Prometheus
        # Flux CD GitOps cluster stats
        flux-cluster:
          gnetId: 16714
          revision: 1
          datasource: Prometheus
        # Flux CD control plane
        flux-control-plane:
          gnetId: 16715
          revision: 1
          datasource: Prometheus

    # Service configuration
    service:
      type: ClusterIP
      port: 80
