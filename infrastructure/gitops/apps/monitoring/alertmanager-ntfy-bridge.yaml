---
# Bridges Alertmanager's webhook_configs receiver (see alertmanager.config
# in prometheus-helmrelease.yaml) to ntfy topics. alexbakker/alertmanager-ntfy
# is a small, maintained Go service built for exactly this
# (https://github.com/alexbakker/alertmanager-ntfy); no credentials in
# either direction (ntfy is unauthenticated, this bridge's own HTTP
# listener is reached only from Alertmanager in-namespace), so no Secret.
# The bridge config lives in the alertmanager-ntfy-config Secret
# (SOPS, monitoring-alertmanager-ntfy-config.enc.yaml): it carries the ntfy
# publish token for the alertmanager user. Prior: a ConfigMap in this file.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager-ntfy
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager-ntfy
  annotations:
    # The bridge reads its ConfigMap once at start; without this a config
    # fix stays unapplied until something else restarts the pod (seen
    # 2026-10-01: the per-alert template fix sat idle behind a running pod).
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager-ntfy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager-ntfy
    spec:
      # Platform node per roadmap 9.1.5 (everything new lands on rig0 unless
      # it must run per-node). Not separately itemized in the 9.2 ledger
      # table; flagged in the task report.
      nodeSelector:
        kubernetes.io/hostname: rig0
      # Containerfile is FROM scratch with no USER directive (defaults to
      # root in the image); forced non-root here instead. Verify on first
      # rollout that the scratch binary has no other assumption about uid 0.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alertmanager-ntfy
          image: ghcr.io/alexbakker/alertmanager-ntfy:1.2.1
          args:
            - --configs
            - /etc/alertmanager-ntfy/config.yml
          ports:
            - containerPort: 8000
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager-ntfy
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: config
          secret:
            secretName: alertmanager-ntfy-config  # pragma: allowlist secret
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-ntfy
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager-ntfy
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: alertmanager-ntfy
