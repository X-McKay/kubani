# yamllint disable rule:line-length
# Agent Runtime Platform: the one alert that is a Loki query, not a metric
# (spec 13.6 "token in logs", severity 1). Staged: the line in
# kustomization.yaml is commented out because the Loki ruler is not enabled
# in loki-helmrelease.yaml today. The Prometheus rules (spec 13.8) live in
# prometheus-helmrelease.yaml, serverFiles.alerting_rules.yml, group
# agent-platform, which the chart loads without any extra mount.
---
apiVersion: v1
kind: ConfigMap
metadata:
  agent-platform-loki.rules.yml: |
    groups:
      - name: agent-platform-redaction
        rules:
          - alert: AgentPlatformTokenInLogs
            # Spec 13.6 redaction patterns: a JWT or a long bearer value in
            # any platform log line is a severity-1 incident.
            expr: |
              sum by (namespace) (count_over_time({namespace=~"agent-platform|ai-gateway|auth|mcp|tenant-.*"} |~ "eyJ[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}|Bearer [A-Za-z0-9._~+/=-]{20,}" [5m])) > 0
            labels:
              severity: critical
              spec_severity: "1"
            annotations:
              summary: "Token-shaped value in {{ $labels.namespace }} logs; treat as a credential leak"
