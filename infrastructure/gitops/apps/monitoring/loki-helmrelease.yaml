---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: loki
      version: "6.23.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    deploymentMode: SingleBinary

    singleBinary:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1
          memory: 1Gi
      persistence:
        enabled: true
        size: 10Gi
        storageClass: longhorn
      terminationGracePeriodSeconds: 90
      extraArgs:
        - -server.graceful-shutdown-timeout=60s
      readinessProbe:
        initialDelaySeconds: 45
        timeoutSeconds: 5
        periodSeconds: 10
        failureThreshold: 6

    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      memberlist:
        join_members: []
      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      storage:
        type: filesystem
      ingester:
        chunk_encoding: snappy
      query_scheduler:
        max_outstanding_requests_per_tenant: 32768
      # structuredConfig overrides chart defaults that include deprecated fields
      structuredConfig:
        limits_config:
          reject_old_samples: true
          reject_old_samples_max_age: 168h
          max_cache_freshness_per_query: 10m
          split_queries_by_interval: 15m
          ingestion_rate_mb: 16
          ingestion_burst_size_mb: 32
          per_stream_rate_limit: 5MB
          per_stream_rate_limit_burst: 15MB
          volume_enabled: true
          query_timeout: 300s

    # Disable everything not needed in single binary mode
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    gateway:
      enabled: false
    test:
      enabled: false
    lokiCanary:
      enabled: false
    minio:
      enabled: false
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    monitoring:
      selfMonitoring:
        enabled: false
        grafanaAgent:
          installOperator: false

    # Required for single-node bootstrap
    # See: https://github.com/grafana/loki/issues/7907
    memberlist:
      service:
        publishNotReadyAddresses: true
