apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ai-internal
  namespace: ai-gateway
spec:
  parentRefs:
    - name: ai
  hostnames:
    - ai.ai-gateway.svc.cluster.local
  rules:
