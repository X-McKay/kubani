# Stage 2.6 (traces need Tempo, which does not exist yet — see roadmap
# Phase 2.6). Uncomment in kustomization.yaml only once Tempo and the Alloy
# OTLP receiver are live in `monitoring/`.
#
# Prometheus metrics need NO policy: the data-plane proxy exposes
# Prometheus-format metrics on port 15020 (pod annotations
# prometheus.io/scrape=true, prometheus.io/port=15020 are set by the
# deployer) and the control plane on 9092. The `agentgateway` scrape job in
# apps/monitoring/prometheus-helmrelease.yaml discovers both through
# kubernetes_sd, and netpol-ai-gateway.yaml admits Prometheus on those ports.
#
# Tracing shape verified against the AgentgatewayPolicy CRD in the
# agentgateway-crds v1.5.0 chart: spec.frontend.tracing has `url` (opaque
# OTLP endpoint; https enables backend TLS), `protocol` (GRPC | HTTP, default
# GRPC), `path` (HTTP only), `randomSampling` / `clientSampling` (CEL
# expressions evaluating to a float 0..1 or a boolean), `filter`,
# `attributes`, `resources`. LLM spans carry the OpenTelemetry GenAI
# semantic-convention attributes by default; no toggle exists.
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: ai-gateway-tracing
  namespace: ai-gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ai
  frontend:
    tracing:
      url: http://alloy.monitoring.svc.cluster.local:4317
      protocol: GRPC
      # Traffic is a few requests per second at this stage (roadmap 9.2
      # sizing note for Tempo): sample every request rather than a ratio.
      randomSampling: "true"
