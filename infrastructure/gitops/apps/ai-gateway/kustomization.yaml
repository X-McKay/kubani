# NOT WIRED INTO FLUX. See README.md.
#
# This kustomization is not referenced by apps/kustomization.yaml, so nothing
# below reaches the cluster regardless of what is commented in or out here.
# The comments still follow the stage convention the maintainer will use once
# that top-level reference is added: uncomment one stage's lines, validate,
# commit, watch the soak/gate from roadmap section 9.4, then move to the next
# stage.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # stage 2.1
  - namespace.yaml
  - helmrelease.yaml
  - gateway.yaml
  - netpol-ai-gateway.yaml
  - netpol-vllm-from-gateway.yaml

  # stage 2.1b (after the CRDs chart is Ready)
  - parameters.yaml

  # stage 2.2
  - models.yaml

  # stage 2.3
  - ingress.yaml

  # stage 2.5 prerequisite: certificates for the hostnames that move here
  - certificates.yaml

  # stage 2.5 cutover: the legacy hostnames front the gateway
  - ingress-legacy-hosts.yaml

  # stage 2.6
  - policy-observability.yaml

  # MCP M1 (plan 2026-10-17): mcp.almckay.io host
  - ingress-mcp.yaml

  # MCP M2: Kubernetes MCP backend, route and auth policy
  - mcp-kubernetes.yaml

  # MCP M3: Graphiti MCP backend, route and auth policy
  - mcp-graphiti.yaml

  # MCP M4: Postgres MCP backend, route and auth policy
  - mcp-postgres.yaml

  # MCP M5: GitHub MCP backend (PAT injected), route and auth policy
  - github-mcp-pat.enc.yaml
  - mcp-github.yaml
