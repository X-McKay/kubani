# Stage 2.1.
#
# No GatewayClass manifest here: the agentgateway controller creates the
# `agentgateway` GatewayClass at runtime (chart value `gatewayClassName`
# empty = built-in default, controllerName agentgateway.dev/agentgateway).
# It is not in the chart's templates, so `helm template` will not show it.
#
# Data-plane naming, verified against the controller's embedded proxy chart
# (controller/pkg/helm/agentgateway/templates in agentgateway v1.5.0): the
# proxy Deployment and Service are both named after the Gateway, so this
# Gateway yields Service `ai` in namespace `ai-gateway` (used by
# ingress.yaml). Proxy pods carry the labels
#   app.kubernetes.io/name: ai
#   gateway.networking.k8s.io/gateway-name: ai
#   gateway.networking.k8s.io/gateway-class-name: agentgateway
# and the annotations prometheus.io/scrape=true, prometheus.io/port=15020.
# The proxy container is named `agentgateway` and already runs as uid 10101
# with runAsNonRoot and readOnlyRootFilesystem set by the deployer.
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ai
  namespace: ai-gateway
spec:
  gatewayClassName: agentgateway
  listeners:
    # Plain HTTP only. TLS termination stays on Traefik (roadmap 2.0 decision:
    # agentgateway is reached over plain HTTP inside the cluster, behind the
    # existing Ingress -> Traefik -> cert-manager path).
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
  # Per-Gateway data-plane customisation. The standard Gateway API extension
  # point; agentgateway resolves group agentgateway.dev / kind
  # AgentgatewayParameters in the Gateway's namespace.
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: ai-data-plane
---
# Shape verified against the AgentgatewayParameters CRD in the
# agentgateway-crds v1.5.0 chart: typed fields are `resources`, `image`,
# `env`, `logging`, `workload`, `service`, `deployment`, ...; anything
# else (nodeSelector, pod securityContext) is a strategic-merge overlay
# under `deployment.spec`, applied after the deployer's own template.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: ai-data-plane
  namespace: ai-gateway
spec:
  # Roadmap 9.2 ledger: data plane 100m/1 CPU, 128Mi/512Mi.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  deployment:
    spec:
      template:
        spec:
          # Platform node only (topology.kubani.io/usage-class covers three
          # nodes, so the hostname is pinned, as for the control plane).
          nodeSelector:
            kubernetes.io/hostname: rig0
          # The deployer sets the container securityContext (non-root uid
          # 10101, read-only root, no privilege escalation) and a pod-level
          # sysctl for port 80; this only adds the seccomp profile PSA
          # restricted asks for.
          securityContext:
            seccompProfile:
              type: RuntimeDefault
