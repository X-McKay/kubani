---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: news-monitor
  namespace: ai-agents
  labels:
    app.kubernetes.io/name: news-monitor
    app.kubernetes.io/component: ai-agent
  annotations:
    # Auto-restart pod when model-config ConfigMap changes
    configmap.reloader.stakater.com/reload: "model-config"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: news-monitor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: news-monitor
        app.kubernetes.io/component: ai-agent
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      # Note: initContainers removed - syndicate handles scheduling internally
      containers:
        - name: worker
          image: registry.almckay.io/news-monitor:0.4.1
          imagePullPolicy: Always
          # Entry point set in Docker image: news-digest-worker
          envFrom:
            - configMapRef:
                name: model-config
          env:
            - name: TEMPORAL_HOST
              value: "temporal-frontend.temporal.svc.cluster.local:7233"
            - name: TEMPORAL_NAMESPACE
              value: "default"
            - name: VLLM_API_URL
              value: "http://llm-api.vllm.svc.cluster.local:8000/v1"
            - name: VLLM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: model-config
                  key: LLM_MODEL_NAME
            - name: EMBEDDINGS_API_URL
              value: "http://embeddings-api.vllm.svc.cluster.local:8000/v1"
            - name: EMBEDDINGS_MODEL
              valueFrom:
                configMapKeyRef:
                  name: model-config
                  key: EMBEDDINGS_MODEL_NAME
            # Discord MCP server for notifications (internal cluster service)
            - name: DISCORD_MCP_URL
              value: "http://discord-mcp-server.ai-agents.svc:8080/mcp"
            - name: DISCORD_CHANNEL
              value: "ai-news"
            # Memory system configuration (Qdrant + Neo4j graph memory)
            # Qdrant for vector similarity search
            - name: QDRANT_HOST
              value: "qdrant.database.svc.cluster.local"
            - name: QDRANT_PORT
              value: "6333"
            - name: QDRANT_COLLECTION
              value: "news-monitor"
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: news-monitor-memory-credentials
                  key: qdrant-api-key
            # Neo4j for graph-based entity/relationship tracking
            - name: NEO4J_URI
              value: "bolt://neo4j.database.svc.cluster.local:7687"
            - name: NEO4J_USER
              value: "neo4j"
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: news-monitor-memory-credentials
                  key: neo4j-password
            # Redis for fast URL deduplication
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: news-monitor-memory-credentials
                  key: redis-host
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: news-monitor-memory-credentials
                  key: redis-password
            # Federated agents configuration (NewsExplorer)
            - name: ENABLE_FEDERATED_AGENTS
              value: "true"
            - name: EXPLORER_CYCLE_HOURS
              value: "24"
            # Registry integration for agent metadata
            - name: KUBANI_REGISTRY_URL
              value: "http://metadata-registry.ai-agents.svc:8000"
            - name: KUBANI_REGISTRY_ENABLED
              value: "true"
            - name: AGENT_VERSION
              value: "0.4.1"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            exec:
              command:
                - python3
                - -c
                - "import sys; sys.exit(0)"
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - python3
                - -c
                - "import sys; sys.exit(0)"
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
      restartPolicy: Always
