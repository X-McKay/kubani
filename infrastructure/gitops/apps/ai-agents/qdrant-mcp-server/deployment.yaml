---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant-mcp-server
  namespace: ai-agents
  labels:
    app.kubernetes.io/name: qdrant-mcp-server
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: kubani
    mcp.kubani.io/server: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: qdrant-mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qdrant-mcp-server
        app.kubernetes.io/component: mcp-server
        mcp.kubani.io/server: "true"
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: mcp-server
          image: registry.almckay.io/qdrant-mcp-server:0.1.1
          imagePullPolicy: Always
          args:
            - --mode
            - sse
            - --port
            - "8082"
          ports:
            - name: http
              containerPort: 8082
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: MCP_SERVER_ID
              value: "qdrant-mcp"
            - name: REGISTRY_URL
              value: "http://registry.ai-agents.svc:8000"
            - name: QDRANT_HOST
              value: "qdrant.database.svc.cluster.local"
            - name: QDRANT_PORT
              value: "6333"
            - name: QDRANT_GRPC_PORT
              value: "6334"
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: qdrant-mcp-server-secrets
                  key: QDRANT_API_KEY
                  optional: true
            - name: MCP_TRANSPORT
              value: "sse"
            - name: MCP_PORT
              value: "8082"
            - name: MCP_ALLOWED_HOSTS
              value: "qdrant-mcp.almckay.io,qdrant-mcp.almckay.io:*,localhost,localhost:*,127.0.0.1,127.0.0.1:*,10.*,10.*:*,100.*,100.*:*,*.ai-agents.svc,*.ai-agents.svc:*"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
      restartPolicy: Always
