---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-test-agent
  namespace: ai-agents-test
  labels:
    app.kubernetes.io/name: gateway-test-agent
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: kubani
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-test-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-test-agent
        app.kubernetes.io/component: agent
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: agent
          image: registry.almckay.io/kubani-agent:latest
          imagePullPolicy: Always
          command:
            - python
            - -m
            - kubani.cli.testing
            - --config
            - /etc/kubani/gateway-test.yaml
            - --test-gateway
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/kubani
              readOnly: true
          env:
            - name: KUBANI_CONFIG
              value: /etc/kubani/gateway-test.yaml
            - name: KUBANI_ENVIRONMENT
              value: gateway-test
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: gateway-test-config
      restartPolicy: Always
