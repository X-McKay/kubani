---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discord-mcp-server
  namespace: ai-agents
  labels:
    app.kubernetes.io/name: discord-mcp-server
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: kubani
    mcp.kubani.io/server: "true"
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: discord-mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: discord-mcp-server
        app.kubernetes.io/component: mcp-server
        mcp.kubani.io/server: "true"
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: mcp-server
          image: registry.almckay.io/discord-mcp-server:0.4.5
          imagePullPolicy: Always
          args:
            - --mode
            - sse
            - --port
            - "8080"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: MCP_SERVER_ID
              value: "discord-mcp"
            - name: REGISTRY_URL
              value: "http://registry.ai-agents.svc:8000"
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: discord-mcp-server-secrets
                  key: DISCORD_BOT_TOKEN
            - name: DISCORD_GUILD_ID
              valueFrom:
                secretKeyRef:
                  name: discord-mcp-server-secrets
                  key: DISCORD_GUILD_ID
            - name: MCP_ALLOWED_HOSTS
              # Allow: external domain, localhost, k8s pod network (10.42.x.x), tailscale (100.x.x.x), k8s service DNS
              value: "discord-mcp.almckay.io,discord-mcp.almckay.io:*,localhost,localhost:*,127.0.0.1,127.0.0.1:*,10.*,10.*:*,100.*,100.*:*,*.almckay.io,*.almckay.io:*,discord-mcp-server.ai-agents.svc,discord-mcp-server.ai-agents.svc:*,discord-mcp-server.ai-agents.svc.cluster.local,discord-mcp-server.ai-agents.svc.cluster.local:*,*.svc,*.svc:*,*.svc.cluster.local,*.svc.cluster.local:*"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
      restartPolicy: Always
