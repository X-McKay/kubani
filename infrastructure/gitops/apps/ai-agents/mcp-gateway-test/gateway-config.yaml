---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-gateway-config
  namespace: ai-agents-test
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/component: gateway
data:
  gateway.yaml: |
    # MCP Gateway Configuration
    # This configures the gateway to proxy requests to upstream MCP servers
    
    servers:
      # Discord MCP Server
      - id: discord-mcp
        name: Discord MCP Server
        description: Bidirectional Discord integration
        transport: sse
        url: http://discord-mcp-server.ai-agents.svc:8080/sse
        health_check: http://discord-mcp-server.ai-agents.svc:8080/health
        
      # Memory MCP Server
      - id: memory-mcp
        name: Memory MCP Server
        description: Agent memory and knowledge management
        transport: sse
        url: http://memory-mcp-server.ai-agents.svc:8080/sse
        health_check: http://memory-mcp-server.ai-agents.svc:8080/health
        
      # Skills MCP Server
      - id: skills-mcp
        name: Skills MCP Server
        description: Dynamic skill discovery and execution
        transport: sse
        url: http://skills-mcp-server.ai-agents.svc:8080/sse
        health_check: http://skills-mcp-server.ai-agents.svc:8080/health
        
      # Temporal MCP Server
      - id: temporal-mcp
        name: Temporal MCP Server
        description: Workflow orchestration
        transport: sse
        url: http://temporal-mcp-server.ai-agents.svc:8080/sse
        health_check: http://temporal-mcp-server.ai-agents.svc:8080/health
        
      # Qdrant MCP Server
      - id: qdrant-mcp
        name: Qdrant MCP Server
        description: Vector database operations
        transport: sse
        url: http://qdrant-mcp-server.ai-agents.svc:8080/sse
        health_check: http://qdrant-mcp-server.ai-agents.svc:8080/health
    
    # Gateway settings
    gateway:
      port: 8080
      metrics_port: 9090
      health_check_interval: 30s
      request_timeout: 60s
      
    # Observability settings
    observability:
      metrics:
        enabled: true
        port: 9090
      tracing:
        enabled: true
        endpoint: http://jaeger-collector.monitoring.svc:14268/api/traces
      logging:
        level: info
        format: json
