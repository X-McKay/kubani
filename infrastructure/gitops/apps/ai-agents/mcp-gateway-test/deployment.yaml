---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-gateway
  namespace: ai-agents-test
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: kubani
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-gateway
        app.kubernetes.io/component: gateway
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: gateway
          # Using the official mcp-gateway image from Microsoft
          # Note: This may need to be adjusted based on actual availability
          image: ghcr.io/microsoft/mcp-gateway:latest
          imagePullPolicy: Always
          args:
            - --config
            - /etc/mcp-gateway/gateway.yaml
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/mcp-gateway
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: mcp-gateway-config
      restartPolicy: Always
