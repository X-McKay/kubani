---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-mcp-executor
  namespace: ai-agents
  labels:
    app.kubernetes.io/name: kubernetes-mcp-executor
    app.kubernetes.io/component: mcp-server
spec:
  replicas: 0 # OPTIONAL: set replicas > 0 to enable
  selector:
    matchLabels:
      app.kubernetes.io/name: kubernetes-mcp-executor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubernetes-mcp-executor
        app.kubernetes.io/component: mcp-server
    spec:
      serviceAccountName: kubernetes-mcp-executor
      containers:
        - name: mcp-server
          image: quay.io/containers/kubernetes_mcp_server:latest
          imagePullPolicy: Always
          args:
            - --port
            - "8080"
            # NOTE: No --disable-destructive flag - this instance has write permissions
            # Access should only be granted after human approval
            - --log-level
            - "2"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: MCP_SERVER_NAME
              value: "kubernetes-mcp-executor"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      restartPolicy: Always
