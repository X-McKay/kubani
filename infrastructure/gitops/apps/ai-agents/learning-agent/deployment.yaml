---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: learning-agent
  namespace: ai-agents
  labels:
    app.kubernetes.io/name: learning-agent
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: kubani
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: learning-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: learning-agent
        app.kubernetes.io/component: agent
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      serviceAccountName: learning-agent
      containers:
        - name: agent
          image: registry.almckay.io/learning-agent:0.1.7
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            # Environment
            - name: KUBANI_ENVIRONMENT
              value: "production"
            - name: KUBANI_AGENT_NAME
              value: "learning-agent"
            - name: KUBANI_LOG_LEVEL
              value: "INFO"
            # Temporal (direct SDK connection)
            - name: TEMPORAL_HOST
              value: "temporal-frontend.temporal.svc.cluster.local:7233"
            - name: TEMPORAL_NAMESPACE
              value: "default"
            # MCP Servers
            - name: MCP_QDRANT_URL
              value: "http://qdrant-mcp.ai-agents.svc:8082"
            - name: MCP_MEMORY_URL
              value: "http://memory-mcp.ai-agents.svc:8083"
            - name: MCP_DISCORD_URL
              value: "http://discord-mcp-server.ai-agents.svc:8080"
            # DISCORD_MCP_URL is used by core_agents.integrations.discord_mcp
            - name: DISCORD_MCP_URL
              value: "http://discord-mcp-server.ai-agents.svc:8080"
            - name: MCP_REGISTRY_URL
              value: "http://metadata-registry.ai-agents.svc:8000"
            # LLM
            - name: LLM_API_URL
              value: "http://llm-api.vllm.svc.cluster.local:8000/v1"
            - name: LLM_MODEL
              value: "nvidia/Qwen3-14B-FP4"
            # Embeddings
            - name: EMBEDDINGS_API_URL
              value: "http://embeddings.ai-agents.svc:8080/v1"
            # Qdrant
            - name: QDRANT_HOST
              value: "qdrant.ai-agents.svc"
            - name: QDRANT_PORT
              value: "6333"
            # Neo4j
            - name: NEO4J_URI
              value: "bolt://neo4j.ai-agents.svc:7687"
            - name: NEO4J_USER
              value: "neo4j"
            - name: NEO4J_PASSWORD
              value: ""
            # Learning configuration
            - name: LEARNING_ENABLED
              value: "true"
            - name: LEARNING_CRITIC_ENABLED
              value: "true"
            - name: LEARNING_REFLECTION_ENABLED
              value: "true"
            - name: LEARNING_SYNTHESIZER_ENABLED
              value: "true"
            - name: LEARNING_REQUIRE_DISCORD_APPROVAL
              value: "true"
            # Passive monitoring configuration
            - name: LEARNING_PASSIVE_MONITORING_ENABLED
              value: "true"
            - name: LEARNING_WORKFLOW_POLL_INTERVAL
              value: "60"
            - name: LEARNING_DISCORD_POLL_INTERVAL
              value: "300"
            - name: LEARNING_EVENT_SUBSCRIPTION_ENABLED
              value: "true"
            # Redis for event subscription
            - name: REDIS_URL
              value: "redis://redis-master.cache.svc.cluster.local:6379"
            # Discord channels (channel names, not IDs)
            - name: DISCORD_LEARNING_CHANNEL
              value: "kubani-learning"
            - name: DISCORD_APPROVALS_CHANNEL
              value: "kubani-approvals"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
      restartPolicy: Always
