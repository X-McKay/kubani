---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: learning-agent
  namespace: ai-agents
  labels:
    app.kubernetes.io/name: learning-agent
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: kubani
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: learning-agent
  labels:
    app.kubernetes.io/name: learning-agent
    app.kubernetes.io/part-of: kubani
rules:
  # Read access to pods and deployments for monitoring agent activity
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  # Read access to configmaps for skill configurations
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: learning-agent
  labels:
    app.kubernetes.io/name: learning-agent
    app.kubernetes.io/part-of: kubani
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: learning-agent
subjects:
  - kind: ServiceAccount
    name: learning-agent
    namespace: ai-agents
