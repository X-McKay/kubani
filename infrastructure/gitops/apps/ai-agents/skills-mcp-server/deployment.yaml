---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skills-mcp-server
  namespace: ai-agents
  labels:
    app.kubernetes.io/name: skills-mcp-server
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: kubani
    app.kubernetes.io/managed-by: flux
    mcp.kubani.io/server: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: skills-mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skills-mcp-server
        app.kubernetes.io/component: mcp-server
        mcp.kubani.io/server: "true"
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: mcp-server
          image: registry.almckay.io/skills-mcp-server:0.1.0
          imagePullPolicy: Always
          args:
            - --mode
            - sse
            - --port
            - "8085"
          ports:
            - name: http
              containerPort: 8085
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: MCP_SERVER_ID
              value: "skills-mcp"
            - name: REGISTRY_URL
              value: "http://registry.ai-agents.svc:8000"
            - name: SKILLS_PATH
              value: /app/kubani/skills
            - name: MICROSANDBOX_ENABLED
              value: "false"
            - name: MCP_ALLOWED_HOSTS
              # Allow: external domain, localhost, k8s pod network (10.42.x.x), tailscale (100.x.x.x), k8s service DNS
              value: "skills-mcp.almckay.io,skills-mcp.almckay.io:*,localhost,localhost:*,127.0.0.1,127.0.0.1:*,10.*,10.*:*,100.*,100.*:*,*.almckay.io,*.almckay.io:*,skills-mcp-server.ai-agents.svc,skills-mcp-server.ai-agents.svc:*,skills-mcp-server.ai-agents.svc.cluster.local,skills-mcp-server.ai-agents.svc.cluster.local:*,*.svc,*.svc:*,*.svc.cluster.local,*.svc.cluster.local:*"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
      restartPolicy: Always
