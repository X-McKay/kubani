---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-agents

resources:
  - rbac.yaml
  - secret.enc.yaml
  - qdrant-secret.enc.yaml
  - model-config.yaml
  - deployment.yaml
  # schedule-job.yaml removed - the deployment's initContainer now handles
  # starting the scheduled workflow. The "schedule-remediation" command was
  # removed in favor of federated agents (Sentinel, Healer, Explorer).
