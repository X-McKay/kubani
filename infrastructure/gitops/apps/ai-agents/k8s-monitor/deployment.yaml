---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-monitor
  namespace: ai-agents
  labels:
    app.kubernetes.io/name: k8s-monitor
    app.kubernetes.io/component: ai-agent
  annotations: {}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-monitor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-monitor
        app.kubernetes.io/component: ai-agent
    spec:
      serviceAccountName: k8s-monitor
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: worker
          image: registry.almckay.io/k8s-monitor:1.0.0-7a7dee9
          imagePullPolicy: Always
          env:
            # Temporal
            - name: TEMPORAL_HOST
              value: "temporal-frontend.temporal.svc.cluster.local:7233"
            - name: TEMPORAL_NAMESPACE
              value: "k8s-monitor"
            # LLM
            - name: LLM_API_URL
              value: "http://llm-api.vllm.svc.cluster.local:8000/v1"
            - name: LLM_MODEL
              value: "Qwen3.5-9B-NVFP4"
            # K8s MCP server (shared service)
            - name: KUBERNETES_MCP_SERVER_URL
              value: "http://kubernetes-mcp-server.ai-agents.svc.cluster.local:8080"
            # Discord
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: k8s-monitor-secrets
                  key: discord-webhook-url
            - name: DISCORD_CHANNEL
              value: "kubani-alerts"
            # Redis (for event bus + publish_activity)
            - name: REDIS_URL
              value: "redis://redis-master.cache.svc.cluster.local:6379"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "from kubani.syndicates.k8s_monitor.workflows import K8sMonitorWorkflow; print('ok')"
            initialDelaySeconds: 30
            periodSeconds: 60
      restartPolicy: Always
