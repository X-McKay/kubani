---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-monitor
  namespace: ai-agents
  labels:
    app.kubernetes.io/name: k8s-monitor
    app.kubernetes.io/component: ai-agent
  annotations: {}
spec:
  replicas: 0 # OPTIONAL: set replicas > 0 to enable
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-monitor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-monitor
        app.kubernetes.io/component: ai-agent
    spec:
      serviceAccountName: k8s-monitor
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: worker
          image: registry.almckay.io/k8s-monitor:1.0.2-330861c
          imagePullPolicy: Always
          env:
            # Temporal (read directly by worker, not via config system)
            - name: TEMPORAL_HOST
              value: "temporal-frontend.temporal.svc.cluster.local:7233"
            - name: TEMPORAL_NAMESPACE
              value: "k8s-monitor"
            # Discord
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: k8s-monitor-secrets
                  key: discord-webhook-url
            - name: DISCORD_CHANNEL
              value: "kubani-alerts"
            # Redis (for event bus + publish_activity)
            - name: REDIS_HOST
              value: "redis-master.cache.svc.cluster.local"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: k8s-monitor-secrets
                  key: redis-password
            - name: REDIS_URL
              value: "redis://redis-master.cache.svc.cluster.local:6379"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            exec:
              command:
                - /app/.venv/bin/python
                - -c
                - "from kubani.syndicates.k8s_monitor.workflows import K8sMonitorWorkflow; print('ok')"
            initialDelaySeconds: 30
            periodSeconds: 60
      restartPolicy: Always
