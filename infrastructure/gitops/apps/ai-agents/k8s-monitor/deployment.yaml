---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-monitor
  namespace: ai-agents
  labels:
    app.kubernetes.io/name: k8s-monitor
    app.kubernetes.io/component: ai-agent
  annotations:
    configmap.reloader.stakater.com/reload: "model-config"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-monitor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-monitor
        app.kubernetes.io/component: ai-agent
    spec:
      serviceAccountName: k8s-monitor
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        # Kubernetes MCP Server sidecar
        - name: mcp-server
          image: quay.io/containers/kubernetes_mcp_server:latest
          args:
            - "--port=8080"
            - "--log-level=2"
          ports:
            - containerPort: 8080
              name: mcp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30

        # K8s Monitor worker
        - name: worker
          image: registry.almckay.io/k8s-monitor:1.0.0
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: model-config
          env:
            # Temporal
            - name: TEMPORAL_HOST
              value: "temporal-frontend.temporal.svc.cluster.local:7233"
            - name: TEMPORAL_NAMESPACE
              value: "k8s-monitor"
            # LLM
            - name: LLM_API_URL
              value: "http://llm-api.vllm.svc.cluster.local:8000/v1"
            - name: LLM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: model-config
                  key: LLM_MODEL_NAME
            # MCP sidecar
            - name: KUBERNETES_MCP_SERVER_URL
              value: "http://localhost:8080/mcp"
            # Discord
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: k8s-monitor-secrets
                  key: discord-webhook-url
            - name: DISCORD_CHANNEL
              value: "kubani-alerts"
            # Redis (for event bus + publish_activity)
            - name: REDIS_URL
              value: "redis://redis-master.cache.svc.cluster.local:6379"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "from kubani.syndicates.k8s_monitor.workflows import K8sMonitorWorkflow; print('ok')"
            initialDelaySeconds: 30
            periodSeconds: 60
      restartPolicy: Always
