apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-agent
  namespace: ai-agents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backup-agent
rules:
  # Pod exec for running backup commands
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # Read secrets for database credentials
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["postgresql-credentials", "neo4j-credentials", "qdrant-credentials"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backup-agent
subjects:
  - kind: ServiceAccount
    name: backup-agent
    namespace: ai-agents
roleRef:
  kind: ClusterRole
  name: backup-agent
  apiGroup: rbac.authorization.k8s.io
