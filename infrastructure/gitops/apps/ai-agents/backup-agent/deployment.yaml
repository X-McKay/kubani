apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-agent
  namespace: ai-agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backup-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backup-agent
    spec:
      serviceAccountName: backup-agent
      containers:
        - name: backup-agent
          image: registry.almckay.io/backup-agent:latest
          args: ["worker"]
          env:
            - name: TEMPORAL_HOST
              value: "temporal-frontend.temporal.svc.cluster.local:7233"
            - name: TEMPORAL_NAMESPACE
              value: "default"
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: backup-agent-secrets
                  key: discord-webhook-url
            - name: BACKUP_SCHEDULE_HOUR
              value: "2"
            - name: BACKUP_RETENTION_DAYS
              value: "7"
          volumeMounts:
            - name: backups
              mountPath: /backups
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: backups
          persistentVolumeClaim:
            claimName: nas-backups
---
# PVC reference in ai-agents namespace
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nas-backups
  namespace: ai-agents
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: nas-backups-ai-agents
  resources:
    requests:
      storage: 100Gi
