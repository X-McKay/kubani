---
apiVersion: v1
kind: Service
metadata:
  name: temporal-mcp
  namespace: ai-agents
  labels:
    app.kubernetes.io/name: temporal-mcp-server
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: kubani
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8081
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
  selector:
    app.kubernetes.io/name: temporal-mcp-server
