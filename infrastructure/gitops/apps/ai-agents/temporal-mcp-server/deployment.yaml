---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-mcp-server
  namespace: ai-agents
  labels:
    app.kubernetes.io/name: temporal-mcp-server
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: kubani
    mcp.kubani.io/server: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal-mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-mcp-server
        app.kubernetes.io/component: mcp-server
        mcp.kubani.io/server: "true"
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: mcp-server
          image: registry.almckay.io/temporal-mcp-server:0.1.0
          imagePullPolicy: Always
          args:
            - --mode
            - sse
            - --port
            - "8081"
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: MCP_SERVER_ID
              value: "temporal-mcp"
            - name: REGISTRY_URL
              value: "http://registry.ai-agents.svc:8000"
            - name: TEMPORAL_HOST
              value: "temporal-frontend.temporal.svc.cluster.local"
            - name: TEMPORAL_PORT
              value: "7233"
            - name: TEMPORAL_NAMESPACE
              value: "default"
            - name: MCP_TRANSPORT
              value: "sse"
            - name: MCP_PORT
              value: "8081"
            - name: MCP_ALLOWED_HOSTS
              value: "temporal-mcp.almckay.io,temporal-mcp.almckay.io:*,localhost,localhost:*,127.0.0.1,127.0.0.1:*,10.*,10.*:*,100.*,100.*:*,*.ai-agents.svc,*.ai-agents.svc:*,*.ai-agents.svc.cluster.local,*.ai-agents.svc.cluster.local:*,temporal-mcp.ai-agents.svc.cluster.local,temporal-mcp.ai-agents.svc.cluster.local:*,temporal-mcp,temporal-mcp:*"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
      restartPolicy: Always
