# Prepared only: this directory is not referenced by an active Flux root.
apiVersion: v1
kind: Namespace
metadata:
  name: starbase2-prod
  labels:
    starbase2.io/installation: starbase2-prod
    app.kubernetes.io/name: starbase2
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.34
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: starbase2
  labels:
    starbase2.io/installation: starbase2-prod
    app.kubernetes.io/name: starbase2
  namespace: starbase2-prod
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: starbase2-boundary
  labels:
    starbase2.io/installation: starbase2-prod
    app.kubernetes.io/name: starbase2
  namespace: starbase2-prod
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: database
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: temporal
    ports:
    - protocol: TCP
      port: 7233
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: starbase2-prod-postgres
  labels:
    starbase2.io/installation: starbase2-prod
    app.kubernetes.io/name: starbase2
  namespace: database
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: starbase2-prod
      podSelector:
        matchLabels:
          starbase2.io/installation: starbase2-prod
          app.kubernetes.io/name: starbase2
    ports:
    - protocol: TCP
      port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: starbase2-prod-temporal
  labels:
    starbase2.io/installation: starbase2-prod
    app.kubernetes.io/name: starbase2
  namespace: temporal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: temporal
      app.kubernetes.io/instance: temporal
      app.kubernetes.io/component: frontend
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: starbase2-prod
      podSelector:
        matchLabels:
          starbase2.io/installation: starbase2-prod
          app.kubernetes.io/name: starbase2
    ports:
    - protocol: TCP
      port: 7233
