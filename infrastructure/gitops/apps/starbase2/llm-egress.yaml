apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: starbase2-llm-egress
  namespace: starbase2-prod
  labels:
    app.kubernetes.io/name: starbase2
    starbase2.io/installation: starbase2-prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: starbase2
      starbase2.io/installation: starbase2-prod
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
              app.kubernetes.io/instance: traefik-kube-system
      ports:
        # Traefik's HTTPS Service port443 targets the pod's websecure port8443.
        - protocol: TCP
          port: 8443
