apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-fast
  namespace: vllm
  labels:
    app: vllm-fast
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-fast
  template:
    metadata:
      labels:
        app: vllm-fast
    spec:
      runtimeClassName: nvidia
      # Run on sparky alongside the main vLLM instance
      nodeSelector:
        topology.kubani.io/usage-class: inference
      tolerations:
        - key: "gpu-workloads"
          operator: "Equal"
          value: "true"
          effect: "PreferNoSchedule"
      containers:
        - name: vllm
          # Bumped from nvcr.io/nvidia/vllm:25.12-py3 (Dec 2025) to upstream
          # v0.19.0 for Qwen3.5 dense (Qwen3ForCausalLM 3.5 family) support.
          # NGC 25.12 predates Qwen3.5 family addition (upstream v0.17.0,
          # 2026-03-07) so the previous image cannot serve Qwen3.5-0.8B.
          image: vllm/vllm-openai:v0.19.0-aarch64-cu130
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: model-config
          env:
            - name: HF_HOME
              value: /models
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            # Disable Ray memory monitor for UMA architecture (GB10)
            - name: RAY_memory_monitor_refresh_ms
              value: "0"
          command: ["sh", "-c"]
          args:
            - |
              exec vllm serve "$FAST_MODEL_NAME" \
                --served-model-name "$FAST_MODEL_NAME" \
                --host 0.0.0.0 \
                --port 8000 \
                --gpu-memory-utilization "$FAST_GPU_MEMORY_UTILIZATION" \
                --max-model-len "$FAST_MAX_MODEL_LEN" \
                --enable-auto-tool-choice \
                --tool-call-parser hermes \
                --enforce-eager
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              # Request 1 GPU slice (time-sliced, shares with main vLLM)
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /health
              port: http
            # Allow up to 10 minutes for model loading
            failureThreshold: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-storage
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
