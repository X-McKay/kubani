apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-fast
  namespace: vllm
  labels:
    app: vllm-fast
spec:
  # Online as the sleep-mode qualification canary behind the GPU broker;
  # the broker sleeps it when idle instead of scaling it to zero.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-fast
  template:
    metadata:
      labels:
        app: vllm-fast
    spec:
      runtimeClassName: nvidia
      # Run on sparky alongside the main vLLM instance
      nodeSelector:
        topology.kubani.io/usage-class: inference
      tolerations:
        # sparky is tainted nvidia.com/gpu=true:NoSchedule (2026-08-16
        # control-plane migration); GPU workloads must tolerate it.
        - key: "nvidia.com/gpu"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      containers:
        - name: vllm
          # v0.20.0 canary for the upstream-image fleet on Spark (sm_121).
          # --enforce-eager is set below, so the unsettled SM121 CUDA-graph
          # path in 0.20.0 is not exercised on this canary; the bump is for
          # CUDA 13 / Torch 2.11 / Qwen3 MoE fixes shared with the main LLM.
          image: vllm/vllm-openai:v0.27.1-aarch64-cu129
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: model-config
          env:
            - name: HF_HOME
              value: /models
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            # Disable Ray memory monitor for UMA architecture (GB10)
            - name: RAY_memory_monitor_refresh_ms
              value: "0"
            # Sleep-mode control endpoints (/sleep, /wake_up, /is_sleeping).
            # Dev-only by design: reachable solely from the gpu-broker via
            # the ClusterIP-only fast-model-engine Service; the public path
            # goes through the broker (spec section 24.1).
            - name: VLLM_SERVER_DEV_MODE
              value: "1"
          command: ["sh", "-c"]
          args:
            - |
              exec vllm serve "$FAST_MODEL_NAME" \
                --served-model-name "$FAST_MODEL_NAME" \
                --host 0.0.0.0 \
                --port 8000 \
                --gpu-memory-utilization "$FAST_GPU_MEMORY_UTILIZATION" \
                --max-model-len "$FAST_MAX_MODEL_LEN" \
                --enable-auto-tool-choice \
                --tool-call-parser hermes \
                --enable-sleep-mode \
                --enforce-eager
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              # Request 1 GPU slice (time-sliced, shares with main vLLM)
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /health
              port: http
            # Allow up to 10 minutes for model loading
            failureThreshold: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-storage
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
