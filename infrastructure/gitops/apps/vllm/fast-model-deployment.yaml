apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-fast
  namespace: vllm
  labels:
    app: vllm-fast
spec:
  # Online as the sleep-mode qualification canary behind the GPU broker;
  # the broker sleeps it when idle instead of scaling it to zero.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-fast
  template:
    metadata:
      labels:
        app: vllm-fast
    spec:
      runtimeClassName: nvidia
      # Run on sparky alongside the main vLLM instance
      nodeSelector:
        topology.kubani.io/usage-class: inference
      tolerations:
        # sparky is tainted nvidia.com/gpu=true:NoSchedule (2026-08-16
        # control-plane migration); GPU workloads must tolerate it.
        - key: "nvidia.com/gpu"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      containers:
        - name: vllm
          # v0.27.1 canary for the upstream-image fleet on Spark (sm_121),
          # sharing the main LLM's image so an image bump lands here first
          # (release-process.md, fast model first). --enforce-eager is set
          # below, so CUDA-graph capture is not exercised on this canary.
          image: vllm/vllm-openai:v0.30.0-aarch64
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: model-config
          env:
            - name: HF_HOME
              value: /models
            - name: HF_HUB_OFFLINE
              value: "1"
            # Persist torch.compile / kernel-autotune caches across
            # restarts (roadmap 0.6): defaults to /root/.cache/vllm, which
            # is lost on every pod recreate.
            - name: VLLM_CACHE_ROOT
              value: /cache/vllm
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            # Disable Ray memory monitor for UMA architecture (GB10)
            - name: RAY_memory_monitor_refresh_ms
              value: "0"
            # Sleep-mode control endpoints (/sleep, /wake_up, /is_sleeping).
            # Dev-only by design: reachable solely from the gpu-broker via
            # the ClusterIP-only fast-model-engine Service; the public path
            # goes through the broker (spec section 24.1).
            - name: VLLM_SERVER_DEV_MODE
              value: "1"
          command: ["sh", "-c"]
          args:
            - |
              exec vllm serve "$FAST_MODEL_NAME" \
                --served-model-name "$FAST_MODEL_NAME" \
                --host 0.0.0.0 \
                --port 8000 \
                --gpu-memory-utilization "$FAST_GPU_MEMORY_UTILIZATION" \
                --max-model-len "$FAST_MAX_MODEL_LEN" \
                --enable-auto-tool-choice \
                --tool-call-parser qwen3_xml \
                --enable-sleep-mode \
                --enforce-eager
          resources:
            # The roadmap's 9.2 capacity ledger said 6Gi/8Gi; that was
            # wrong. Measured: the 0.1 GPU-memory-utilization pool is
            # ~12 GiB (unified memory, not charged to the cgroup) and the
            # container's own CPU-side working set is ~9 GiB, so 6 GiB
            # left the scheduler blind to the real footprint (roadmap
            # 0.4). See deployment.yaml (main) for the unified-memory
            # rationale.
            requests:
              cpu: 500m
              memory: 12Gi
            limits:
              memory: 16Gi
              # Request 1 GPU slice (time-sliced, shares with main vLLM)
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: cache
              mountPath: /cache
            - name: shm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /health
              port: http
            # Allow up to 10 minutes for model loading
            failureThreshold: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
        - name: watchdog
          # Exec-only observation sidecar (roadmap 0.3, ring 1): probes
          # this engine for a 7-day gate (roadmap 9.4) before anything
          # wires WATCHDOG_MODE=probe as a liveness probe. No probe
          # wiring here — this container is not part of the pod's own
          # readiness/liveness story. Ring 2 moves the same script into
          # an `exec` livenessProbe inside the `vllm` container (which
          # has python3), fast first, then main, once this observation
          # window is clean.
          #
          # Digest-pinning this image is a follow-up: offline here, so
          # it is pinned by tag only.
          image: python:3.12-slim
          command: ["python3", "/watchdog/watchdog.py"]
          env:
            - name: WATCHDOG_MODEL
              valueFrom:
                configMapKeyRef:
                  name: model-config
                  key: FAST_MODEL_NAME
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: watchdog-script
              mountPath: /watchdog
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-storage
        - name: cache
          persistentVolumeClaim:
            claimName: vllm-fast-cache
        - name: watchdog-script
          configMap:
            name: vllm-watchdog
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
