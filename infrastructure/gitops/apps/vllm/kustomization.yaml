apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vllm
resources:
  - namespace.yaml
  - model-storage-pvc.yaml
  - nas-model-storage-pvc.yaml
  - model-config.yaml
  - hf-token-secret.enc.yaml
  # Main LLM (configured in model-config.yaml)
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  # Embeddings (configured in model-config.yaml)
  - embeddings-deployment.yaml
  - embeddings-service.yaml
  - embeddings-ingress.yaml
  # Fast model for simple tasks (configured in model-config.yaml)
  - fast-model-deployment.yaml
  - fast-model-service.yaml
  - fast-model-engine-service.yaml
  - fast-model-ingress.yaml
  # GPU broker: sleep-aware gateways, one instance per engine
  # (docs/plans/active/2026-08-16-vllm-gpu-sleep-wake-broker.md)
  - broker-config.yaml
  - broker-secret.enc.yaml
  - broker-deployment.yaml
  - broker-main-config.yaml
  - broker-main-deployment.yaml
  - llm-engine-service.yaml
