apiVersion: v1
kind: Service
metadata:
  name: llm-api
  namespace: vllm
spec:
  # Public path goes through the gpu-broker (transparent sleep/wake);
  # the raw engine is reachable only via llm-engine (ClusterIP).
  selector:
    app: gpu-broker-main
  ports:
    - port: 8000
      targetPort: public
      name: http
