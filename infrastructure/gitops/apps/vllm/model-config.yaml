apiVersion: v1
kind: ConfigMap
metadata:
  name: model-config
  namespace: vllm
  labels:
    app.kubernetes.io/part-of: vllm
data:
  # GPU Memory Budget (sparky / DGX Spark GB10 — 119.7 GiB unified memory,
  # per the engine's "Free memory on device (97.65/119.7 GiB)" startup log
  # line, measured 2026-09-30)
  # ---------------------------------------------------------------
  # Main LLM  (Qwen3.6-35B-A3B-NVFP4):  0.4 util ≈ 47.9 GiB budget
  #   measured breakdown: ~24 GiB weights + non-torch, ~21 GiB KV pool
  #   (~2.06M tokens at fp8 KV dtype → ~15.7x concurrency at the 131072
  #   max-model-len)
  # Fast model (Qwen3.5-0.8B):          0.1 util ≈ 12 GiB budget
  # Embeddings (Qwen3-Embedding-0.6B):  0.10 util ≈ 12 GiB budget
  #   (currently replicas: 0 — see embeddings-deployment.yaml)
  # ---------------------------------------------------------------
  # Combined utilization must not exceed 0.85 (see Property 6 in design.md)

  # Main LLM model configuration
  # Qwen3.6 35B-A3B MoE (256 experts, 8 active) with hybrid GDN linear-attention
  # + full-attention layers. Multimodal (vision tower included) — currently
  # served as text-only. Served model is nvidia/Qwen3.6-35B-A3B-NVFP4 — uses
  # Marlin W4A16 MoE kernels (GB10 has no native FP4 compute) + FlashInfer
  # attention; see forum post
  # https://forums.developer.nvidia.com/t/qwen-qwen3-6-35b-a3b-and-fp8-has-landed/366822
  LLM_MODEL_NAME: "Qwen3.6-35B-A3B-NVFP4"
  LLM_MODEL_PATH: "nvidia/Qwen3.6-35B-A3B-NVFP4"
  LLM_GPU_MEMORY_UTILIZATION: "0.4"
  # Pinned KV pool, from the engine's own startup log on 2026-09-30:
  # "Free memory on device (97.65/119.7 GiB) on startup ... Actual usage is
  # 24.23 GiB for consumed memory (weights + non-torch), 1.93 GiB for peak
  # activation, and 0.65 GiB for CUDAGraph memory. Replace
  # gpu_memory_utilization config with --kv-cache-memory=22473494016
  # (20.93 GiB) to fit into requested memory". deployment.yaml passes this
  # as --kv-cache-memory-bytes (the log prints the abbreviated spelling),
  # which pins the KV pool and skips the memory-profiling pass on every
  # restart (roadmap 0.6). --gpu-memory-utilization stays alongside it:
  # without it vLLM's startup free-memory check uses the 0.92 default and
  # refuses to start (89.6 of 119.7 GiB free with the fast engine resident,
  # seen 2026-10-01). Remove LLM_KV_CACHE_MEMORY to roll back to profiling.
  # Roadmap stage 1.6 (8 GiB, 8589934592) FAILED on 2026-10-01: c=4
  # aggregate -20%, ITL p95 +20% to +145%, prefix-hit TTFT p95 +28%, even
  # though the soak was clean. The profiled pool stays until the headroom
  # is needed (embeddings is at replicas 0) and a re-run explains the drop.
  LLM_KV_CACHE_MEMORY: "22473494016"

  # Context length - 128K (model supports up to 262K natively)
  LLM_MAX_MODEL_LEN: "131072"

  # Prefill batching budget (forum default). Roadmap stage 1.4 tried 16384
  # on 2026-10-01 and FAILED: c=4 ITL p95 43 -> 133 ms, soak max 39 s,
  # 32k TTFT only -3%; long prefill chunks starve decode on this GPU.
  LLM_MAX_NUM_BATCHED_TOKENS: "8192"

  # Fast model configuration (Qwen3.5-0.8B for simple tasks - small/fast)
  # Same generation as the main LLM (Qwen3.5 dense), modest capability bump
  # over the previous 0.6B for negligible memory cost.
  FAST_MODEL_NAME: "Qwen/Qwen3.5-0.8B"
  FAST_GPU_MEMORY_UTILIZATION: "0.1"
  FAST_MAX_MODEL_LEN: "32768"

  # Embeddings model configuration
  EMBEDDINGS_MODEL_NAME: "Qwen/Qwen3-Embedding-0.6B"
  EMBEDDINGS_GPU_MEMORY_UTILIZATION: "0.10"
  EMBEDDINGS_MAX_MODEL_LEN: "8192"
