# Raw internal engine Service — the broker's upstream ONLY.
# Never expose via Ingress: the engine runs with VLLM_SERVER_DEV_MODE=1
# for sleep-mode control endpoints (spec section 24.1).
apiVersion: v1
kind: Service
metadata:
  name: llm-engine
  namespace: vllm
  labels:
    app: vllm
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: vllm
