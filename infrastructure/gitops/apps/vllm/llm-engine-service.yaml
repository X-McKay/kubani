# Internal engine Service. Port 8000 reaches the engine directly for probes
# and T6; the broker uses port 8001 through the T7 capture sidecar.
# Never expose via Ingress: the engine runs with VLLM_SERVER_DEV_MODE=1
# for sleep-mode control endpoints (spec section 24.1).
apiVersion: v1
kind: Service
metadata:
  name: llm-engine
  namespace: vllm
  labels:
    app: vllm
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
    - port: 8001
      targetPort: capture
      protocol: TCP
      name: capture
  selector:
    app: vllm
