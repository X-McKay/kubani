apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: vllm
spec:
  # Online behind the gpu-broker: level-1 sleep frees the KV pool when
  # idle instead of scaling to zero (fine-tuning headroom on sparky).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        topology.kubani.io/usage-class: inference
      tolerations:
        # sparky is tainted nvidia.com/gpu=true:NoSchedule (2026-08-16
        # control-plane migration); GPU workloads must tolerate it.
        - key: "nvidia.com/gpu"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      containers:
        - name: vllm
          # Upstream vLLM for DGX Spark / GB10 (ARM64 + CUDA 12.9, per the
          # -cu129 tag suffix). v0.27.1 is the current production image;
          # the prior image is kept cached on sparky for fast rollback.
          image: vllm/vllm-openai:v0.27.1-aarch64-cu129
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: model-config
          env:
            - name: HF_HOME
              value: /models
            - name: HF_HUB_OFFLINE
              value: "1"
            # Persist torch.compile / kernel-autotune caches across
            # restarts (roadmap 0.6): defaults to /root/.cache/vllm per
            # the engine's own log, which is lost on every pod recreate.
            - name: VLLM_CACHE_ROOT
              value: /cache/vllm
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            # Disable Ray memory monitor for UMA architecture (GB10)
            - name: RAY_memory_monitor_refresh_ms
              value: "0"
            # Required for Marlin MoE kernels on GB10 per forum recipe
            - name: VLLM_MARLIN_USE_ATOMIC_ADD
              value: "1"
            # Sleep-mode control endpoints (/sleep, /wake_up, /is_sleeping).
            # Dev-only by design: reachable solely from the gpu-broker via
            # the ClusterIP-only llm-engine Service; the public path goes
            # through the broker (spec section 24.1).
            - name: VLLM_SERVER_DEV_MODE
              value: "1"
          command: ["sh", "-c"]
          # Flags per the nvidia/Qwen3.6-35B-A3B-NVFP4 model card's DGX
          # Spark recipe (quantization auto-detected from hf_quant_config):
          #   --kv-cache-dtype fp8        checkpoint is calibrated for FP8 KV
          #   --attention-backend flashinfer
          #   --moe-backend marlin        Spark-recommended for NVFP4 MoE
          #   --max-num-seqs 4            Spark-recommended batch bound
          #   --tool-call-parser qwen3_xml  (card recipe; replaces the FP8
          #                               era's qwen3_coder)
          #   --enable-sleep-mode         level-1 sleep via the gpu-broker;
          #                               level 2 is banned (corrupts output,
          #                               validated 2026-08-16 on the fast
          #                               model — /wake_up does not reload
          #                               discarded weights)
          # Deliberately deferred from the card recipe until this boot
          # qualifies (re-add as separate optimization commits):
          #   --speculative-config (MTP)  broke with NVFP4 on v0.17
          #                               (shape mismatch, commit 7a56292)
          #   --async-scheduling          untested with sleep mode here
          #   --load-format fastsafetensors  extra not bundled in upstream
          #                               image historically
          args:
            - |
              exec vllm serve "$LLM_MODEL_PATH" \
                --served-model-name "$LLM_MODEL_NAME" \
                --host 0.0.0.0 \
                --port 8000 \
                --trust-remote-code \
                --kv-cache-memory-bytes "$LLM_KV_CACHE_MEMORY" \
                --max-model-len "$LLM_MAX_MODEL_LEN" \
                --max-num-batched-tokens "$LLM_MAX_NUM_BATCHED_TOKENS" \
                --max-num-seqs 4 \
                --kv-cache-dtype fp8 \
                --attention-backend flashinfer \
                --moe-backend marlin \
                --enable-chunked-prefill \
                --enable-prefix-caching \
                --enable-auto-tool-choice \
                --tool-call-parser qwen3_xml \
                --reasoning-parser qwen3 \
                --enable-sleep-mode
          resources:
            # GB10 is unified memory: CUDA allocations (weights, KV pool,
            # activations) are not charged to the container cgroup, whose
            # working set here is ~9 GiB CPU-side. The request is sized to
            # the real GPU-resident footprint instead — ~24 GiB weights +
            # non-torch, ~21 GiB KV pool, plus activations (see
            # model-config.yaml) — so the scheduler stops being blind to
            # it (roadmap 0.4). No CPU limit: a memory limit here only
            # bounds CPU-side RSS and cannot OOM-kill a healthy engine, so
            # it is set with headroom, not tightly to the request.
            requests:
              cpu: "2"
              memory: 48Gi
            limits:
              memory: 56Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: cache
              mountPath: /cache
            - name: shm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /health
              port: http
            # Allow up to 15 minutes for model loading.
            # Qwen3.6-35B-A3B-FP8 is ~35 GB on disk; MoE weight load +
            # GDN/SSM kernel compile + FlashInfer init are slow on cold start.
            failureThreshold: 90
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-storage
        - name: cache
          persistentVolumeClaim:
            claimName: vllm-main-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
