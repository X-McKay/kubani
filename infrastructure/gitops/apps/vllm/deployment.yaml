apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: vllm
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        topology.kubani.io/usage-class: inference
      tolerations:
        - key: "gpu-workloads"
          operator: "Equal"
          value: "true"
          effect: "PreferNoSchedule"
      containers:
        - name: vllm
          # Upstream vLLM for DGX Spark / GB10 (ARM64 + CUDA 13.0)
          # v0.20.0 brings the DeepGEMM E8M0 accuracy fix for Qwen3.5/3.6
          # FP8, the SM120 swapAB CUTLASS blockwise FP8 GEMM, and the
          # Qwen3 MoE "gate called twice" fix. Image pre-cached on sparky;
          # v0.19.1 image kept cached for fast rollback.
          image: vllm/vllm-openai:v0.20.0-aarch64-cu130
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: model-config
          env:
            - name: HF_HOME
              value: /models
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            # Disable Ray memory monitor for UMA architecture (GB10)
            - name: RAY_memory_monitor_refresh_ms
              value: "0"
            # Required for FP8 Marlin MoE kernels on GB10 per forum recipe
            - name: VLLM_MARLIN_USE_ATOMIC_ADD
              value: "1"
          command: ["sh", "-c"]
          # Flags per NVIDIA forum recipe for Qwen3.6-35B-A3B-FP8:
          #   --kv-cache-dtype fp8        halves KV cache footprint
          #   --attention-backend flashinfer  required by this recipe
          #   --enable-prefix-caching     reuse prefix KV across requests
          #   --enable-auto-tool-choice + --tool-call-parser qwen3_coder
          #                               emit OpenAI-style tool calls
          #   --reasoning-parser qwen3    captures thinking trace into
          #                               choices[].message.reasoning
          # Quantization auto-detected from model config (no flag needed).
          # NOTE: --load-format fastsafetensors is omitted — the upstream
          # vllm/vllm-openai:v0.19.1-aarch64-cu130 image does not bundle
          # the fastsafetensors extra (NVIDIA's forum recipe used a custom
          # vllm-node image). Default safetensors loader works fine; cold
          # start is slower but correctness/throughput unaffected.
          args:
            - |
              exec vllm serve "$LLM_MODEL_PATH" \
                --served-model-name "$LLM_MODEL_NAME" \
                --host 0.0.0.0 \
                --port 8000 \
                --gpu-memory-utilization "$LLM_GPU_MEMORY_UTILIZATION" \
                --max-model-len "$LLM_MAX_MODEL_LEN" \
                --max-num-batched-tokens "$LLM_MAX_NUM_BATCHED_TOKENS" \
                --kv-cache-dtype fp8 \
                --attention-backend flashinfer \
                --enable-prefix-caching \
                --enable-auto-tool-choice \
                --tool-call-parser qwen3_coder \
                --reasoning-parser qwen3
          resources:
            limits:
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /health
              port: http
            # Allow up to 15 minutes for model loading.
            # Qwen3.6-35B-A3B-FP8 is ~35 GB on disk; MoE weight load +
            # GDN/SSM kernel compile + FlashInfer init are slow on cold start.
            failureThreshold: 90
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-storage
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
