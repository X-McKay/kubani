apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: vllm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        topology.kubani.io/usage-class: inference
      tolerations:
        - key: "gpu-workloads"
          operator: "Equal"
          value: "true"
          effect: "PreferNoSchedule"
      containers:
        - name: vllm
          # Upstream vLLM for DGX Spark / GB10 (ARM64 + CUDA 13.0)
          image: vllm/vllm-openai:v0.17.0-aarch64-cu130
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: model-config
          env:
            - name: HF_HOME
              value: /models
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            # Disable Ray memory monitor for UMA architecture (GB10)
            - name: RAY_memory_monitor_refresh_ms
              value: "0"
          command: ["sh", "-c"]
          args:
            - |
              exec vllm serve "$LLM_MODEL_PATH" \
                --served-model-name "$LLM_MODEL_NAME" \
                --host 0.0.0.0 \
                --port 8000 \
                --gpu-memory-utilization "$LLM_GPU_MEMORY_UTILIZATION" \
                --enable-auto-tool-choice \
                --tool-call-parser qwen3_coder \
                --reasoning-parser qwen3 \
                --quantization modelopt \
                --max-model-len "$LLM_MAX_MODEL_LEN"
          resources:
            limits:
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /health
              port: http
            # Allow up to 10 minutes for model loading (smaller model + NVFP4)
            failureThreshold: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-storage
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
