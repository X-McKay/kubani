apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-broker-main
  namespace: vllm
  labels:
    app: gpu-broker-main
  annotations:
    # Restart on ConfigMap/Secret changes (policy flips, token rotation).
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # Single replica on the hot path: a rolling update would double-send
  # wake/sleep control traffic; Recreate keeps one arbiter at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gpu-broker-main
  template:
    metadata:
      labels:
        app: gpu-broker-main
        # Shared role label: NetworkPolicy allow-broker-engine-egress
        # selects on this so every broker instance may reach engines.
        kubani.io/role: gpu-broker
    spec:
      containers:
        - name: broker
          # CPU-only; never requests a GPU. Pinned by CI sha tag.
          image: ghcr.io/x-mckay/kubani-gpu-broker:sha-cba41ff0b60d688571fdc264c809b0acd28263bd
          ports:
            - containerPort: 8080
              name: public
            - containerPort: 8081
              name: admin
          env:
            - name: CONFIG_PATH
              value: /etc/gpu-broker/config.yaml
            - name: GPU_BROKER_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gpu-broker-admin
                  key: admin-token
            # Engine key for the wake probe (api_key_env in the ConfigMap). Read
            # at start only; Reloader restarts the broker on rotation.
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-api-key
                  key: VLLM_API_KEY_MAIN
          volumeMounts:
            - name: config
              mountPath: /etc/gpu-broker
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: public
            failureThreshold: 12
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: public
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: public
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            # The image's USER is the named account "broker" (uid 10001);
            # runAsNonRoot needs the numeric uid to verify.
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: gpu-broker-main-config
