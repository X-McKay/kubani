apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: control-plane
    app.kubernetes.io/name: starbase-core
    app.kubernetes.io/part-of: starbase
    starbase.io/release: 0.1.0-rc.5
    starbase.io/source-revision: 96c920472c29fcf7b536591fed4e363c34be36ff
  name: starbase-core
  namespace: starbase-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: starbase-core
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: control-plane
        app.kubernetes.io/name: starbase-core
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - preference:
              matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - asio
                - strix
            weight: 100
      automountServiceAccountToken: false
      containers:
      - envFrom:
        - configMapRef:
            name: starbase-runtime
        image: ghcr.io/x-mckay/starbase/core@sha256:ca90ed140c23bd630f5ce5e6d1b6c90d29c8096da3e5481abc8ca5ef234d7dad
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health/live
            port: api
          periodSeconds: 10
          timeoutSeconds: 2
        name: core
        ports:
        - containerPort: 8081
          name: api
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health/ready
            port: api
          periodSeconds: 5
          timeoutSeconds: 2
        resources:
          limits:
            cpu: '1'
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /health/live
            port: api
          periodSeconds: 2
          timeoutSeconds: 1
        volumeMounts:
        - mountPath: /tmp
          name: temporary-files
        - mountPath: /var/run/secrets/starbase.io/workload-issuer
          name: workload-issuer-ca
          readOnly: true
        - mountPath: /var/run/secrets/starbase.io/workload-issuer-identity
          name: workload-issuer-identity
          readOnly: true
      - image: ghcr.io/x-mckay/starbase/web@sha256:cc366db29258b16ed593ac7ab7a2d35987905a9346e505dbc0b1afc015ad282d
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: web
          periodSeconds: 10
          timeoutSeconds: 2
        name: web
