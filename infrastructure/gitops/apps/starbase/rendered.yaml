apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    starbase.io/activation-state: intentionally-disabled-no-egress
  labels:
    app.kubernetes.io/component: readonly-connector
    app.kubernetes.io/name: starbase-github-connector
    app.kubernetes.io/part-of: starbase
    starbase.io/release: 0.1.0-rc.5
    starbase.io/source-revision: 96c920472c29fcf7b536591fed4e363c34be36ff
  name: starbase-github-connector
  namespace: starbase-connectors
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: starbase-github-connector
  template:
    metadata:
      labels:
        app.kubernetes.io/component: readonly-connector
        app.kubernetes.io/name: starbase-github-connector
        starbase.io/access-core: 'true'
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - preference:
              matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - asio
                - strix
            weight: 100
      automountServiceAccountToken: false
      containers:
      - env:
        - name: STARBASE_CONNECTOR_MODE
          value: github
        - name: STARBASE_GITHUB_REPOSITORY
          value: X-McKay/Starbase
        envFrom:
        - configMapRef:
            name: starbase-connector-runtime
        image: ghcr.io/x-mckay/starbase/github-connector@sha256:8b51d4dedd2bedbf9ffc8b87395a0484784f3674b807d9411dbcc7a1f0519883
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health/live
            port: health
          periodSeconds: 10
          timeoutSeconds: 2
        name: connector
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health/ready
            port: health
          periodSeconds: 5
          timeoutSeconds: 2
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /health/live
            port: health
          periodSeconds: 2
          timeoutSeconds: 1
        volumeMounts:
        - mountPath: /tmp
          name: temporary-files
        - mountPath: /var/run/secrets/starbase.io/core
          name: core-workload-identity
          readOnly: true
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: starbase-github-connector
      terminationGracePeriodSeconds: 30
      volumes:
      - emptyDir:
          sizeLimit: 64Mi
        name: temporary-files
      - name: core-workload-identity
        projected:
          defaultMode: 288
          sources:
          - serviceAccountToken:
              audience: starbase-core
              expirationSeconds: 600
              path: token
