apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: control-plane
    app.kubernetes.io/name: starbase-core
    app.kubernetes.io/part-of: starbase
    starbase.io/release: 0.1.0-rc.4
    starbase.io/source-revision: e35ac44f5cea35b400d73bf94802b1a70e84585a
  name: starbase-core
  namespace: starbase-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: starbase-core
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: control-plane
        app.kubernetes.io/name: starbase-core
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - preference:
              matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - asio
                - strix
            weight: 100
      automountServiceAccountToken: false
      containers:
      - envFrom:
        - configMapRef:
            name: starbase-runtime
        image: ghcr.io/x-mckay/starbase/core@sha256:61a0fe54fd5903f5afb9bbae254c794e590444611fdf089308b5a9f70e1e4054
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health/live
            port: api
          periodSeconds: 10
          timeoutSeconds: 2
        name: core
        ports:
        - containerPort: 8081
          name: api
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health/ready
            port: api
          periodSeconds: 5
          timeoutSeconds: 2
        resources:
          limits:
            cpu: '1'
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /health/live
            port: api
          periodSeconds: 2
          timeoutSeconds: 1
        volumeMounts:
        - mountPath: /tmp
          name: temporary-files
        - mountPath: /var/run/secrets/starbase.io/workload-issuer
          name: workload-issuer-ca
          readOnly: true
        - mountPath: /var/run/secrets/starbase.io/workload-issuer-identity
          name: workload-issuer-identity
          readOnly: true
      - image: ghcr.io/x-mckay/starbase/web@sha256:ab5e5aa20e7c318f38bbfb8c20c739bfa10b5b4888ef152623367dbc24ed9baf
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: web
          periodSeconds: 10
          timeoutSeconds: 2
        name: web
        ports:
        - containerPort: 8080
          name: web
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health/ready
            port: web
          periodSeconds: 5
          timeoutSeconds: 2
        resources:
          limits:
            cpu: 250m
            memory: 128Mi
          requests:
            cpu: 25m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /
            port: web
          periodSeconds: 2
          timeoutSeconds: 1
        volumeMounts:
        - mountPath: /tmp
          name: web-temporary-files
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: starbase-core
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: starbase-core
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
      volumes:
      - emptyDir:
          sizeLimit: 64Mi
        name: temporary-files
      - emptyDir:
          sizeLimit: 32Mi
        name: web-temporary-files
      - configMap:
          defaultMode: 288
          items:
          - key: ca.crt
            path: ca.crt
          name: kube-root-ca.crt
        name: workload-issuer-ca
      - name: workload-issuer-identity
        projected:
          defaultMode: 288
          sources:
          - serviceAccountToken:
              audience: https://kubernetes.default.svc.cluster.local
              expirationSeconds: 600
              path: token
