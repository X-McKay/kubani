# Stage AP1. One ServiceAccount per platform workload (spec 9.1, 10.6, 10.7,
# 5.5). Only the workloads that talk to the API server mount a token.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-policy-service
  namespace: agent-platform
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: registry-controller
  namespace: agent-platform
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: session-runner
  namespace: agent-platform
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cleanup-reconciler
  namespace: agent-platform
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: netpol-attestor
  namespace: agent-platform
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ratelimit
  namespace: agent-platform
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aps-redis
  namespace: agent-platform
automountServiceAccountToken: false
