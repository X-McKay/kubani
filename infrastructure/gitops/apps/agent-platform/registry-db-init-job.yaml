# One-shot Job: creates the login role agent_registry and the database
# agent_registry (owned by that role) in the shared PostgreSQL. Nothing else:
# no superuser, no CREATEDB, no grants on other databases.
#
# The name carries the first 12 hex chars of the sha256 of the pod template
# (canonical JSON, see tests/test_temporal_db_init.py and the same rule in
# apps/temporal/db-init-job.yaml). Any change to the script, image or env
# produces a new name, so Flux creates a fresh Job that runs once and prunes the
# previous one. There is deliberately no ttlSecondsAfterFinished, because
# deleting the completed Job makes Flux re-create and re-run it.
#
# Idempotent: a second run changes nothing but resets the role's password to
# the Secret's value. The password comes from Secret agent-registry-db (key
# password) in this namespace; an operator creates it (runbook:
# docs/infrastructure/configuration/agent-registry.md). It reaches SQL as a psql
# variable, quoted by format(%L), never by shell interpolation into SQL text,
# and is never echoed.
apiVersion: batch/v1
kind: Job
metadata:
  name: agent-registry-db-init-v1-913385b654c9
  namespace: database
  labels:
    app.kubernetes.io/name: agent-registry-db-init
  annotations:
    kubani.io/db-init-digest: sha256:913385b654c9c63b60644b6c20f0f32816c4b03738f72189ae3b4d98b9a2bcaa
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-registry-db-init
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      nodeSelector:
        topology.kubani.io/role: platform
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: init-db
          # yamllint disable-line rule:line-length
          image: docker.io/bitnami/postgresql@sha256:e93732718bf7fafa61a04abaa437fc601c80a791857105fd6fca18407b5725c9  # pragma: allowlist secret (public image digest)
          env:
            - name: PGHOST
              value: postgresql.database.svc.cluster.local
            - name: PGCONNECT_TIMEOUT
              value: '10'
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: postgres-password
            - name: AGENT_REGISTRY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agent-registry-db
                  key: password
            # Raise this in the commit that changes the password Secret. It
            # changes the Job's name, so the Job runs again and sets the role's
            # password; nothing reads the value.
            - name: PASSWORD_GENERATION
              value: '1'
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              # A new pod's connections are refused for its first ~2s while
              # kube-router programs its egress rule. Wait for PostgreSQL.
              waited=0
              until pg_isready -q -t 2; do
                waited=$((waited + 1))
                if [ "${waited}" -ge 60 ]; then
                  echo "ERROR: PostgreSQL not reachable after 60 attempts"
                  exit 1
                fi
                sleep 1
              done

              psql -X -q -v ON_ERROR_STOP=1 -d postgres \
                -v pw="${AGENT_REGISTRY_DB_PASSWORD}" <<'SQL'
              SELECT format('CREATE ROLE agent_registry LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD %L', :'pw')
              WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'agent_registry')\gexec
              SELECT format('ALTER ROLE agent_registry PASSWORD %L', :'pw')\gexec
              SELECT 'CREATE DATABASE agent_registry OWNER agent_registry'
              WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'agent_registry')\gexec
              SQL

              echo "agent_registry role and database ready"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-agent-registry-db-init-egress
  namespace: database
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-registry-db-init
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - port: 5432
          protocol: TCP
