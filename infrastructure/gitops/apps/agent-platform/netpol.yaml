    matchLabels:
      app.kubernetes.io/name: aps-redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [agent-policy-service, ratelimit]
      ports:
