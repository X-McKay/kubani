# Stage AP1. agent-platform network policy: default deny both directions,
# DNS, then one explicit pair per path (spec 5.3 aps-ingress plus the paths
# each workload needs). Ports are destination container ports (Service DNAT
# runs before policy). The netpol-attestor runs with hostNetwork and is not
# subject to NetworkPolicy.
#
# Other side of each cross-namespace path:
#   ai-gateway agents data plane -> APS/ratelimit: ai-gateway/agents/netpol.yaml
#   APS/controller -> keycloak:      apps/keycloak/netpol.yaml
#   runner/reconciler -> temporal:   needs an ingress allow in
#     infrastructure/networking/netpol-temporal.yaml (pending, outside this
#     directory) for pods session-runner/cleanup-reconciler on 7233
#   alloy -> APS 4317, prometheus -> 9090: monitoring has no egress
#     restriction today
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: agent-platform
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: agent-platform
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# Spec 5.3 aps-ingress, plus Alloy (settlement) and Prometheus.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aps-ingress
  namespace: agent-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-policy-service
  policyTypes: [Ingress]
  ingress:
    # The agents data plane: ext_authz (9001) and the token route (9002).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai-gateway
          podSelector:
            matchLabels:
              app.kubernetes.io/name: agents
      ports:
        - port: 9001
          protocol: TCP
        - port: 9002
          protocol: TCP
    # Session Runner and cleanup reconciler: sessions and grants API (9.7).
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [session-runner, cleanup-reconciler]
      ports:
        - port: 9002
          protocol: TCP
    # Alloy forwards the gateway's OTLP access log for budget settlement (8.9).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
      ports:
        - port: 4317
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 9090
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aps-egress
  namespace: agent-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-policy-service
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 10.43.0.1/32
      ports:
        - port: 443
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 100.64.0.0/10
      ports:
        - port: 6443
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: auth
          podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
      ports:
        - port: 8080
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: aps-redis
      ports:
        - port: 6379
          protocol: TCP
    # Own traces/metrics export to Alloy.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 4317
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ratelimit-ingress
  namespace: agent-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ratelimit
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai-gateway
          podSelector:
            matchLabels:
              app.kubernetes.io/name: agents
      ports:
        - port: 8081
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 9090
          protocol: TCP
---
