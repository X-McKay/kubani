# yamllint disable rule:line-length
# Backend has no API token, Redis access, tenant ingress, or outbound service calls.
# Namespace DNS egress remains additive; no extra service egress is granted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: budget-backend
  namespace: agent-platform
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: budget-backend-ingress
  namespace: agent-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: budget-backend
  policyTypes:
    - Ingress
    - Egress
  egress: []
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai-gateway
          podSelector:
            matchLabels:
              app.kubernetes.io/name: agents
      ports:
        - port: 8080
          protocol: TCP
