# Agent Runtime Platform control plane in namespace agent-platform (spec
# sections 3.1, 8.9, 9, 10.6, 10.7, 5.5). Phase A enables AP1 (without the
# CA bundle and ReferenceGrant, which serve the agents gateway) and AP6 (the
# attestor); every other stage below is still commented. The Namespace itself is infrastructure/namespace-policy/
# agent-platform-namespaces.yaml (PSA enforce privileged for the attestor);
# the CRDs are infrastructure/agent-platform-crds/. Overall stage order:
# docs/infrastructure/configuration/agent-runtime-platform.md. Secrets and
# operator steps: docs/infrastructure/operations/pending-secrets.md
# ("Agent Runtime Platform").
#
# Images are built from X-McKay/zetra 158a170 and pushed to
# registry.almckay.io/platform/ (netpol-attestor and egress-guard are pinned
# by digest; agent-policy-service, registry-controller and session-runner are
# still marked TODO(image) and are replaced when their stage is enabled):
#   agent-policy-service sha256:afb62b1b36430d43a27b9354fe521f9f7254cee899dfcb8456d1376a55772640
#   registry-controller  sha256:2cf48cdadda90439a9eb9f12d9c7f84dc1e89d94284ae5420220a813cbe347a7
#   session-runner       sha256:525258de160248974b2d487542459e429926512ef4efbd11070213d93cef570c
# Third-party images (redis, envoyproxy/ratelimit) carry TODO(digest).
#
# Pending changes outside this directory:
#   - infrastructure/networking/netpol-temporal.yaml: ingress from
#     agent-platform pods session-runner and cleanup-reconciler on 7233.
#   - apps/monitoring/alloy-helmrelease.yaml: OTLP logs pipeline, with a copy
#     to agent-policy-service.agent-platform.svc:4317 (budget settlement).
#   - Temporal: namespace agents-tenant-test and mTLS on the frontend
#     (spec 10.6); the runner refuses to connect without its client cert.
#   - docs/infrastructure/cluster/capacity.md: ledger lines for every
#     workload here (requests/limits are in each manifest).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # stage AP1: identities, RBAC, network policy, the CA trust ConfigMap and
  # the gateway's ReferenceGrant. Inert without workloads.
  - serviceaccounts.yaml
  - rbac.yaml
  - netpol.yaml
  # - ca-bundle.yaml
  # - referencegrant.yaml

  # stage AP2: shared Redis (TLS from ClusterIssuer internal-ca, so after
  # ai-gateway/agents stage AG1) and the Envoy ratelimit service.
  # UNCOMMENT once the SOPS file exists.
  - aps-redis.enc.yaml
  # - redis.yaml
  # - ratelimit.yaml

  # stage AP3: Agent Policy Service (needs Keycloak KC1).
  - idp-client-agent-policy-service.enc.yaml
  - aps-vault-key.enc.yaml
  # - agent-policy-service.yaml
  # - aps-backend-policy.yaml

  # stage AP4: Registry Controller (needs the CRDs and the Keycloak realm).
  - idp-client-registry-controller.enc.yaml
  # - registry-controller.yaml

  # stage AP5: Session Runner and cleanup reconciler for tenant-test (needs
  # Temporal namespace agents-tenant-test with mTLS).
  # - session-runner-temporal-tls.enc.yaml
  # - cleanup-reconciler-temporal-tls.enc.yaml
  - session-payload-key-tenant-test.enc.yaml
  # - session-runner-tenant-test.yaml
  # - cleanup-reconciler.yaml

  # stage AP6: node attestor (needs Kata sandbox nodes).
  - netpol-attestor.yaml
