# Stage AP4 (after the CRDs in infrastructure/agent-platform-crds/ and the
# Keycloak realm, apps/keycloak KC1). Spec 2.1/6.4: one replica, idempotent.
#
# Single-writer guarantee: the current controller (kopf, zetra
# platform/controller/registry_controller/operator.py) runs `standalone=True`
# with no peering, so exclusivity comes from replicas: 1 plus strategy
# Recreate, never two pods at once. The Role in rbac.yaml still grants
# coordination.k8s.io leases so Lease-based election can be switched on later
# without an RBAC change; when it is, move to RollingUpdate.
#
# Env names match platform/controller/registry_controller/config.py and
# platform/contracts/agent_platform/constants.py (zetra).
#
# REGISTRY_KEYCLOAK_CLIENT_TEMPLATE stays unset until the hand-made agent
# client export of spec 7.3 exists; then add it as a ConfigMap here and point
# the variable at the mounted file.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-controller
  namespace: agent-platform
  labels:
    app.kubernetes.io/name: registry-controller
    app.kubernetes.io/part-of: agent-platform
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: registry-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry-controller
        app.kubernetes.io/part-of: agent-platform
    spec:
      serviceAccountName: registry-controller
      automountServiceAccountToken: true
      enableServiceLinks: false
      nodeSelector:
        topology.kubani.io/role: database
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registry-controller
          # Built from X-McKay/zetra 0fa3367 (platform/controller) with --no-cache,
          # because the Dockerfile's uv cache mount can reuse a stale build of the
          # package. Prior: 104d05f.
          image: registry.almckay.io/platform/registry-controller:624a0ba@sha256:5ed46286f31f3f31a9bbf8174eea76bbdf9043fdbc4c573f76885ad602d9614f
          env:
            - name: AGENT_PLATFORM_ISSUER_URL
              value: https://idp.almckay.io/realms/agents
            - name: AGENT_PLATFORM_MCP_RESOURCE_BASE
              value: https://mcp.almckay.io
            - name: AGENT_PLATFORM_GATEWAY_CLUSTER_IP
              value: 10.43.250.10
            # The egress-guard digest (spec 3.1, zetra 158a170); the controller
            # refuses to start without @sha256.
            - name: AGENT_PLATFORM_EGRESS_GUARD_IMAGE
              value: registry.almckay.io/platform/egress-guard@sha256:7f4abefb518b75401bf2cd78f1ae9d00b20881e1a181fbd367d2c1384cfff8ca
            - name: AGENT_PLATFORM_TRUST_DOMAIN
              value: cluster.local
            - name: AGENT_PLATFORM_CA_CONFIGMAP
              value: agent-gateway-ca
            - name: REGISTRY_IDP_ALIAS
              value: kubernetes-kubani
            # Back-channel admin API; the realm's issuer stays idp.almckay.io.
            - name: REGISTRY_KEYCLOAK_URL
              value: http://keycloak.auth.svc.cluster.local:8080
            - name: REGISTRY_KEYCLOAK_REALM
              value: agents
            - name: REGISTRY_KEYCLOAK_CLIENT_ID
              value: registry-controller
            - name: REGISTRY_KEYCLOAK_SECRET_FILE
              value: /var/run/secrets/idp-client/client_secret
            # Keyless against the private Sigstore; no cosign key exists. The
            # signer pins are the tenant Namespace's agentplatform.io/signer-*
            # annotations.
            - name: REGISTRY_SIGNATURE_PROFILE
              value: keyless
            - name: REGISTRY_SIGSTORE_TRUSTED_ROOT
              value: /etc/sigstore/trusted_root.json
            - name: REGISTRY_SIGSTORE_REKOR_URL
              value: https://rekor.almckay.io
            # cosign 2.x refuses --trusted-root on verify-attestation for our
            # attestation format, and takes the same roots from these instead.
            - name: SIGSTORE_ROOT_FILE
              value: /etc/sigstore/fulcio-roots.pem
            - name: SIGSTORE_REKOR_PUBLIC_KEY
              value: /etc/sigstore/rekor.pub
            - name: SIGSTORE_CT_LOG_PUBLIC_KEY_FILE
              value: /etc/sigstore/ctlog.pub
            # cosign reads registry.almckay.io credentials from here and keeps
            # its cache under HOME.
            - name: DOCKER_CONFIG
              value: /etc/registry-auth
            - name: HOME
              value: /tmp
          ports:
            # kopf liveness endpoint (operator.py: liveness_endpoint :8080/healthz).
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          # Python + kopf idle around 120Mi; one cosign verification adds a few
          # hundred Mi on top. At 384Mi the pod was OOMKilled within seconds of
          # every start for three days (503 restarts) and a release lost its
          # verification because a killed cosign exits non-zero. The controller
          # now runs one cosign at a time (zetra), so one process is the budget.
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: idp-client
              mountPath: /var/run/secrets/idp-client
              readOnly: true
            - name: sigstore
              mountPath: /etc/sigstore
              readOnly: true
            - name: registry-auth
              mountPath: /etc/registry-auth
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: idp-client
          secret:
            secretName: idp-client-registry-controller  # pragma: allowlist secret
        - name: sigstore
          configMap:
            name: sigstore-trusted-root
        - name: registry-auth
          secret:
            secretName: registry-controller-registry-pull  # pragma: allowlist secret
            items:
              - key: .dockerconfigjson
                path: config.json
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
