# Stage AP3 (with the APS). Spec 3.7: the gateway's APS check times out after
# 2 s and fails closed. extAuth has no timeout field in agentgateway 1.7.0, so
# the timeout is a backend policy on the APS Service, scoped to the gRPC port
# (9001) only: the token route also targets this
# Service (port 9002) and forwards to the IdP with a 5 s budget, so it must
# not inherit 2 s. A targetRef carries no
# namespace, so this policy lives next to the Service. Whether
# backend.http.requestTimeout governs the ext_authz call is confirmed by T17.
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: agent-policy-service-extauth-timeout
  namespace: agent-platform
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: agent-policy-service
      # The Service port, as a string: the 1.7.0 CRD requires sectionName on a
      # Service target to be numeric, and `port` is for frontend policies only.
      sectionName: "9001"
  backend:
    http:
      requestTimeout: 2s
