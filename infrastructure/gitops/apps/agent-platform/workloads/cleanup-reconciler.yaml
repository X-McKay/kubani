# Stage AP5. Cleanup reconciler (spec 10.7): the session-runner image started
# with `--role reconciler`, polling task queue cleanup-tenant-test as
# ServiceAccount cleanup-reconciler (tenant Role written by the Registry
# Controller: the runner's set minus pods create and pods/exec). The APS
# accepts this identity for stop and grant deletion only.
#
# The worker creates its Temporal Schedule (every 5 minutes, overlap Skip) at
# start if it does not exist (zetra platform/runner/runner/worker.py).
# Unfinished cleanup is therefore picked up within 5 minutes (spec 3.7).
#
# It needs no artifact store; the artifacts volume is an emptyDir.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cleanup-reconciler-tenant-test
  namespace: agent-platform
  labels:
    app.kubernetes.io/name: cleanup-reconciler
    app.kubernetes.io/part-of: agent-platform
    agentplatform.io/tenant: tenant-test
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cleanup-reconciler
      agentplatform.io/tenant: tenant-test
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cleanup-reconciler
        app.kubernetes.io/part-of: agent-platform
        agentplatform.io/tenant: tenant-test
    spec:
      serviceAccountName: cleanup-reconciler
      # The default token is the reconciler's API-server identity (pods
      # list/delete in tenant-test through the controller-written Role).
      automountServiceAccountToken: true
      enableServiceLinks: false
      # Same graceful shutdown as the runner (spec 10.6).
      terminationGracePeriodSeconds: 60
      nodeSelector:
        topology.kubani.io/role: database
      securityContext:
        runAsNonRoot: true
        runAsUser: 1600
        runAsGroup: 1600
        fsGroup: 1600
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          # Built from X-McKay/zetra ce7c06b (merged cleanup and T13/T17/T23/T24/T27 evidence fixes).
          image: registry.almckay.io/platform/session-runner:ce7c06b@sha256:48ef7c54e41b4ccf0958ff29fd88a3263d59fe6d7d455f0589cac4f0788feca1
          args: ["--role", "reconciler", "--tenant", "tenant-test"]
          # Names match platform/runner/runner/{worker,aps,activities}.py (zetra).
          env:
            - name: TENANT
              value: tenant-test
            - name: APS_URL
              value: http://agent-policy-service.agent-platform.svc.cluster.local:9002
            - name: APS_TOKEN_PATH
              value: /var/run/secrets/agent-policy-service/token
            - name: TEMPORAL_ADDRESS
              value: temporal-mtls.temporal.svc.cluster.local:7233
            - name: TEMPORAL_NAMESPACE
              value: agents-tenant-test
            # mTLS client certificate (spec 10.6) from cert-manager, Secret
            # cleanup-reconciler-temporal-tls (temporal-mtls.yaml). The runner enables TLS only
            # when TEMPORAL_TLS_CERT is set, so these stay set: no plaintext fallback.
            - name: TEMPORAL_TLS_CERT
              value: /etc/temporal-tls/tls.crt
            - name: TEMPORAL_TLS_KEY
              value: /etc/temporal-tls/tls.key
            - name: TEMPORAL_TLS_CA
              value: /etc/temporal-tls/ca.crt
            - name: PAYLOAD_KEY_FILE
              value: /etc/agent-platform/payload-key/tenant-test
            - name: WORKER_DEPLOYMENT
              value: cleanup-reconciler-tenant-test
            # Unset until the first runner upgrade: a versioned worker gets no
            # tasks until its version is made current, which needs a rollout step
            # (spec 10.6, 14.4).
            - name: WORKER_BUILD_ID
              value: ""
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: aps-token
              mountPath: /var/run/secrets/agent-policy-service
              readOnly: true
            - name: temporal-tls
              mountPath: /etc/temporal-tls
              readOnly: true
            - name: payload-key
              mountPath: /etc/agent-platform/payload-key
              readOnly: true
            - name: artifacts
              mountPath: /var/lib/agent-artifacts
            - name: tmp
              mountPath: /tmp
      volumes:
        # Spec 10.6: projected token, audience agent-policy-service, 600 s.
        - name: aps-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: agent-policy-service
                  expirationSeconds: 600
                  path: token
        - name: temporal-tls
          secret:
            secretName: cleanup-reconciler-temporal-tls  # pragma: allowlist secret
        - name: payload-key
          secret:
            secretName: session-payload-key-tenant-test  # pragma: allowlist secret
            items:
              - key: key
                path: tenant-test
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: artifacts
          emptyDir:
            sizeLimit: 64Mi
