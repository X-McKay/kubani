# yamllint disable rule:line-length
# Manual qualification only, deliberately outside every Kustomization and suspended.
# Approve the verified fixture, confirm matching APS/runner images, then explicitly unsuspend.
apiVersion: batch/v1
kind: Job
metadata:
  name: conformance-budget-day-harness
  namespace: agent-platform
  labels:
    app.kubernetes.io/name: conformance-harness
    app.kubernetes.io/part-of: agent-platform
    agentplatform.io/tenant: tenant-test
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: conformance-harness
        app.kubernetes.io/part-of: agent-platform
        agentplatform.io/tenant: tenant-test
    spec:
      restartPolicy: Never
      serviceAccountName: conformance-harness
      automountServiceAccountToken: true
      enableServiceLinks: false
      nodeSelector:
        topology.kubani.io/role: database
      securityContext:
        runAsNonRoot: true
        runAsUser: 1600
        runAsGroup: 1600
        fsGroup: 1600
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: harness
          # Current deployed pin; update with the combined T13/T13b runner before unsuspending.
          image: registry.almckay.io/platform/session-runner:89034e2@sha256:d6eba5d7edf98e3f719843c4d678b46d81ca2374f2bf9b7d1f093017bbf817b8
          command:
            - /app/.venv/bin/agent-conformance
          args:
            - --tenant
            - tenant-test
            - --agent
            - conformance-budget-day
            - --release
            - $(BUDGET_RELEASE)
            - --tests
            - T13
            - --budget-day-release
            - $(BUDGET_RELEASE)
            - --session-timeout
            - '900'
            - --report
            - /tmp/report.json
          env:
            - name: BUDGET_RELEASE
              value: conformance-budget-day-2026-11-06-362f1075
            - name: TENANT
              value: tenant-test
            - name: TEMPORAL_ADDRESS
              value: temporal-mtls.temporal.svc.cluster.local:7233
            - name: TEMPORAL_NAMESPACE
              value: agents-tenant-test
            - name: TEMPORAL_TLS_CERT
              value: /etc/temporal-tls/tls.crt
            - name: TEMPORAL_TLS_KEY
              value: /etc/temporal-tls/tls.key
            - name: TEMPORAL_TLS_CA
              value: /etc/temporal-tls/ca.crt
            - name: PAYLOAD_KEY_FILE
              value: /etc/agent-platform/payload-key/tenant-test
            - name: APS_URL
              value: http://agent-policy-service.agent-platform.svc.cluster.local:9002
            - name: APS_TOKEN_PATH
              value: /var/run/secrets/agent-policy-service/token
            - name: ARTIFACT_DIR
              value: /var/lib/agent-artifacts
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: temporal-tls
              mountPath: /etc/temporal-tls
              readOnly: true
            - name: payload-key
              mountPath: /etc/agent-platform/payload-key
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: aps-token
              mountPath: /var/run/secrets/agent-policy-service
              readOnly: true
            - name: artifacts
              mountPath: /var/lib/agent-artifacts
              readOnly: true
      volumes:
        - name: temporal-tls
          secret:
            secretName: conformance-harness-temporal-tls  # pragma: allowlist secret
        - name: payload-key
          secret:
            secretName: session-payload-key-tenant-test  # pragma: allowlist secret
            items:
              - key: key
                path: tenant-test
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: aps-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: agent-policy-service
                  expirationSeconds: 600
                  path: token
        - name: artifacts
          persistentVolumeClaim:
            claimName: agent-artifacts-tenant-test
            readOnly: true
  suspend: true
