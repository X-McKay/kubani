# Manual T25 qualification template, intentionally absent from Kustomizations.
# Signed fixture approved after controller SignatureVerified and NoDrift.
# Before applying, confirm it remains Ready and no other tenant sessions run.
# Keep this image aligned with the tenant runner and cleanup reconciler.
# Run exclusively; see ../conformance/protocol/README.md.
apiVersion: batch/v1
kind: Job
metadata:
  name: conformance-protocol-harness
  namespace: agent-platform
  labels:
    app.kubernetes.io/name: conformance-harness
    app.kubernetes.io/part-of: agent-platform
    agentplatform.io/tenant: tenant-test
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: conformance-harness
        app.kubernetes.io/part-of: agent-platform
        agentplatform.io/tenant: tenant-test
    spec:
      restartPolicy: Never
      serviceAccountName: conformance-harness
      automountServiceAccountToken: true
      enableServiceLinks: false
      nodeSelector:
        topology.kubani.io/role: database
      securityContext:
        runAsNonRoot: true
        runAsUser: 1600
        runAsGroup: 1600
        fsGroup: 1600
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: harness
          # Combined runner build containing T25 and its memory audit (zetra#46).
          image: registry.almckay.io/platform/session-runner:89034e2@sha256:d6eba5d7edf98e3f719843c4d678b46d81ca2374f2bf9b7d1f093017bbf817b8
          command: ["/app/.venv/bin/agent-conformance"]
          args:
            - --tenant
            - tenant-test
            - --agent
            - conformance-protocol
            - --release
            - $(PROTOCOL_RELEASE)
            - --tests
            - T25
            - --protocol-fixture-agent
            - conformance-protocol
            - --protocol-fixture-release
            - $(PROTOCOL_RELEASE)
            - --session-timeout
            - "1800"
            - --report
            - /tmp/report.json
          env:
            - name: PROTOCOL_RELEASE
              value: conformance-protocol-2026-11-06-4c529889
            - name: TENANT
              value: tenant-test
            - name: TEMPORAL_ADDRESS
              value: temporal-mtls.temporal.svc.cluster.local:7233
            - name: TEMPORAL_NAMESPACE
              value: agents-tenant-test
            - name: TEMPORAL_TLS_CERT
              value: /etc/temporal-tls/tls.crt
            - name: TEMPORAL_TLS_KEY
              value: /etc/temporal-tls/tls.key
            - name: TEMPORAL_TLS_CA
              value: /etc/temporal-tls/ca.crt
            - name: PAYLOAD_KEY_FILE
              value: /etc/agent-platform/payload-key/tenant-test
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: temporal-tls
              mountPath: /etc/temporal-tls
              readOnly: true
            - name: payload-key
              mountPath: /etc/agent-platform/payload-key
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: temporal-tls
          secret:
            secretName: conformance-harness-temporal-tls  # pragma: allowlist secret
        - name: payload-key
          secret:
            secretName: session-payload-key-tenant-test  # pragma: allowlist secret
            items:
              - key: key
                path: tenant-test
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
