# yamllint disable rule:line-length
# The private Sigstore's trust root as a Sigstore trusted_root.json, for the
# Registry Controller's keyless verification. Public material. It is the same
# Fulcio root, Rekor key and CT log key as
# infrastructure/kyverno/private-sigstore.yaml, so rotate the two together.
# Generated with `cosign trusted-root create` (start-time is the Fulcio root's
# notBefore); no TUF repository exists to distribute it. These are the public
# keys listed in .secrets.baseline.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sigstore-trusted-root
  namespace: agent-platform
data:
  trusted_root.json: |
    {
      "mediaType": "application/vnd.dev.sigstore.trustedroot+json;version=0.1",
      "tlogs": [
        {
          "baseUrl": "https://rekor.almckay.io",
