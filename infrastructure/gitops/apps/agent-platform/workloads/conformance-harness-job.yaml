# Phase B conformance harness (spec 15): one run of `agent-conformance` from
# the session-runner image (zetra platform/runner/runner/conformance.py). It
# submits sessions of the conformance agent (zetra-agents agents/conformance)
# to the tenant's Session Runner, reads the committed boundaries from Temporal
# history and the Agent Policy Service log, posts T5's two non-sandbox cases
# to the APS token route itself, and prints a JSON report (also written to
# /tmp/report.json inside the pod).
#
# NOT listed in kustomization.yaml: a Job is one run, so it is applied by hand
# per run from the rig0 session (direct writes in agent-platform are expected,
# .claude/rules/kubernetes.md) and deleted afterwards:
#
#   KUBECONFIG=/home/al/.kube/config kubectl delete job -n agent-platform conformance-harness --ignore-not-found
#   KUBECONFIG=/home/al/.kube/config kubectl apply -f infrastructure/gitops/apps/agent-platform/workloads/conformance-harness-job.yaml
#   KUBECONFIG=/home/al/.kube/config kubectl wait -n agent-platform --for=condition=complete job/conformance-harness --timeout=2h
#   KUBECONFIG=/home/al/.kube/config kubectl logs -n agent-platform job/conformance-harness > docs/.../phase-b-run-<date>.json
#
# CONFORMANCE_RELEASE is the approved AgentRelease of the conformance agent
# (apps/agents/tenant-test/conformance/). Identity, RBAC, network policy and the Temporal
# client certificate are in ../serviceaccounts.yaml, ../rbac.yaml,
# ../netpol.yaml and temporal-mtls.yaml (listed; inert until this Job runs).
#
# Each sandbox-side case is one session: a Kata sandbox on rig0, two or three
# model calls on llm-main, one probe. T4 + T5 is seven sessions; T8 and T19
# add one each over the MCP route (probe_mcp, conformance v0.1.5 or later).
# T26 is three: one session stashes its token in the workspace, then a session
# of the same agent and one of conformance-b (CONFORMANCE_B_RELEASE) are seeded
# from that snapshot and present it on the MCP route. The harness reads the
# snapshot from the tenant's artifact PVC (read-only; same node and uid as the
# runner) only to compare the stashed token by jti (spec 15.4).
---
apiVersion: batch/v1
kind: Job
metadata:
  name: conformance-harness
  namespace: agent-platform
  labels:
    app.kubernetes.io/name: conformance-harness
    app.kubernetes.io/part-of: agent-platform
    agentplatform.io/tenant: tenant-test
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: conformance-harness
        app.kubernetes.io/part-of: agent-platform
        agentplatform.io/tenant: tenant-test
    spec:
      restartPolicy: Never
      serviceAccountName: conformance-harness
      # The default token reads the APS pod log (Role conformance-harness).
      automountServiceAccountToken: true
      enableServiceLinks: false
      nodeSelector:
        topology.kubani.io/role: database
      securityContext:
        runAsNonRoot: true
        runAsUser: 1600
        runAsGroup: 1600
        fsGroup: 1600
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: harness
          # Built from zetra main 89034e2 (zetra#44–47: exact identity, admission, protocol and revocation checks).
          # Keep the runner and reconciler on the same
          # build when runner code or activity/workflow payloads change (finding 16).
          image: registry.almckay.io/platform/session-runner:89034e2@sha256:d6eba5d7edf98e3f719843c4d678b46d81ca2374f2bf9b7d1f093017bbf817b8
          command: ["/app/.venv/bin/agent-conformance"]
          args:
            - --tenant
            - tenant-test
            - --agent
            - conformance
            - --release
            - $(CONFORMANCE_RELEASE)
            - --agent-b
            - conformance-b
            - --release-b
            - $(CONFORMANCE_B_RELEASE)
            - --tests
            - T4,T5,T6,T7,T8,T11,T12,T19,T26
            - --report
            - /tmp/report.json
          env:
            # The approved AgentRelease of the conformance agent in tenant-test.
            - name: CONFORMANCE_RELEASE
              value: conformance-2026-11-06-88b05a89
            # The approved AgentRelease of conformance-b, T26's second identity.
            - name: CONFORMANCE_B_RELEASE
              value: conformance-b-2026-11-06-00fdab05
            # T6 reaches the direct engine only while the temporary policies
            # in apps/vllm/conformance/t6-netpol.yaml are applied.
            - name: T6_MODEL_URL
              value: http://llm-engine.vllm.svc.cluster.local:8000/v1/models
            - name: BACKEND_KEY_FILE
              value: /var/run/secrets/model-backend/key
            - name: TENANT
              value: tenant-test
            - name: ARTIFACT_DIR
              value: /var/lib/agent-artifacts
            - name: APS_URL
              value: http://agent-policy-service.agent-platform.svc.cluster.local:9002
            # T5 checks actual API, non-sandbox issuer and human credentials.
            # Mint the short-lived human Secret immediately before applying this Job.
            - name: ISSUER_URL
              value: https://idp.almckay.io/realms/agents
            - name: T5_HUMAN_TOKEN_FILE
              value: /var/run/secrets/conformance-human/token
            - name: T5_HUMAN_SUBJECT
              value: 65c3f987-1a83-4be7-8820-1be2297ab8db
            - name: T5_HUMAN_USERNAME
              value: conformance-alice
            - name: T5_HUMAN_CLIENT_ID
              value: agent-cli
            - name: T5_HUMAN_JWKS_URL
              value: http://keycloak.auth.svc.cluster.local:8080/realms/agents/protocol/openid-connect/certs
            - name: ISSUER_TOKEN_PATH
              value: /var/run/secrets/issuer-audience/token
            - name: APS_TOKEN_PATH
              value: /var/run/secrets/agent-policy-service/token
            - name: TEMPORAL_ADDRESS
              value: temporal-mtls.temporal.svc.cluster.local:7233
            - name: TEMPORAL_NAMESPACE
              value: agents-tenant-test
            - name: TEMPORAL_TLS_CERT
              value: /etc/temporal-tls/tls.crt
            - name: TEMPORAL_TLS_KEY
              value: /etc/temporal-tls/tls.key
            - name: TEMPORAL_TLS_CA
              value: /etc/temporal-tls/ca.crt
            - name: PAYLOAD_KEY_FILE
              value: /etc/agent-platform/payload-key/tenant-test
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: aps-token
              mountPath: /var/run/secrets/agent-policy-service
              readOnly: true
            - name: issuer-token
              mountPath: /var/run/secrets/issuer-audience
              readOnly: true
            - name: temporal-tls
              mountPath: /etc/temporal-tls
              readOnly: true
            - name: payload-key
              mountPath: /etc/agent-platform/payload-key
              readOnly: true
            - name: human-token
              mountPath: /var/run/secrets/conformance-human
              readOnly: true
            - name: model-backend-key
              mountPath: /var/run/secrets/model-backend
              readOnly: true
            - name: artifacts
              mountPath: /var/lib/agent-artifacts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: aps-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: agent-policy-service
                  expirationSeconds: 600
                  path: token
        # Same audience as a sandbox's assertion (APS ISSUER_URL), so the APS
        # reviews it successfully and refuses it for what it is: not a sandbox.
        - name: issuer-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: https://idp.almckay.io/realms/agents
                  expirationSeconds: 600
                  path: token
        - name: temporal-tls
          secret:
            secretName: conformance-harness-temporal-tls  # pragma: allowlist secret
        - name: payload-key
          secret:
            secretName: session-payload-key-tenant-test  # pragma: allowlist secret
            items:
              - key: key
                path: tenant-test
        - name: human-token
          secret:
            secretName: conformance-human-token  # pragma: allowlist secret
            defaultMode: 0440
        - name: model-backend-key
          secret:
            secretName: conformance-model-key  # pragma: allowlist secret
            defaultMode: 0440
            items:
              - key: key
                path: key
        # The runner's artifact store (session-runner-tenant-test.yaml); RWO, so
        # the Job's node selector keeps it on the runner's node.
        - name: artifacts
          persistentVolumeClaim:
            claimName: agent-artifacts-tenant-test
            readOnly: true
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
