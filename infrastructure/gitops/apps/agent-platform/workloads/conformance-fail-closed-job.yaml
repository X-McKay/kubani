# Manual T17 only; suspended and outside every Kustomization.
# Replace the marker before explicit launch; runner 4a089b5 includes the T17 receipt fixes.
# Root/operator owns the live outage; see ../conformance/fail-closed/README.md.
# yamllint disable rule:line-length
---
apiVersion: batch/v1
kind: Job
metadata:
  name: conformance-fail-closed-harness
  namespace: agent-platform
  labels:
    app.kubernetes.io/name: conformance-harness
    app.kubernetes.io/part-of: agent-platform
    agentplatform.io/tenant: tenant-test
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1200
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: conformance-harness
        app.kubernetes.io/part-of: agent-platform
        agentplatform.io/tenant: tenant-test
    spec:
      restartPolicy: Never
      serviceAccountName: conformance-harness
      automountServiceAccountToken: true
      enableServiceLinks: false
      nodeSelector:
        topology.kubani.io/role: database
      securityContext:
        runAsNonRoot: true
        runAsUser: 1600
        runAsGroup: 1600
        fsGroup: 1600
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: harness
        image: registry.almckay.io/platform/session-runner:9c2c092@sha256:d6a785a6b94af6bcb95e34954db3b84bcaf370ac5ff28cdef2efb5fbc57f6e52
        command:
        - /app/.venv/bin/agent-conformance
        args:
        - --tenant
        - tenant-test
        - --agent
        - conformance
        - --release
        - $(CONFORMANCE_RELEASE)
        - --tests
        - T17
        - --fail-closed-fixture-release
        - $(CONFORMANCE_B_RELEASE)
        - --aps-outage-marker
        - $(APS_OUTAGE_MARKER)
        - --aps-outage-duration
        - '180'
        - --observe-aps-outage
        - --session-timeout
        - '900'
        - --report
        - /tmp/report.json
        env:
        - name: CONFORMANCE_RELEASE
          value: conformance-2026-11-06-88b05a89
        - name: CONFORMANCE_B_RELEASE
          value: conformance-b-2026-11-06-5928c578
        - name: TENANT
          value: tenant-test
        - name: ARTIFACT_DIR
          value: /var/lib/agent-artifacts
        - name: TEMPORAL_ADDRESS
          value: temporal-mtls.temporal.svc.cluster.local:7233
        - name: TEMPORAL_NAMESPACE
          value: agents-tenant-test
        - name: TEMPORAL_TLS_CERT
          value: /etc/temporal-tls/tls.crt
        - name: TEMPORAL_TLS_KEY
          value: /etc/temporal-tls/tls.key
        - name: TEMPORAL_TLS_CA
          value: /etc/temporal-tls/ca.crt
        - name: PAYLOAD_KEY_FILE
          value: /etc/agent-platform/payload-key/tenant-test
        - name: APS_OUTAGE_MARKER
          value: REPLACE_WITH_RUN_MARKER
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: temporal-tls
          mountPath: /etc/temporal-tls
          readOnly: true
        - name: payload-key
          mountPath: /etc/agent-platform/payload-key
          readOnly: true
        - name: artifacts
          mountPath: /var/lib/agent-artifacts
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: temporal-tls
        secret:
          secretName: conformance-harness-temporal-tls # pragma: allowlist secret
      - name: payload-key
        secret:
          secretName: session-payload-key-tenant-test # pragma: allowlist secret
          items:
          - key: key
            path: tenant-test
      - name: artifacts
        persistentVolumeClaim:
          claimName: agent-artifacts-tenant-test
          readOnly: true
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
  suspend: true
