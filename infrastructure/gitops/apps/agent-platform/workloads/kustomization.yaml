# Agent Runtime Platform workloads (stage B3 in
# docs/infrastructure/configuration/agent-runtime-platform.md), applied by Flux
# Kustomization agent-platform-workloads and not by `apps`, so a workload that
# fails to become healthy blocks only this stage. Identities, RBAC, network
# policy and Secrets stay in ../ (the apps Kustomization).
#
# Rollback: remove flux-system/agent-platform-workloads-kustomization.yaml from
# flux-system/kustomization.yaml. prune deletes everything listed here. The
# aps-redis PVC goes with it, and with it the budget ledgers.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # stage AP2: shared Redis and the Envoy ratelimit service.
  - redis.yaml
  - ratelimit.yaml

  # stage AP3: Agent Policy Service (needs Keycloak).
  - agent-policy-service.yaml
  - aps-backend-policy.yaml

  # stage AP4: Registry Controller (needs the CRDs and the Keycloak realm).
  - registry-controller-scope.yaml
  - sigstore-trusted-root.yaml
  - registry-controller.yaml

  # stage AP5: Temporal mTLS endpoint, Session Runner and cleanup reconciler for
  # tenant-test.
  - temporal-mtls.yaml
  - session-runner-tenant-test.yaml
  - cleanup-reconciler.yaml
  - budget-backend.yaml

  # Retained governed A/B candidates; Temporal promotion is separate.
  - governed-workers

  # Agent Registry and its provisioner (need the Keycloak realm's registry
  # clients and the database role; runbook:
  # docs/infrastructure/configuration/agent-registry.md).
  - agent-registry.yaml
  - registry-provisioner.yaml

# Agent Registry: the catalog feed it reads, rendered from
# infrastructure/registry/ by `just registry-feed render --write` and held to
# it by `just registry-feed-check`. The name has no hash suffix: the registry
# reads the mounted file again when it changes, so no restart is wanted.
configMapGenerator:
  - name: agent-registry-feed
    namespace: agent-platform
    files:
      - agent-registry-feed.json
    options:
      disableNameSuffixHash: true
