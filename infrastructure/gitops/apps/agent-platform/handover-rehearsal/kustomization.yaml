# Rehearsal of the hand-over of an agent's objects from Flux to the registry's
# provisioner (docs/plans: catalog and registry implementation, section 4.3
# step 1), on one throwaway ConfigMap. commonAnnotations is how the annotation
# will reach db-admin's objects. The directory is removed when the rehearsal is
# done.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  kustomize.toolkit.fluxcd.io/prune: disabled
resources:
  - configmap.yaml
