apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubani-ui
  namespace: kubani-ui
  labels:
    app.kubernetes.io/name: kubani-ui
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubani-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubani-ui
        app.kubernetes.io/component: frontend
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: kubani-ui
          image: registry.almckay.io/kubani-ui:v0.10.1-717f3e4
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: RUST_LOG
              value: "info"
            - name: REGISTRY_URL
              value: "http://metadata-registry.ai-agents.svc.cluster.local:8000"
            - name: VLLM_URL
              value: "http://llm-api.vllm.svc.cluster.local:8000/v1"
            - name: MODEL_NAME
              value: "nvidia/Qwen3-14B-FP4"
            - name: K8S_MCP_URL
              value: "http://kubernetes-mcp-server.ai-agents.svc.cluster.local:8080"
            - name: TEMPORAL_MCP_URL
              value: "http://temporal-mcp.ai-agents.svc.cluster.local:8081"
            - name: NEXUS_GATEWAY_URL
              value: "http://nexus-gateway.nexus.svc.cluster.local:8000"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: kubani-ui-config
                  key: redis-url
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kubani-ui
  namespace: kubani-ui
  labels:
    app.kubernetes.io/name: kubani-ui
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: kubani-ui
