apiVersion: v1
kind: ServiceAccount
metadata:
  name: authentik-live-upgrade
  labels:
    app.kubernetes.io/name: authentik-live-upgrade
    app.kubernetes.io/part-of: authentik-live-upgrade
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-authentik-live-upgrade-postgresql
  labels:
    app.kubernetes.io/name: authentik-live-upgrade
    app.kubernetes.io/part-of: authentik-live-upgrade
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: authentik-live-upgrade
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - port: 5432
          protocol: TCP
---
apiVersion: batch/v1
kind: Job
metadata:
  name: authentik-live-upgrade-ladder-v1
  labels:
    app.kubernetes.io/name: authentik-live-upgrade
    app.kubernetes.io/component: live-ladder
    app.kubernetes.io/part-of: authentik-live-upgrade
  annotations:
    kubani.io/activation-gate: merge-authorizes-reviewed-sequential-live-migration
    kubani.io/activation-state: authorized-live-ladder
    kubani.io/ladder-contract-digest: sha256:791331c12bf9cbd8f8cfea8c32455d1a95bd00a69c0b8177857495011766086c
    kubani.io/recovery-backup: authentik-live-alignment-v1-20260825.sql.gz.enc
    kubani.io/target-version: 2026.5.6
    kubani.io/removal-condition: authentik-2026-5-6-post-upgrade-evidence-accepted
spec:
  activeDeadlineSeconds: 3600
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik-live-upgrade
        app.kubernetes.io/component: live-ladder
        app.kubernetes.io/part-of: authentik-live-upgrade
    spec:
      serviceAccountName: authentik-live-upgrade
      automountServiceAccountToken: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [rig0]
      securityContext:
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: capture-baseline
          image: docker.io/bitnami/postgresql@sha256:e93732718bf7fafa61a04abaa437fc601c80a791857105fd6fca18407b5725c9
          imagePullPolicy: IfNotPresent
          command: [/opt/bitnami/scripts/postgresql/entrypoint.sh]
          args: [/bin/bash, /opt/kubani/capture-baseline.sh]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-credentials
                  key: postgres-password
          resources: &postgres_resources
            requests:
              cpu: 50m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
              ephemeral-storage: 256Mi
          securityContext: &postgres_security
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts: &postgres_mounts
            - name: scripts
              mountPath: /opt/kubani
              readOnly: true
            - name: work
              mountPath: /work
            - name: temporary-files
              mountPath: /tmp
        - name: upgrade-2025-10-4
          image: ghcr.io/goauthentik/server:2025.10.4@sha256:4b4f9ae106dbda902b836aa7a79d2f456b8302f090b862f7ad1bf268402730b2
          imagePullPolicy: IfNotPresent
          command: [/bin/bash, /opt/kubani/run-version.sh]
          args: [2025.10.4]
          env: &authentik_env
            - name: AUTHENTIK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: authentik-credentials
                  key: secret-key
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-credentials
                  key: postgres-password
          resources: &authentik_resources
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
              ephemeral-storage: 1Gi
          securityContext: &authentik_security
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts: &authentik_mounts
            - name: scripts
              mountPath: /opt/kubani
              readOnly: true
            - name: work
              mountPath: /work
            - name: temporary-files
              mountPath: /tmp
            - name: authentik-certs
              mountPath: /certs
            - name: authentik-media
              mountPath: /media
            - name: authentik-run
              mountPath: /run
        - name: upgrade-2025-12-0
          image: ghcr.io/goauthentik/server:2025.12.0@sha256:c4b55bec00d0872ffe7beac401b747eaf6f48bdf5e9be1500a23bf962226fc2e
          imagePullPolicy: IfNotPresent
          command: [/bin/bash, /opt/kubani/run-version.sh]
          args: [2025.12.0]
          env: *authentik_env
          resources: *authentik_resources
          securityContext: *authentik_security
          volumeMounts: *authentik_mounts
        - name: upgrade-2025-12-6
          image: ghcr.io/goauthentik/server:2025.12.6@sha256:d4c1750e26bb7faa4d09e23305d75b54957ce4b81cee8e3acf4cc4bb8635d705
          imagePullPolicy: IfNotPresent
          command: [/bin/bash, /opt/kubani/run-version.sh]
          args: [2025.12.6]
          env: *authentik_env
          resources: *authentik_resources
          securityContext: *authentik_security
          volumeMounts: *authentik_mounts
        - name: upgrade-2026-2-6
          image: ghcr.io/goauthentik/server:2026.2.6@sha256:49d30c0e511668329e2a3083e6a4ed16ba5ef072880df46794668587464d31f7
          imagePullPolicy: IfNotPresent
          command: [/bin/bash, /opt/kubani/run-version.sh]
          args: [2026.2.6]
          env: *authentik_env
          resources: *authentik_resources
          securityContext: *authentik_security
          volumeMounts: *authentik_mounts
        - name: upgrade-2026-5-6
          image: ghcr.io/goauthentik/server:2026.5.6@sha256:ed120caf710ccf82ef0026f0bc74e51615bc95ebff228a7a2d6fc60c441c3868
          imagePullPolicy: IfNotPresent
          command: [/bin/bash, /opt/kubani/run-version.sh]
          args: [2026.5.6]
          env: *authentik_env
          resources: *authentik_resources
          securityContext: *authentik_security
          volumeMounts: *authentik_mounts
      containers:
        - name: verify-upgrade
          image: docker.io/bitnami/postgresql@sha256:e93732718bf7fafa61a04abaa437fc601c80a791857105fd6fca18407b5725c9
          imagePullPolicy: IfNotPresent
          command: [/opt/bitnami/scripts/postgresql/entrypoint.sh]
          args: [/bin/bash, /opt/kubani/verify-upgrade.sh]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-credentials
                  key: postgres-password
          resources: *postgres_resources
          securityContext: *postgres_security
          volumeMounts: *postgres_mounts
      volumes:
        - name: scripts
          configMap:
            name: authentik-live-upgrade-ladder-v1
            defaultMode: 365
        - name: work
          emptyDir:
            sizeLimit: 512Mi
        - name: temporary-files
          emptyDir:
            sizeLimit: 256Mi
        - name: authentik-certs
          emptyDir:
            sizeLimit: 64Mi
        - name: authentik-media
          emptyDir:
            sizeLimit: 256Mi
        - name: authentik-run
          emptyDir:
            sizeLimit: 64Mi
