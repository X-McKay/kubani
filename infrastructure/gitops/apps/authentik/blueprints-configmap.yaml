apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: auth
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: blueprints
data:
  kubani-forward-auth.yaml: |  # pragma: allowlist secret
    version: 1
    metadata:
      name: Kubani - Forward Auth Applications
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - id: falkordb-provider
        model: authentik_providers_proxy.proxyprovider
        identifiers:
          name: Kubani FalkorDB Browser
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          external_host: https://falkordb.almckay.io
          internal_host: http://falkordb.database.svc.cluster.local:3000
          internal_host_ssl_validation: false

      - model: authentik_core.application
        identifiers:
          slug: falkordb
        attrs:
          name: FalkorDB Browser
          provider: !KeyOf falkordb-provider
          meta_launch_url: https://falkordb.almckay.io
          policy_engine_mode: any

      - id: qdrant-provider
        model: authentik_providers_proxy.proxyprovider
        identifiers:
          name: Kubani Qdrant
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          external_host: https://qdrant.almckay.io
          internal_host: http://qdrant.database.svc.cluster.local:6333
          internal_host_ssl_validation: false

      - model: authentik_core.application
        identifiers:
          slug: qdrant
        attrs:
          name: Qdrant
          provider: !KeyOf qdrant-provider
          meta_launch_url: https://qdrant.almckay.io
          policy_engine_mode: any

      - model: authentik_outposts.outpost
        identifiers:
          name: authentik Embedded Outpost
        attrs:
          type: proxy
          service_connection: !Find [authentik_outposts.kubernetesserviceconnection, [name, Local Kubernetes Cluster]]
          providers:
            - !KeyOf falkordb-provider
            - !KeyOf qdrant-provider
          config:
            log_level: info
            authentik_host: https://auth.almckay.io
            authentik_host_browser: https://auth.almckay.io
            authentik_host_insecure: false
            refresh_interval: minutes=5
            object_naming_template: ak-outpost-%(name)s
            kubernetes_namespace: auth
            kubernetes_replicas: 1
            kubernetes_service_type: ClusterIP
            kubernetes_ingress_secret_name: authentik-outpost-tls
            kubernetes_disabled_components: []
            kubernetes_ingress_annotations: {}
            kubernetes_image_pull_secrets: []
            docker_map_ports: true
