apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: auth
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/component: blueprints
data:
  kubani-forward-auth.yaml: |  # pragma: allowlist secret
    version: 1
    metadata:
      name: Kubani - Forward Auth Applications
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - id: falkordb-provider
        model: authentik_providers_proxy.proxyprovider
        identifiers:
          name: Kubani FalkorDB Browser
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          external_host: https://falkordb.almckay.io
          internal_host: http://falkordb.database.svc.cluster.local:3000
          internal_host_ssl_validation: false

      - model: authentik_core.application
        identifiers:
          slug: falkordb
        attrs:
          name: FalkorDB Browser
          provider: !KeyOf falkordb-provider
          meta_launch_url: https://falkordb.almckay.io
          policy_engine_mode: any

      - id: qdrant-provider
        model: authentik_providers_proxy.proxyprovider
        identifiers:
          name: Kubani Qdrant
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          external_host: https://qdrant.almckay.io
          internal_host: http://qdrant.database.svc.cluster.local:6333
          internal_host_ssl_validation: false

      - model: authentik_core.application
        identifiers:
          slug: qdrant
        attrs:
          name: Qdrant
          provider: !KeyOf qdrant-provider
          meta_launch_url: https://qdrant.almckay.io
          policy_engine_mode: any

      - id: prometheus-provider
        model: authentik_providers_proxy.proxyprovider
        identifiers:
          name: Kubani Prometheus
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          external_host: https://prometheus.almckay.io
          internal_host: http://prometheus-server.monitoring.svc.cluster.local:80
          internal_host_ssl_validation: false

      - model: authentik_core.application
        identifiers:
          slug: prometheus
        attrs:
          name: Prometheus
          provider: !KeyOf prometheus-provider
          meta_launch_url: https://prometheus.almckay.io
          policy_engine_mode: any

      # Grafana: native OIDC (auth decision table row 1). Grafana's own config
      # (apps/monitoring/grafana-helmrelease.yaml) expects application slug
      # `grafana`; the client id/secret match monitoring/grafana-oauth-credentials
      # and arrive here as env from the grafana-oidc-client Secret.
      - id: grafana-oauth2-provider
        model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: Kubani Grafana
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          # Providers created by blueprint get an empty grant_types list (the UI
          # defaults to all), and the authorize endpoint then answers
          # invalid_request for every login (observed 2026-10-01). Grafana uses
          # the code flow plus refresh tokens.
          grant_types:
            - authorization_code
            - refresh_token
          client_id: !Env GRAFANA_OAUTH_CLIENT_ID
          client_secret: !Env GRAFANA_OAUTH_CLIENT_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://grafana.almckay.io/login/generic_oauth
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

      - model: authentik_core.application
        identifiers:
          slug: grafana
        attrs:
          name: Grafana
          provider: !KeyOf grafana-oauth2-provider
          meta_launch_url: https://grafana.almckay.io
          policy_engine_mode: any

      - model: authentik_outposts.outpost
        identifiers:
          name: authentik Embedded Outpost
        attrs:
          type: proxy
          service_connection: !Find [authentik_outposts.kubernetesserviceconnection, [name, Local Kubernetes Cluster]]
          providers:
            - !KeyOf falkordb-provider
            - !KeyOf qdrant-provider
            - !KeyOf prometheus-provider
          config:
            log_level: info
            authentik_host: https://auth.almckay.io
            authentik_host_browser: https://auth.almckay.io
            authentik_host_insecure: false
            refresh_interval: minutes=5
            object_naming_template: ak-outpost-%(name)s
            kubernetes_namespace: auth
            kubernetes_replicas: 1
            kubernetes_service_type: ClusterIP
            kubernetes_ingress_secret_name: authentik-outpost-tls
            kubernetes_disabled_components: []
            kubernetes_ingress_annotations: {}
            kubernetes_image_pull_secrets: []
            docker_map_ports: true
  # MCP servers behind agentgateway (plan
  # docs/plans/ideas/2026-10-17-mcp-gateway-openshell-tetragon.md, 2.2 and
  # 2.7). Public client with PKCE: the client_id is not a credential (it is
  # sent in every authorize URL and must also appear literally in the
  # gateway's AgentgatewayPolicy mcp.clientId), so it is a fixed readable
  # value rather than an !Env from SOPS. Rollback: set state: absent on these
  # entries first, then remove the key (authentik-app skill red flag).
  kubani-mcp.yaml: |
    version: 1
    metadata:
      name: Kubani - MCP gateway
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - id: mcp-users-group
        model: authentik_core.group
        identifiers:
          name: mcp-users
        attrs:
          is_superuser: false
      - id: mcp-admin-group
        model: authentik_core.group
        identifiers:
          name: mcp-admin
        attrs:
          is_superuser: false
      - id: mcp-agents-group
        model: authentik_core.group
        identifiers:
          name: mcp-agents
        attrs:
          is_superuser: false
      # Agent role groups (plan 2.7): mcp-agents admits an agent to the
      # application; these grant its tools, one per backend, checked by
      # each backend's AgentgatewayPolicy CEL. Not bound to the application.
      - id: agent-role-k8s-read-group
        model: authentik_core.group
        identifiers:
          name: agent-role-k8s-read
        attrs:
          is_superuser: false
      - id: agent-role-graph-write-group
        model: authentik_core.group
        identifiers:
          name: agent-role-graph-write
        attrs:
          is_superuser: false
      - id: agent-role-pg-read-group
        model: authentik_core.group
        identifiers:
          name: agent-role-pg-read
        attrs:
          is_superuser: false
      - id: agent-role-github-read-group
        model: authentik_core.group
        identifiers:
          name: agent-role-github-read
        attrs:
          is_superuser: false

      - id: mcp-oauth2-provider
        model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: Kubani agentgateway MCP
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: public
          # Blueprint-created providers get an empty grant_types list, which
          # makes every authorize call fail (see the Grafana provider above).
          # client_credentials is for agents (plan 2.7).
          grant_types:
            - authorization_code
            - refresh_token
            - client_credentials
          client_id: kubani-agentgateway-mcp
          sub_mode: user_username
          include_claims_in_id_token: true
          # MCP clients listen on a localhost port for the OAuth callback:
          # Claude Code on /callback, MCP Inspector on /oauth/callback.
          redirect_uris:
            - matching_mode: regex
              url: '^http://localhost:[0-9]+/(oauth/)?callback$'
            - matching_mode: regex
              url: '^http://127\.0\.0\.1:[0-9]+/(oauth/)?callback$'
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            # Without it Authentik drops a requested offline_access scope and
            # issues no refresh token, despite the refresh_token grant.
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]

      - id: mcp-application
        model: authentik_core.application
        identifiers:
          slug: agentgateway-mcp
        attrs:
          name: MCP servers
          provider: !KeyOf mcp-oauth2-provider
          meta_launch_url: https://mcp.almckay.io
          policy_engine_mode: any

      # Only members of the three MCP groups may authorize against this
      # application.
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf mcp-application
          group: !KeyOf mcp-users-group
        attrs:
          order: 0
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf mcp-application
          group: !KeyOf mcp-admin-group
        attrs:
          order: 1
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf mcp-application
          group: !KeyOf mcp-agents-group
        attrs:
          order: 2

      # Test identities so the MCP gate can be run without a person
      # (Al, 2026-10-18). Service accounts cannot log in interactively; they
      # get tokens with the client_credentials grant, using their app
      # password, which Authentik generates (no key in git; read it with
      # `ak shell` when testing, never write it to a file in the repo).
      # mcp-test-user: in mcp-users, expects 200 and the read tools.
      # mcp-test-outsider: in mcp-admin only, so Authentik issues a token
      # but the gateway's per-tool CEL (mcp-users or mcp-agents) filters
      # every tool: expect 200 with an empty tools/list and refused calls.
      # Move it to a different group when mcp-admin gains write tools.
      # Revoke by setting state: absent on the four entries below.
      - id: mcp-test-user
        model: authentik_core.user
        identifiers:
          username: mcp-test-user
        attrs:
          name: MCP gate test user
          type: service_account
          path: kubani/mcp-test
          groups:
            - !KeyOf mcp-users-group
      - id: mcp-test-outsider
        model: authentik_core.user
        identifiers:
          username: mcp-test-outsider
        attrs:
          name: MCP gate test outsider
          type: service_account
          path: kubani/mcp-test
          groups:
            - !KeyOf mcp-admin-group
      - model: authentik_core.token
        identifiers:
          identifier: mcp-test-user-app-password
        attrs:
          user: !KeyOf mcp-test-user
          intent: app_password
          expiring: false
          description: client_credentials for the MCP gate tests
      - model: authentik_core.token
        identifiers:
          identifier: mcp-test-outsider-app-password
        attrs:
          user: !KeyOf mcp-test-outsider
          intent: app_password
          expiring: false
          description: client_credentials for the MCP gate tests
  # OpenShell (plan docs/plans/ideas/2026-10-17-mcp-gateway-openshell-tetragon.md,
  # 3.1 and decision D6). The gateway validates tokens from this provider:
  # issuer https://auth.almckay.io/application/o/openshell/, audience = the
  # client_id below (apps/openshell/helmrelease.yaml server.oidc), roles from
  # the groups claim. Public client with PKCE for the CLI; the client_id is
  # not a credential. Rollback: state: absent on these entries first, then
  # remove the key (authentik-app skill red flag).
  kubani-openshell.yaml: |
    version: 1
    metadata:
      name: Kubani - OpenShell
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - id: openshell-admin-group
        model: authentik_core.group
        identifiers:
          name: openshell-admin
        attrs:
          is_superuser: false
      - id: openshell-user-group
        model: authentik_core.group
        identifiers:
          name: openshell-user
        attrs:
          is_superuser: false
      # Gate only: admitted to the application but holding neither OpenShell
      # role, so the gateway's own role check is what refuses it. Remove
      # with the test identities below.
      - id: openshell-test-norole-group
        model: authentik_core.group
        identifiers:
          name: openshell-test-norole
        attrs:
          is_superuser: false

      - id: openshell-oauth2-provider
        model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: Kubani OpenShell
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: public
          # Set explicitly: blueprint-created providers otherwise get an
          # empty list and every authorize call fails (Grafana provider).
          # client_credentials is for the gate's test identities.
          grant_types:
            - authorization_code
            - refresh_token
            - client_credentials
          client_id: kubani-openshell
          sub_mode: user_username
          include_claims_in_id_token: true
          # The CLI listens on a loopback port for the OAuth callback.
          redirect_uris:
            - matching_mode: regex
              url: '^http://localhost:[0-9]+/.*$'
            - matching_mode: regex
              url: '^http://127\.0\.0\.1:[0-9]+/.*$'
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]

      - id: openshell-application
        model: authentik_core.application
        identifiers:
          slug: openshell
        attrs:
          name: OpenShell
          provider: !KeyOf openshell-oauth2-provider
          meta_launch_url: https://openshell.almckay.io
          policy_engine_mode: any

      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf openshell-application
          group: !KeyOf openshell-admin-group
        attrs:
          order: 0
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf openshell-application
          group: !KeyOf openshell-user-group
        attrs:
          order: 1
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf openshell-application
          group: !KeyOf openshell-test-norole-group
        attrs:
          order: 2

      # Gate identities, same pattern as the MCP ones: service accounts that
      # get tokens with client_credentials and their Authentik-generated app
      # password (read with `ak shell` when testing; never written to a file
      # in the repo). Revoke by setting state: absent on these entries and
      # the norole group and binding above.
      - id: openshell-test-user
        model: authentik_core.user
        identifiers:
          username: openshell-test-user
        attrs:
          name: OpenShell gate test user
          type: service_account
          path: kubani/openshell-test
          groups:
            - !KeyOf openshell-user-group
      - id: openshell-test-outsider
        model: authentik_core.user
        identifiers:
          username: openshell-test-outsider
        attrs:
          name: OpenShell gate test outsider
          type: service_account
          path: kubani/openshell-test
          groups:
            - !KeyOf openshell-test-norole-group
      - model: authentik_core.token
        identifiers:
          identifier: openshell-test-user-app-password
        attrs:
          user: !KeyOf openshell-test-user
          intent: app_password
          expiring: false
          description: client_credentials for the OpenShell gate tests
      - model: authentik_core.token
        identifiers:
          identifier: openshell-test-outsider-app-password
        attrs:
          user: !KeyOf openshell-test-outsider
          intent: app_password
          expiring: false
          description: client_credentials for the OpenShell gate tests
