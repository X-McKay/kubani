apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: auth
  annotations:
    kubani.io/activation-gate: merge-authorizes-reviewed-post-migration-workloads
    kubani.io/migration-revision: a96a321914b964a65a86d8e549a27035f855aa9f # pragma: allowlist secret
    kubani.io/migration-evidence-manifest-sha256: 4b6678099656af14ef84776b7e4b3262d3ec5642646c4a6636ee89c9bf13250c # pragma: allowlist secret
    kubani.io/recovery-backup-sha256: 73819ad68e0bc60e7888dfba0604b7cb9bdaa93b6f226f23fe02fe8e1362f00c # pragma: allowlist secret
spec:
  interval: 10m
  maxHistory: 3
  chart:
    spec:
      chart: authentik
      # The completed live ladder visited every required calendar release.
      # This activation is bound to its retained evidence above.
      version: "2026.5.6"
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    blueprints:
      configMaps:
        - authentik-blueprints

    # Global configuration
    global:
      image:
        tag: "2026.5.6"
        digest: sha256:ed120caf710ccf82ef0026f0bc74e51615bc95ebff228a7a2d6fc60c441c3868
      env:
        - name: AUTHENTIK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: authentik-credentials
              key: secret-key
        - name: AUTHENTIK_POSTGRESQL__HOST
          value: postgresql.database.svc.cluster.local
        - name: AUTHENTIK_POSTGRESQL__NAME
          value: authentik
        - name: AUTHENTIK_POSTGRESQL__USER
          value: authentik
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-credentials
              key: postgres-password
        - name: AUTHENTIK_BOOTSTRAP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-credentials
              key: bootstrap-password
        - name: AUTHENTIK_BOOTSTRAP_TOKEN
          valueFrom:
            secretKeyRef:
              name: authentik-credentials
              key: bootstrap-token

    # Server configuration
    server:
      replicas: 1
      nodeSelector:
        kubernetes.io/hostname: asio
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 2000m
          memory: 1Gi
      # authentik-server's bootstrap retries postgres for ~30s then exits.
      # Wait here instead so brief postgres unavailability doesn't churn restarts.
      initContainers:
        - name: wait-for-postgres
          image: postgres:18-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgresql.database.svc.cluster.local -p 5432 -U authentik; do
                echo "waiting for postgres"
                sleep 5
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      # Increase startup probe timeout for slow cold starts
      startupProbe:
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 10
        failureThreshold: 60  # 10 minutes max startup time
      # Increase liveness/readiness probe timeouts to prevent false failures
      # during background operations (e.g., brand certificate updates, outpost sync)
      livenessProbe:
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 10
        failureThreshold: 5
      readinessProbe:
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 10
        failureThreshold: 5

    # Worker configuration
    worker:
      replicas: 1
      nodeSelector:
        kubernetes.io/hostname: strix
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 2000m
          memory: 1Gi

    # Disable built-in PostgreSQL (we use external)
    postgresql:
      enabled: false

    # Disable built-in Redis (optional - can enable if needed)
    redis:
      enabled: false
