    kubani.io/recovery-backup: authentik-live-alignment-v1-20260825.sql.gz.enc
    kubani.io/removal-condition: authentik-2026-5-6-post-upgrade-evidence-accepted
spec:
  suspend: true
  activeDeadlineSeconds: 900
  backoffLimit: 0
  template:
