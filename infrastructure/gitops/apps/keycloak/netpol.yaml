# Stage KC1. Keycloak-specific additions to the auth namespace's central set
# (infrastructure/networking/netpol-auth.yaml), which already gives every pod
# in `auth`: ingress from Traefik and from the same namespace, egress to DNS,
# PostgreSQL (5432), the same namespace (Authentik's back-channel URLs in the
# realm's `authentik` identity provider) and any :443/:80. These policies are
# additive and select only the Keycloak pod.
#
# Spec 5.3, last paragraph: the IdP accepts in-cluster traffic only from
# ai-gateway (JWKS for the agents listener; native exchange in 8.11) and
# agent-platform (APS token forwarding and exchange, Registry Controller
# admin API), plus humans through the existing ingress. Ports are the pod's
# container ports (Service DNAT happens before policy).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-keycloak-from-agent-platform
  namespace: auth
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  policyTypes:
    - Ingress
  ingress:
    # Both gateway components: which of them fetches a remote JWKS is
    # checked in ring 0, not assumed (same reasoning as allow-ai-gateway-jwks).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai-gateway
          podSelector:
            matchLabels:
              app.kubernetes.io/name: agents
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai-gateway
          podSelector:
            matchLabels:
              app.kubernetes.io/name: agentgateway
      ports:
        - port: 8080
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agent-platform
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [agent-policy-service, registry-controller]
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-keycloak-monitoring-scrape
  namespace: auth
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 9000
          protocol: TCP
---
# Keycloak -> kube-apiserver for the cluster's OIDC discovery and JWKS
# (spec 7.2). Same two destinations as the agentgateway control plane's
# apiserver rule: the in-cluster ClusterIP on 443 and, after DNAT, the
# servers' Tailscale addresses on 6443.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-keycloak-to-apiserver-egress
  namespace: auth
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.43.0.1/32
      ports:
        - port: 443
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 100.64.0.0/10
      ports:
        - port: 6443
          protocol: TCP
