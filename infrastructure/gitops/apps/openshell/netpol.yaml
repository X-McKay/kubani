# tier: optional (OpenShell, plan 2026-10-17 section 3)
#
# openshell: the gateway. In from Traefik (the openshell.almckay.io TCP
# route) and from sandbox supervisors calling back. Out to DNS, the API
# server (the Kubernetes driver and the certgen hook), Traefik (Authentik's
# issuer and JWKS: auth.almckay.io resolves to Traefik in-cluster through
# the CoreDNS split horizon), and the sandboxes it drives.
#
# openshell-sandboxes: in only from the gateway. Sandbox egress is not
# limited here: the supervisor enforces each sandbox's OpenShell network
# policy (plan 3.2 item 2 tests that a sandbox with no allow rule cannot
# reach the internet, in O3).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: openshell
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-ingress
  namespace: openshell
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openshell
      app.kubernetes.io/instance: openshell
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshell-sandboxes
    ports:
    - port: 8080
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress
  namespace: openshell
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  - to:
    - ipBlock:
        cidr: 10.43.0.1/32
    ports:
    - port: 443
      protocol: TCP
  - to:
    - ipBlock:
        cidr: 100.64.0.0/10
    ports:
    - port: 6443
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
    ports:
    - port: 443
      protocol: TCP
    - port: 8443
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshell-sandboxes
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: openshell-sandboxes
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-gateway
  namespace: openshell-sandboxes
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshell
      podSelector:
        matchLabels:
          app.kubernetes.io/name: openshell
          app.kubernetes.io/instance: openshell
