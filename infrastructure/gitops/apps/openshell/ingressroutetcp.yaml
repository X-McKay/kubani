# openshell.almckay.io (decision D6: tailnet access, Authentik OIDC).
# TLS passthrough: the gateway terminates TLS itself and presents the
# Let's Encrypt certificate for this name (helmrelease.yaml), so Traefik
# routes on SNI and never decrypts. On websecure a TCP router that matches
# the SNI wins over HTTP routers, so no new entrypoint is needed.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: openshell
  namespace: openshell
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`openshell.almckay.io`)
      services:
        - name: openshell
          port: 8080
  tls:
    passthrough: true
---
# DNS only. external-dns watches Ingress objects and nothing else
# (infrastructure/external-dns/helmrelease.yaml), and there is no wildcard
# record, so without this Ingress openshell.almckay.io would not resolve.
# Its HTTP router on websecure never receives a request: the passthrough
# TCP router above matches the same SNI first. No tls block, so
# cert-manager issues nothing for it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openshell-dns
  namespace: openshell
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: openshell.almckay.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openshell
                port:
                  number: 8080
