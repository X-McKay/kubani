# Runner scale set for X-McKay/zetra-agents. Workflows select it with
#   runs-on: kubani-zetra-agents
# (set the zetra-agents repo variable RELEASE_RUNNER to that value).
#
# Credentials: Secret arc-github-app (github-app.enc.yaml), the kubani-arc
# GitHub App installed on zetra-agents and zetra (scale-set-zetra.yaml), with
# Administration read/write and Metadata read. No webhook; the listener
# long-polls GitHub.
#
# zetra-agents is public, so the runner itself refuses every job except a
# release-tag push of release.yml (job-guard.yaml); see the GitHub-side
# settings in README.md.
#
# Runners are ephemeral (one job per pod) and scale from zero. Images are
# pinned by digest and pulled from the local registry: registry.almckay.io/
# mirror/<upstream host>/<path> holds byte-identical copies (same digest), so
# runner starts need no external DNS or registry. To bump, copy the new
# upstream digest first, then change the reference here, e.g.
#   crane copy ghcr.io/actions/actions-runner:<v>@sha256:<d> \
#     registry.almckay.io/mirror/ghcr.io/actions/actions-runner:<v>
# Bump actions-runner within GitHub's support window (runners older than
# ~30 days behind the latest release are refused).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubani-zetra-agents
  namespace: arc-runners
spec:
  interval: 1h
  maxHistory: 3
  timeout: 10m
  dependsOn:
    - name: arc-controller
      namespace: arc-systems
  chartRef:
    kind: OCIRepository
    name: arc-scale-set
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    githubConfigUrl: https://github.com/X-McKay/zetra-agents
    githubConfigSecret: arc-github-app  # pragma: allowlist secret (Secret name, not a value)
    runnerScaleSetName: kubani-zetra-agents
    minRunners: 0
    maxRunners: 2
    controllerServiceAccount:
      namespace: arc-systems
      name: arc-controller-gha-rs-controller
    listenerTemplate:
      spec:
        nodeSelector:
          topology.kubani.io/role: platform
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: listener
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
    # No containerMode: with `type: dind` the chart renders its own unpinned
    # init-dind-externals and dind containers and volumes and then appends
    # these, so every name would be duplicated. This is the chart's dind
    # layout written out once, with pinned images.
    template:
      spec:
        # The runner pod runs as a Kata VM. dockerd is privileged, so a job
        # can be root wherever dockerd runs; under Kata that is the guest
        # kernel, not rig0 (containerd's kata handler uses
        # privileged_without_host_devices). The RuntimeClass's own node
        # selector places the pod on the Kata node.
        runtimeClassName: kata-qemu-runtime-rs
        nodeSelector:
          topology.kubani.io/role: platform
        initContainers:
          - name: init-dind-externals
            image: registry.almckay.io/mirror/ghcr.io/actions/actions-runner:2.338.2@sha256:759a1d94a15b05941aba5196974ff43fe15b4cbba29b694b35cbc32a1166b232
            command: ["cp", "-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
            volumeMounts:
              - name: dind-externals
                mountPath: /home/runner/tmpDir
          - name: dind
            image: registry.almckay.io/mirror/docker.io/library/docker:29.8.2-dind@sha256:1e08cdb63405ca788aea94ef35b792d1e299607c667d33d7bcbcae1fd2611ced
            # Inherit the guest network MTU rather than Docker's 1500 default.
            # Keep the image entrypoint's dockerd setup after validating sysfs.
            command: ["/bin/sh", "-ec"]
            args:
              - |
                IFS= read -r mtu < /sys/class/net/eth0/mtu
                case "$mtu" in
                  ''|*[!0-9]*) echo "invalid guest MTU" >&2; exit 1 ;;
                esac
                if [ "${#mtu}" -gt 5 ] || [ "$mtu" -lt 576 ] || [ "$mtu" -gt 65535 ]; then
                  echo "guest MTU outside supported IPv4 range" >&2
                  exit 1
                fi
                exec /usr/local/bin/dockerd-entrypoint.sh dockerd \
                  --host=unix:///var/run/docker.sock \
                  --group="${DOCKER_GROUP_GID}" --mtu="$mtu"
            env:
              - name: DOCKER_GROUP_GID
                value: "123"
            securityContext:
              privileged: true
            restartPolicy: Always
            startupProbe:
              exec:
                command: [docker, info]
              initialDelaySeconds: 0
              failureThreshold: 24
              periodSeconds: 5
            resources:
              # The limit covers dockerd, the build's processes and the
              # tmpfs storage below (tmpfs pages are charged to this
              # container). Sampled peaks are about 1.4Gi, for agent
              # releases and for the first platform image build
              # (2026-11-12). The memory request equals the limit so the
              # scheduler counts what the pod may use: rig0 then holds two
              # runner pods at once and a third waits. See "Memory on rig0"
              # in README.md before changing either figure.
              requests: {cpu: 500m, memory: 4Gi}
              limits: {memory: 4Gi}
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: dind-sock
                mountPath: /var/run
              - name: dind-externals
                mountPath: /home/runner/externals
              - name: dind-storage
                mountPath: /var/lib/docker
        containers:
          - name: runner
            image: registry.almckay.io/mirror/ghcr.io/actions/actions-runner:2.338.2@sha256:759a1d94a15b05941aba5196974ff43fe15b4cbba29b694b35cbc32a1166b232
            command: ["/home/runner/run.sh"]
            env:
              - name: DOCKER_HOST
                value: unix:///var/run/docker.sock
              - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
                value: "120"
              # Refuses every job except a release-tag push of release.yml
              # (job-guard.yaml). Runs before any step of the job.
              - name: ACTIONS_RUNNER_HOOK_JOB_STARTED
                value: /home/runner/hooks/job-started.sh
            resources:
              # An agent release peaks at about 3.6Gi here while it signs
              # and scans; a platform image build used 0.45Gi. Request
              # equals limit, as for dind.
              requests: {cpu: 250m, memory: 4Gi}
              limits: {memory: 4Gi}
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: dind-sock
                mountPath: /var/run
              - name: job-guard
                mountPath: /home/runner/hooks
                readOnly: true
        volumes:
          - name: job-guard
            configMap:
              name: runner-job-guard
              defaultMode: 0555
          - name: work
            emptyDir: {}
          # Memory-backed so Kata keeps it as tmpfs inside the guest. A
          # disk emptyDir is shared from the host over virtio-fs, and the
          # runner could not connect to dockerd's unix socket across it
          # ("Cannot connect to the Docker daemon"), although dind's own
          # `docker info` probe passed.
          - name: dind-sock
            emptyDir:
              medium: Memory
              sizeLimit: 1Mi
          - name: dind-externals
            emptyDir: {}
          # dockerd's data root. Without a volume it sat on the dind
          # container's root filesystem, which Kata shares from the host
          # over virtio-fs, and BuildKit failed hashing files there
          # ("failed to create hash for /uv: operation not supported").
          # Memory-backed is tmpfs inside the guest. It is per job and freed
          # when the runner pod ends; sizeLimit bounds a build's layers.
          - name: dind-storage
            emptyDir:
              medium: Memory
              sizeLimit: 3Gi
