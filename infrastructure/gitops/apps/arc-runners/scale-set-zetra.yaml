# Runner scale set for X-McKay/zetra (platform image builds). Workflows select
# it with
#   runs-on: kubani-zetra
# in the workflow file itself (no repository variable).
#
# Same as scale-set-zetra-agents.yaml: the Kata runtime class and node
# placement, the pinned runner and dind images, the dind MTU wrapper, the
# resources, the security settings, the dind volumes, the listener template,
# and the credentials (Secret arc-github-app, the kubani-arc GitHub App, which
# must also be installed on zetra; no webhook, the listener long-polls GitHub).
#
# Differs from it only in:
#   - the repository and scale set name, and maxRunners: 1 (platform builds
#     run one at a time; the build sidecar has been OOM-killed at 12Gi);
#   - the job guard: ConfigMap runner-job-guard-zetra (job-guard-zetra.yaml)
#     admits only a push to refs/heads/main running platform-release.yml;
#   - the runner container also mounts the registry push login, Secret
#     registry-platform-push, as the docker client's config file (below).
#     The Secret is created by the operator, see README.md; until it exists
#     a runner pod would not start, but with minRunners: 0 none is scheduled
#     until a job is queued.
#
# Image pins and the mirror/bump procedure are those of
# scale-set-zetra-agents.yaml; bump the two files together.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubani-zetra
  namespace: arc-runners
spec:
  interval: 1h
  maxHistory: 3
  timeout: 10m
  dependsOn:
    - name: arc-controller
      namespace: arc-systems
  chartRef:
    kind: OCIRepository
    name: arc-scale-set
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    githubConfigUrl: https://github.com/X-McKay/zetra
    githubConfigSecret: arc-github-app  # pragma: allowlist secret (Secret name, not a value)
    runnerScaleSetName: kubani-zetra
    minRunners: 0
    maxRunners: 1
    controllerServiceAccount:
      namespace: arc-systems
      name: arc-controller-gha-rs-controller
    listenerTemplate:
      spec:
        nodeSelector:
          topology.kubani.io/role: platform
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: listener
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
    # No containerMode: see scale-set-zetra-agents.yaml. This is the same
    # dind layout written out once, with pinned images.
    template:
      spec:
        # Kata VM, as in scale-set-zetra-agents.yaml: dockerd is privileged,
        # and under Kata that is the guest kernel, not rig0.
        runtimeClassName: kata-qemu-runtime-rs
        nodeSelector:
          topology.kubani.io/role: platform
        initContainers:
          - name: init-dind-externals
            image: registry.almckay.io/mirror/ghcr.io/actions/actions-runner:2.338.2@sha256:759a1d94a15b05941aba5196974ff43fe15b4cbba29b694b35cbc32a1166b232
            command: ["cp", "-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
            volumeMounts:
              - name: dind-externals
                mountPath: /home/runner/tmpDir
          - name: dind
            image: registry.almckay.io/mirror/docker.io/library/docker:29.8.2-dind@sha256:1e08cdb63405ca788aea94ef35b792d1e299607c667d33d7bcbcae1fd2611ced
            # Inherit the guest network MTU rather than Docker's 1500 default.
            # Keep the image entrypoint's dockerd setup after validating sysfs.
            command: ["/bin/sh", "-ec"]
            args:
              - |
                IFS= read -r mtu < /sys/class/net/eth0/mtu
                case "$mtu" in
                  ''|*[!0-9]*) echo "invalid guest MTU" >&2; exit 1 ;;
                esac
                if [ "${#mtu}" -gt 5 ] || [ "$mtu" -lt 576 ] || [ "$mtu" -gt 65535 ]; then
                  echo "guest MTU outside supported IPv4 range" >&2
                  exit 1
                fi
                exec /usr/local/bin/dockerd-entrypoint.sh dockerd \
                  --host=unix:///var/run/docker.sock \
                  --group="${DOCKER_GROUP_GID}" --mtu="$mtu"
            env:
              - name: DOCKER_GROUP_GID
                value: "123"
            securityContext:
              privileged: true
            restartPolicy: Always
            startupProbe:
              exec:
                command: [docker, info]
              initialDelaySeconds: 0
              failureThreshold: 24
              periodSeconds: 5
            resources:
              # The limit covers dockerd plus its tmpfs storage below
              # (tmpfs pages are charged to this container).
              requests: {cpu: 500m, memory: 1Gi}
              limits: {memory: 12Gi}
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: dind-sock
                mountPath: /var/run
              - name: dind-externals
                mountPath: /home/runner/externals
              - name: dind-storage
                mountPath: /var/lib/docker
        containers:
          - name: runner
            image: registry.almckay.io/mirror/ghcr.io/actions/actions-runner:2.338.2@sha256:759a1d94a15b05941aba5196974ff43fe15b4cbba29b694b35cbc32a1166b232
            command: ["/home/runner/run.sh"]
            env:
              - name: DOCKER_HOST
                value: unix:///var/run/docker.sock
              - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
                value: "120"
              # Refuses every job except a push to main running
              # platform-release.yml (job-guard-zetra.yaml). Runs before any
              # step of the job.
              - name: ACTIONS_RUNNER_HOOK_JOB_STARTED
                value: /home/runner/hooks/job-started.sh
            resources:
              requests: {cpu: 250m, memory: 512Mi}
              limits: {memory: 4Gi}
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: dind-sock
                mountPath: /var/run
              - name: job-guard
                mountPath: /home/runner/hooks
                readOnly: true
              # The docker client's configuration directory (the runner image
              # runs as user `runner`, HOME=/home/runner). It is writable
              # scratch because the client and buildx write there; only the
              # login file is laid over it, read-only, from the Secret. The
              # dind container does not mount either. A disk emptyDir, like
              # `work`: the zetra-agents release keeps its docker client
              # configuration under `work` and builds with it, so this is
              # the medium already in use for that directory.
              - name: docker-config
                mountPath: /home/runner/.docker
              - name: registry-push
                mountPath: /home/runner/.docker/config.json
                subPath: config.json
                readOnly: true
        volumes:
          - name: job-guard
            configMap:
              name: runner-job-guard-zetra
              defaultMode: 0555
          # Created by the operator (README.md), not by Flux. Not optional: a
          # missing login must stop the pod, not give a job that pushes
          # nothing. 0444 because the file is owned by root and read by the
          # runner user; no other container in the pod mounts it.
          - name: registry-push
            secret:
              secretName: registry-platform-push  # pragma: allowlist secret (Secret name, not a value)
              defaultMode: 0444
              items:
                - key: .dockerconfigjson
                  path: config.json
          - name: docker-config
            emptyDir: {}
          - name: work
            emptyDir: {}
          # Memory-backed so Kata keeps it as tmpfs inside the guest; see
          # scale-set-zetra-agents.yaml for why.
          - name: dind-sock
            emptyDir:
              medium: Memory
              sizeLimit: 1Mi
          - name: dind-externals
            emptyDir: {}
          # dockerd's data root, tmpfs inside the guest, bounded per job; see
          # scale-set-zetra-agents.yaml.
          - name: dind-storage
            emptyDir:
              medium: Memory
              sizeLimit: 8Gi
