apiVersion: v1
kind: ConfigMap
metadata:
  name: starbase-dojo-database-bootstrap-v1
  namespace: database
  labels:
    app.kubernetes.io/name: starbase-dojo-database-bootstrap
    app.kubernetes.io/part-of: starbase
data:
  bootstrap.sh: |
    #!/bin/sh
    set -eu
    set +x
    umask 077

    readonly host="postgresql.database.svc.cluster.local"
    readonly password_pattern='^[A-Za-z0-9_-]{43,128}$'

    require_password() {
      variable="$1"
      value="$(printenv "$variable")"
      if ! printf '%s' "$value" | grep -Eq "$password_pattern"; then
        printf 'invalid generated credential in %s\n' "$variable" >&2
        exit 2
      fi
    }

    require_password DOJO_RUNTIME_PASSWORD
    require_password DOJO_MIGRATOR_PASSWORD
    export PGPASSWORD="$POSTGRES_ADMIN_PASSWORD"

    create_role() {
      export STARBASE_BOOTSTRAP_ROLE="$1"
      export STARBASE_BOOTSTRAP_CREDENTIAL="$2"
      psql --host="$host" --username=postgres --dbname=postgres \
        --set=ON_ERROR_STOP=1 <<'SQL'
    \getenv role STARBASE_BOOTSTRAP_ROLE
    \getenv credential STARBASE_BOOTSTRAP_CREDENTIAL
    SET log_statement = 'none';
    SELECT format(
      'CREATE ROLE %I LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION',
      :'role', :'credential'
    ) WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'role') \gexec
    SELECT format(
      'ALTER ROLE %I LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION',
      :'role', :'credential'
    ) \gexec
    SQL
      unset STARBASE_BOOTSTRAP_ROLE STARBASE_BOOTSTRAP_CREDENTIAL
    }

    create_role starbase_dojo_runtime "$DOJO_RUNTIME_PASSWORD"
    create_role starbase_dojo_migrator "$DOJO_MIGRATOR_PASSWORD"

    psql --host="$host" --username=postgres --dbname=postgres \
      --set=ON_ERROR_STOP=1 <<'SQL'
    SELECT 'CREATE DATABASE starbase_dojo OWNER starbase_dojo_migrator'
      WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'starbase_dojo') \gexec
    ALTER DATABASE starbase_dojo OWNER TO starbase_dojo_migrator;
    REVOKE ALL ON DATABASE starbase_dojo FROM PUBLIC;
    GRANT CONNECT ON DATABASE starbase_dojo TO starbase_dojo_runtime, starbase_dojo_migrator;
    SQL

    psql --host="$host" --username=postgres --dbname=starbase_dojo \
      --set=ON_ERROR_STOP=1 <<'SQL'
    REVOKE CREATE ON SCHEMA public FROM PUBLIC;
    CREATE SCHEMA IF NOT EXISTS dojo AUTHORIZATION starbase_dojo_migrator;
    ALTER SCHEMA dojo OWNER TO starbase_dojo_migrator;
    GRANT USAGE ON SCHEMA dojo TO starbase_dojo_runtime;
    GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA dojo TO starbase_dojo_runtime;
    GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA dojo TO starbase_dojo_runtime;
    ALTER DEFAULT PRIVILEGES FOR ROLE starbase_dojo_migrator IN SCHEMA dojo
      GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO starbase_dojo_runtime;
    ALTER DEFAULT PRIVILEGES FOR ROLE starbase_dojo_migrator IN SCHEMA dojo
      GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO starbase_dojo_runtime;
    SQL

    printf 'Starbase Dojo database bootstrap completed without emitting credentials.\n'
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: starbase-dojo-database-bootstrap
  namespace: database
  labels:
    app.kubernetes.io/name: starbase-dojo-database-bootstrap
    app.kubernetes.io/part-of: starbase
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: starbase-dojo-database-bootstrap-v1-66e26e025d98
  namespace: database
  labels:
    app.kubernetes.io/name: starbase-dojo-database-bootstrap
    app.kubernetes.io/part-of: starbase
  annotations:
    starbase.io/activation-state: authorized-preproduction
    starbase.io/activation-stage: phase8-dojo-database-bootstrap
    starbase.io/bootstrap-contract-digest: sha256:66e26e025d98ca8747bbd5049279aed33120cc8c1474efd6fe519cc688f45638
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: starbase-dojo-database-bootstrap
        app.kubernetes.io/part-of: starbase
    spec:
      serviceAccountName: starbase-dojo-database-bootstrap
      automountServiceAccountToken: false
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [asio, strix]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: docker.io/bitnami/postgresql@sha256:e93732718bf7fafa61a04abaa437fc601c80a791857105fd6fca18407b5725c9
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, /opt/starbase/bootstrap.sh]
          env:
            - name: POSTGRES_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: postgres-password
            - name: DOJO_RUNTIME_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: starbase-dojo-database-bootstrap
                  key: runtime-password
            - name: DOJO_MIGRATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: starbase-dojo-database-bootstrap
                  key: migrator-password
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: bootstrap
              mountPath: /opt/starbase/bootstrap.sh
              subPath: bootstrap.sh
              readOnly: true
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: bootstrap
          configMap:
            name: starbase-dojo-database-bootstrap-v1
            defaultMode: 365
        - name: temporary-files
          emptyDir: {sizeLimit: 16Mi}
---
apiVersion: v1
