apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dojo-to-postgresql
  namespace: starbase-execution
  labels: {app.kubernetes.io/part-of: starbase}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [starbase-dojo-runtime, starbase-dojo-migrator]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: database}
          podSelector:
            matchLabels: {app.kubernetes.io/name: postgresql}
      ports: [{protocol: TCP, port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dojo-to-temporal
  namespace: starbase-execution
  labels: {app.kubernetes.io/part-of: starbase}
spec:
  podSelector:
    matchLabels: {starbase.io/temporal-client: "true"}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: temporal}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: temporal
              app.kubernetes.io/instance: temporal
              app.kubernetes.io/component: frontend
      ports: [{protocol: TCP, port: 7233}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dojo-from-execution
  namespace: database
  labels: {app.kubernetes.io/part-of: starbase}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: postgresql}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: starbase-execution}
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [starbase-dojo-runtime, starbase-dojo-migrator]
      ports: [{protocol: TCP, port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dojo-bootstrap-to-postgresql
  namespace: database
  labels: {app.kubernetes.io/part-of: starbase}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: starbase-dojo-database-bootstrap}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: postgresql}
      ports: [{protocol: TCP, port: 5432}]
