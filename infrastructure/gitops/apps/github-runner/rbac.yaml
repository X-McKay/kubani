---
# Dedicated ServiceAccount for the Manus runner pods.
# The runner pods will use this account to interact with the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: manus-runner
  namespace: actions-runner-system
---
# ClusterRole granting the permissions Manus needs to read cluster state
# and perform approved write operations. Adjust verbs as your use case evolves.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manus-runner-role
rules:
  # Core resources: read-only
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/status
      - services
      - endpoints
      - namespaces
      - nodes
      - configmaps
      - events
      - persistentvolumeclaims
      - persistentvolumes
    verbs: ["get", "list", "watch"]

  # Core resources: limited writes (e.g., restarting pods via deletion)
  - apiGroups: [""]
    resources:
      - pods
    verbs: ["delete"]

  # Apps resources: read-only
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]

  # Apps resources: limited writes (e.g., rollout restart)
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
    verbs: ["patch", "update"]

  # Batch resources: read and create/delete jobs
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch", "create", "delete"]

  # Networking: read-only
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]

  # Helm/Flux: read-only (to inspect deployed releases)
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources:
      - helmreleases
    verbs: ["get", "list", "watch"]

  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources:
      - kustomizations
    verbs: ["get", "list", "watch"]
---
# Bind the ClusterRole to the dedicated manus-runner ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: manus-runner-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: manus-runner-role
subjects:
  - kind: ServiceAccount
    name: manus-runner
    namespace: actions-runner-system
