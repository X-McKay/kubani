apiVersion: apps/v1
kind: Deployment
metadata:
  name: starbase-preview-fixture
  namespace: starbase-connectors
spec:
  template:
    metadata:
      annotations:
        starbase.io/route-fixture-revision: v2
    spec:
      volumes:
        - name: fixture
          configMap:
            name: starbase-autonomous-route-fixture-v2
            defaultMode: 288
            items:
              - key: repository.json
                path: repository.json
