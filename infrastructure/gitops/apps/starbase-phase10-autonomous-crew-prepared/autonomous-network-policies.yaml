apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-core-to-bounty-temporal
  namespace: starbase-system
  labels:
    app.kubernetes.io/part-of: starbase
    app.kubernetes.io/component: autonomous-crew
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: starbase-core
      starbase.io/temporal-client: "true"
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: temporal}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: temporal
              app.kubernetes.io/instance: temporal
              app.kubernetes.io/component: frontend
      ports: [{protocol: TCP, port: 7233}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-starbase-core-bounty-ingress
  namespace: temporal
  labels:
    app.kubernetes.io/part-of: starbase
    app.kubernetes.io/component: autonomous-crew
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: temporal
      app.kubernetes.io/instance: temporal
      app.kubernetes.io/component: frontend
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: starbase-system}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: starbase-core
              starbase.io/temporal-client: "true"
      ports: [{protocol: TCP, port: 7233}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-core-to-bounty-model-https
  namespace: starbase-system
  annotations:
    starbase.io/endpoint-observed-at: "2026-09-05T07:19:24Z"
    starbase.io/revalidate-before-activation: "true"
  labels:
    app.kubernetes.io/part-of: starbase
    app.kubernetes.io/component: autonomous-crew
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: starbase-core
      starbase.io/temporal-client: "true"
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 100.71.65.62/32 # sparky
        - ipBlock:
            cidr: 100.76.45.84/32 # strix
        - ipBlock:
            cidr: 100.77.107.81/32 # rig0
        - ipBlock:
            cidr: 100.92.107.71/32 # asio
      ports: [{protocol: TCP, port: 443}]
