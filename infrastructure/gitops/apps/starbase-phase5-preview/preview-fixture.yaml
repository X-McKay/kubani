apiVersion: v1
kind: ServiceAccount
metadata:
  name: starbase-preview-fixture
  namespace: starbase-connectors
  labels:
    app.kubernetes.io/name: starbase-preview-fixture
    app.kubernetes.io/part-of: starbase
    starbase.io/environment: synthetic-preview
automountServiceAccountToken: false
imagePullSecrets:
  - name: starbase-ghcr-pull
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: starbase-preview-fixture-v1
  namespace: starbase-connectors
  labels:
    app.kubernetes.io/name: starbase-preview-fixture
    app.kubernetes.io/part-of: starbase
    starbase.io/environment: synthetic-preview
  annotations:
    starbase.io/content-digest: sha256:77987b3a5f73c776b74be05a56bc0d70e2325bfbd46c95c09cd05e1b64091e23
    starbase.io/load-profile: four-observations-every-30-seconds
immutable: true
data:
  repository.json: |
    {
      "owner": "starbase-preview",
      "name": "synthetic-observation",
      "issues": [
        {
          "number": 101,
          "title": "[SYNTHETIC PREVIEW] Review bounded repository issue",
          "updated_at": "2026-08-25T00:00:00Z"
        }
      ],
      "pull_requests": [
        {
          "number": 202,
          "title": "[SYNTHETIC PREVIEW] Review non-production pull request",
          "draft": false,
          "review_decision": "REVIEW_REQUIRED",
          "updated_at": "2026-08-25T00:01:00Z"
        }
      ],
      "workflow_runs": [
        {
          "id": 303,
          "name": "[SYNTHETIC PREVIEW] fixture-ci",
          "head_sha": "synthetic-preview-sha",
          "conclusion": "failure",
          "updated_at": "2026-08-25T00:02:00Z"
        }
      ],
      "branches": [
        {
          "name": "[SYNTHETIC PREVIEW] merged-branch",
          "sha": "synthetic-preview-branch-sha",
          "protected": false,
          "merged": true,
          "updated_at": "2026-06-01T00:00:00Z"
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: starbase-preview-fixture
  namespace: starbase-connectors
  labels:
    app.kubernetes.io/name: starbase-preview-fixture
    app.kubernetes.io/component: synthetic-connector
    app.kubernetes.io/part-of: starbase
    starbase.io/environment: synthetic-preview
  annotations:
    starbase.io/activation-state: authorized-synthetic-preview
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: starbase-preview-fixture
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: starbase-preview-fixture
        app.kubernetes.io/component: synthetic-connector
        app.kubernetes.io/part-of: starbase
        starbase.io/environment: synthetic-preview
      annotations:
        starbase.io/activation-state: authorized-synthetic-preview
    spec:
      automountServiceAccountToken: false
      serviceAccountName: starbase-preview-fixture
      terminationGracePeriodSeconds: 30
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - asio
                      - strix
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: connector
          image: ghcr.io/x-mckay/starbase/github-connector@sha256:f555ab876a929d68e35f02e879025ce7c98006888e942148be659c9dd0e2700b
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: starbase-connector-runtime
          env:
            - name: STARBASE_CONNECTOR_MODE
              value: fixture
            - name: STARBASE_FIXTURE_PATH
              value: /var/run/starbase-preview/repository.json
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health/live
              port: health
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
            - name: fixture
              mountPath: /var/run/starbase-preview
              readOnly: true
            - name: core-workload-identity
              mountPath: /var/run/secrets/starbase.io/core
              readOnly: true
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 64Mi
        - name: fixture
          configMap:
            name: starbase-preview-fixture-v1
            defaultMode: 288
            items:
              - key: repository.json
                path: repository.json
        - name: core-workload-identity
          projected:
            defaultMode: 288
            sources:
              - serviceAccountToken:
                  audience: starbase-core
                  expirationSeconds: 600
                  path: token
