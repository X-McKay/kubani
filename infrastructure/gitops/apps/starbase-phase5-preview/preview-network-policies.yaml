apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-preview-fixture-to-core
  namespace: starbase-connectors
  labels:
    app.kubernetes.io/part-of: starbase
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: starbase-preview-fixture
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: starbase-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: starbase-core
      ports:
        - protocol: TCP
          port: 8081
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-core-from-preview-fixture
  namespace: starbase-system
  labels:
    app.kubernetes.io/part-of: starbase
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: starbase-core
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: starbase-connectors
          podSelector:
            matchLabels:
              app.kubernetes.io/name: starbase-preview-fixture
      ports:
        - protocol: TCP
          port: 8081
