apiVersion: apps/v1
kind: Deployment
metadata:
  name: starbase-core
  namespace: starbase-system
  annotations:
    starbase.io/activation-state: authorized-synthetic-preview
spec:
  replicas: 1
  template:
    metadata:
      annotations:
        starbase.io/activation-state: authorized-synthetic-preview
        starbase.io/blocker: null
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - asio
                      - strix
      containers:
        - name: core
          env:
            - name: STARBASE_EXPECTED_SOURCES
              value: >-
                {"github:starbase-preview/synthetic-observation":"github"}
            - name: STARBASE_CONNECTOR_IDENTITIES
              value: >-
                {"system:serviceaccount:starbase-connectors:starbase-preview-fixture":["github"]}
