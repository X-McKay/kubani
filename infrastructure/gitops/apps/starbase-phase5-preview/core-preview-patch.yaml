apiVersion: apps/v1
kind: Deployment
metadata:
  name: starbase-core
  namespace: starbase-system
  annotations:
    starbase.io/activation-state: authorized-synthetic-preview
spec:
  replicas: 1
  template:
    metadata:
      annotations:
        starbase.io/activation-state: authorized-synthetic-preview
        starbase.io/blocker: null
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - asio
                      - strix
      containers:
        - name: core
          env:
            - name: STARBASE_EXPECTED_SOURCES
              value: >-
                {"github:starbase-preview/synthetic-observation":"github"}
            - name: STARBASE_CONNECTOR_IDENTITIES
              value: >-
                {"system:serviceaccount:starbase-connectors:starbase-preview-fixture":["github"]}
            - name: STARBASE_WORKLOAD_OIDC_TOKEN_FILE
              value: /var/run/secrets/starbase.io/workload-issuer-identity/token
          volumeMounts:
            - name: workload-issuer-identity
              mountPath: /var/run/secrets/starbase.io/workload-issuer-identity
              readOnly: true
      volumes:
        - name: workload-issuer-identity
          projected:
            defaultMode: 288
            sources:
              - serviceAccountToken:
                  audience: https://kubernetes.default.svc.cluster.local
                  expirationSeconds: 600
                  path: token
