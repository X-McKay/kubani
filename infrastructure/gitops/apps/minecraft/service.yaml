---
# Internal service for the Minecraft server
# Not exposed externally - playit.gg handles external access
apiVersion: v1
kind: Service
metadata:
  name: minecraft-bedrock
  namespace: minecraft
  labels:
    app.kubernetes.io/name: minecraft-bedrock
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: minecraft-bedrock
  ports:
    - name: bedrock
      port: 19132
      targetPort: 19132
      protocol: UDP
