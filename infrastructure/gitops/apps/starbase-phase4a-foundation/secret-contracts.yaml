apiVersion: v1
kind: ConfigMap
metadata:
  name: starbase-secret-contracts
  namespace: starbase-system
  labels:
    app.kubernetes.io/part-of: starbase
  annotations:
    starbase.io/activation-state: credentials-provisioned-inactive
    starbase.io/blocker: database-bootstrap-separately-authorized
data:
  contract-version: "1"
  database-bootstrap: >-
    database/starbase-database-bootstrap:
    core-runtime-password,core-migrator-password,
    gateway-runtime-password,gateway-migrator-password
  core-runtime: "starbase-system/starbase-core-runtime: database-url"
  gateway-runtime: >-
    starbase-system/starbase-gateway-runtime:
    database-url,session-encryption-key
  core-migration: "starbase-system/starbase-core-migration: database-url"
  gateway-migration: "starbase-system/starbase-gateway-migration: database-url"
