apiVersion: batch/v1
kind: Job
metadata:
  name: starbase-network-boundary-v1-c804f51209e6
  namespace: starbase-system
  labels:
    app.kubernetes.io/part-of: starbase
  annotations:
    starbase.io/activation-state: authorized
    starbase.io/activation-stage: phase4a-network-boundary
spec:
  suspend: false
  backoffLimit: 0
  activeDeadlineSeconds: 300
  # Retain the completed, content-named Job as immutable acceptance evidence.
  # Garbage collection could otherwise cause Flux to recreate and rerun it.
  ttlSecondsAfterFinished: null
  template:
    metadata:
      labels:
        app.kubernetes.io/name: starbase-core
        app.kubernetes.io/part-of: starbase
        starbase.io/network-boundary-probe: "true"
    spec:
      serviceAccountName: starbase-core
      automountServiceAccountToken: false
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [asio, strix]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verify
          image: docker.io/bitnami/postgresql@sha256:e93732718bf7fafa61a04abaa437fc601c80a791857105fd6fca18407b5725c9
          imagePullPolicy: IfNotPresent
          command: [/bin/bash, -ec]
          args:
            - |
              set -euo pipefail

              fail() {
                printf 'FAIL: %s\n' "$*" >&2
                exit 1
              }

              expect_tcp_blocked() {
                local host="$1"
                local port="$2"
                if timeout 2 bash -c "</dev/tcp/${host}/${port}" 2>/dev/null; then
                  fail "unexpected egress to ${host}:${port}"
                fi
              }

              api_status() {
                local path="$1"
                printf 'header = "Authorization: Bearer %s"\n' \
                  "$(</var/run/secrets/starbase.io/kubernetes-api/token)" |
                  curl --config - --silent --show-error --max-time 10 \
                    --cacert /var/run/secrets/starbase.io/kubernetes-api/ca.crt \
                    --output /dev/null --write-out '%{http_code}' \
                    "https://kubernetes.default.svc${path}"
              }

              timeout 5 bash -c '</dev/tcp/postgresql.database.svc.cluster.local/5432' ||
                fail 'required PostgreSQL path is unavailable'

              curl --fail --silent --show-error --location --max-time 10 \
                https://auth.almckay.io/application/o/starbase/.well-known/openid-configuration \
                >/dev/null || fail 'required Authentik discovery path is unavailable'

              issuer_status="$(api_status '/openid/v1/jwks')" ||
                fail 'required Kubernetes workload issuer path is unavailable'
              [[ "$issuer_status" == "200" ]] ||
                fail "Kubernetes workload issuer expected 200 and received ${issuer_status}"

              status="$(api_status '/api/v1/secrets?limit=1')" ||
                fail 'Kubernetes Secret-list request failed before authorization'
              [[ "$status" == "403" ]] ||
                fail "Kubernetes Secret read expected 403 and received ${status}"

              expect_tcp_blocked 169.254.169.254 80
              expect_tcp_blocked example.com 443

              printf 'PASS: Starbase core network and RBAC boundary verified\n'
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: kubernetes-api-identity
              mountPath: /var/run/secrets/starbase.io/kubernetes-api
              readOnly: true
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: kubernetes-api-identity
          projected:
            defaultMode: 288
            sources:
              - serviceAccountToken:
                  # K3s defaults API audiences to its service-account issuer.
                  # This token exists only to prove API authentication followed
                  # by RBAC denial; it is not a Starbase workload token.
                  audience: https://kubernetes.default.svc.cluster.local
                  expirationSeconds: 600
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        - name: temporary-files
          emptyDir:
            sizeLimit: 16Mi
