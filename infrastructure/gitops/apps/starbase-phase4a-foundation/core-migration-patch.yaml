apiVersion: batch/v1
kind: Job
metadata:
  name: starbase-core-migrate-67c24a8df537
  namespace: starbase-system
  annotations:
    starbase.io/activation-state: blocked
    starbase.io/activation-stage: phase4a-rc4-core-migration-pending
    starbase.io/blocker: migration-separately-authorized
spec:
  suspend: true
  # When separately activated, fail closed after one attempt and retain the
  # completed Job as immutable evidence through the gateway-migration gate. A
  # TTL would let Flux recreate and rerun it after garbage collection.
  backoffLimit: 0
  ttlSecondsAfterFinished: null
  template:
    spec:
      imagePullSecrets:
        - name: starbase-ghcr-pull
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution: null
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [asio, strix]
      containers:
        - name: migrate
          env:
            - name: STARBASE_CORE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: starbase-core-migration
                  key: database-url
