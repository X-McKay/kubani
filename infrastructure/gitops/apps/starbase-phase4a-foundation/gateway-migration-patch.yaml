apiVersion: batch/v1
kind: Job
metadata:
  name: starbase-gateway-migrate-5856bef074b5
  namespace: starbase-system
  annotations:
    starbase.io/activation-state: blocked
    starbase.io/activation-stage: phase4a-rc4-gateway-migration-pending
    starbase.io/blocker: migration-separately-authorized
spec:
  suspend: true
  # When separately activated, fail closed after one attempt and retain the
  # completed Job as immutable evidence through runtime activation. A TTL
  # would let Flux recreate and rerun it after garbage collection.
  backoffLimit: 0
  ttlSecondsAfterFinished: null
  template:
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution: null
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [asio, strix]
      containers:
        - name: migrate
          env:
            - name: STARBASE_GATEWAY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: starbase-gateway-migration
                  key: database-url
