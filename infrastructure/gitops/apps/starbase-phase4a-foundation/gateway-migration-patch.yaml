apiVersion: batch/v1
kind: Job
metadata:
  name: starbase-gateway-migrate-f2fa2f551602
  namespace: starbase-system
  annotations:
    starbase.io/activation-state: blocked
    starbase.io/activation-stage: rc5-unchanged-migrations-suspended
    starbase.io/blocker: unchanged-schema-prior-rc4-completion-retained
spec:
  # RC5 changes application authentication behavior only. Its ordered SQL set
  # is byte-identical to the completed RC4 migration evidence, so a new image
  # digest is not authority to replay production migrations.
  suspend: true
  backoffLimit: 0
  ttlSecondsAfterFinished: null
  template:
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution: null
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [asio, strix]
      containers:
        - name: migrate
          env:
            - name: STARBASE_GATEWAY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: starbase-gateway-migration
                  key: database-url
