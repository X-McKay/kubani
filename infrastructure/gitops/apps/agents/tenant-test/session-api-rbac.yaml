# The session interface (agent-platform/session-api-tenant-test) reads the
# Agent and AgentRelease a session names. Get only: no list, no watch, no write.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: session-api
  namespace: tenant-test
rules:
  - apiGroups: [agentplatform.io]
    resources: [agents, agentreleases]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: session-api
  namespace: tenant-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: session-api
subjects:
  - kind: ServiceAccount
    name: session-api-tenant-test
    namespace: agent-platform
