# Copied from X-McKay/zetra-agents agents/conformance-b/deploy/agent.yaml: the
# conformance test agent (spec 15.1): adversarial probes for the Phase B harness.
apiVersion: agentplatform.io/v1alpha1
kind: Agent
metadata:
  name: conformance-b
  namespace: tenant-test
spec:
  owner: 4785437+X-McKay@users.noreply.github.com
  description: "Second identity of the conformance test agent, for T26 (spec 15.2): same image and probes as conformance"
  identity:
    mode: on-behalf-of
    onBehalfOf: {required: false, fallback: agent}
  capabilities:
    models:
      - backend: llm-main
        models: [Qwen3.6-35B-A3B-NVFP4]
        budget: {tokensPerDay: 5000000, tokensPerSession: 200000}
    mcp:
      - backend: kubernetes
        effect: remote_read
        tools: [pods_list_in_namespace]
        delegation: inherit
  runtime: {cpu: "1", memory: 1Gi, ttlSeconds: 1800}
