# Change deploy/agent.yaml in the source repository, then: just agent sync conformance-b --source PATH
# Agent (spec 15.1): the platform's conformance test agent. It runs adversarial probes
# for the test harness and does no real work. Kubani holds the copy that is applied; this
# file is its source and the input to `just release conformance`.
apiVersion: agentplatform.io/v1alpha1
kind: Agent
metadata:
  name: conformance-b
  namespace: tenant-test
spec:
  owner: 4785437+X-McKay@users.noreply.github.com
  description: "Second identity of the conformance test agent, for T26 (spec 15.2): same image and probes as conformance"
  identity:
    mode: on-behalf-of
    onBehalfOf: {required: false, fallback: agent}
  capabilities:
    models:
      - backend: llm-main
        models: [Qwen3.6-35B-A3B-NVFP4]
        # The APS reserves the backend's maxModelLen (131072 for llm-main) per request
        # (spec 3.7, 9.3 step 10), so the session budget must be at least that.
        budget: {tokensPerDay: 5000000, tokensPerSession: 200000}
    mcp:
      - backend: kubernetes
        effect: remote_read
        tools: [pods_list_in_namespace]
        delegation: inherit
  runtime: {cpu: "1", memory: 1Gi, ttlSeconds: 1800}
