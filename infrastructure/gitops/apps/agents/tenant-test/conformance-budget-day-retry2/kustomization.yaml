# yamllint disable rule:line-length
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - agent.yaml
  - agentrelease.yaml
  - harness-rbac.yaml
# Retired 2026-11-27: its one job was a third identity for T13 on 2026-11-06 (run 32 passed on it); T13 runs on conformance-budget-day.
# The Agent is switched off here, not in its source, which is no longer built. Its release, reports
# and ledger stay as the record: the controller sets Enabled=False and the policy service denies
# every release. Remove `spec.enabled` from this patch to switch the Agent on again. The label marks
# it as a platform test fixture, which `just agent ls` leaves out unless --all is given.
patches:
  - patch: |-
      apiVersion: agentplatform.io/v1alpha1
      kind: Agent
      metadata:
        name: conformance-budget-day-retry2
        namespace: tenant-test
        labels:
          agentplatform.io/purpose: fixture
      spec:
        enabled: false
