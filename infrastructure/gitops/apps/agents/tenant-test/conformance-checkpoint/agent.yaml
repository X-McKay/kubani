apiVersion: agentplatform.io/v1alpha1
kind: Agent
metadata:
  name: conformance-checkpoint
  namespace: tenant-test
spec:
  owner: 4785437+X-McKay@users.noreply.github.com
  description: T23 signed checkpoint fixture; one allowed MCP read per target boundary
  identity:
    mode: agent
  capabilities:
    models:
    - backend: llm-main
      models:
      - Qwen3.6-35B-A3B-NVFP4
      budget:
        tokensPerDay: 5000000
        tokensPerSession: 200000
    mcp:
    - backend: kubernetes
      effect: remote_read
      delegation: inherit
      tools:
      - pods_list_in_namespace
  runtime:
    cpu: '1'
    memory: 1Gi
    ttlSeconds: 3600
