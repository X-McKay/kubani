apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - agent.yaml
  - agentrelease-v0.1.0.yaml
# Retired 2026-11-27: its one job was the first live run of a skill's script, done 2026-11-19.
# The Agent is switched off here, not in its source, which stays in zetra-agents as the worked
# example of an agent that runs a skill's script. Its release, reports
# and ledger stay as the record: the controller sets Enabled=False and the policy service denies
# every release. Remove `spec.enabled` from this patch to switch the Agent on again. The label marks
# it as a platform test fixture, which `just agent ls` leaves out unless --all is given.
patches:
  - patch: |-
      apiVersion: agentplatform.io/v1alpha1
      kind: Agent
      metadata:
        name: skill-rehearsal
        namespace: tenant-test
        labels:
          agentplatform.io/purpose: fixture
      spec:
        enabled: false
