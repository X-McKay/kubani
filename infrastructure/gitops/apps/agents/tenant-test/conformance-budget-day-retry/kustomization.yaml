# yamllint disable rule:line-length
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - agent.yaml
  - agentrelease.yaml
  - harness-rbac.yaml
# Retired 2026-11-27: its one job was a second identity for T13 on 2026-11-06, the day the day fixture's ledger was spent.
# The Agent is switched off here, not in its source, which is no longer built. Its release, reports
# and ledger stay as the record: the controller sets Enabled=False and the policy service denies
# every release. Remove this patch to switch the Agent on again.
patches:
  - patch: |-
      apiVersion: agentplatform.io/v1alpha1
      kind: Agent
      metadata:
        name: conformance-budget-day-retry
        namespace: tenant-test
      spec:
        enabled: false
