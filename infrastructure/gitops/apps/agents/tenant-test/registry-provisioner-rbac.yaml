# The registry provisioner applies Agent and AgentRelease objects here with
# server-side apply. Create and patch only: no update, no delete, no watch and
# no status subresource. Approval stays with the Registry Controller's checks.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: registry-provisioner
  namespace: tenant-test
rules:
  - apiGroups: [agentplatform.io]
    resources: [agents, agentreleases]
    verbs: [get, list, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: registry-provisioner
  namespace: tenant-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: registry-provisioner
subjects:
  - kind: ServiceAccount
    name: registry-provisioner
    namespace: agent-platform
