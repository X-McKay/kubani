apiVersion: agentplatform.io/v1alpha1
kind: Agent
metadata:
  name: conformance-performance
  namespace: tenant-test
spec:
  owner: 4785437+X-McKay@users.noreply.github.com
  description: T29 signed performance fixture; bounded performance measurements using
    ordinary SDK MCP reads
  identity:
    mode: agent
  capabilities:
    models: []
    mcp:
    - backend: kubernetes
      effect: remote_read
      delegation: inherit
      tools:
      - pods_list_in_namespace
  runtime:
    cpu: '1'
    memory: 1Gi
    ttlSeconds: 3600
