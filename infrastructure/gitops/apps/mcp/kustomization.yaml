# MCP servers (plan section 2.8). M0 is the namespace and its network
# baseline; each server lands in its own PR (M2 Kubernetes, M3 Graphiti,
# M4 Postgres, M5 GitHub).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - netpol.yaml
  - kubernetes-mcp.yaml
  - graphiti-mcp.enc.yaml
  - graphiti-mcp.yaml
  - postgres-mcp-role.enc.yaml
  - postgres-mcp-role-job.yaml
  - postgres-mcp.enc.yaml
  - postgres-mcp.yaml
  - github-mcp.yaml
  - rbac-conformance.yaml
  - postgres-admin-mcp-role.enc.yaml
  - postgres-admin-role-job.yaml
  - postgres-admin-mcp.enc.yaml
  - registry-generated/

configMapGenerator:
  - name: postgres-admin-monitor-sql
    namespace: database
    files:
      - monitor.sql=postgres-admin-monitor.sql
    options:
      disableNameSuffixHash: true

patches:
  - path: registry-generated/human-exclusions.json
    target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: allow-ai-gateway-ingress
