# yamllint disable rule:line-length
# Dedicated metadata-only monitoring login; existing postgres backend unchanged.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-admin-mcp
  namespace: mcp
  labels:
    app.kubernetes.io/name: postgres-admin-mcp
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-admin-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-admin-mcp
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        topology.kubani.io/role: platform
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres-admin-mcp
          image: docker.io/crystaldba/postgres-mcp@sha256:dbbd346860d29f1543e991f30f3284bf4ab5f096d049ecc3426528f20b1b6e6b  # pragma: allowlist secret (public image digest)
          args: ["--access-mode=restricted", "--transport=sse"]
          env:
            - name: DATABASE_URI
              valueFrom:
                secretKeyRef:
                  name: postgres-admin-mcp
                  key: DATABASE_URI
          ports:
            - name: http
              containerPort: 8000
          # No health endpoint in 0.3.0; the SSE stream never ends, so a TCP
          # check is the probe. It does not prove role/bootstrap/query health.
          # Root verifies the role Job and four fixed diagnostics before use.
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-admin-mcp
  namespace: mcp
  labels:
    app.kubernetes.io/name: postgres-admin-mcp
spec:
  selector:
    app.kubernetes.io/name: postgres-admin-mcp
  ports:
    - name: http
      port: 8000
      targetPort: http
      appProtocol: agentgateway.dev/mcp
---
# postgres-admin-mcp -> PostgreSQL. Ingress side: allow-mcp-postgresql in
# infrastructure/networking/netpol-database.yaml (dedicated admin selector).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-admin-mcp-postgresql-egress
  namespace: mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres-admin-mcp
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - port: 5432
          protocol: TCP
