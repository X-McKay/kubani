# Plan 2026-10-17 MCP M2: Kubernetes MCP server, read-only.
#
# containers/kubernetes-mcp-server v0.0.67 (quay.io manifest list, amd64 for
# rig0), Streamable HTTP on :8080 at /mcp. It talks to the API server with
# its own ServiceAccount bound to the built-in `view` ClusterRole (no
# Secrets), and cluster_auth_mode = "kubeconfig" so it never forwards a
# caller's Authorization header to the API server (the default,
# "passthrough", would). read_only removes every write tool on top of RBAC.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-mcp
  namespace: mcp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-kubernetes-mcp-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: kubernetes-mcp
    namespace: mcp
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubernetes-mcp-config
  namespace: mcp
data:
  config.toml: |
    port = "8080"
    log_level = 0
    read_only = true
    stateless = true
    cluster_auth_mode = "kubeconfig"
    list_output = "table"
    toolsets = ["core"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-mcp
  namespace: mcp
  labels:
    app.kubernetes.io/name: kubernetes-mcp
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubernetes-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubernetes-mcp
    spec:
      serviceAccountName: kubernetes-mcp
      nodeSelector:
        topology.kubani.io/role: platform
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kubernetes-mcp
          image: quay.io/containers/kubernetes_mcp_server:v0.0.67
          args: ["--config", "/etc/kubernetes-mcp-server/config.toml"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/kubernetes-mcp-server
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: kubernetes-mcp-config
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-mcp
  namespace: mcp
  labels:
    app.kubernetes.io/name: kubernetes-mcp
spec:
  selector:
    app.kubernetes.io/name: kubernetes-mcp
  ports:
    - name: http
      port: 8080
      targetPort: http
      appProtocol: agentgateway.dev/mcp
---
# kubernetes-mcp -> API server (same pair of destinations as the agentgateway
# control plane rule in netpol-ai-gateway.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kubernetes-mcp-apiserver-egress
  namespace: mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kubernetes-mcp
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.43.0.1/32
      ports:
        - port: 443
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 100.64.0.0/10
      ports:
        - port: 6443
          protocol: TCP
