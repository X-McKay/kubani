# The Phase B conformance harness (agent-platform/conformance-harness) reads
# the capture sidecar's log on the kubernetes-mcp pod (spec 15.2 T8, T11, T12).
# Read-only, this namespace only.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: conformance-harness-capture
  namespace: mcp
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: conformance-harness-capture
  namespace: mcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: conformance-harness-capture
subjects:
  - kind: ServiceAccount
    name: conformance-harness
    namespace: agent-platform
