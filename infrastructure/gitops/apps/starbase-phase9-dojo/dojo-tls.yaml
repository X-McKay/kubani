apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: starbase-dojo-ca
  namespace: starbase-execution
  labels: {app.kubernetes.io/part-of: starbase}
spec:
  ca:
    secretName: starbase-dojo-ca # pragma: allowlist secret
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: starbase-dojo-tls
  namespace: starbase-execution
  labels: {app.kubernetes.io/part-of: starbase}
  annotations:
    starbase.io/rotation-owner: Al-McKay
spec:
  secretName: starbase-dojo-tls # pragma: allowlist secret
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages: [server auth]
  dnsNames:
    - starbase-dojo.starbase-execution.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: starbase-dojo-ca
---
apiVersion: v1
kind: Service
metadata:
  name: starbase-dojo
  namespace: starbase-execution
  labels:
    app.kubernetes.io/name: starbase-dojo-runtime
    app.kubernetes.io/part-of: starbase
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: starbase-dojo-runtime}
  ports:
    - {name: https, port: 8443, targetPort: dojo-tls, protocol: TCP}
