apiVersion: apps/v1
kind: Deployment
metadata:
  name: starbase-dojo-runtime
  namespace: starbase-execution
spec:
  template:
    metadata:
      annotations:
        starbase.io/release: 0.1.0-rc.10
        starbase.io/source-revision: 40bacc987ee45c0c65787c681340c89cafab0b8c
        starbase.io/activation-stage: phase9-governed-proposal-ui
    spec:
      containers:
        - name: dojo-server
          image: ghcr.io/x-mckay/starbase/dojo-runtime@sha256:abb76835bb0d5c8c5f52d3e3e5a1a0f290d06596720e3d9e5c2396170c5c0b2d
          env:
            - {name: STARBASE_DOJO_ADDRESS, value: "127.0.0.1:8090"}
            - {name: STARBASE_DOJO_TLS_ADDRESS, value: "0.0.0.0:8443"}
            - {name: STARBASE_DOJO_TLS_CERT_FILE, value: /var/run/secrets/starbase.io/dojo-tls/tls.crt}
            - {name: STARBASE_DOJO_TLS_KEY_FILE, value: /var/run/secrets/starbase.io/dojo-tls/tls.key}
          ports:
            - {name: dojo-tls, containerPort: 8443}
          startupProbe: {httpGet: {path: /health/ready, port: dojo-tls, scheme: HTTPS}, failureThreshold: 30, periodSeconds: 2}
          readinessProbe: {httpGet: {path: /health/ready, port: dojo-tls, scheme: HTTPS}, periodSeconds: 5, timeoutSeconds: 2}
          livenessProbe: {httpGet: {path: /health/live, port: dojo-tls, scheme: HTTPS}, periodSeconds: 10, timeoutSeconds: 2}
          volumeMounts:
            - {name: dojo-tls, mountPath: /var/run/secrets/starbase.io/dojo-tls, readOnly: true}
        - name: sandbox-fixture
          image: ghcr.io/x-mckay/starbase/dojo-runtime@sha256:abb76835bb0d5c8c5f52d3e3e5a1a0f290d06596720e3d9e5c2396170c5c0b2d
        - name: advisory-fixture
          image: ghcr.io/x-mckay/starbase/dojo-runtime@sha256:abb76835bb0d5c8c5f52d3e3e5a1a0f290d06596720e3d9e5c2396170c5c0b2d
          env:
            - {name: STARBASE_ADVISORY_FIXTURE_MODEL, value: starbase-proposal-fixture-v1}
            - {name: STARBASE_ADVISORY_FIXTURE_OUTCOME, value: propose}
        - name: evaluation-activity-worker
          image: ghcr.io/x-mckay/starbase/dojo-runtime@sha256:abb76835bb0d5c8c5f52d3e3e5a1a0f290d06596720e3d9e5c2396170c5c0b2d
          env:
            - {name: STARBASE_EVALUATION_MODEL, value: starbase-proposal-fixture-v1}
      volumes:
        - name: dojo-tls
          secret:
            secretName: starbase-dojo-tls # pragma: allowlist secret
            defaultMode: 288
---
