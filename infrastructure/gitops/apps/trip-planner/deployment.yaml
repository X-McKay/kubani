apiVersion: apps/v1
kind: Deployment
metadata:
  name: vietnam-trip
  namespace: trip-planner
  labels:
    app.kubernetes.io/name: vietnam-trip
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vietnam-trip
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vietnam-trip
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: vietnam-trip
          image: registry.almckay.io/vietnam-trip:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LLM_BASE_URL
              value: "http://llm-api.vllm.svc.cluster.local:8000/v1"
            - name: LLM_MODEL
              value: "Qwen3.5-9B-NVFP4"
            - name: LLM_API_KEY
              value: ""
            - name: SEED_DEMO_TRIP
              value: "true"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: vietnam-trip
  namespace: trip-planner
  labels:
    app.kubernetes.io/name: vietnam-trip
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: vietnam-trip
