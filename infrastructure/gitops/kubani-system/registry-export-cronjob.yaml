apiVersion: batch/v1
kind: CronJob
metadata:
  name: registry-export
  namespace: kubani-system
spec:
  schedule: "0 * * * *" # Every hour
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: export
              image: ghcr.io/almckay/kubani-cli:latest
              command:
                - python
                - -m
                - kubani.cli.commands.export
              env:
                - name: KUBANI_PROJECT_ROOT
                  value: /workspace
                - name: REGISTRY_URL
                  value: https://registry-api.almckay.io
                - name: KUBANI_OCI_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: oci-credentials
                      key: username
                - name: KUBANI_OCI_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: oci-credentials
                      key: password
                - name: GIT_AUTHOR_NAME
                  value: "Registry Export Bot"
                - name: GIT_AUTHOR_EMAIL
                  value: "registry-export@kubani.local"
              volumeMounts:
                - name: workspace
                  mountPath: /workspace
                - name: ssh-key
                  mountPath: /root/.ssh
                  readOnly: true
          volumes:
            - name: workspace
              persistentVolumeClaim:
                claimName: kubani-workspace
            - name: ssh-key
              secret:
                secretName: git-deploy-key
                defaultMode: 0600
          restartPolicy: OnFailure
