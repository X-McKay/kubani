---
# Handlers for bootstrap role

- name: Restart SSH
  ansible.builtin.systemd:
    name: ssh
    state: restarted

- name: Restart Tailscale
  ansible.builtin.systemd:
    name: tailscaled
    state: restarted

- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Restart systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted

- name: Reapply WiFi connection
  # Reapply instead of a connection restart: keeps the link (and Tailscale,
  # and the K3s agent riding on it) up while the DNS settings change.
  ansible.builtin.command: nmcli device reapply {{ wifi_device | default('wlP9s9') }}
  changed_when: true
