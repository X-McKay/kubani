---
# Handlers for bootstrap role

- name: Restart SSH
  ansible.builtin.systemd:
    name: ssh
    state: restarted

- name: Restart Tailscale
  ansible.builtin.systemd:
    name: tailscaled
    state: restarted

- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Restart systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted
