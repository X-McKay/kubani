---
# System dependencies installation tasks

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"

- name: Install system dependencies (Debian/Ubuntu)
  ansible.builtin.apt:
    name: "{{ system_packages }}"
    state: present
  when: ansible_os_family == "Debian"

- name: Install system dependencies (RedHat/CentOS)
  ansible.builtin.dnf:
    name: "{{ system_packages }}"
    state: present
  when: ansible_os_family == "RedHat"

- name: Disable swap for Kubernetes
  ansible.builtin.command: swapoff -a
  changed_when: false
  when: ansible_swaptotal_mb > 0

- name: Remove swap from /etc/fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: "^.*\\sswap\\s"
    state: absent
  when: ansible_swaptotal_mb > 0

- name: Enable IP forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: true
    state: present
    reload: true

- name: Enable bridge netfilter
  community.general.modprobe:
    name: br_netfilter
    state: present

- name: Persist br_netfilter module
  ansible.builtin.lineinfile:
    path: /etc/modules-load.d/k8s.conf
    line: br_netfilter
    create: true
    mode: "0644"

- name: Configure bridge networking for Kubernetes
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
  loop:
    - { name: "net.bridge.bridge-nf-call-iptables", value: "1" }
    - { name: "net.bridge.bridge-nf-call-ip6tables", value: "1" }

# The kubelet follows container logs with inotify, one instance per stream,
# and root's default budget of 128 instances is shared with containerd and
# the Alloy log collector. With Alloy tailing every container, `kubectl
# logs -f` failed with "failed to create fsnotify watcher: too many open
# files" on sparky (2026-10-01). Applied by hand on all nodes that day.
- name: Raise inotify limits for log following
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-kubani-inotify.conf
    sysctl_set: true
    state: present
    reload: true
  loop:
    - { name: "fs.inotify.max_user_instances", value: "1024" }
    - { name: "fs.inotify.max_user_watches", value: "524288" }

- name: Display system dependencies installation success
  ansible.builtin.debug:
    msg: "System dependencies installed and configured on {{ inventory_hostname }}"
