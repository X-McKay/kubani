---
# Default variables for node_config role

# Hardware detection settings
detect_hardware: true
hardware_facts_file: /etc/kubernetes/node-hardware.json

# Storage configuration
enable_local_storage: false
local_storage_path: /var/lib/rancher/k3s/storage
storage_class_name: local-path

# Resource limits
default_max_pods: "110"
enable_resource_limits: true

# Node labels (merged with inventory node_labels)
default_node_labels:
  kubernetes.io/hostname: "{{ k3s_node_name }}"

# Node taints (merged with inventory node_taints)
default_node_taints: []
# Kubeconfig location
kubeconfig_path: /etc/rancher/k3s/k3s.yaml

# Wait for node to be ready
wait_for_node_ready: true
node_ready_timeout: 300

# Kubernetes node name. K3s registers the node under the lowercased hostname
# (node names must be RFC 1123), so a host whose hostname is RIG0 joins as
# rig0. Every kubectl node reference goes through this, not ansible_hostname.
k3s_node_name: "{{ ansible_hostname | lower }}"

# Workstation memory policy: swapfile on, earlyoom and systemd-oomd off, so
# nothing in user space kills desktop apps. See tasks/configure_oom_policy.yml.
# Set per host (rig0); the prerequisites/bootstrap roles skip their swapoff
# for these hosts.
workstation_memory_policy: false
node_swapfile_path: /swapfile
node_swapfile_size_gb: 16
node_swappiness: 10
