---
# Default variables for k3s_worker role

# K3s version and installation
k3s_version: "v1.34.7+k3s1"
k3s_allow_upgrade: false
k3s_install_script_url: https://get.k3s.io
k3s_install_dir: /usr/local/bin
k3s_config_dir: /etc/rancher/k3s
k3s_data_dir: /var/lib/rancher/k3s

# Resource reservations for workstation use
# These ensure the node remains usable for local work
default_reserved_cpu: "1"
default_reserved_memory: "2Gi"
default_reserved_ephemeral_storage: "1Gi"

# System reservations (for OS and system daemons)
default_system_reserved_cpu: "500m"
default_system_reserved_memory: "1Gi"
default_system_reserved_ephemeral_storage: "1Gi"

# Service configuration
k3s_service_name: k3s-agent
k3s_service_enabled: true
k3s_service_state: started

# Kubeconfig location (for kubectl commands)
kubeconfig_path: "{{ k3s_config_dir }}/k3s.yaml"

# WiFi radio. Set block_wifi: true per-host in inventory for nodes that are
# wired to the LAN switch and should never fall back to WiFi (keeps Tailscale
# direct connections, and therefore Flannel, on the switch hop). Left false
# here so it's opt-in per host.
block_wifi: false
