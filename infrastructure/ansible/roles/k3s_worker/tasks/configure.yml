---
# K3s configuration tasks for worker nodes

- name: Ensure K3s config directory exists
  ansible.builtin.file:
    path: "{{ k3s_config_dir }}"
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Inspect existing K3s agent config
  ansible.builtin.stat:
    path: "{{ k3s_config_dir }}/config.yaml"
    checksum_algorithm: sha1
  register: k3s_agent_config_before

- name: Create K3s agent config file
  ansible.builtin.template:
    src: k3s-agent-config.yaml.j2
    dest: "{{ k3s_config_dir }}/config.yaml"
    mode: "0600"
    owner: root
    group: root
  register: k3s_agent_config
  no_log: true

# Containerd mirror config: registry.almckay.io -> the in-cluster registry's
# ClusterIP, so the kubelet pulls mirrored images without the Traefik basic
# auth. K3s reads it only at startup, so a change restarts the service below.
- name: Install K3s registry mirror config
  ansible.builtin.copy:
    src: "{{ k3s_registries_src }}"
    dest: "{{ k3s_config_dir }}/registries.yaml"
    mode: "0644"
    owner: root
    group: root
  register: k3s_registries_config

- name: Set K3s agent config content change fact
  ansible.builtin.set_fact:
    k3s_agent_config_content_changed: >-
      {{ k3s_agent_config.changed and
         (not k3s_agent_config_before.stat.exists or
          (k3s_agent_config.checksum | default('')) !=
          (k3s_agent_config_before.stat.checksum | default(''))) }}

- name: Restart K3s agent after config content change
  ansible.builtin.systemd:
    name: "{{ k3s_service_name }}"
    state: restarted
    daemon_reload: true
  when:
    - (k3s_agent_config_content_changed | bool) or (k3s_registries_config.changed | bool)
    - not (k3s_install_needed | default(false) | bool)

- name: Verify node resource reservations are applied
  ansible.builtin.debug:
    msg:
      - "Resource reservations configured:"
      - "  Kube reserved - CPU: {{ reserved_cpu }}, Memory: {{ reserved_memory }}"
      - >-
        System reserved - CPU: {{ system_reserved_cpu | default(default_system_reserved_cpu) }},
        Memory: {{ system_reserved_memory | default(default_system_reserved_memory) }}
