---
# K3s installation tasks for worker nodes

- name: Check if K3s is already installed
  ansible.builtin.stat:
    path: "{{ k3s_install_dir }}/k3s"
  register: k3s_binary

- name: Get installed K3s version
  ansible.builtin.command: "{{ k3s_install_dir }}/k3s --version"
  register: k3s_installed_version
  changed_when: false
  failed_when: false
  check_mode: false
  when: k3s_binary.stat.exists

- name: Set K3s install and upgrade facts
  ansible.builtin.set_fact:
    k3s_install_needed: "{{ not k3s_binary.stat.exists }}"
    k3s_upgrade_needed: >-
      {{ k3s_binary.stat.exists and
         (k3s_version not in k3s_installed_version.stdout | default('')) }}

- name: Require explicit approval for K3s worker upgrades
  ansible.builtin.fail:
    msg: >-
      K3s {{ k3s_installed_version.stdout | default('unknown') }} is installed on
      {{ inventory_hostname }}, but inventory requests {{ k3s_version }}.
      Re-run with -e k3s_allow_upgrade=true during a planned upgrade window.
  when:
    - k3s_upgrade_needed | bool
    - not (k3s_allow_upgrade | bool)

- name: Ensure K3s config directory exists
  ansible.builtin.file:
    path: "{{ k3s_config_dir }}"
    state: directory
    mode: "0755"
    owner: root
    group: root
  when: k3s_install_needed | bool

- name: Create K3s agent config file before installation
  ansible.builtin.template:
    src: k3s-agent-config.yaml.j2
    dest: "{{ k3s_config_dir }}/config.yaml"
    mode: "0600"
    owner: root
    group: root
  when: k3s_install_needed | bool
  no_log: true

- name: Download K3s installation script
  ansible.builtin.get_url:
    url: "{{ k3s_install_script_url }}"
    dest: /tmp/k3s_install.sh
    mode: "0755"
  when: k3s_install_needed | bool or k3s_upgrade_needed | bool

- name: Install or upgrade K3s agent
  ansible.builtin.shell: |
    INSTALL_K3S_VERSION="{{ k3s_version }}" \
    K3S_URL="{{ k3s_control_plane_url }}" \
    K3S_TOKEN="{{ k3s_join_token }}" \
    INSTALL_K3S_EXEC="agent" \
    /tmp/k3s_install.sh
  changed_when: true
  when: k3s_install_needed | bool or (k3s_upgrade_needed | bool and k3s_allow_upgrade | bool)
  no_log: true
  notify:
    - enable k3s-agent
    - restart k3s-agent

- name: Verify K3s agent service is running
  ansible.builtin.systemd:
    name: "{{ k3s_service_name }}"
    state: started
    enabled: true

- name: Wait for node to join cluster
  ansible.builtin.pause:
    seconds: 30
  when: k3s_install_needed | bool or k3s_upgrade_needed | bool

- name: Display worker node information
  ansible.builtin.debug:
    msg:
      - "Worker node {{ ansible_hostname }} has been configured"
      - "Tailscale IP: {{ tailscale_ip }}"
      - "Control plane URL: {{ k3s_control_plane_url }}"
      - "Reserved CPU: {{ reserved_cpu }}"
      - "Reserved Memory: {{ reserved_memory }}"
