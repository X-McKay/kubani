---
# Main tasks for gpu_support role

- name: Check if node has GPU
  ansible.builtin.shell: |
    set -o pipefail
    lspci | grep -i nvidia
  args:
    executable: /bin/bash
  register: gpu_check
  failed_when: false
  changed_when: false
  tags:
    - always

- name: Skip GPU support if no GPU detected
  ansible.builtin.debug:
    msg: "No NVIDIA GPU detected on this node. Skipping GPU support role."
  when: gpu_check.rc != 0

- name: Resolve GPU role variable defaults
  ansible.builtin.set_fact:
    skip_driver_install: "{{ skip_driver_install | default(default_skip_driver_install) }}"
    gpu_time_slicing_enabled: "{{ gpu_time_slicing_enabled | default(default_gpu_time_slicing_enabled) }}"
    gpu_time_slicing_replicas: "{{ gpu_time_slicing_replicas | default(default_gpu_time_slicing_replicas) }}"
  when: gpu_check.rc == 0

- name: Include NVIDIA driver installation tasks
  ansible.builtin.include_tasks: install_driver.yml
  when:
    - gpu_check.rc == 0
    - not skip_driver_install
  tags:
    - gpu
    - nvidia-driver

# The NVIDIA device plugin and its time-slicing config are owned by the
# GitOps gpu-operator HelmRelease (infrastructure/gitops/infrastructure/
# gpu-operator). The standalone kube-system deployment this role used to
# apply duplicated it, fought over the kubelet socket, and crashlooped on a
# broken config mount — removed 2026-08-16.

- name: Include GPU validation tasks
  ansible.builtin.include_tasks: validate_gpu.yml
  when:
    - gpu_check.rc == 0
    - validate_gpu_availability | bool
    - not ansible_check_mode
  tags:
    - gpu
    - validate
