---
# K3s installation tasks for control plane

- name: Check if K3s is already installed
  ansible.builtin.stat:
    path: "{{ k3s_install_dir }}/k3s"
  register: k3s_binary

- name: Get installed K3s version
  ansible.builtin.command: "{{ k3s_install_dir }}/k3s --version"
  register: k3s_installed_version
  changed_when: false
  failed_when: false
  check_mode: false
  when: k3s_binary.stat.exists

- name: Set K3s install and upgrade facts
  ansible.builtin.set_fact:
    k3s_install_needed: "{{ not k3s_binary.stat.exists }}"
    k3s_upgrade_needed: >-
      {{ k3s_binary.stat.exists and
         (k3s_version not in k3s_installed_version.stdout | default('')) }}

- name: Require explicit approval for K3s control plane upgrades
  ansible.builtin.fail:
    msg: >-
      K3s {{ k3s_installed_version.stdout | default('unknown') }} is installed on
      {{ inventory_hostname }}, but inventory requests {{ k3s_version }}.
      Re-run with -e k3s_allow_upgrade=true during a planned upgrade window.
  when:
    - k3s_upgrade_needed | bool
    - not (k3s_allow_upgrade | bool)

- name: Ensure K3s config directory exists
  ansible.builtin.file:
    path: "{{ k3s_config_dir }}"
    state: directory
    mode: "0755"
    owner: root
    group: root
  when: k3s_install_needed | bool

- name: Create K3s server config file before installation
  ansible.builtin.template:
    src: k3s-server-config.yaml.j2
    dest: "{{ k3s_config_dir }}/config.yaml"
    mode: "0600"
    owner: root
    group: root
  when: k3s_install_needed | bool

- name: Download K3s installation script
  ansible.builtin.get_url:
    url: "{{ k3s_install_script_url }}"
    dest: /tmp/k3s_install.sh
    mode: "0755"
  when: k3s_install_needed | bool or k3s_upgrade_needed | bool

- name: Install or upgrade K3s server
  ansible.builtin.shell: |
    INSTALL_K3S_VERSION="{{ k3s_version }}" \
    INSTALL_K3S_EXEC="server" \
    /tmp/k3s_install.sh
  environment:
    K3S_URL: ""
    K3S_TOKEN: ""
  changed_when: true
  when: k3s_install_needed | bool or (k3s_upgrade_needed | bool and k3s_allow_upgrade | bool)
  notify:
    - enable k3s
    - restart k3s

- name: Wait for K3s to be ready
  ansible.builtin.wait_for:
    path: "{{ kubeconfig_path }}"
    timeout: 300
  when: k3s_install_needed | bool or k3s_upgrade_needed | bool

- name: Verify K3s service is running
  ansible.builtin.systemd:
    name: "{{ k3s_service_name }}"
    state: started
    enabled: true

- name: Wait for Kubernetes API server to be available
  ansible.builtin.uri:
    url: "https://{{ tailscale_ip }}:{{ api_server_port }}/healthz"
    validate_certs: false
    status_code:
      - 200
      - 401
  register: api_health
  until: api_health.status in [200, 401]
  retries: 30
  delay: 10
  when: k3s_install_needed | bool or k3s_upgrade_needed | bool
