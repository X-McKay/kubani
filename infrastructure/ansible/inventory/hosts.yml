---
# Kubani Cluster Inventory
# Control Plane: asio
# Workers: rig0, sparky, strix

all:
  vars:
    k3s_version: v1.34.7+k3s1
    cluster_name: homelab
    tailscale_network: 100.64.0.0/10
    git_repo_url: ssh://git@github.com/X-McKay/kubani
    git_branch: main

  children:
    control_plane:
      hosts:
        asio:
          ansible_host: 100.92.107.71
          tailscale_ip: 100.92.107.71
          # Wired to the LAN switch — block WiFi so Tailscale stays on the
          # switch hop instead of falling back to the WiFi router.
          block_wifi: true
          # First etcd member. Ignored on restarts once etcd is initialized;
          # required for disaster-recovery rebuilds from scratch.
          k3s_cluster_init: true
          reserved_cpu: "500m"
          reserved_memory: "1Gi"
          topology_labels:
            topology.kubani.io/site: primary
            topology.kubani.io/network-zone: lan
            topology.kubani.io/usage-class: general
          node_labels:
            node-role: control-plane
            workstation: "true"

    workers:
      hosts:
        rig0:
          # rig0 is also the operator's workstation — Ansible runs locally to
          # avoid SSH-to-self failures (no askpass, host key not trusted by self).
          # block_wifi is intentionally NOT set here: rig0 keeps WiFi available
          # as its failover path when the wired link drops.
          ansible_host: 100.77.107.81
          ansible_port: 27
          ansible_connection: local
          tailscale_ip: 100.77.107.81
          reserved_cpu: "4"
          reserved_memory: "8Gi"
          gpu: true
          topology_labels:
            topology.kubani.io/site: primary
            topology.kubani.io/network-zone: lan
            topology.kubani.io/usage-class: general
          node_labels:
            node-role: worker
            gpu: "true"
            workstation: "true"

        sparky:
          ansible_host: 100.71.65.62
          tailscale_ip: 100.71.65.62
          # Wired to the LAN switch — block WiFi so Tailscale stays on the
          # switch hop instead of falling back to the WiFi router.
          block_wifi: true
          reserved_cpu: "4"
          reserved_memory: "8Gi"
          gpu: true
          topology_labels:
            topology.kubani.io/site: primary
            topology.kubani.io/network-zone: lan
            topology.kubani.io/usage-class: inference
          node_labels:
            node-role: worker
            gpu: "true"
            workstation: "true"
          # NoSchedule keeps everything off sparky except workloads that
          # explicitly tolerate it (fine-tuning jobs, gpu-operator stack).
          # Key must be nvidia.com/gpu — the gpu-operator daemonsets
          # tolerate only that key.
          node_taints:
            - key: nvidia.com/gpu
              value: "true"
              effect: NoSchedule

        strix:
          ansible_host: 100.76.45.84
          tailscale_ip: 100.76.45.84
          # Wired to the LAN switch — block WiFi so Tailscale stays on the
          # switch hop instead of falling back to the WiFi router.
          block_wifi: true
          reserved_cpu: "500m"
          reserved_memory: "1Gi"
          topology_labels:
            topology.kubani.io/site: primary
            topology.kubani.io/network-zone: lan
            topology.kubani.io/usage-class: general
            topology.kubani.io/role: database
          node_labels:
            node-role: worker
            workstation: "true"

    # Bootstrap group for new nodes being configured
    # Use: ansible-playbook ... --limit bootstrap
    bootstrap:
      hosts: {}
