# Kubani Cluster Inventory
# Control Plane: sparky
# Workers: rig0, asio, strix, osprey

all:
  vars:
    k3s_version: v1.28.5+k3s1
    cluster_name: homelab
    tailscale_network: 100.64.0.0/10
    git_repo_url: https://github.com/yourusername/kubani.git
    git_branch: main

  children:
    control_plane:
      hosts:
        sparky:
          ansible_host: 100.71.65.62
          tailscale_ip: 100.71.65.62
          reserved_cpu: "4"
          reserved_memory: "8Gi"
          gpu: true
          topology_labels:
            topology.kubani.io/site: primary
            topology.kubani.io/network-zone: lan
            topology.kubani.io/usage-class: inference
          node_labels:
            node-role: control-plane
            gpu: "true"
            workstation: "true"
          node_taints:
            - key: gpu-workloads
              value: "true"
              effect: PreferNoSchedule

    workers:
      hosts:
        rig0:
          ansible_host: 100.77.107.81
          ansible_port: 27
          tailscale_ip: 100.77.107.81
          reserved_cpu: "4"
          reserved_memory: "8Gi"
          gpu: true
          topology_labels:
            topology.kubani.io/site: primary
            topology.kubani.io/network-zone: lan
            topology.kubani.io/usage-class: general
          node_labels:
            node-role: worker
            gpu: "true"
            workstation: "true"
          node_taints:
            - key: nvidia.com/gpu
              value: "true"
              effect: NoSchedule

        asio:
          ansible_host: 100.92.107.71
          tailscale_ip: 100.92.107.71
          reserved_cpu: "500m"
          reserved_memory: "1Gi"
          topology_labels:
            topology.kubani.io/site: primary
            topology.kubani.io/network-zone: lan
            topology.kubani.io/usage-class: general
          node_labels:
            node-role: worker
            workstation: "true"

        strix:
          ansible_host: 100.76.45.84
          tailscale_ip: 100.76.45.84
          reserved_cpu: "500m"
          reserved_memory: "1Gi"
          topology_labels:
            topology.kubani.io/site: primary
            topology.kubani.io/network-zone: lan
            topology.kubani.io/usage-class: general
          node_labels:
            node-role: worker
            workstation: "true"

        osprey:
          ansible_host: 100.94.211.21
          tailscale_ip: 100.94.211.21
          reserved_cpu: "500m"
          reserved_memory: "1Gi"
          system_reserved_cpu: "500m"
          system_reserved_memory: "512Mi"
          gpu: false
          topology_labels:
            topology.kubani.io/site: secondary
            topology.kubani.io/network-zone: remote
            topology.kubani.io/usage-class: constrained
          node_labels:
            node-role: worker
            hardware.kubernetes.io/memory-gb: "5"
            node.kubernetes.io/resource-constrained: "true"

    # Bootstrap group for new nodes being configured
    # Use: ansible-playbook ... --limit bootstrap
    bootstrap:
      hosts:
        osprey: {}
