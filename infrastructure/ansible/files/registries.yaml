---
# 10.43.150.95 is the registry Service's clusterIP, pinned in
# infrastructure/gitops/infrastructure/registry/deployment.yaml. Hosts cannot
# resolve *.svc.cluster.local, so the mirror must use the address. Change both
# together.
mirrors:
  "registry.almckay.io":
    endpoint:
      - "http://10.43.150.95:5000"
  "registry.registry.svc.cluster.local:5000":
    endpoint:
      - "http://10.43.150.95:5000"
