name: Build and Push

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'agents/**'
      - 'Earthfile'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      agent:
        description: 'Agent to build (leave empty for all)'
        required: false
        default: ''

env:
  REGISTRY: registry.almckay.io
  EARTHLY_TOKEN: ${{ secrets.EARTHLY_TOKEN }}

jobs:
  build:
    name: Build Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Earthly
        uses: earthly/actions-setup@v1
        with:
          version: v0.8.15

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract version
        id: version
        run: |
          SHA_SHORT=${GITHUB_SHA::7}
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # Tagged release: use version number
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            # Branch build: use branch-sha format
            BRANCH=${GITHUB_REF_NAME}
            VERSION="${BRANCH}-${SHA_SHORT}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "sha_short=$SHA_SHORT" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"

      - name: Build and push all agents
        if: github.event.inputs.agent == '' || github.event.inputs.agent == 'all'
        run: |
          earthly \
            --push \
            --ci \
            --build-arg VERSION=${{ steps.version.outputs.version }} \
            +push-all

      - name: Build and push specific agent
        if: github.event.inputs.agent != '' && github.event.inputs.agent != 'all'
        run: |
          earthly \
            --push \
            --ci \
            --build-arg VERSION=${{ steps.version.outputs.version }} \
            ./agents/${{ github.event.inputs.agent }}+push

  # Update GitOps manifests on successful build
  update-gitops:
    name: Update GitOps
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          SHA_SHORT=${GITHUB_SHA::7}
          VERSION="main-${SHA_SHORT}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "sha_short=$SHA_SHORT" >> $GITHUB_OUTPUT

      - name: Update k8s-monitor image tag
        uses: mikefarah/yq@master
        with:
          cmd: |
            yq eval '.spec.template.spec.containers[0].image = "registry.almckay.io/k8s-monitor:${{ steps.version.outputs.version }}"' \
            -i gitops/apps/ai-agents/k8s-monitor/deployment.yaml

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(gitops): update agent images to ${{ steps.version.outputs.version }}"
          title: "Update agent images to ${{ steps.version.outputs.version }}"
          body: |
            Automated image update from CI build.

            **Image tags updated:**
            - `registry.almckay.io/k8s-monitor:${{ steps.version.outputs.version }}`

            **Commit:** ${{ github.sha }}
          branch: update-agents-${{ steps.version.outputs.version }}
          labels: automated,gitops
          delete-branch: true

  # Create GitHub release on tags
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Agent Images

            **k8s-monitor:**
            - `registry.almckay.io/k8s-monitor:${{ steps.version.outputs.version }}`
            - Multi-arch: `linux/amd64`, `linux/arm64`

            ## Installation

            Update your GitOps manifests or run:
            ```bash
            kubectl set image deployment/k8s-monitor \
              worker=registry.almckay.io/k8s-monitor:${{ steps.version.outputs.version }} \
              -n ai-agents
            ```
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
