name: Starbase preview heartbeat

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  id-token: write

concurrency:
  group: starbase-preview-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    name: External preview heartbeat
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Join the tailnet as an ephemeral heartbeat observer
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_STARBASE_HEARTBEAT_CLIENT_ID }}
          audience: ${{ secrets.TS_STARBASE_HEARTBEAT_AUDIENCE }}
          tags: tag:starbase-heartbeat
          version: 1.102.3
          sha256sum: 36ddd9b51be57ffc2990cf76323cfa13643bfbb1b8a969f6183fa164741cdef5 # pragma: allowlist secret
          hostname: github-starbase-heartbeat
          ping: 100.92.107.71,100.77.107.81,100.71.65.62,100.76.45.84
          timeout: 1m
          retry: "2"
          use-cache: "false"

      - name: Verify public readiness and OIDC boundary
        shell: bash
        run: |
          set -euo pipefail
          target='https://starbase.almckay.io'
          observed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # ExternalDNS publishes all four Tailscale node addresses. Verify the
          # reviewed ACL and ingress path through each address so DNS ordering
          # cannot hide a partially unreachable route.
          for address in \
            100.92.107.71 \
            100.77.107.81 \
            100.71.65.62 \
            100.76.45.84
          do
            node_ready="$(curl --fail --silent --show-error \
              --proto '=https' --tlsv1.2 --max-time 10 --max-redirs 0 \
              --resolve "starbase.almckay.io:443:$address" \
              "$target/health/ready")"
            test "$(jq -r '.status' <<<"$node_ready")" = 'ready'
          done

          ready="$(curl --fail --silent --show-error \
            --proto '=https' --tlsv1.2 --max-time 10 --max-redirs 0 \
            "$target/health/ready")"
          test "$(jq -r '.status' <<<"$ready")" = 'ready'

          session="$(curl --fail --silent --show-error \
            --proto '=https' --tlsv1.2 --max-time 10 --max-redirs 0 \
            "$target/api/v1/auth/session")"
          test "$(jq -r '.mode' <<<"$session")" = 'oidc'
          test "$(jq -r '.authenticated' <<<"$session")" = 'false'

          headers="$(mktemp)"
          trap 'rm -f "$headers"' EXIT
          status="$(curl --silent --show-error \
            --proto '=https' --tlsv1.2 --max-time 10 --max-redirs 0 \
            --dump-header "$headers" --output /dev/null --write-out '%{http_code}' \
            "$target/api/v1/auth/login")"
          test "$status" = '303'
          location="$(awk 'BEGIN { IGNORECASE=1 } /^location:/ { sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit }' "$headers")"
          LOCATION="$location" python3 - <<'PY'
          import os
          from urllib.parse import parse_qs, urlsplit

          parsed = urlsplit(os.environ["LOCATION"])
          if (
              parsed.scheme,
              parsed.netloc,
              parsed.path,
              parsed.fragment,
          ) != (
              "https",
              "auth.almckay.io",
              "/application/o/authorize/",
              "",
          ):
              raise SystemExit("Unexpected OIDC redirect contract")

          query = parse_qs(parsed.query, keep_blank_values=True, strict_parsing=True)
          expected = {
              "client_id": ["starbase-kubani"],
              "redirect_uri": ["https://starbase.almckay.io/api/v1/auth/callback"],
              "response_type": ["code"],
              "code_challenge_method": ["S256"],
              "prompt": ["login"],
              "max_age": ["0"],
          }
          dynamic = {"scope", "state", "nonce", "code_challenge"}
          if set(query) != set(expected) | dynamic:
              raise SystemExit("Unexpected OIDC redirect contract")
          if any(query.get(key) != value for key, value in expected.items()):
              raise SystemExit("Unexpected OIDC redirect contract")

          # Deliberate tripwire: refresh is disabled. Enabling it adds
          # offline_access/access_type=offline and must fail this exact
          # contract until that capability is separately reviewed.
          required_scopes = {"groups", "openid"}
          scopes = query.get("scope", [])
          if len(scopes) != 1 or set(scopes[0].split()) != required_scopes:
              raise SystemExit("Unexpected OIDC redirect contract")
          for required in ("state", "nonce", "code_challenge"):
              values = query.get(required, [])
              if len(values) != 1 or not values[0].strip():
                  raise SystemExit("Unexpected OIDC redirect contract")
          PY

          {
            printf '%s\n' '## Starbase external preview heartbeat'
            echo
            printf -- '- Observed: \x60%s\x60\n' "$observed_at"
            printf '%s\n' "- HTTPS readiness: \`ready\`"
            printf '%s\n' "- Anonymous operator session: \`oidc\`, unauthenticated"
            printf '%s\n' '- Login boundary: exact Starbase Authentik OIDC request'
          } >>"$GITHUB_STEP_SUMMARY"
