name: Test

on:
  push:
    branches: [main]
    paths:
      - 'agents/**'
      - 'agent_platform/**'
      - 'Earthfile'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'agents/**'
      - 'agent_platform/**'
      - 'Earthfile'
      - '.github/workflows/test.yml'

env:
  EARTHLY_TOKEN: ${{ secrets.EARTHLY_TOKEN }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Earthly
        uses: earthly/actions-setup@v1
        with:
          version: v0.8.15

      - name: Run linting
        run: earthly +lint-all

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Setup Earthly
        uses: earthly/actions-setup@v1
        with:
          version: v0.8.15

      - name: Run tests
        run: earthly +test-all

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: agents/*/coverage.xml
          retention-days: 7

  # Integration tests only run on main branch (not blocking PRs)
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Earthly
        uses: earthly/actions-setup@v1
        with:
          version: v0.8.15

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: test-cluster
          wait: 60s

      - name: Run integration tests
        run: |
          # Integration tests would go here
          # For now, just verify the cluster is accessible
          kubectl get nodes
          echo "Integration test placeholder - add actual tests"
