[project]
name = "kubani-registry"
version = "0.1.0"
description = "Centralized registry service for Kubani agents, MCP servers, models, and endpoints"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Redis for caching and heartbeats
    "redis>=5.0.0",
    # Data validation
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    # HTTP client for health checks
    "httpx>=0.27.0",
    # MCP server
    "mcp>=1.0.0",
    # Prometheus metrics
    "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
kubernetes = [
    "kubernetes>=31.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.8.0",
    "mypy>=1.7.0",
    "testcontainers[postgres]>=4.0.0",
]
all = [
    "kubani-registry[kubernetes,dev]",
]

[project.scripts]
kubani-registry = "kubani_registry.main:main"
kubani-registry-mcp = "kubani_registry_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kubani_registry", "src/kubani_registry_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/kubani_registry", "src/kubani_registry_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["kubani_registry", "kubani_registry_mcp"]
